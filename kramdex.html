/* Called when Overview, Flashcards or Quiz is tapped. Starts the one request unless saved AI content already matches the files. */
function openDeckTab(d){
  if(!d.sources.length||!loadKeys().length)return;
  const sig=factsOf(d).sig;
  if(genBusy.get(d.id)===sig)return;
  if(KEYS4.every(k=>{const r=d.gen&&d.gen[k];return !!r&&r.sig===sig&&r.by==='ai'}))return;
  startAll(d,sig);
}
/* The saved set for one part. Returns the record, or 'loading' while the request runs.
   Never starts a request by itself; openDeckTab does that on a tap. */
function ensure(d,key){
  if(!d.sources.length)return null;
  const sig=factsOf(d).sig,rec=d.gen&&d.gen[key];
  if(genBusy.get(d.id)===sig)return 'loading';
  if(rec&&rec.sig===sig)return rec;
  if(loadKeys().length)return 'loading';
  const fresh=fallbackFor(d,key,sig,'app','');
  storeRec(d,key,fresh);
  return fresh;
}
/* What a section shows: cut to the chosen level (MIN, STD or MAX). */
function getPart(d,part){
  const key=part==='ov'?'ov':(d.difficulty||'medium');
  const rec=ensure(d,key);
  if(rec==='loading')return {state:'loading',by:'ai',err:'',via:'',data:EMPTY[part]};
  if(!rec)return {state:'ready',by:'app',err:'',via:'',data:EMPTY[part]};
  const meta={state:'ready',by:rec.by,err:rec.err||'',via:rec.via||''};
  if(part==='ov'){
    const full=String(rec.text||'');
    const limit=Math.round(Math.min(OV_WORDS,countWords(full))*LVL_PCT[wlvlOf(d)]);
    const shown=capWords(full,limit);
    const paras=shown.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    return {...meta,data:{text:shown,paras,words:wordsIn(shown)}};
  }
  const arr=rec[part]||[];
  let n=Math.max(1,Math.round(arr.length*LVL_PCT[lvlOf(d)]));
  if(!arr.length)n=0;
  let data=arr.slice(0,n);
  if(part==='quiz'&&d.difficulty==='easy')data=data.map(q=>{
    if(q.type&&q.type!=='choice')return q;
    if(q.options.length<=3)return q;
    const wrong=q.options.filter(o=>o!==q.answer).slice(0,2);
    return {...q,options:shuffle([q.answer,...wrong])};
  });
  return {...meta,data};
}
/* Shuffle: the saved set is put in a new order. No AI run and no new content. */
function reshuffle(d,part){
  const rec=ensure(d,d.difficulty||'medium');
  if(!rec||rec==='loading')return;
  if(part==='cards')rec.cards=shuffle(rec.cards);else rec.quiz=shuffle(rec.quiz);
  save();speechStop();
  if(part==='cards')study=null;else quiz=null;
  renderAll();
}
const cardsOf=d=>d?getPart(d,'cards').data:[];
const questionsOf=d=>d?getPart(d,'quiz').data:[];
function loadingView(){return '<div class="busybox" role="status">Creating content with AI</div>'}
function byText(by,err,via){
  if(by==='ai'&&err)return 'Built with AI ('+(PROV_NAME[via]||'AI')+'); some files were not read (AI failed'+(/^\d+$/.test(err)?' '+err:': '+err)+')';
  if(by==='ai')return 'Built with AI ('+(PROV_NAME[via]||'AI')+')';
  if(by==='mixed')return 'Built with AI ('+(PROV_NAME[via]||'AI')+') and app logic';
  if(by==='failed')return 'Built with app logic (AI failed'+(err?(/^\d+$/.test(err)?' '+err:': '+err):'')+')';
  return 'Built with app logic';
}

function setBy(){

/* ---------- levels: see getPart. Sliders choose Minimum, Standard or Maximum. ---------- */
const WORD_STOPS=[500,1000,1500,2000,2500], WORD_MAX_IDX=5;
const wIdx=wlvlOf;

/* ---------- overview: built from the facts (the term and its definition), in ranked order ---------- */
function ovSentences(d){
  return balancedFacts(d).map(f=>{
    const body=f.def.replace(/[\s.;:,]+$/,'');
    return (f.kind==='def'?`${f.term}: ${body}.`:`${body}.`).replace(/\s+/g,' ');
  });
}
const wordsIn=s=>s.split(' ').length;
function ovMax(d){return ovSentences(d).reduce((a,s)=>a+wordsIn(s),0)}
function wordText(idx,d){const max=ovMax(d);return idx>=WORD_MAX_IDX?`Max (${max})`:`${WORD_STOPS[idx]} (max ${max})`}
function ovText(d){
  const all=ovSentences(d),idx=wIdx(d);
  const limit=idx>=WORD_MAX_IDX?Infinity:WORD_STOPS[idx];
  const used=[];let n=0;
  for(const s of all){const w=wordsIn(s);if(n+w>limit)break;used.push(s);n+=w}
  const paras=[];
  for(let i=0;i<used.length;i+=5)paras.push(used.slice(i,i+5).join(' '));
  return {text:used.join(' '),paras,words:n,max:ovMax(d)};
}
function renderOverview(){
  const d=D(),el=$('#view-overview');

  if(c.state==='loading'){el.innerHTML=loadingView();return}

    ${spkBar()}
    <div class="panel ov">${ov.paras.map(p=>`<p class="ovp">${esc(p)}</p>`).join('')}</div>`;
  /* Reading starts as soon as the Overview is selected (and is not repeated by other redraws). */
  if(ovSpeakPending){ovSpeakPending=false;speak(ov.text)}
}

const SPEAK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

function knownCount(){const d=D();return d&&d.marks?Object.values(d.marks).filter(v=>v===true).length:0}

function flipCard(dir){
  const d=D(),cards=cardsOf(d);if(!cards.length||!study||busy||study.pos>=study.seq.length)return;
  study.flipped=!study.flipped;
  study.angle=study.flipped?(dir<0?-180:180):0;
  const f=$('#flip');if(f){f.style.transform=`rotateY(${study.angle}deg)`;f.classList.toggle('is-flipped',study.flipped)}
  const g=$('#grade');if(g)g.hidden=!study.flipped;
  const ft=faceText(d.difficulty,cards[study.seq[study.pos]]);
  speak(study.flipped?ft.back:ft.front);
}
/* Card change: the current card turns away and the next one turns in, like a flip. dir +1 = next, -1 = previous. */
function runChange(dir,apply){
  const st=$('#stage');
  if(!st||!st.animate){apply();return}
  busy=true;
  const s=dir>0?1:-1;
  const out=st.animate([
    {transform:'perspective(1400px) rotateX(0deg)',opacity:1},
    {transform:`perspective(1400px) rotateX(${-s*75}deg)`,opacity:0}
  ],{duration:700,easing:'cubic-bezier(.5,0,1,1)',fill:'forwards'});
  out.onfinish=()=>{
    apply();
    const ns=$('#stage');
    if(ns&&ns.animate){
      const inn=ns.animate([
        {transform:`perspective(1400px) rotateX(${s*75}deg)`,opacity:0},
        {transform:'perspective(1400px) rotateX(0deg)',opacity:1}
      ],{duration:700,easing:'cubic-bezier(0,0,.2,1)'});
      inn.onfinish=()=>{busy=false};
    }else busy=false;
  };
}
function move(delta){
  const d=D(),cards=cardsOf(d);if(!cards.length||!study||busy)return;
  const next=Math.max(0,Math.min(study.seq.length,study.pos+delta));
  if(next===study.pos)return;
  runChange(delta,()=>{study.pos=next;study.flipped=false;study.angle=0;study.speak=true;renderStudy()});
}
/* A missed card or question comes back after three more, and at most this many times, so a session always ends. */
const REPEAT_MAX=5;
/* Got it: the card is marked known. Missed it: the card is marked missed and comes back after three more cards. */
function grade(ok){
  const d=D(),cards=cardsOf(d);if(!cards.length||!study||!study.flipped||busy||study.pos>=study.seq.length)return;
  const ci=study.seq[study.pos];
  d.marks=d.marks||{};d.marks[cards[ci].term]=ok;save();
  study.repeats=study.repeats||{};
  if(!ok&&(study.repeats[ci]||0)<REPEAT_MAX){study.repeats[ci]=(study.repeats[ci]||0)+1;study.seq.splice(Math.min(study.seq.length,study.pos+4),0,ci)}
  move(1);
}

/* swipe: left or right turns the card, bottom-to-top = next, top-to-bottom = previous */
document.addEventListener('pointerdown',e=>{

});
document.addEventListener('pointerup',e=>{
  if(!gesture)return;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<40&&ay<40)return;
  ignoreClick=true;setTimeout(()=>{ignoreClick=false},400);
  if(ax>ay)flipCard(dx<0?1:-1);
  else move(dy<0?1:-1);
});

const normAns=s=>String(s).toLowerCase().normalize('NFKC').replace(/[\s.,;:!?'"()\-]+/g,'');
function fullQuestionText(q){
  if(q.type==='match')return `${q.prompt} ${q.pairs.map(p=>p.term).join('. ')}. Meanings: ${q.options.join('. ')}.`;
  if(q.type==='fill'||!q.options.length)return q.prompt;
  return `${q.prompt} ${q.options.map((o,j)=>`Option ${'ABCD'[j]}, ${o}.`).join(' ')}`;
}
function renderQuiz(){

  if(c.state==='loading'){el.innerHTML=loadingView();return}
  if(!total){quiz=null;el.innerHTML=emptyView('No questions yet');return}
  if(!quiz||quiz.n!==total)quiz={n:total,order:shuffle(qs.map((_,i)=>i)),i:0,score:0,picked:null,missed:[],seen:new Set(),speak:true};
  if(quiz.i>=quiz.order.length){
    const missed=quiz.missed.length?`<h3 style="margin:0;color:var(--yellow)">Review these</h3><ul class="missed">${quiz.missed.map(m=>`<li><b>${esc(m.answer)}</b><br>${esc(m.explain||'')}</li>`).join('')}</ul>`:'';
    el.innerHTML=`<div class="panel center"><div class="score">${quiz.score}/${quiz.n}</div>${missed}<button class="btn lg" id="retake">New quiz</button></div>`;
    return;
  }
  const q=qs[quiz.order[quiz.i]],t=q.type||'choice',done=quiz.picked!==null,correct=done&&quiz.picked.ok;
  let body='';
  if(t==='fill'){
    body=`<div class="fillrow"><label class="label" for="fillIn">Your answer</label><input id="fillIn" class="fillin" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" ${done?'disabled':''} value="${done?esc(quiz.picked.text||''):''}"><button class="btn block" data-fillcheck="1" ${done?'disabled':''}>Check answer</button></div>`;
  }else if(t==='match'){
    body=q.pairs.map((p,i)=>{
      const sel=done&&quiz.picked.map?quiz.picked.map[i]:-1;
      return `<div class="matchrow"><label class="mterm" for="m${i}">${esc(p.term)}</label><select id="m${i}" ${done?'disabled':''}><option value="">Choose a meaning</option>${q.options.map((o,j)=>`<option value="${j}"${j===sel?' selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    }).join('')+`<button class="btn block" data-matchcheck="1" ${done?'disabled':''}>Check answers</button>`;
  }else{
    const opts=q.options.map((o,j)=>{
      let cls='';
      if(done){if(o===q.answer)cls=' right';else if(j===quiz.picked.j)cls=' wrong'}
      return `<button class="opt${cls}" data-opt="${j}" ${done?'disabled':''}><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`;
    }).join('');
    body=`<div class="opts">${opts}</div>`;
  }
  const fb=done?`<div class="feedback ${correct?'ok':'no'}"><b>${correct?'Correct':'Not quite. Answer: '+esc(q.answer)}</b>${esc(q.explain||'')}</div>`:'';
  const nxt=done?`<button class="btn block" id="qnext">${quiz.i+1<quiz.order.length?'Next question':'See results'}</button>`:'';
  el.innerHTML=`<div class="statline"><span>Question ${quiz.i+1} of ${quiz.order.length}</span><span>Score ${quiz.score}</span></div>
    ${spkBar(true)}
    <div class="q"><span class="label">${esc(q.label)}</span><div class="prompt">${esc(q.prompt)}</div>${body}${fb}${nxt}</div>`;
  if(quiz.speak){quiz.speak=false;speak(fullQuestionText(q))}
}
/* A wrong answer comes back after three more questions. Only the first answer to a question counts for the score. */
function finishQuestion(ok,picked){
  const qs=questionsOf(D());if(!quiz||!qs.length)return;
  const qi=quiz.order[quiz.i],q=qs[qi];
  quiz.picked={...picked,ok};
  if(!quiz.seen.has(qi)){quiz.seen.add(qi);if(ok)quiz.score++;else quiz.missed.push(q)}
  quiz.repeats=quiz.repeats||{};
  if(!ok&&(quiz.repeats[qi]||0)<REPEAT_MAX){quiz.repeats[qi]=(quiz.repeats[qi]||0)+1;quiz.order.splice(Math.min(quiz.order.length,quiz.i+4),0,qi)}
  renderQuiz();
}
function answer(j){
  const qs=questionsOf(D());if(!quiz||quiz.picked!==null||!qs.length)return;
  const q=qs[quiz.order[quiz.i]];
  if(q.type&&q.type!=='choice'&&q.type!=='truefalse')return;
  const ok=q.options[j]===q.answer;
  finishQuestion(ok,{j});
  speak(ok?'Correct':`Not quite. The answer is ${q.answer}.`);
}
function answerFill(){
  const qs=questionsOf(D());if(!quiz||quiz.picked!==null||!qs.length)return;
  const q=qs[quiz.order[quiz.i]];if(q.type!=='fill')return;
  const inp=$('#fillIn');const text=inp?inp.value.trim():'';
  if(!text){speak('Type your answer first.');return}
  const ok=normAns(text)===normAns(q.answer);
  finishQuestion(ok,{text});
  speak(ok?'Correct':`Not quite. The answer is ${q.answer}.`);
}
function answerMatch(){
  const qs=questionsOf(D());if(!quiz||quiz.picked!==null||!qs.length)return;
  const q=qs[quiz.order[quiz.i]];if(q.type!=='match')return;
  const map=q.pairs.map((_,i)=>{const v=$('#m'+i);return v&&v.value!==''?+v.value:-1});
  if(map.some(x=>x<0)){speak('Choose a meaning for every term.');return}
  const ok=map.every((x,i)=>q.options[x]===q.pairs[i].meaning);
  finishQuestion(ok,{map});
  speak(ok?'Correct':`Not quite. The answers are: ${q.answer}.`);
}

/* ---------- backup: a folder the user picks; one small transaction file per use; restore to any transaction ---------- */
function fmtWhen(ms){return new Date(ms).toLocaleString()}
function logList(){try{const a=JSON.parse(localStorage.getItem(BK_LOG_KEY)||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
/* Every action is kept with its date and time. The entry also queues a backup transaction. */
function note(text){
  try{const a=logList();a.push({t:Date.now(),a:text});if(a.length>1000)a.splice(0,a.length-1000);localStorage.setItem(BK_LOG_KEY,JSON.stringify(a))}catch(e){}
  scheduleBackup(text);
}
/* Changes are gathered for 1.5 seconds, then written as one transaction. */
function scheduleBackup(label){
  if(!bkDir)return;
  bkPending.push(label);
  clearTimeout(bkTimer);
  bkTimer=setTimeout(()=>{bkTimer=null;queueBackup()},1500);
}
function queueBackup(){bkChain=bkChain.then(flushBackup).catch(()=>{})}
async function writeFile(dir,name,blob){const h=await dir.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(blob);await w.close()}
async function bkDel(id){try{const d=await idb();d.transaction('backups','readwrite').objectStore('backups').delete(id)}catch(e){}}
/* Writes what changed since the last transaction: changed decks, keys and theme, plus any new photos, audio and video. */
async function flushBackup(){
  if(!bkDir||!bkPending.length)return;
  const labels=[...new Set(bkPending.splice(0))];
  const actions=labels.filter(x=>x!=='Changed data');
  if(!actions.length)actions.push('Changed data');
  try{
    if(bkDir.queryPermission&&(await bkDir.queryPermission({mode:'readwrite'}))!=='granted'){const e=new Error('permission');e.name='NotAllowedError';throw e}
    const now=new Date().toISOString();
    const cur=new Map(db.decks.map(d=>[d.id,JSON.stringify(d)]));
    const changed={},srcs=[];
    db.decks.forEach(d=>{if(!bkBase||bkBase.decks.get(d.id)!==cur.get(d.id)){changed[d.id]=d;(d.sources||[]).forEach(s=>{if(s.blobId)srcs.push(s)})}});
    const removed=bkBase?[...bkBase.decks.keys()].filter(id=>!cur.has(id)):[];
    const keys=loadKeys().map(k=>({provider:k.provider,key:k.key}));
    const keysJs=JSON.stringify(keys);
    let theme='slate';try{theme=localStorage.getItem(THEME_KEY)||'slate'}catch(e){}
    const media=[];
    if(srcs.length){
      const mdir=await bkDir.getDirectoryHandle('media',{create:true});
      for(const s of srcs){
        if(!media.some(m=>m.id===s.blobId))media.push({id:s.blobId,type:s.mime||''});
        if(bkMediaKnown.has(s.blobId))continue;
        let have=false;try{await mdir.getFileHandle(s.blobId);have=true}catch(e){}
        if(!have){const b=await idbGet(s.blobId);if(b)await writeFile(mdir,s.blobId,b)}
        bkMediaKnown.add(s.blobId);
      }
    }
    const payload={app:'kramdex',format:2,when:now,actions,decks:changed,removed,media};
    if(!bkBase||bkBase.keys!==keysJs)payload.keys=keys;
    if(!bkBase||bkBase.theme!==theme)payload.theme=theme;
    await writeFile(bkDir,'transaction-'+now.replace(/[:.]/g,'-')+'.json',new Blob([JSON.stringify(payload)],{type:'application/json'}));
    bkBase={decks:cur,keys:keysJs,theme};
    const text=logList().map(e=>fmtWhen(e.t)+'  '+e.a).join('\n')+'\n';
    await writeFile(bkDir,'activity-log.txt',new Blob([text],{type:'text/plain'}));
    bkNeedsPerm=false;
    if(/^(Backups are paused|A backup could not)/.test(backupUI.msg)){backupUI.msg='';if(homeTab==='backup')renderHome()}
  }catch(e){
    bkPending.unshift(...labels);
    if(e&&e.name==='NotAllowedError'){bkNeedsPerm=true;backupUI.msg='Backups are paused. Tap "Allow backups" to let Kramdex write to the folder again.'}
    else backupUI.msg='A backup could not be saved. It will be tried again after the next use.';
    if(homeTab==='backup')renderHome();
  }
}
/* Loads the saved backup location when the app starts. Writes need permission again after a restart. */
async function loadBackupCfg(){
  try{
    const rec=await bkGet('config');
    if(rec&&rec.handle){
      bkDir=rec.handle;bkPicked=rec.pickedName||'';bkBase=null;bkMediaKnown=new Set();
      try{bkNeedsPerm=(await bkDir.queryPermission({mode:'readwrite'}))!=='granted'}catch(e){bkNeedsPerm=true}
      if(homeTab==='backup')renderHome();
    }
  }catch(e){}
}
/* Set up: the user picks one location. Only the device folder works in this version. */
function backupPick(kind){
  if(kind==='cancel'){backupUI.choosing=false;backupUI.msg='';renderHome();return}
  if(kind==='change'){
    if(!confirm('Change the backup location? New backups go to the new folder. Backups already in the old folder stay there.'))return;
    bkDir=null;bkBase=null;bkPending=[];bkNeedsPerm=false;bkDel('config');
    backupUI.choosing=true;backupUI.msg='';renderHome();return;
  }
  if(kind==='drive'){
    backupUI.choosing=true;
    backupUI.msg='Google Drive backup needs setup. It needs a Google OAuth client ID, which has not been added to Kramdex yet. Choose a personal device folder instead.';
    renderHome();return;
  }
  if(!window.showDirectoryPicker){
    backupUI.msg='This browser cannot choose a folder for backups. Open Kramdex in Chrome on a computer or on Android.';renderHome();return;
  }
  /* The picker opens straight from the tap, so it is called before any await. */
  window.showDirectoryPicker({mode:'readwrite'}).then(async picked=>{
    const folder=await picked.getDirectoryHandle('Kramdex _backup',{create:true});
    bkDir=folder;bkPicked=picked.name||'Chosen folder';bkBase=null;bkNeedsPerm=false;bkMediaKnown=new Set();bkPending=[];
    try{await bkPut({id:'config',kind:'device',pickedName:bkPicked,handle:folder})}catch(e){}
    backupUI.choosing=false;backupUI.view='main';
    backupUI.msg='Backup is set up. Kramdex will back up after each use.';
    note('Set up backup in the "Kramdex _backup" folder');
    renderHome();
  }).catch(e=>{
    backupUI.msg=(e&&e.name==='AbortError')?'No folder was chosen.':'The folder could not be opened. Try again.';
    renderHome();
  });
}
async function allowBackup(){
  try{const r=await bkDir.requestPermission({mode:'readwrite'});bkNeedsPerm=r!=='granted'}catch(e){bkNeedsPerm=true}
  backupUI.msg=bkNeedsPerm?'Backups are still paused. Allow access to the folder to continue.':'Backups are on again.';
  renderHome();
  if(!bkNeedsPerm)queueBackup();
}
/* Lists the transactions in the folder, oldest first. */
async function loadTxs(){
  backupUI.view='restore';backupUI.txs=null;backupUI.msg='';renderHome();
  if(!bkDir){backupUI.txs=[];renderHome();return}
  const names=[],txs=[];
  try{
    for await(const h of bkDir.values()){if(h.kind==='file'&&h.name.startsWith('transaction-')&&h.name.endsWith('.json'))names.push(h.name)}
    names.sort();
    for(const name of names){
      try{const t=JSON.parse(await (await (await bkDir.getFileHandle(name)).getFile()).text());txs.push({name,when:t.when,actions:t.actions||[]})}catch(e){}
    }
    backupUI.txs=txs;
  }catch(e){backupUI.txs=[];backupUI.msg='The backups could not be read.'}
  renderHome();
}
/* Restores the state as it was at transaction idx: replays every transaction up to it. */
async function restoreTo(idx){
  const t=backupUI.txs&&backupUI.txs[idx];if(!t||!bkDir)return;
  const when=fmtWhen(Date.parse(t.when));
  if(!confirm('Restore Kramdex to '+when+'? The decks, keys and theme on this device will be replaced with how they were then. A new backup is made after the restore.'))return;
  backupUI.msg='Restoring. Please wait.';renderHome();
  try{
    const decks=new Map(),media=new Map();let keys=null,theme=null;
    for(let i=0;i<=idx;i++){
      const x=JSON.parse(await (await (await bkDir.getFileHandle(backupUI.txs[i].name)).getFile()).text());
      (x.removed||[]).forEach(id=>decks.delete(id));
      Object.keys(x.decks||{}).forEach(id=>decks.set(id,x.decks[id]));
      if(Array.isArray(x.keys))keys=x.keys;
      if(typeof x.theme==='string')theme=x.theme;
      (x.media||[]).forEach(m=>media.set(m.id,m));
    }
    const refs=new Set();decks.forEach(d=>(d.sources||[]).forEach(s=>{if(s.blobId)refs.add(s.blobId)}));
    const mdir=await bkDir.getDirectoryHandle('media').catch(()=>null);
    for(const id of refs){
      if(!mdir)break;
      try{const f=await (await mdir.getFileHandle(id)).getFile();const m=media.get(id);await idbPut(id,new Blob([f],{type:(m&&m.type)||f.type||''}))}catch(e){}
    }
    db.decks=[...decks.values()];
    db.active=null;db.tab='create';study=quiz=null;
    save();
    if(keys)writeKeys(keys);
    if(theme)setTheme(theme);
    load();
    bkBase=null;bkPending=[];
    note('Restored data to '+when);
    homeTab='backup';backupUI.view='main';backupUI.txs=null;
    backupUI.msg='Restored to '+when+'. The decks, keys and theme are back to that point.';
    render();
  }catch(e){backupUI.msg='The backup could not be restored.';renderHome()}
}

      :`<button class="btn lg block" data-bsetup="1">Set up your backup</button>`;

    body=`<div class="panel bkloc">
      <span class="label">Backup location</span>
      <p class="bkwhere">Personal device folder: <b>${esc(bkPicked)}</b></p>
      <p class="hint">Kramdex creates a folder named "Kramdex _backup" at this location and stores this device's backups in it. Backups are made after every use of the app, once backup is set up. Each one saves only what changed. Backups include your API keys, so keep the folder private.</p>
      ${bkNeedsPerm?'<button class="btn sm" data-ballow="1">Allow backups</button>':''}
      <div class="apirow"><button class="btn sm" data-bpick="change">Change location</button></div>
    </div>`;
  }
  return `<div class="panel bk">
    ${body}
    <button class="btn lg block" data-bview="restore">Restore</button>
    ${backupUI.msg?`<p class="hint" role="status">${esc(backupUI.msg)}</p>`:''}
  </div>`;
}

/* ---------- shell ---------- */
function renderHome(){
  const cur=THEME_LIST.find(t=>t[0]===currentTheme())||THEME_LIST[0];
  const settings=`
    <div class="panel theme-panel">
      <span class="label" id="themeLbl">Themes</span>
      <div class="tdd">
        <button class="tddbtn" id="tddBtn" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="themeLbl tddCur"><span class="sw" style="background:${cur[2]}" aria-hidden="true"></span><span id="tddCur">${esc(cur[1])}</span><span aria-hidden="true">▾</span></button>
        <ul class="tddlist" id="tddList" role="listbox" aria-labelledby="themeLbl" hidden>
          ${THEME_LIST.map(t=>`<li><button role="option" aria-selected="${t[0]===cur[0]}" data-theme-pick="${t[0]}"><span class="sw" style="background:${t[2]}" aria-hidden="true"></span>${esc(t[1])}</button></li>`).join('')}
        </ul>
      </div>
    </div>
    ${keyPanel()}`;
  const home=`
    <button class="btn lg block" id="newdeck">+ New deck</button>
    <div class="decks">${db.decks.length?db.decks.map(d=>`<div class="deckwrap"><div class="deckrow"><button class="deckopen" data-open="${esc(d.id)}">${esc(d.name)}</button><button class="renbtn" data-rename="${esc(d.id)}" aria-label="Rename ${esc(d.name)}">Rename</button><button class="delbtn" data-deldeck="${esc(d.id)}" aria-label="Delete ${esc(d.name)}">Delete</button></div>${deckReport(d)}</div>`).join(''):'<p class="hint">No decks yet. Tap New deck to start.</p>'}</div>
`;
  $('#view-home').innerHTML=homeTab==='settings'?settings:homeTab==='backup'?backupView():homeTab==='about'?aboutView():home;
  document.querySelectorAll('[data-hometab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.hometab===homeTab)));
}

function renderAll(){
  const d=D();if(!d)return;
  if(db.tab==='create')renderCreate();
  else if(db.tab==='overview')renderOverview();
  else if(db.tab==='study')renderStudy();
  else renderQuiz();
  setBy();
}
function render(){
  const d=D();
  $('#deckbar').hidden=!d;
  $('#tabs').hidden=!d;
  $('#view-home').hidden=!!d;
  $('#homebar').hidden=!!d;
  syncBanner();
  if(d)$('#dname').textContent=d.name;
  ['create','overview','study','quiz'].forEach(t=>{$('#view-'+t).hidden=!d||db.tab!==t});
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===db.tab)));
  if(!d){renderHome();return}
  renderAll();
  syncSpk();
}

/* ---------- events (delegated) ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#flip')){if(!ignoreClick)flipCard(1);return}
  const b=t.closest('button,[data-open]');if(!b)return;
  const ds=b.dataset;
  if(ds.open!==undefined){note(`Opened deck "${((db.decks.find(x=>x.id===ds.open))||{}).name||''}"`);openDeck(ds.open);return}
  if(ds.deldeck!==undefined){deleteDeck(ds.deldeck);return}
  if(ds.rename!==undefined){
    const rd=db.decks.find(x=>x.id===ds.rename);if(!rd)return;
    const nv=prompt('New name for this deck',rd.name);
    if(nv&&nv.trim()){rd.name=nv.trim().slice(0,60);note(`Renamed deck to "${rd.name}"`);save()}
    render();return;
  }
  if(ds.tab!==undefined){note(`Opened ${({create:'Sources',overview:'Overview',study:'Flashcards',quiz:'Quiz'})[ds.tab]||ds.tab} in "${(D()||{}).name||''}"`);db.tab=ds.tab;study=quiz=null;speechStop();{const tp={overview:'ov',study:'cards',quiz:'quiz'}[ds.tab];if(tp){const dd=D();if(dd)openDeckTab(dd)}}if(ds.tab==='overview')ovSpeakPending=true;render();resetScroll();return}
  if(ds.opt!==undefined){answer(+ds.opt);return}
  if(ds.d!==undefined){const d=D();d.difficulty=ds.d;note(`Changed difficulty of "${d.name}" to ${ds.d}`);study=quiz=null;save();renderAll();return}
  if(ds.hometab!==undefined){homeTab=ds.hometab;keyUI.msg='';if(homeTab==='backup'){backupUI.msg='';backupUI.view='main';backupUI.choosing=false}note('Opened '+({settings:'Settings',backup:'Backup',about:'About'}[homeTab]||'Home'));renderHome();resetScroll();return}
  if(ds.themePick!==undefined){note(`Changed theme to ${ds.themePick}`);setTheme(ds.themePick);renderHome();return}
  if(ds.kadd!==undefined){keyUI={open:true,adding:ds.kadd,msg:''};renderHome();return}
  if(ds.kclose!==undefined){keyUI.adding=null;keyUI.msg='';renderHome();return}
  if(ds.ksave!==undefined){saveNewKey();return}
  if(ds.kremove!==undefined){removeKey(+ds.kremove);return}
  if(ds.kcopy!==undefined){copyKey(+ds.kcopy);return}
  if(ds.rm!==undefined){const d=D();const s=d.sources[+ds.rm];if(s&&s.blobId)idbDel(s.blobId);note(`Removed "${(s&&s.name)||'a file'}" from "${d.name}"`);d.sources.splice(+ds.rm,1);save();renderAll();renderSheet();return}
  if(ds.cdel!==undefined){camShots.splice(+ds.cdel,1);renderSheet();return}
  if(ds.cmode!==undefined){camMode=ds.cmode;renderSheet();return}
  if(ds.addlink!==undefined){addLink(ds.addlink);return}
  if(ds.fillcheck!==undefined){answerFill();return}
  if(ds.matchcheck!==undefined){answerMatch();return}
  if(ds.bpick!==undefined){backupPick(ds.bpick);return}
  if(ds.bsetup!==undefined){backupUI.choosing=true;backupUI.msg='';renderHome();return}
  if(ds.bview!==undefined){backupUI.msg='';if(ds.bview==='restore'){loadTxs();return}backupUI.view='main';renderHome();return}
  if(ds.brest!==undefined){restoreTo(+ds.brest);return}
  if(ds.ballow!==undefined){allowBackup();return}
  switch(b.id){
    case 'backHome':goHome();break;
    case 'newdeck':newDeck();break;
    case 'deldeck':deleteDeck(db.active);break;
    case 'addPaste':{
      const v=$('#paste').value.trim();if(!v)break;
      const d=D();
      d.sources.push({name:`Pasted text (${v.split(/\s+/).length} words)`,kind:'text',text:cleanText(v)});
      $('#paste').value='';lastMsg='';study=quiz=null;note(`Added pasted text to "${d.name}"`);save();
      if(!factsOf(d).facts.length)lastMsg='No facts found in this text.';
      renderAll();renderSheet();break;
    }
    case 'sprev':move(-1);break;
    case 'snext':move(1);break;
    case 'again':grade(false);break;
    case 'got':grade(true);break;
    case 'restart':{const dd=D();if(dd)dd.marks={};study={pos:0,flipped:false,angle:0,seq:cardsOf(dd).map((_,i)=>i),speak:true};save();renderStudy();break}
    case 'qnext':if(quiz){quiz.i++;quiz.picked=null;quiz.speak=true;renderQuiz()}break;
    case 'retake':quiz=null;renderQuiz();break;
    case 'spkMute':setMute(!spk.muted);break;
    case 'apiUpdate':keyUI={open:!keyUI.open,adding:null,msg:''};renderHome();break;
    case 'tddBtn':{const l=$('#tddList'),bt=$('#tddBtn');if(l){l.hidden=!l.hidden;bt.setAttribute('aria-expanded',String(!l.hidden))}break}
    case 'openDocs':openSheet('docs');break;
    case 'openMedia':openSheet('media');break;
    case 'openLinks':openSheet('links');break;
    case 'closeSheet':closeSheet();break;
    case 'camStart':camStart();break;
    case 'camShutter':camShoot();break;
    case 'camRec':camRecToggle();break;
    case 'camTick':camFinish();break;
    case 'recStart':recStart();break;
    case 'recPause':recPause();break;
    case 'recStop':recStop();break;
    case 'recSave':saveReview(($('#recName')||{}).value||'');break;
    case 'recDelete':discardReview();break;
    case 'shuffle':{const d=D();if(d)reshuffle(d,db.tab==='study'?'cards':'quiz');break}
  }
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over')}
}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('#drop');
  if(z){e.preventDefault();z.classList.remove('over');addFiles([...(e.dataTransfer?.files||[])])}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'){addFiles([...t.files]);t.value='';return}
  if(t.id==='media'){addMedia([...t.files]);t.value='';return}
  if(t.id==='camfb'){if(t.files[0])camShots.push({blob:t.files[0],kind:'image',url:''});t.value='';renderSheet();return}
  if(t.id==='themeSel'){setTheme(t.value);return}
  if(t.id==='count'){const d=D();d.lvl=+t.value;study=quiz=null;save();renderAll();return}
  if(t.id==='owords'){const d=D();d.wordIdx=+t.value;save();renderAll();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='owords'){setRangeFill(e.target);D().wlvl=+e.target.value;return}
  if(e.target.id==='count'){setRangeFill(e.target);D().lvl=+e.target.value;study=quiz=null;return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='fillIn'){e.preventDefault();answerFill()}});
document.addEventListener('submit',e=>{e.preventDefault()});

/* ---------- themes ---------- */
/* Fifteen themes (Night and Ocean removed; Cyan Charcoal added). Each sets the same colour tokens: the page is always pitch black, panels take the faded colour.
   Themes marked stars show a few twinkling stars on their panels. Each entry: [key, name, swatch colour, stars]. */
const THEME_LIST=[
  ['bw','Black and White','#f2f2f2',false],
  ['espresso','Espresso Brown','#7b4a2d',false],
  ['sunset','Sunset Orange','#ff7a2f',false],
  ['forest','Forest Green','#2f8f4e',true],
  ['royal','Royal Purple','#7b2fbf',true],
  ['crimson','Crimson Red','#d62839',false],
  ['golden','Golden Yellow','#f5c518',true],
  ['rose','Rose Pink','#e86fa0',false],
  ['slate','Slate Grey','#6b7a90',true],
  ['ice','Ice Blue','#7fd4ff',true],
  ['olive','Olive','#7d8229',false],
  ['burgundy','Burgundy','#7a1b31',false],
  ['indigo','Indigo','#3f51b5',true],
  ['sand','Sand Beige','#d8c3a0',false],
  ['cyan','Cyan Charcoal','#22d3ee',false]
];
const THEME_KEY='cramdeck.theme';
const currentTheme=()=>document.documentElement.getAttribute('data-theme')||'slate';
function setTheme(name){
  if(!THEME_LIST.some(t=>t[0]===name))name='slate';
  const root=document.documentElement;
  root.setAttribute('data-theme',name);
  root.toggleAttribute('data-stars',!!THEME_LIST.find(t=>t[0]===name)[3]);
  try{localStorage.setItem(THEME_KEY,name)}catch(e){}
}

/* ---------- start ---------- */
let savedTheme='slate';
try{savedTheme=localStorage.getItem(THEME_KEY)||'slate'}catch(e){}
setTheme(savedTheme);
load();
try{history.replaceState(null,'')}catch(e){}
/* System back button: from a deck it returns to the deck list; on the deck list it leaves the app. */
window.addEventListener('popstate',()=>{if(sheetKind){closeSheet();return}if(db.active!==null)showHome()});
render();
loadBackupCfg();
window.addEventListener('pagehide',()=>{if(bkTimer){clearTimeout(bkTimer);bkTimer=null;queueBackup()}});
})();
</script>
