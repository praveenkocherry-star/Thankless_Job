<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kramdex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700;800&display=swap">
<style>
/* Themes: each sets the same colour tokens. "custom" is set from the swatches. */
:root,[data-theme="night"]{--navy:#0A1A4F;--navy2:#11246B;--yellow:#E8D878;--orange:#E0A463;--black:#0B0B0B;--white:#DCE1EE;--ph:#C9D3F5}
[data-theme="forest"]{--navy:#0B2E1F;--navy2:#145A3C;--yellow:#D7E8CC;--orange:#8FCFA8;--black:#06140D;--white:#DCE1EE;--ph:#B7E4C7}
[data-theme="plum"]{--navy:#2A0B3A;--navy2:#44156A;--yellow:#E8D2E3;--orange:#D27BC0;--black:#1A0018;--white:#DCE1EE;--ph:#E9C6F0}
[data-theme="peace"]{--navy:#1F3A4D;--navy2:#2C5266;--yellow:#F2EBDD;--orange:#A7C7B5;--black:#0E1E27;--white:#E6EEF0;--ph:#BFD3D9}
[data-theme="ocean"]{--navy:#0B2A3C;--navy2:#14496B;--yellow:#CDEEF7;--orange:#5FC3D8;--black:#051521;--white:#D6ECF3;--ph:#A9DCE8}
[data-theme="sand"]{--navy:#3B2F22;--navy2:#5A4730;--yellow:#F3E6C8;--orange:#E3B66B;--black:#1E160C;--white:#EFE4CC;--ph:#E7D6B0}
[data-theme="rose"]{--navy:#3A1424;--navy2:#5C2338;--yellow:#F9DDE6;--orange:#E88FA9;--black:#1F0A12;--white:#F3DCE4;--ph:#F2C4D3}
[data-theme="slate"]{--navy:#1E2430;--navy2:#2D3646;--yellow:#E4E8F0;--orange:#9AA8C0;--black:#0E1219;--white:#D9DEE8;--ph:#BCC6D6}
[data-theme="ember"]{--navy:#3A1A0E;--navy2:#5C2D17;--yellow:#FBE3CF;--orange:#F0A35E;--black:#1E0D05;--white:#F4DCCB;--ph:#F6C9A6}
[data-theme="mint"]{--navy:#0F3530;--navy2:#17524A;--yellow:#DDF5EC;--orange:#7FD6B5;--black:#062019;--white:#D4EEE5;--ph:#B2E6D2}
[data-theme="lavender"]{--navy:#2B2750;--navy2:#3E3A72;--yellow:#ECE9FB;--orange:#B7AEF0;--black:#13112A;--white:#E0DCF5;--ph:#CFC8F0}

*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}

/* Scale the whole app to the device: root size follows the screen width */
html{font-size:clamp(16px,4vw,26px);-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--navy)}
html,body{margin:0;max-width:100%}
body{overflow:hidden;height:100vh;height:100svh;background:var(--navy);color:var(--yellow);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.5;padding:0 1rem;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--white);outline-offset:3px}
::placeholder{color:var(--ph);opacity:1}
.wrap{width:100%;max-width:46rem;margin:0 auto;display:flex;flex-direction:column;gap:.6rem}

/* header: app name and small credit box, then the deck name */
.top{display:flex;flex-direction:column;gap:.6rem;padding-top:.8rem}
.row1{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.brand{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:.63rem;font-weight:900;text-transform:uppercase;white-space:nowrap;color:var(--yellow);line-height:1.05}
.credit-row{display:flex;justify-content:flex-end}
.credit{flex:none;border:1px solid var(--white);border-radius:0;padding:.03rem .12rem;font-weight:800;line-height:1.15;text-align:center;background:var(--navy);color:var(--yellow)}
.credit .cr1{display:block;font-size:.285rem}
.credit hr{margin:.05rem 0}
.credit .cr2{display:block;font-size:.21875rem;text-transform:uppercase}
.credit hr{border:0;height:1px;margin:.08rem 0;background:var(--white)}
.deckbar{display:flex;align-items:center;justify-content:center;gap:.6rem;min-width:0}
.deckbar .label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* deck name inside a deck: display only, very small, no border */
.deckname{flex:1;min-width:0;font-size:1.1rem;font-weight:900;text-align:center;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:.25em;color:var(--yellow);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.homebar{grid-template-columns:repeat(2,1fr)}
.tabs{position:relative;flex:none;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;padding:.6rem .45rem calc(.6rem + env(safe-area-inset-bottom,0px));background:var(--navy);border-top:1px solid var(--white)}
.tab{min-height:2.125rem;border:1px solid var(--white);border-radius:14px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:.62rem;overflow-wrap:normal;padding:.2rem .1rem}
.tab[aria-selected="true"]{background:var(--orange);color:var(--black)}
@media (min-width:760px){
  .tabs{border-radius:16px;margin-bottom:.4rem}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.25rem;padding:.7rem 1.1rem;border:1px solid var(--white);border-radius:14px;background:var(--orange);color:var(--black);font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--white);text-align:center;overflow-wrap:anywhere}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--white)}
.btn:disabled{opacity:.45;cursor:default;transform:none;box-shadow:0 4px 0 var(--white)}
.btn.sm{min-height:2.5rem;padding:.35rem .8rem;font-size:.95rem}
.btn.lg{min-height:3.75rem;font-size:1.2rem}
.btn.block{width:100%}
.btn.back{flex-direction:column;gap:0;min-width:4rem;min-height:0;padding:.375rem .5rem;font-size:1.375rem;line-height:1;box-shadow:0 3px 0 var(--white);flex:none;border-radius:15px}
.btn.back .bl{font-size:.875rem;font-weight:900;line-height:1.1}
.btn.danger{background:#C84B4B;color:#DCE1EE;font-size:1.35rem;font-weight:900;min-height:4rem}
.theme-panel .label{font-size:.8rem}
.theme-panel .seg.four button{min-height:2.2rem;font-size:.8rem;padding:.1rem .2rem}
.decks .deck{min-height:2.6rem;padding:.35rem .8rem;font-size:1rem;border-radius:12px}
/* deck rows on the landing page: name button (black, white border) with small Rename and Delete on the same line */
.deckrow{display:flex;align-items:center;gap:.4rem;min-width:0}
.deckopen{flex:1;min-width:0;height:1.2rem;min-height:1.2rem;padding:0 .5rem;background:#000000;color:#DCE1EE;border:1px solid var(--white);border-radius:12px;text-align:center;font-size:.8rem;font-weight:900;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;box-shadow:0 2px 0 var(--white)}
.deckrow .renbtn,.deckrow .delbtn{flex:none;width:3.42rem;min-height:1rem;padding:0 .2rem;border:1px solid var(--white);border-radius:8px;font-size:.7rem;font-weight:900;line-height:1.1}
.renbtn{background:#E3C56A;color:#000000}
.deckrow .delbtn{background:#C2494A;color:#DCE1EE}
.btn.again{background:#C2494A;color:#DCE1EE}
.btn.got{background:#3D9A62;color:#DCE1EE}

/* panels and text */
.page{margin:.4rem 0 0;font-size:2rem;font-weight:800;color:var(--yellow)}
.panel{background:var(--navy2);border:1px solid var(--white);border-radius:18px;padding:1.1rem;display:flex;flex-direction:column;gap:.9rem}
.center{align-items:center;text-align:center}
.big{font-size:1.5rem;font-weight:800;color:var(--yellow);margin:0}
.label{font-size:.85rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow)}
.ready{margin:0;font-weight:800;color:var(--white);min-height:1.4em}
.busy{margin:0;min-height:1.3em;color:var(--white);font-weight:700}
.hint{margin:0;text-align:center;color:var(--white);font-weight:700;font-size:.95rem}
.text,textarea{width:100%;background:var(--navy);color:var(--yellow);border:1px solid var(--white);border-radius:12px;padding:.7rem .85rem;font-size:1.05rem}
textarea{min-height:7rem;resize:vertical}

/* lists of decks and sets */
.decks,.setlist{display:flex;flex-direction:column;gap:.85rem}
.setrow{display:flex;gap:.6rem;align-items:stretch}
.deck{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:.75rem;min-height:4.1rem;padding:.85rem 1.1rem;border:1px solid var(--white);border-radius:16px;background:var(--orange);color:var(--black);font-weight:800;font-size:1.15rem;box-shadow:0 4px 0 var(--white);text-align:left;overflow-wrap:anywhere}
.deck .dc{font-size:.95rem;font-weight:700;flex:none}
.delbtn{flex:none;align-self:center;min-height:2.6rem;padding:.3rem .7rem;border:1px solid var(--white);border-radius:12px;background:#C2494A;color:#DCE1EE;font-weight:800;font-size:.9rem}

/* file box: black background, white text and a clear border */
.drop{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.5rem 1rem;border:1px solid var(--white);border-radius:18px;background:#000000;color:#DCE1EE;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 2px #000000,inset 0 0 0 4px var(--white)}
.drop:hover,.drop.over{border-color:var(--yellow);box-shadow:inset 0 0 0 2px #000000,inset 0 0 0 4px var(--yellow)}
.drop:focus-within{outline:4px solid var(--yellow);outline-offset:4px}
.drop input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.drop-title{font-size:1.25rem;font-weight:800;color:#DCE1EE}
.drop-sub{font-weight:700;font-size:.95rem;color:#DCE1EE}
.types{display:flex;flex-wrap:wrap;gap:.45rem;justify-content:center;margin-top:.25rem}
.types span{font-weight:800;font-size:.8rem;background:#000000;color:#DCE1EE;border:1px solid var(--white);border-radius:8px;padding:.05rem .55rem}
details.paste{display:flex;flex-direction:column;gap:.6rem}
details.paste summary{font-weight:800;color:var(--yellow);cursor:pointer;padding:.25rem 0}
details.paste .btn{align-self:flex-start}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.file{display:flex;justify-content:space-between;align-items:center;gap:.6rem;border:1px solid var(--white);border-radius:12px;padding:.45rem .5rem .45rem .85rem;background:var(--navy)}
.fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;font-weight:700;color:var(--yellow)}
.xbtn{flex:none;width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--white);background:var(--orange);color:var(--black);font-weight:900}

/* theme and difficulty pickers */
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.seg.four{grid-template-columns:repeat(2,1fr)}
.seg button{min-height:3.4rem;border:1px solid var(--white);border-radius:14px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:1.05rem;overflow-wrap:anywhere;padding:.2rem}
.seg button[aria-pressed="true"]{background:var(--orange);color:var(--black)}
.custom{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.swatch{display:flex;flex-direction:column;gap:.35rem;font-weight:800;color:var(--yellow)}
.swatch input{width:100%;height:3rem;border:1px solid var(--white);border-radius:12px;background:none;padding:2px;cursor:pointer}

/* card-count slider with notches */
.slider-head{display:flex;justify-content:space-between;align-items:center}
.bubble{min-width:3.6rem;text-align:center;padding:.2rem .7rem;border:1px solid var(--white);border-radius:999px;background:var(--orange);color:var(--black);font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1rem;margin:1rem 0 .3rem;border-radius:999px;border:1px solid var(--white);background:linear-gradient(var(--yellow),var(--yellow)) 0 / var(--p,0%) 100% no-repeat,var(--navy);box-shadow:0 0 0 4px var(--navy2),0 0 0 6px var(--white)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--orange);border:4px solid var(--white);box-shadow:0 4px 0 var(--black),0 0 0 4px var(--navy2)}
input[type=range]::-moz-range-thumb{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--orange);border:4px solid var(--white)}
input[type=range]::-moz-range-track{background:transparent}
input[type=range]:focus-visible{outline:4px solid var(--white);outline-offset:6px}
.notches{display:flex;justify-content:space-between;font-size:.85rem;font-weight:800;color:var(--white);padding:0 .3rem}

/* flashcards */
.statline{display:flex;justify-content:space-between;gap:.6rem;font-weight:800;color:var(--white)}
.stage{position:relative;perspective:1400px;touch-action:none;user-select:none;-webkit-user-select:none}
.flip{position:relative;display:grid;min-height:max(8rem,calc(100vh - 400px));transform-style:preserve-3d;transition:transform 1.2s cubic-bezier(.45,.05,.2,1);cursor:pointer}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:.7rem;text-align:center;padding:1.2rem 1.4rem;border-radius:22px;background:var(--orange);color:var(--black);border:4px solid var(--white);box-shadow:0 0 0 4px var(--black),0 0 0 7px var(--white)}
.face.back{transform:rotateY(180deg)}
.face .label{color:var(--black)}
.main{font-size:1.6rem;font-weight:800;line-height:1.3;color:var(--black);overflow-wrap:anywhere;white-space:pre-line;max-width:100%}
.main.long{font-size:1.15rem;font-weight:700}
/* short phones: keep the grade buttons on the same screen */
@media (max-height:640px){.face{padding:.7rem 1rem}.main{font-size:1.25rem}.main.long{font-size:1rem}.face .label{font-size:.75rem}}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.grade{display:flex;justify-content:center;gap:1.2rem}
.grade .btn{width:5.5rem;min-height:2.75rem;padding:.2rem;font-size:1.5rem;line-height:1;border-radius:12px}
/* speech bar, top-left of each section: speaker (mute / unmute) and Replay */
.spkbar{display:flex;gap:.5rem;align-items:center;justify-content:flex-start}
.spkbtn{display:inline-flex;align-items:center;justify-content:center;min-height:2.6rem;min-width:2.8rem;padding:.2rem .7rem;border:1px solid var(--white);border-radius:12px;background:#000000;color:#DCE1EE;font-weight:900;font-size:.9rem;box-shadow:0 2px 0 var(--white);cursor:pointer}
.spkbtn svg{width:1.5rem;height:1.5rem}
.spkmute[aria-pressed="true"]{background:#C2494A}
.q{position:relative}
/* slider value, shown just below the Max notch */
.sval{display:block;text-align:right;font-weight:900;font-size:.95rem;color:var(--yellow);font-variant-numeric:tabular-nums}

/* quiz */
.q{display:flex;flex-direction:column;gap:1rem;background:var(--navy2);border:1px solid var(--white);border-radius:18px;padding:1.2rem}
.prompt{font-size:1.3rem;font-weight:700;color:var(--yellow);line-height:1.4;overflow-wrap:anywhere;white-space:pre-line}
.opts{display:flex;flex-direction:column;gap:.75rem}
.opt{display:flex;align-items:center;gap:.6rem;text-align:left;min-height:1.8rem;padding:.1rem .6rem;line-height:1.2;border:1px solid var(--white);border-radius:14px;background:var(--orange);color:var(--black);font-weight:800;font-size:1.05rem;overflow-wrap:anywhere}
.opt .k{flex:none;width:1.4rem;height:1.4rem;border-radius:8px;border:3px solid currentColor;display:grid;place-items:center;font-weight:900}
.opt.right{background:#3D9A62;color:#DCE1EE}
.opt.wrong{background:#C2494A;color:#DCE1EE}
.opt:disabled{cursor:default}
.feedback{border:1px solid var(--white);border-radius:14px;padding:.9rem;background:var(--orange);color:var(--black);font-weight:700;overflow-wrap:anywhere}
.feedback.ok{background:#3D9A62;color:#DCE1EE}
.feedback.no{background:#C2494A;color:#DCE1EE}
.feedback b{display:block;font-size:1.1rem}
.score{font-size:3.6rem;font-weight:900;color:var(--yellow);line-height:1}
.missed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem;text-align:left;width:100%}
.missed li{border:1px solid var(--white);border-radius:12px;padding:.6rem .75rem;background:var(--navy);color:var(--yellow);overflow-wrap:anywhere}

/* coloured buttons: darker, larger text that fills the button; outline halved to a mild line */
.btn,.deck,.opt,.xbtn,.tab,.seg button{border-width:2px}
.btn,.deck,.opt,.xbtn{box-shadow:0 2px 0 var(--white)}
.btn,.deck,.opt,.xbtn,.tab[aria-selected="true"],.seg button[aria-pressed="true"]{color:#000;font-weight:900}
.btn{font-size:1.2rem}
.btn.lg{font-size:1.35rem}
.deck{font-size:1.25rem}
.opt{font-size:1rem}
.seg button{font-size:.95rem;white-space:nowrap}
.tab{font-size:.62rem}
.btn.again,.btn.got,.opt.right,.opt.wrong{color:#DCE1EE}
/* home: theme first, a line across the screen, then New deck (30% smaller) and the deck list */
.homesep{height:0;border-top:1px solid var(--white);margin:.3rem calc(50% - 50vw) .3rem}
#newdeck{min-height:0;padding:.4rem .8rem;font-size:.85rem;line-height:1.1}
/* overview view and speech controls */
.ov{position:relative}
.ovp{margin:0;font-size:1.05rem;line-height:1.5;font-weight:700;color:var(--yellow);overflow-wrap:anywhere}
/* API key panel on the home page: compact */
.apipanel{padding:.5rem .6rem;gap:.4rem}
.apipanel .label{font-size:.7rem}
.apipanel .text{padding:.35rem .5rem;font-size:.85rem}
.apipanel .btn.sm{min-height:1.9rem;padding:.2rem .5rem;font-size:.75rem;border-radius:10px;box-shadow:0 2px 0 var(--white)}
.apirow{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.apidots{flex:1;min-width:0;font-weight:800;font-size:.9rem;overflow-wrap:anywhere;color:var(--white)}
.apisteps{margin:0;padding-left:1.1rem;font-size:.7rem;font-weight:700;color:var(--white)}
.apinote{margin:0;font-size:.68rem;font-weight:700;color:var(--white)}
/* answer side: a smaller card, grade buttons below it */
.flip.is-flipped{min-height:max(7rem,calc(100vh - 560px))}
/* letterhead band: white, black, white; full width of the screen */
.letterhead{height:0;border-top:1px solid var(--white);margin:.5rem calc(50% - 50vw) .3rem}
/* theme section: compact, about half its former height */
.theme-panel{padding:.4rem .5rem;gap:.3rem}
.theme-panel .label{font-size:.7rem}
.theme-panel .seg.four{grid-template-columns:repeat(4,1fr);gap:.3rem}
.theme-panel .seg.four button{min-height:1.44rem;font-size:.7rem;padding:0 .1rem;border-radius:8px;border-width:2px}
.deckcol{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0}
.bylabel{font-size:.7rem;font-weight:700;color:var(--white);text-align:center}
.busybox{align-self:flex-start;border:1px solid var(--white);border-radius:12px;background:var(--navy2);padding:.5rem .8rem;font-weight:800;font-size:.95rem;color:var(--yellow)}
.apidetect{display:flex;flex-direction:column;gap:.4rem;font-size:.85rem;font-weight:800;color:var(--yellow)}
.apititle{flex:1;min-width:0;font-size:.85rem;font-weight:800;color:var(--yellow)}
.shufbtn{margin-left:auto;min-height:2.2rem;font-size:.8rem}
/* ---- round 2: thin double frame (white, black, white), smaller sliders and difficulty buttons ---- */
.panel,.btn,.deck,.drop,.credit,.tab,.file,.seg button,.opt,.q,.deckopen,.spkbtn,.feedback{outline:1px solid var(--black);outline-offset:1px;box-shadow:0 0 0 2px var(--white)}
.btn:active,.deck:active{box-shadow:0 0 0 2px var(--white)}
#diff button{min-height:.85rem;font-size:.26rem;padding:0;line-height:1}
input[type=range]{height:.5rem;margin:.6rem 0 .2rem}
input[type=range]::-webkit-slider-thumb{width:1.4rem;height:1.4rem;border-width:2px}
input[type=range]::-moz-range-thumb{width:1.3rem;height:1.3rem;border-width:2px}
#newdeck{margin-bottom:.9rem}
.panel{padding:.6rem .7rem;gap:.5rem}
.wrap{gap:.45rem}
.top{padding-top:.4rem;gap:.35rem}
.btn.lg{min-height:2.6rem;font-size:1.05rem;padding:.4rem .8rem}
.notches{font-size:.7rem}
input[type=range]{margin:.4rem 0 .1rem}
.drop{padding:.8rem}
details.paste summary{padding:.1rem 0}
.files{gap:.35rem}
.quizfit .q{gap:.5rem;padding:.6rem}
.quizfit .opt{min-height:1.9rem;padding:.2rem .5rem;font-size:.95rem}
.quizfit .opts{gap:.4rem}
.upl{position:relative;cursor:pointer;margin:0}
.upl input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.themesel{width:100%;min-height:2.2rem;padding:.2rem .6rem;border:1px solid var(--white);border-radius:12px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:.95rem}
.themesel option{background:var(--navy);color:var(--yellow)}
/* ---- round 3 ---- */
.brand{font-size:1.89rem}
#diff button{min-height:1.7rem;font-size:.52rem}
.fname{font-size:.5rem}
.panel{padding:.5rem .6rem;gap:.35rem;position:relative;overflow:hidden}
input[type=range]{height:.3rem;margin:.3rem 0 .05rem}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);

/* Count notches: 10, 20, 30, 40, 50, then Max (all facts in the material, no cap). */

/* ---------- state and storage ---------- */
const KEY='cramdeck.v3', OLD_KEY='cramdeck.v2';
let db={decks:[],active:null,tab:'create'};
let nextId=1;
let study=null, quiz=null, busy=false, gesture=null, ignoreClick=false;
let lastMsg='';
const factCache=new Map();
let ovSpeakPending=false;
let backupUI={msg:'',list:[],restoreOpen:false};

function save(){try{localStorage.setItem(KEY,JSON.stringify({decks:db.decks}))}catch(e){}}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const d=JSON.parse(raw);if(d&&Array.isArray(d.decks))db.decks=d.decks}
    else{
      const o=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
      if(o&&Array.isArray(o.decks))db.decks=o.decks.map(x=>({id:x.id,name:x.name,sources:x.sources||[],difficulty:x.difficulty||'medium'}));
    }
  }catch(e){}
  db.decks.forEach(d=>{
    d.sources=d.sources||[];
    d.difficulty=d.difficulty||'medium';
    d.lvl=lvlOf(d);d.wlvl=wlvlOf(d);delete d.countIdx;
    d.gen=(d.gen&&typeof d.gen==='object')?d.gen:{};
    /* saved sets from earlier versions are no longer used */
    delete d.cursor;delete d.flashSets;delete d.quizSets;delete d.nextFlash;delete d.nextQuiz;
  });
}
const D=()=>db.decks.find(d=>d.id===db.active);

/* Default names: "Deck 1", "Deck 2"... using the lowest number not already taken. Custom names are ignored. */
function nextDeckName(){
  const taken=new Set(db.decks.map(d=>{const m=/^Deck (\d+)$/.exec(d.name);return m?+m[1]:0}));
  let n=1;while(taken.has(n))n++;
  return `Deck ${n}`;
}
/* Navigation: opening a deck adds one history entry, so the phone's back button returns to the deck list.
   On the deck list the back button leaves the app, as usual. */
function openDeck(id){
  db.active=id;db.tab='create';study=quiz=null;lastMsg='';
  try{history.pushState({deck:id},'')}catch(e){}
  render();resetScroll();
}
function resetScroll(){const sc=$('#scroll');if(sc)sc.scrollTop=0}
function showHome(){
  db.active=null;study=quiz=null;lastMsg='';speechStop();
  render();resetScroll();
}
function goHome(){
  const inDeck=history.state&&history.state.deck!==undefined;
  showHome();
  if(inDeck){try{history.back()}catch(e){}}
}
function newDeck(){
  const v=prompt('Name your new deck',nextDeckName());
  if(v===null)return;
  const name=(v.trim()||nextDeckName()).slice(0,60);
  const d={id:'d'+uid(),name,sources:[],difficulty:'medium',lvl:1,wlvl:1};
  db.decks.push(d);save();openDeck(d.id);
}
function deleteDeck(id){
  const d=db.decks.find(x=>x.id===id);if(!d)return;
  if(!confirm(`Delete "${d.name}"? This cannot be undone.`))return;
  db.decks=db.decks.filter(x=>x.id!==id);
  factCache.delete(id);
  d.sources.forEach(s=>{if(s.blobId)idbDel(s.blobId)});
  save();
  if(db.active===id)goHome();
  else render();
}

/* ---------- text analysis ---------- */
/* Words that describe the document rather than its subject. They are never used as terms or distractors. */
const META_WORDS=`book books chapter chapters author authors edition preface introduction foreword reader readers page pages lesson lessons section sections figure figures copyright publisher learn learning objective objectives course module modules unit units document documents file files version sample deck decks card cards quiz quizzes paragraph paragraphs note notes text texts article articles website guide guides tutorial worksheet question questions answer answers example examples exercise exercises activity activities summary review topic topics subject subjects student students teacher teachers class classroom thank thanks please hope welcome name date contents index acknowledgements dedication`;
const STOP=new Set(`a about above across after again against all almost also although am among an and another any are around as at away back be became because become becomes been before being below between both but by came can cannot could did do does doing done down during each either else enough even ever every few first for from further get gets got had has have having he her here hers him his how however i if in into is it its itself just last least less like made make makes many may me might more most much must my near neither never new next no nor not now of off often on once one only onto or other others our out over own per perhaps rather same several shall she should since so some such than that the their them themselves then there these they this those though through thus to together too toward towards under until up upon us use used uses using very via was way we well were what when where whether which while who whom whose why will with within without would yet you your called known refers means include includes including often usually also mostly roughly about ${META_WORDS}`.split(/\s+/));
const PRONOUN=new Set('it this that there these those they he she we which what who such one each many some most here its their'.split(' '));
const WORD_RE=/[A-Za-z][A-Za-z'’-]*[A-Za-z]|\d[\d.,]*\d%?|\d%?/g;
const isNum=w=>/^\d/.test(w);

/* Front matter (preface, contents, copyright) is dropped. A body section re-enables use. */
const FRONT_HEAD=/^(preface|foreword|introduction|acknowledg(e)?ments?|dedication|about (this|the) (book|author|guide|course|program)|table of contents|contents|index|copyright|how to use (this|the) (book|guide)|note to (the )?(reader|student|teacher)|publisher|about the author|author'?s note|disclaimer|bibliography|references|afterword|afterthoughts?|final thoughts|closing thoughts|who (this|the) (book|course) is for|learning (outcomes|objectives)|review questions|self[- ]check|exercises|course (overview|information))\b/i;
const FRONT_BODY=/(all rights reserved|copyright\s*(©|\(c\))|©\s*\d{4}|\bisbn\b|www\.|https?:\/\/|\S+@\S+\.\S+|\bpage \d+\b)/i;
const SECTION_START=/^(chapter|unit|lesson|module|part|section|topic)\s+(\d+|[ivx]+|one|two|three|four|five|six|seven|eight|nine|ten)\b/i;
/* Everything in the material is used, including introductions and questions. Only obvious junk is dropped:
   copyright and web lines, and lines that are just page numbers or punctuation. */
const JUNK_LINE=/(©|\bisbn\b|all rights reserved|https?:\/\/|www\.|\S+@\S+\.\S+|^\s*(page\s*)?\d+\s*$)/i;
function cleanSource(raw){
  /* Lines that were wrapped by the page (the next line starts in lower case and the previous one has no full stop)
     are joined back into one sentence. */
  const out=[];
  for(const line of raw.split('\n')){
    const t=line.trim();
    if(!t||JUNK_LINE.test(t)||/^[\d\s.|–-]+$/.test(t)){out.push('');continue}
    const prev=out.length?out[out.length-1]:'';
    if(prev&&/^[a-z]/.test(t)&&!/[.!?:;"”’)\]]$/.test(prev)){out[out.length-1]=prev+' '+t}
    else out.push(t);
  }
  return out.join('\n');
}
/* A sentence can make a card only if it is about the subject: no document talk, no "we/you/I", no questions. */
const META_SENT=/(this (book|chapter|guide|article|lesson|document|course|unit|section|module|worksheet|tutorial|file|deck|text|material|notes?|presentation|video|paper|study)\b|in this (book|chapter|guide|lesson|unit|section|module|course|article)\b|you will (learn|need|find|see)\b|learning objectives?|by the end of|we (will|hope|recommend|believe|suggest)\b|thank you|please (read|note|use|see)\b|https?:|www\.)/i;
const PERSON=/\b([Ww]e|[Oo]ur|[Oo]urs|[Uu]s|[Yy]ou|[Yy]our|[Yy]ours|[Mm]y|[Mm]e|I)\b/;
/* Relaxed: any sentence with real words will do. Questions are handled separately (see qaFacts). */
const goodSentence=s=>s.split(' ').length>=3&&s.length<=400&&!/\?\s*$/.test(s)&&!/https?:|www\./i.test(s);

function cleanText(t){
  return t.replace(/\r/g,'').replace(/­/g,'').replace(/(\w)-\n(\w)/g,'$1$2')
    .replace(/([a-z)\]"'])([.!?])([A-Z])/g,'$1$2 $3')   /* "fails.They" -> "fails. They" */
    .replace(/([a-z]),([A-Za-z])/g,'$1, $2')           /* "computerized,security" -> "computerized, security" */
    .replace(/[ \t]+/g,' ');
}
/* A short capitalised line with no closing punctuation is a heading. Headings are kept apart from the text after them. */
const isHeadingLine=h=>h.length>0&&h.length<=70&&h.split(/\s+/).length<=8&&/^[A-Z]/.test(h)&&!/[.!?;,:]$/.test(h)&&!/^[•\-*▪◦]/.test(h);
/* Common verbs. A phrase containing one of these is not a term ("Helmets protect" is not a term). */
const VERBS=new Set(`be is are was were been being am have has had do does did include includes including protect protects reduce reduces cause causes help helps allow allows require requires need needs make makes use uses give gives provide provides occur occurs become becomes mean means lead leads prevent prevents ensure ensures contain contains show shows keep keeps work works cover covers check checks identify identifies decide decides review reviews list lists control controls grow grows move moves form forms change changes affect affects follow follows depend depends consist consists produce produces release releases store stores reach reaches carry carries bring brings take takes get gets put puts see sees lose loses increase increases decrease decreases enter enters leave leaves pass passes convert converts absorb absorbs transport transports fix fixes break breaks split splits return returns remain remains connect connects join joins begin begins start starts end ends enable enables supply supplies must should can could will would may might also often always never`.split(/\s+/));
/* Words that are too general to be a term on their own. Used only when choosing a key term from a sentence. */
const GENERIC=new Set(`process processes result results factor factors type types method methods number part parts level levels system systems area areas amount example examples thing things way ways form forms kind kinds use uses purpose reason reasons effect effects role roles`.split(/\s+/));
function splitSentences(t){
  const out=[];
  t=t.split('\n').map(l=>isHeadingLine(l.trim())?l+'\n\n':l).join('\n');
  for(const para of t.split(/\n{2,}|\n(?=\s*(?:[•\-*▪◦]|\d+[.)])\s)/)){
    const p=para.replace(/^\s*(?:[•\-*▪◦]|\d+[.)])\s+/,'').replace(/\s*\n\s*/g,' ').trim();
    if(!p)continue;
    for(let s of p.split(/(?<=[.!?])\s+(?=["“(]?[A-Z0-9])/)){s=s.trim();if(s.split(' ').length>=3&&!s.includes('?')&&!/^(yes|no)\b/i.test(s))out.push(s)}
  }
  return out;
}
function termScore(term,freq){
  let s=0;for(const w of (term.toLowerCase().match(WORD_RE)||[]))s+=(freq.get(w)||0);return s;
}
function okTerm(term){
  const words=term.trim().split(/\s+/);
  if(words.length>4||!term.trim())return false;
  if(PRONOUN.has(words[0].toLowerCase()))return false;
  if(/\d/.test(term))return false;
  if(words.some(w=>STOP.has(w.toLowerCase())&&words.length>1))return false;
  if(words.every(w=>STOP.has(w.toLowerCase())))return false;
  if(!words.some(w=>w.length>=4))return false;
  return true;
}
function wordFreq(text){
  const f=new Map();
  for(const w of (text.toLowerCase().match(WORD_RE)||[])){
    if(isNum(w)||w.length<3||STOP.has(w))continue;
    f.set(w,(f.get(w)||0)+1);
  }
  return f;
}
const trimEnd=s=>s.trim().replace(/[.;:,]+$/,'').trim();
const stripArticle=s=>s.replace(/^(?:an?|the)\s+/i,'');

/* Term and definition pairs ("facts") from the material. Built from the sources; cached while the sources are unchanged. */
const escRe=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const META_SET=new Set(META_WORDS.split(/\s+/));
/* The term in a statement is replaced with "this term", so a question never gives its own answer away. */
const hideTerm=(def,term)=>def.replace(new RegExp('(?:\\b(?:the|a|an|this|that|these|those)\\s+)?'+escRe(term),'gi'),'this term');
/* A phrase can be a term: 1 to 4 words, no digits, no stop word at either end, no document words. */
function phraseOK(words){
  if(!words.length||words.length>4)return false;
  const lw=words.map(w=>w.toLowerCase());
  if(lw.some(w=>/\d/.test(w)||META_SET.has(w)))return false;
  if(STOP.has(lw[0])||STOP.has(lw[lw.length-1]))return false;
  if(PRONOUN.has(lw[0]))return false;
  return lw.some(w=>w.length>=4);
}
/* Pass 1: "Term: definition" or "Term – definition" lines. Bullet marks are removed first. */
function definitionFacts(text){
  const facts=[];
  for(const raw of text.split('\n')){
    const line=raw.trim().replace(/^(?:[•\-*▪◦]|\d+[.)])\s+/,'');
    if(line.includes('?'))continue;
    const m=line.match(/^([A-Za-z][\w '’()\/&-]{1,40}?)\s*(?::|\s[–—-]\s)\s*(.{8,})$/);
    if(m&&okTerm(m[1])&&m[2].split(' ').length>=4&&goodSentence(m[2]))
      facts.push({term:cap(trimEnd(m[1])),def:cap(trimEnd(m[2])),kind:'def',score:50});
  }
  return facts;
}
/* Pass 2: a short capitalised line with no full stop is a heading. The first good sentence under it is its definition. */
function headingFacts(text){
  const out=[];
  const lines=text.split('\n').map(l=>l.trim());
  for(let i=0;i<lines.length;i++){
    const h=lines[i];
    if(!isHeadingLine(h))continue;
    let body='',words=0;
    for(let j=i+1;j<lines.length&&words<80;j++){
      const l=lines[j];
      if(!l)continue;
      if(isHeadingLine(l))break;
      body+=l+' ';words+=l.split(/\s+/).length;
    }
    const sent=splitSentences(body).find(s=>goodSentence(s)&&s.split(' ').length>=5);
    if(!sent)continue;
    const term=cap(stripArticle(h.replace(/^(chapter|unit|lesson|module|part|section|topic)\s+(\d+|[ivx]+)\s*[:.–—-]?\s*/i,'').replace(/[:–—-]+$/,'').trim()));
    if(!term||!phraseOK(term.split(/\s+/)))continue;
    out.push({term,def:cap(trimEnd(sent)),kind:'def',score:70});
  }
  return out;
}
/* The terms a sentence is about, best first. Phrases of one to three words that the whole text uses often score highest. */
function keyTerms(s,freq){
  const scored=[];
  for(const chunk of s.split(/[,;:()"“”]/)){
  const words=chunk.match(/[A-Za-z][A-Za-z'’-]*[A-Za-z]/g)||[];
  for(let n=1;n<=3;n++)for(let i=0;i+n<=words.length;i++){
    const ph=words.slice(i,i+n);
    if(!phraseOK(ph))continue;
    const lw=ph.map(w=>w.toLowerCase());
    if(lw.some(w=>VERBS.has(w)||GENERIC.has(w)))continue;
    if(lw.slice(1,-1).some(w=>STOP.has(w)))continue;
    if(lw.length>1&&new Set(lw.map(w=>w.slice(0,5))).size<lw.length)continue;
    if(/ed$/.test(lw[lw.length-1])&&lw[lw.length-1].length>4)continue;
    let score=0;for(const w of lw)score+=(freq.get(w)||0);
    if(!score)continue;
    if(i>0&&ph.some(w=>/^[A-Z]/.test(w)))score*=1.5;
    if(i===0)score*=1.3;
    if(n>1)score*=1.2;
    scored.push({t:cap(ph.join(' ')),score});
  }
  }
  scored.sort((a,b)=>b.score-a.score);
  const seen=new Set(),out=[];
  for(const c of scored){const k=c.t.toLowerCase();if(seen.has(k))continue;seen.add(k);out.push(c.t);if(out.length>=6)break}
  return out;
}
/* Pass 3: single sentences. "X is called Y" and "X is/means Y" give definitions; any other sentence with a key term gives a topic fact. */
function sentenceFacts(text,freq){
  const out=[];
  for(const s of splitSentences(text)){
    if(!goodSentence(s)||s.length>320||s.split(' ').length<5)continue;
    if(/^[^:]{2,50}:\s/.test(s)||isHeadingLine(s))continue;
    let m=s.match(/^(.{4,60}?)\s+(?:is|are)\s+(?:called|known as|termed|referred to as)\s+([^,;]{2,40}?)\.?$/i);
    if(m&&okTerm(stripArticle(m[2]))&&m[1].split(' ').length<=6){
      out.push({term:cap(stripArticle(trimEnd(m[2]))),def:cap(trimEnd(m[1])),kind:'def',score:50});continue;
    }
    m=s.match(/^(?:(?:an?|the)\s+)?([A-Za-z][A-Za-z0-9'’()\/ -]{1,40}?)\s+(?:is defined as|refers to|is|are|means|describes|describe)\s+(.{20,})$/i);
    if(m&&okTerm(m[1])&&m[2].split(' ').length>=4){
      out.push({term:cap(trimEnd(m[1])),def:cap(trimEnd(m[2])),kind:'def',score:50});continue;
    }
    const cands=keyTerms(s,freq);
    if(cands.length)out.push({term:cands[0],alts:cands.slice(1),def:cap(trimEnd(s)),kind:'topic',score:20+Math.min(25,termScore(cands[0],freq))});
  }
  return out;
}
/* Rhetorical questions ("Have you ever...?", "Why not...?", questions to "we" or "you") are never cards. */
const RHETORICAL=/^(have you|did you|do you|don'?t you|can you|could you|would you|wouldn'?t (it|you|we)|who (doesn'?t|hasn'?t|wouldn'?t)|why not|what if|imagine)\b|\b(we|us|our|let'?s)\b/i;
/* Questions that appear in the material (review questions, self-checks, "Consider" boxes) become cards when the
   next line gives an answer. The question is the front; the answer is the back. */
function qaFacts(text){
  const out=[];
  const lines=text.split('\n').map(l=>l.trim().replace(/^(?:[•\-*▪◦]|\d+[.)])\s+/,''));
  for(let i=0;i<lines.length;i++){
    const q=lines[i];
    if(!/\?$/.test(q)||q.split(' ').length<3||RHETORICAL.test(q))continue;
    let j=i+1;while(j<lines.length&&!lines[j])j++;
    const a=lines[j];
    if(!a||/\?$/.test(a)||a.split(' ').length<4)continue;
    out.push({term:cap(q),def:cap(trimEnd(a)),kind:'qa',score:65});
  }
  return out;
}
function tableFacts(rows){
  rows=rows.map(r=>(r||[]).map(c=>c==null?'':String(c).trim())).filter(r=>r.some(Boolean));
  if(rows.length<1)return[];
  const width=Math.max(...rows.map(r=>r.length));
  let header=null;
  if(rows.length>1&&rows[0].every(c=>!c||(!isNum(c)&&c.length<40))&&rows[0].filter(Boolean).length>=2)header=rows.shift();
  const out=[];
  for(const r of rows){
    const term=r[0];if(!term)continue;
    const rest=[];
    for(let i=1;i<width;i++){const v=r[i];if(!v)continue;rest.push(header&&width>2?`${header[i]||'Column '+(i+1)}: ${v}`:v)}
    if(!rest.length)continue;
    out.push({term,def:rest.join(' · '),score:100});
  }
  return out;
}

/* Facts for a deck, sorted by how central they are, with duplicates removed. */
function factsOf(d){
  const sig=d.sources.map(s=>s.name+':'+(s.text?s.text.length:0)+':'+(s.rows?s.rows.length:0)+':'+(s.size||0)).join('|');
  const hit=factCache.get(d.id);
  if(hit&&hit.sig===sig)return hit;
  const text=cleanSource(d.sources.filter(s=>s.text).map(s=>s.text).join('\n\n'));
  const tables=d.sources.filter(s=>s.rows).flatMap(s=>tableFacts(s.rows));
  const freq=wordFreq(text+' '+tables.map(c=>c.term+' '+c.def).join(' '));
  const all=[...tables,...definitionFacts(text),...headingFacts(text),...qaFacts(text),...sentenceFacts(text,freq)].sort((a,b)=>b.score-a.score);
  const seen=new Set(),seenDef=new Set(),facts=[];
  for(const f of all){
    if(!f.def)continue;
    const defKey=f.def.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
    if(seenDef.has(defKey))continue;
    const tkey=t=>t.toLowerCase().replace(/\s*\(.*?\)/g,'').trim();
    const pick=[f.term,...(f.alts||[])].find(t=>t&&!seen.has(tkey(t)));
    if(!pick)continue;
    seen.add(tkey(pick));seenDef.add(defKey);
    facts.push({term:pick,def:f.def.replace(/\n/g,' · '),kind:f.kind||'def'});
  }
  const pool=[...freq.entries()].filter(([w])=>w.length>=4&&!/ly$/.test(w)).sort((a,b)=>b[1]-a[1]).slice(0,300).map(e=>cap(e[0]));
  const val={sig,facts,pool,terms:facts.filter(f=>f.kind==='def').map(f=>f.term),allTerms:facts.filter(f=>f.kind!=='qa').map(f=>f.term)};
  factCache.set(d.id,val);
  return val;
}

/* ---------- set creation ---------- */
/* Flashcard question: "What is X?" with the definition on the back (Hard reverses it). */
function faceText(diff,c){
  if(c.kind==='qa'){
    if(diff==='hard')return {front:c.def,fLabel:'Which question is this the answer to?',back:c.term,bLabel:'Question',fLong:c.def.length>120,bLong:c.term.length>120};
    return {front:c.term,fLabel:'Question',back:c.def,bLabel:'Answer',fLong:c.term.length>120,bLong:c.def.length>120};
  }
  if(diff==='hard')return {front:hideTerm(c.def,c.term),fLabel:'Which term is this?',back:c.term,bLabel:'Term',fLong:c.def.length>120,bLong:false};
  const q=c.kind==='topic'?`What does the material say about ${c.term}?`:`What is ${c.term}?`;
  return {front:q,fLabel:'Question',back:c.def,bLabel:'Answer',fLong:false,bLong:c.def.length>120};
}
/* Quiz question: multiple choice. Framing alternates between a plain definition question and a short scenario. */
function makeQuestion(f,i,ctx,diff){
  if(f.kind==='qa'){
    /* A question from the material: choose its answer from several answers, all taken from the material. */
    const want=(diff==='easy'?3:4)-1;
    const pool=ctx.facts.map(x=>x.def).filter(d=>d!==f.def);
    const picks=shuffle(pool).sort((a,b)=>Math.abs(a.length-f.def.length)-Math.abs(b.length-f.def.length)).slice(0,want);
    return {type:'choice',label:'Question',prompt:f.term,answer:f.def,explain:f.def,options:shuffle([f.def,...picks])};
  }
  /* The types take turns: multiple choice, true or false, fill in the blank, matching. */
  const k=i%4;
  const otherFacts=ctx.facts.filter(x=>x.kind!=='qa'&&x.term!==f.term&&x.def!==f.def);
  if(k===1&&otherFacts.length){
    const wrong=(i>>2)%2===1;
    const other=otherFacts[(i*7)%otherFacts.length];
    const def=wrong?other.def:f.def;
    return {type:'truefalse',label:'True or false',prompt:`True or false. ${f.term}: ${def}`,answer:wrong?'False':'True',explain:`${f.term}: ${f.def}`,options:shuffle(['True','False'])};
  }
  if(k===2&&f.kind!=='qa'){
    /* The term is the missing word: "_____ is <definition>". */
    const stmt=/this term/i.test(hideTerm(f.def,f.term))?hideTerm(f.def,f.term).replace(/this term/gi,'_____'):`_____ is ${f.def}`;
    return {type:'fill',label:'Fill in the blank',prompt:`Fill in the blank: ${stmt}`,answer:f.term,explain:`${f.term}: ${f.def}`,options:[]};
  }
  if(k===3&&otherFacts.length>=2){
    const src=[f,...shuffle(otherFacts).slice(0,2)].filter((p,j,a)=>a.findIndex(x=>x.term.toLowerCase()===p.term.toLowerCase())===j);
    if(src.length>=2){
      const pairs=src.map(p=>({term:p.term,meaning:p.def}));
      return {type:'match',label:'Matching',prompt:'Match each term with its meaning.',answer:pairs.map(p=>`${p.term} = ${p.meaning}`).join('; '),explain:'',pairs,options:shuffle(pairs.map(p=>p.meaning))};
    }
  }
  /* Multiple choice: the framing alternates between a plain definition question and a short scenario. */
  const scenario=i%2===1;
  const stmt=hideTerm(f.def,f.term);
  const ask=f.kind==='topic'?'Which term is this statement about?':'Which term matches this definition?';
  const q={
    type:'choice',
    label:scenario?'Scenario':'Definition',
    prompt:scenario?`A student reads this in a textbook: "${stmt}". ${ask}`:`${ask} ${stmt}`,
    answer:f.term,
    explain:`${f.term}: ${f.def}`
  };
  const want=(diff==='easy'?3:4)-1;
  const lt=f.term.toLowerCase();
  const others=(ctx.terms.length>=want+2?ctx.terms:ctx.allTerms).filter(t=>{const l=t.toLowerCase();return l!==lt&&!l.includes(lt)&&!lt.includes(l)});
  let cands=shuffle(others).sort((a,b)=>Math.abs(a.length-f.term.length)-Math.abs(b.length-f.term.length)).slice(0,want);
  if(cands.length<want){
    const meta=META_WORDS.split(' ');
    const extra=ctx.pool.filter(w=>{const l=w.toLowerCase();return l!==lt&&!cands.includes(w)&&!meta.includes(l)&&!STOP.has(l)});
    cands=cands.concat(shuffle(extra).slice(0,want-cands.length));
  }
  q.options=shuffle([f.term,...cands]);
  return q;
}
/* App logic (no AI): the flashcards use N facts and the quiz uses the next N facts (wrapping round when the material
   is short). With rand=true (Shuffle) the facts are taken in a new random order. N follows the Create settings. */
/* ---------- file reading (unreadable files are skipped silently) ---------- */
const LIBS={
  pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
  xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'],
  docx:['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js']
};
const loading={};
function loadScript(src){return loading[src]||(loading[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete loading[src];rej(new Error('load'))};document.head.appendChild(s)}))}
async function need(k){for(const u of LIBS[k])await loadScript(u)}

/* CSV is read directly in the browser, so it works offline */
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split('\n',1)[0]||'';
  const sep=(first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length?'\t':',';
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}
      else cell+=ch;
    }else if(ch==='"')q=true;
    else if(ch===sep){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n')i++;
      row.push(cell);cell='';
      if(row.some(c=>c.trim()))rows.push(row);
      row=[];
    }else cell+=ch;
  }
  row.push(cell);
  if(row.some(c=>c.trim()))rows.push(row);
  return rows;
}
async function readFile(file){
  const name=file.name, ext=(name.split('.').pop()||'').toLowerCase();
  if(ext==='pdf'){
    await need('pdf');
    const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc=LIBS.pdf[1];
    const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
    let out='';
    for(let i=1;i<=pdf.numPages;i++){
      setBusy(`Reading ${name}: page ${i} of ${pdf.numPages}`);
      const tc=await (await pdf.getPage(i)).getTextContent();
      let line='';
      for(const it of tc.items){line+=it.str;line+=it.hasEOL?'\n':(/\s$/.test(it.str)?'':' ')}
      out+=line+'\n\n';
    }
    const text=cleanText(out);
    if(text.replace(/\s/g,'').length<40)return null;
    return {name,kind:'pdf',text};
  }
  if(['xlsx','xls','csv'].includes(ext)){
    const rows=[];
    if(ext==='csv'){
      rows.push(...parseCSV(await file.text()));
    }else{
      await need('xlsx');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      for(const sn of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,blankrows:false,raw:false});if(r.length)rows.push(...r)}
    }
    if(!rows.length)return null;
    const width=Math.max(...rows.map(r=>r.length));
    if(width===1)return {name,kind:ext,text:rows.map(r=>r[0]).join('\n')};
    return {name,kind:ext,rows};
  }
  if(ext==='docx'){
    await need('docx');
    const r=await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});
    return {name,kind:'docx',text:cleanText(r.value)};
  }
  if(['txt','md','text'].includes(ext)){
    return {name,kind:ext,text:cleanText(await file.text())};
  }
  return null;
}
function setBusy(msg){const el=$('#busy');if(el)el.textContent=msg}
async function addFiles(files){
  const d=D();if(!d||!files.length)return;
  lastMsg='';
  const failed=[],empty=[];
  for(const f of files){
    setBusy(`Reading ${f.name}…`);
    try{
      const src=await readFile(f);
      if(!src){failed.push(f.name);continue}
      const before=factsOf(d).facts.length;
      d.sources.push(src);
      if(factsOf(d).facts.length===before)empty.push(f.name);
    }catch(e){failed.push(f.name)}
  }
  setBusy('');
  study=quiz=null;
  save();
  const total=factsOf(d).facts.length;
  const msgs=[];
  if(failed.length)msgs.push(`Could not read: ${failed.join(', ')}.`);
  if(empty.length)msgs.push(`No new facts from: ${empty.join(', ')}.`);
  if(!total&&!msgs.length)msgs.push('No facts found in these files.');
  lastMsg=msgs.join(' ');
  renderAll();renderSheet();
}

/* ---------- panels: DOCS, IMAGE MEDIA and LINKS open inside the app (not the system explorer) ---------- */
let sheetKind=null,camStream=null,camShots=[],camRec=null,camMode='photo',camErr='';
function openSheet(kind){sheetKind=kind;camErr='';renderSheet();const el=$('#sheet');if(el)el.scrollTop=0}
function stopCam(){
  if(camRec&&camRec.state!=='inactive'){try{camRec.stop()}catch(e){}}
  camRec=null;
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null}
}
function closeSheet(){
  stopCam();
  camShots.forEach(s=>{if(s.url)URL.revokeObjectURL(s.url)});
  camShots=[];sheetKind=null;lastMsg='';
  const el=$('#sheet');if(el){el.hidden=true;el.innerHTML=''}
  renderAll();
}
async function camStart(){
  camErr='';
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('none');
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:true});
  }catch(e){camStream=null;camErr='The camera cannot open on this page. Use the phone camera app instead.'}
  renderSheet();
}
function camShoot(){
  const v=$('#camv');if(!v||!camStream||!v.videoWidth)return;
  const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{if(b){camShots.push({blob:b,kind:'image',url:''});renderSheet()}},'image/jpeg',0.9);
}
function camRecToggle(){
  if(!camStream||typeof MediaRecorder==='undefined')return;
  if(camRec&&camRec.state==='recording'){camRec.stop();return}
  const chunks=[];const rec=new MediaRecorder(camStream);camRec=rec;
  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

/* ---------- speech (reads cards and questions aloud) ---------- */
const canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
const spk={text:'',muted:false,cur:null};
const SPEAKOFF_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="currentColor"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
/* Reading starts at once unless muted. Long text is cut into short pieces and read one after another.
   A piece that does not start, or stops part way, is restarted, so reading does not stall. */
let spkRun=0;
function chunkSpeech(t){
  const sents=(t.match(/[^.!?;:]+[.!?;:]+["')\]]*|[^.!?;:]+$/g)||[t]).map(x=>x.trim()).filter(Boolean);
  const pieces=[];
  for(const s0 of sents){
    let rest=s0;
    while(rest.length>200){
      let cut=rest.lastIndexOf(' ',200);if(cut<60)cut=200;
      pieces.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trim();
    }
    if(rest)pieces.push(rest);
  }
  const groups=[];let cur='';
  for(const p of pieces){
    if(cur&&(cur+' '+p).length>200){groups.push(cur);cur=p}else cur=cur?cur+' '+p:p;
  }
  if(cur)groups.push(cur);
  return groups;
}
function speak(text){
  spk.text=text||'';
  if(!canSpeak||!text||spk.muted)return;
  const run=++spkRun;
  const parts=chunkSpeech(text);
  const say=(idx,tries)=>{
    if(run!==spkRun)return;
    if(idx>=parts.length){spk.cur=null;return}
    const u=new SpeechSynthesisUtterance(parts[idx]);
    u.rate=0.95;spk.cur=u;
    let started=false,done=false,t1=null,t2=null;
    const finish=()=>{done=true;clearTimeout(t1);clearTimeout(t2)};
    const next=()=>{if(done)return;finish();say(idx+1,0)};
    const retry=()=>{
      if(done||run!==spkRun)return;
      finish();
      try{speechSynthesis.cancel();speechSynthesis.resume()}catch(e){}
      if(tries<2)setTimeout(()=>say(idx,tries+1),200);else say(idx+1,0);
    };
    u.onstart=()=>{started=true};
    u.onend=next;
    u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))return;next()};
    t1=setTimeout(()=>{if(!started)retry()},2500);
    t2=setTimeout(retry,parts[idx].length*90+8000);
    try{speechSynthesis.speak(u)}catch(e){retry()}
  };
  try{speechSynthesis.cancel();speechSynthesis.resume()}catch(e){}
  setTimeout(()=>say(0,0),150);
}
function speechStop(){
  spkRun++;
  spk.cur=null;
  if(canSpeak){try{speechSynthesis.cancel()}catch(e){}}
}

const MATERIAL_CHARS=120000;
/* Every file is included. A long file is sampled at evenly spaced places, so the whole file is covered. */
function sampleText(t,budget){
  if(t.length<=budget)return t;
  const W=1500,n=Math.max(1,Math.floor(budget/W)),parts=[];
  for(let k=0;k<n;k++){
    const start=n===1?0:Math.floor(k*(t.length-W)/(n-1));
    let piece=t.slice(start,start+W);
    if(start>0){const sp=piece.indexOf(' ');if(sp>0)piece=piece.slice(sp+1)}
    parts.push(piece.trim());
  }
  return parts.join('\n[...]\n');
}
function materialText(d){
  const src=d.sources.filter(s=>s.kind!=='media').map(s=>({name:s.name,body:s.kind==='link'?('Link to read ('+s.linkType+'): '+s.url):s.text?cleanSource(s.text):(s.rows||[]).map(r=>(r||[]).map(c=>c==null?'':String(c)).join(' | ')).join('\n')}));
  if(!src.length)return '';
  const budget=Math.floor(MATERIAL_CHARS/src.length);
  return src.map(x=>`--- ${x.name} ---\n${sampleText(x.body,budget)}`).join('\n\n');
}
/* The facts used for the sets: taken in turn from every file (so each file counts), no fact twice,
   at most 249 (83 per level). Fact i belongs to one level only: Easy when i%3=0, Medium 1, Hard 2. */
const balCache=new Map();
function balancedFacts(d){
  const sig=factsOf(d).sig,hit=balCache.get(d.id);
  if(hit&&hit.sig===sig)return hit.list;
  const lists=d.sources.map((src,i)=>{
    const tmp={id:'#bal'+d.id+'#'+i,sources:[src]};
    const f=factsOf(tmp).facts.slice();factCache.delete(tmp.id);return f;
  });
  const LIMIT=FACT_CAP*3,ptr=lists.map(()=>0),seen=new Set(),out=[];
  let progressed=true;
  while(out.length<LIMIT&&progressed){
    progressed=false;
    lists.forEach((l,li)=>{
      while(ptr[li]<l.length&&out.length<LIMIT){
        const f=l[ptr[li]++],k=(f.term+'|'+f.def).toLowerCase();
        if(seen.has(k))continue;
        seen.add(k);out.push(f);progressed=true;break;
      }
    });
  }
  balCache.set(d.id,{sig,list:out});
  return out;
}
function cleanCards(a){
  return (Array.isArray(a)?a:[]).filter(c=>c&&typeof c.question==='string'&&typeof c.answer==='string'&&c.question.trim()&&c.answer.trim())
    .map(c=>({term:c.question.trim(),def:c.answer.trim(),kind:'qa'}));
}
function cleanQuiz(a,k){
  return (Array.isArray(a)?a:[]).map(q=>{
    if(!q||typeof q.question!=='string'||!q.question.trim())return null;
    const prompt=q.question.trim(),explain=String(q.explain||'').trim();
    const type=String(q.type||'choice').toLowerCase();
    if(type==='fill'){
      const ans=String(q.answer||'').trim();
      if(!ans||ans.length>60||!/_{3,}/.test(prompt))return null;
      return {type:'fill',label:'Fill in the blank',prompt,answer:ans,explain,options:[]};
    }
    if(type==='match'){
      const raw=(Array.isArray(q.pairs)?q.pairs:[]).map(p=>({term:String(p&&p.term||'').trim(),meaning:String(p&&p.meaning||'').trim()})).filter(p=>p.term&&p.meaning);
      const pairs=raw.filter((p,i)=>raw.findIndex(x=>x.term===p.term)===i).slice(0,4);
      if(pairs.length<2)return null;
      return {type:'match',label:'Matching',prompt:prompt||'Match each term with its meaning.',answer:pairs.map(p=>`${p.term} = ${p.meaning}`).join('; '),explain,pairs,options:shuffle(pairs.map(p=>p.meaning))};
    }
    if(type==='truefalse'){
      const raw=String(q.answer||'').trim().toLowerCase();
      if(raw!=='true'&&raw!=='false')return null;
      return {type:'truefalse',label:'True or false',prompt,answer:raw==='true'?'True':'False',explain,options:['True','False']};
    }
    if(!Array.isArray(q.options))return null;
    const opts=[...new Set(q.options.map(o=>String(o).trim()).filter(Boolean))].slice(0,k);
    const ans=String(q.answer||'').trim();
    if(opts.length<2||!opts.includes(ans))return null;
    return {type:'choice',label:'Question',prompt,answer:ans,explain,options:shuffle(opts)};
  }).filter(Boolean);
}
const mkErr=c=>{const e=new Error(c);e.err=c;return e};
function parseJSON(t){
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  try{return JSON.parse(a>=0&&b>a?t.slice(a,b+1):t)}catch(e){throw mkErr('unreadable reply')}

function timeoutSignal(){return (typeof AbortSignal!=='undefined'&&AbortSignal.timeout)?AbortSignal.timeout(240000):undefined}

let googleModel=AI_MODELS.google,googleListed=false;
async function pickGoogleModel(k){
  const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':k},signal:timeoutSignal()});
  if(!r.ok)return null;
  const j=await r.json();
  const c=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/^models\/gemini-\d+(\.\d+)?-flash(-lite)?$/.test(m.name||''))
    .map(m=>{const x=/gemini-(\d+(?:\.\d+)?)-flash(-lite)?$/.exec(m.name);return {id:m.name.replace('models/',''),v:parseFloat(x[1]),lite:x[2]?1:0}});

/* One call to the saved provider. Google and OpenAI each have their own request shape.
   A failure carries the HTTP status code (or a short reason) in .err so it can be shown. */
async function callAI(ai,prompt,json,media){

  const mb=media&&media.length?await Promise.all(media.filter(m=>allowed.includes(m.mediaKind)).map(async m=>({...m,b64:await blobB64(m.blob)}))):[];
  const imgs=mb.filter(m=>m.mediaKind==='image');
  const build=()=>{
    if(p==='google')return {url:`https://generativelanguage.googleapis.com/v1beta/models/${googleModel}:generateContent`,
      headers:{'Content-Type':'application/json','x-goog-api-key':k},
      body:{contents:[{parts:[{text:prompt},...mb.map(m=>({inline_data:{mime_type:m.mime||'application/octet-stream',data:m.b64}}))]}],generationConfig:{temperature:0.3,...(json?{responseMimeType:'application/json'}:{})}}};
    return {url:AI_BASE[p]+'/chat/completions',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
      body:{model:AI_MODELS[p],messages:[{role:'user',content:imgs.length?[{type:'text',text:prompt},...imgs.map(m=>({type:'image_url',image_url:{url:'data:'+m.mime+';base64,'+m.b64}}))]:prompt}],...(json?{response_format:{type:'json_object'}}:{})}};
  };
  const send=async()=>{const q=build();try{return await fetch(q.url,{method:'POST',headers:q.headers,body:JSON.stringify(q.body),signal:timeoutSignal()})}catch(e){throw mkErr('no response')}};

  if(!r.ok&&p==='google'&&(r.status===404||r.status===401)&&!googleListed){

  if(p==='google')text=((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
  else text=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  text=String(text).trim();
  if(!text)throw mkErr('empty reply');
  return json?parseJSON(text):text;
}

/* ---------- saved content. Kept per deck in d.gen:

   Each set is kept at full size. The sliders only choose how much of each set is shown. ---------- */
const genBusy=new Map(),tried=new Set();
const EMPTY={ov:{text:'',paras:[],words:0},cards:[],quiz:[]};
/* Minimum, Standard and Maximum: share of the created content that is shown. Default Standard. */
const LVL_PCT=[0.3,0.6,1], LVL_NAME=['MIN','STD','MAX'];

const OV_WORDS=2000, FACT_CAP=83;
const lvlOf=d=>(typeof d.lvl==='number')?d.lvl:1;

/* Cut text to at most n characters, at a sentence end if one is near the limit, otherwise at a word. */
/* Keeps the first n words of t, with its line breaks. */
function capWords(t,n){
  const re=/\S+/g;let c=0,m;t=String(t||'');
  while((m=re.exec(t))){if(++c===n)return t.slice(0,m.index+m[0].length)}

  if(m&&m[0].length>n*0.6)return m[0].trim();

function appOv(d){

function appLevel(d,diff,facts){
  const ctx=factsOf(d);

/* Sends the request to the saved keys in fallback order, skipping keys that cannot read the media. */
async function callChain(prompt,json,media){
  const keys=loadKeys().filter(k=>!(media&&media.length&&!(MEDIA_OK[k.provider]||[]).length));
  if(!keys.length)throw mkErr('no usable key');
  let last=null;
  for(const k of keys){
    try{const out=await callAI(k,prompt,json,media);return {out,by:k.provider}}
    catch(e){last=e}

/* One AI request for the whole deck: the overview, and cards and quiz for Easy, Medium and Hard.
   Started by the first tap on Overview, Flashcards or Quiz (openDeckTab). Saved sets are reused until the files change. */
const KEYS4=['ov','easy','medium','hard'];
function fallbackFor(d,key,sig,by,err){return {sig,by,err,...(key==='ov'?appOv(d):appLevel(d,key))}}
const FACT_BATCH=30;
const LEVELS=['easy','medium','hard'];
const LEVEL_TEXT={easy:'Easy: plain words, one fact each.',medium:'Medium: apply or compare the facts.',hard:'Hard: precise terms, short scenarios and exact answers.'};
const QUIZ_ITEM='{"type":"choice|truefalse|fill|match","question":"...","options":["...","..."],"answer":"...","pairs":[{"term":"...","meaning":"..."}],"explain":"..."}';
const ITEM_SHAPE=`{"easy":{"cards":[{"question":"...","answer":"..."}],"quiz":[${QUIZ_ITEM}]},"medium":{"cards":[{"question":"...","answer":"..."}],"quiz":[${QUIZ_ITEM}]},"hard":{"cards":[{"question":"...","answer":"..."}],"quiz":[${QUIZ_ITEM}]}}`;
const QUIZ_MIX='Mix the quiz types. About half are multiple choice (type "choice", 3 or 4 options, answer one of them). About a quarter are true or false (type "truefalse", options ["True","False"], answer "True" or "False"). About a quarter are fill in the blank (type "fill": the question contains _____ where the missing word goes, and the answer is that word). At most one matching question per level (type "match", 2 to 4 pairs of term and meaning taken from the facts, in "pairs"). ';
const factLine=f=>f.kind==='def'?`${f.term}: ${f.def}`:`${f.term} -> ${f.def}`;
function factsPrompt(sel,idxs){
  const groups=LEVELS.map((l,li)=>({l,fs:idxs.filter(i=>i%3===li)})).filter(g=>g.fs.length);
  return `Use ONLY the facts below. Each level has its own facts; use a fact only under its own level, never at two levels. Reply with ONE JSON object only, in this shape:\n${ITEM_SHAPE}\nFor EACH fact write exactly 1 flashcard and 1 quiz question, in the style of its level. ${QUIZ_MIX}${LEVEL_TEXT.easy} ${LEVEL_TEXT.medium} ${LEVEL_TEXT.hard} Quiz answers must be one of the options. Leave a level as {"cards":[],"quiz":[]} when it has no facts. Do not ask about the document itself.\n\n`+groups.map(g=>`${g.l.toUpperCase()} facts:\n`+g.fs.map((i,n)=>`${n+1}. ${factLine(sel[i])}`).join('\n')).join('\n\n');
}
function materialPrompt(d){
  return `Use only the study material below, including any attached photos, audio or video. Reply with ONE JSON object only, in this shape:\n${ITEM_SHAPE}\nCreate up to 83 flashcards and up to 83 quiz questions at each level. Each level must use different parts of the material, so no item repeats across levels. ${LEVEL_TEXT.easy} ${LEVEL_TEXT.medium} ${LEVEL_TEXT.hard} Quiz answers must be one of the options. ${QUIZ_MIX}Do not ask about the document itself.\n\nSTUDY MATERIAL:\n${materialText(d)}`;
}
const OV_PROMPT=(d)=>`Write an overview of ALL the study material below, in plain paragraphs, with no headings or bullet points. Keep the whole overview within 2000 words. Cover the main points of every document.\n\nSTUDY MATERIAL:\n${materialText(d)}`;
const levelUsable=(j,l)=>{const x=(j&&j[l])||{};return cleanCards(x.cards).length>0||cleanQuiz(x.quiz,4).length>0};
/* One request, sent to the keys in order. A key that fails hands the work to the next key, and stays handed over for the rest of the run. */
async function aiFrom(st,prompt,json,media,check){
  while(st.ki<st.keys.length){
    const k=st.keys[st.ki];
    try{
      const out=await callAI(k,prompt,json,media);
      if(check&&!check(out))throw mkErr('no usable items');
      return {out,by:k.provider};
    }catch(e){st.lastErr=(e&&e.err)||'no response';st.ki++}

/* Key order. With photos, audio or video: Google keys first (OpenAI reads photos only).

const keyOrder=(ks,withMedia)=>ks.slice().sort((a,b)=>{
  const rank=k=>withMedia?(k.provider==='google'?0:1):(k.provider==='openai'?0:1);
  return rank(a)-rank(b);

async function runAll(d,media){
  const allKeys=loadKeys();
  const hasMedia=!!(media&&media.length);
  const mediaOK=!hasMedia?allKeys:allKeys.filter(k=>(MEDIA_OK[k.provider]||[]).length>0);
  const stText={keys:keyOrder(allKeys,false),ki:0,lastErr:''},stMedia={keys:keyOrder(mediaOK,true),ki:0,lastErr:''};
  const stOv=hasMedia?stMedia:stText;
  const sel=balancedFacts(d),res={};
  const o=await aiFrom(stOv,OV_PROMPT(d),false,media,t=>String(t||'').trim().length>0);
  if(o){const t=capWords(o.out,OV_WORDS);res.ov={by:'ai',via:o.by,err:'',text:t,paras:t.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean),words:wordsIn(t)}}

  const idxAll=sel.map((_,i)=>i),batches=[];
  if(idxAll.length){for(let i=0;i<idxAll.length;i+=FACT_BATCH)batches.push(idxAll.slice(i,i+FACT_BATCH))}else batches.push(null);
  const check=j=>LEVELS.some(l=>levelUsable(j,l));

    if(r)via=r.by;
    LEVELS.forEach((l,li)=>{
      const lf=idxs?idxs.filter(i=>i%3===li).map(i=>sel[i]):null;

}
function startAll(d,sig){

    .then(media=>runAll(d,media))
    .then(finish,e=>{
      const err=(e&&e.err)||'no response',res={};
      for(const k of KEYS4)res[k]={by:'failed',err,...(k==='ov'?appOv(d):appLevel(d,k))};
      finish(res);

/* Called when Overview, Flashcards or Quiz is tapped. Starts the one request unless saved AI content already matches the files. */
function openDeckTab(d){

  const sig=factsOf(d).sig;
  if(genBusy.get(d.id)===sig)return;
  if(KEYS4.every(k=>{const r=d.gen&&d.gen[k];return !!r&&r.sig===sig&&r.by==='ai'}))return;
  startAll(d,sig);

/* The saved set for one part. Returns the record, or 'loading' while the request runs.

function ensure(d,key){
  if(!d.sources.length)return null;
  const sig=factsOf(d).sig,rec=d.gen&&d.gen[key];
  if(genBusy.get(d.id)===sig)return 'loading';
  if(rec&&rec.sig===sig)return rec;
  if(loadKeys().length)return 'loading';
  const fresh=fallbackFor(d,key,sig,'app','');
  storeRec(d,key,fresh);

/* What a section shows: cut to the chosen level (MIN, STD or MAX). */

  const key=part==='ov'?'ov':(d.difficulty||'medium');
  const rec=ensure(d,key);
  if(rec==='loading')return {state:'loading',by:'ai',err:'',via:'',data:EMPTY[part]};
  if(!rec)return {state:'ready',by:'app',err:'',via:'',data:EMPTY[part]};
  const meta={state:'ready',by:rec.by,err:rec.err||'',via:rec.via||''};
  if(part==='ov'){
    const full=String(rec.text||'');
    const limit=Math.round(Math.min(OV_WORDS,countWords(full))*LVL_PCT[wlvlOf(d)]);
    const shown=capWords(full,limit);
    const paras=shown.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
    return {...meta,data:{text:shown,paras,words:wordsIn(shown)}};
  }
  const arr=rec[part]||[];
  let n=Math.max(1,Math.round(arr.length*LVL_PCT[lvlOf(d)]));

const WORD_STOPS=[500,1000,1500,2000,2500], WORD_MAX_IDX=5;

/* ---------- overview: built from the facts (the term and its definition), in ranked order ---------- */
function ovSentences(d){

    const body=f.def.replace(/[\s.;:,]+$/,'');
    return (f.kind==='def'?`${f.term}: ${body}.`:`${body}.`).replace(/\s+/g,' ');

  const all=ovSentences(d),idx=wIdx(d);
