    <input type="range" id="count" min="0" max="${MAX_IDX}" step="1" value="${d.countIdx}" aria-label="# cards / quiz">
    <div class="notches" aria-hidden="true"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>Max</span></div>
    <output id="countOut" class="sval"></output>
    <p class="ready" id="ready"></p>
  </div>
  <div class="panel">
    <span class="label">Words per overview</span>
    <input type="range" id="owords" min="0" max="${WORD_MAX_IDX}" step="1" value="${wIdx(d)}" aria-label="Words per overview">
    <div class="notches" aria-hidden="true"><span>500</span><span>1000</span><span>1500</span><span>2000</span><span>2500</span><span>Max</span></div>
    <output id="wordOut" class="sval"></output>
  </div>`;
}
function renderFiles(d){
  $('#files').innerHTML=d.sources.map((s,i)=>`<li class="file"><span class="fname">${esc(s.name)}</span><button class="xbtn" data-rm="${i}" aria-label="Remove ${esc(s.name)}">✕</button></li>`).join('');
}
function renderSettings(d){
  document.querySelectorAll('#diff button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.d===d.difficulty)));
  const r=$('#count');
  if(+r.value!==d.countIdx)r.value=d.countIdx;
  setRangeFill(r);
  $('#countOut').textContent=countText(d.countIdx,d);
  const wr=$('#owords');
  if(+wr.value!==wIdx(d))wr.value=wIdx(d);
  setRangeFill(wr);
  $('#wordOut').textContent=wordText(wIdx(d),d);
  $('#ready').textContent=lastMsg;
}
function setRangeFill(el){
  const pct=(el.value-el.min)/(el.max-el.min)*100;
  el.style.setProperty('--p',pct+'%');
}

/* ---------- flashcards ---------- */
const SPEAK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
function emptyView(text){return `<div class="panel center"><p class="big">${esc(text)}</p></div>`}
function knownCount(){return study?Object.values(study.marks).filter(Boolean).length:0}
function renderStudy(){
  const d=D(),el=$('#view-study');
  const c=getPart(d,'cards');
  if(c.state==='loading'){el.innerHTML=loadingView();return}
  const cards=c.data;
  if(!cards.length){study=null;el.innerHTML=emptyView('No cards yet');return}
  if(!study)study={pos:0,flipped:false,angle:0,marks:{},speak:true};
  const n=cards.length;
  if(study.pos>=n){
    el.innerHTML=`<div class="panel center"><p class="big">${knownCount()} of ${n} known</p><button class="btn lg" id="restart">Start over</button></div>`;
    return;
  }
  const card=cards[study.pos],f=faceText(d.difficulty,card);
  el.innerHTML=`<div class="statline"><span>Card ${study.pos+1} of ${n}</span><span>Known ${knownCount()}</span></div>
    ${spkBar(true)}
    <div class="stage" id="stage">
      <div class="flip${study.flipped?' is-flipped':''}" id="flip" role="button" tabindex="0" aria-label="Flip card" style="transform:rotateY(${study.angle}deg)">
        <div class="face front"><span class="label">${esc(f.fLabel)}</span><div class="main${f.fLong?' long':''}">${esc(f.front)}</div></div>
        <div class="face back"><span class="label">${esc(f.bLabel)}</span><div class="main${f.bLong?' long':''}">${esc(f.back)}</div></div>
      </div>
    </div>
    <div class="grade" id="grade" ${study.flipped?'':'hidden'}>
      <button class="btn got" id="got" aria-label="Guessed right" title="Guessed right"><span aria-hidden="true">✓</span></button><button class="btn again" id="again" aria-label="Guessed wrong" title="Guessed wrong"><span aria-hidden="true">✗</span></button>
    </div>
    <p class="hint">Swipe left or right to turn the card. Swipe up for next, down for previous.</p>`;
  if(study.speak){study.speak=false;speak(f.front)}
}
function flipCard(dir){
  const d=D(),cards=cardsOf(d);if(!cards.length||!study||busy||study.pos>=cards.length)return;
  study.flipped=!study.flipped;
  study.angle=study.flipped?(dir<0?-180:180):0;
  const f=$('#flip');if(f){f.style.transform=`rotateY(${study.angle}deg)`;f.classList.toggle('is-flipped',study.flipped)}
  const g=$('#grade');if(g)g.hidden=!study.flipped;
  const ft=faceText(d.difficulty,cards[study.pos]);
  speak(study.flipped?ft.back:ft.front);
}
/* Card change: the current card turns away and the next one turns in, like a flip. dir +1 = next, -1 = previous. */
function runChange(dir,apply){
  const st=$('#stage');
  if(!st||!st.animate){apply();return}
  busy=true;
  const s=dir>0?1:-1;
  const out=st.animate([
    {transform:'perspective(1400px) rotateX(0deg)',opacity:1},
    {transform:`perspective(1400px) rotateX(${-s*75}deg)`,opacity:0}
  ],{duration:700,easing:'cubic-bezier(.5,0,1,1)',fill:'forwards'});
  out.onfinish=()=>{
    apply();
    const ns=$('#stage');
    if(ns&&ns.animate){
      const inn=ns.animate([
        {transform:`perspective(1400px) rotateX(${s*75}deg)`,opacity:0},
        {transform:'perspective(1400px) rotateX(0deg)',opacity:1}
      ],{duration:700,easing:'cubic-bezier(0,0,.2,1)'});
      inn.onfinish=()=>{busy=false};
    }else busy=false;
  };
}
function move(delta){
  const d=D(),cards=cardsOf(d);if(!cards.length||!study||busy)return;
  const next=Math.max(0,Math.min(cards.length,study.pos+delta));
  if(next===study.pos)return;
  runChange(delta,()=>{study.pos=next;study.flipped=false;study.angle=0;study.speak=true;renderStudy()});
}
function grade(ok){
  const d=D(),cards=cardsOf(d);if(!cards.length||!study||!study.flipped||busy||study.pos>=cards.length)return;
  study.marks[cards[study.pos].term]=ok;
  move(1);
}

/* swipe: left or right turns the card, bottom-to-top = next, top-to-bottom = previous */
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('#stage'))gesture={x:e.clientX,y:e.clientY};
});
document.addEventListener('pointerup',e=>{
  if(!gesture)return;
  const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;gesture=null;
  const ax=Math.abs(dx),ay=Math.abs(dy);
  if(ax<40&&ay<40)return;
  ignoreClick=true;setTimeout(()=>{ignoreClick=false},400);
  if(ax>ay)flipCard(dx<0?1:-1);
  else move(dy<0?1:-1);
});

/* ---------- quiz ---------- */
function fullQuestionText(q){
  return `${q.prompt} ${q.options.map((o,j)=>`Option ${'ABCD'[j]}, ${o}.`).join(' ')}`;
}
function renderQuiz(){
  const d=D(),el=$('#view-quiz');
  const c=getPart(d,'quiz'),qs=c.data,total=qs.length;
  if(c.state==='loading'){el.innerHTML=loadingView();return}
  if(!total){quiz=null;el.innerHTML=emptyView('No questions yet');return}
  if(!quiz||quiz.order.length!==total)quiz={order:shuffle(qs.map((_,i)=>i)),i:0,score:0,picked:null,missed:[],speak:true};
  if(quiz.i>=total){
    const missed=quiz.missed.length?`<h3 style="margin:0;color:var(--yellow)">Review these</h3><ul class="missed">${quiz.missed.map(m=>`<li><b>${esc(m.answer)}</b><br>${esc(m.explain||'')}</li>`).join('')}</ul>`:'';
    el.innerHTML=`<div class="panel center"><div class="score">${quiz.score}/${total}</div>${missed}<button class="btn lg" id="retake">New quiz</button></div>`;
    return;
  }
  const q=qs[quiz.order[quiz.i]],done=quiz.picked!==null,correct=done&&quiz.picked.ok;
  const opts=q.options.map((o,j)=>{
    let cls='';
    if(done){if(o===q.answer)cls=' right';else if(j===quiz.picked.j)cls=' wrong'}
    return `<button class="opt${cls}" data-opt="${j}" ${done?'disabled':''}><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`;
  }).join('');
  const fb=done?`<div class="feedback ${correct?'ok':'no'}"><b>${correct?'Correct':'Not quite. Answer: '+esc(q.answer)}</b>${esc(q.explain||'')}</div>`:'';
  const nxt=done?`<button class="btn block" id="qnext">${quiz.i+1<total?'Next question':'See results'}</button>`:'';
  el.innerHTML=`<div class="statline"><span>Question ${quiz.i+1} of ${total}</span><span>Score ${quiz.score}</span></div>
    ${spkBar(true)}
    <div class="q"><span class="label">${esc(q.label)}</span><div class="prompt">${esc(q.prompt)}</div><div class="opts">${opts}</div>${fb}${nxt}</div>`;
  if(quiz.speak){quiz.speak=false;speak(fullQuestionText(q))}
}
function answer(j){
  const qs=questionsOf(D());if(!quiz||quiz.picked!==null||!qs.length)return;
  const q=qs[quiz.order[quiz.i]];
  const ok=q.options[j]===q.answer;
  quiz.picked={j,ok};
  if(ok)quiz.score++;else quiz.missed.push(q);
  renderQuiz();
  speak(ok?'Correct':`Not quite. The answer is ${q.answer}.`);
}

/* ---------- shell ---------- */
function renderHome(){
  $('#view-home').innerHTML=`
    <div class="panel theme-panel">
      <span class="label">Theme</span>
      <div class="seg four" role="group" aria-label="Theme">
        <button data-theme-pick="night">Night</button><button data-theme-pick="forest">Forest</button>
        <button data-theme-pick="plum">Plum</button><button data-theme-pick="custom">Custom</button>
      </div>
      <div class="custom" id="custom" hidden>
        <label class="swatch">Background<input type="color" data-c="bg"></label>
        <label class="swatch">Panels<input type="color" data-c="panel"></label>
        <label class="swatch">Text<input type="color" data-c="text"></label>
        <label class="swatch">Buttons<input type="color" data-c="accent"></label>
      </div>
    </div>    ${apiPanel()}<div class="homesep" aria-hidden="true"></div>
    <button class="btn lg block" id="newdeck">+ New deck</button>
    <div class="decks">${db.decks.length?db.decks.map(d=>`<div class="deckrow"><button class="deckopen" data-open="${esc(d.id)}">${esc(d.name)}</button><button class="renbtn" data-rename="${esc(d.id)}" aria-label="Rename ${esc(d.name)}">Rename</button><button class="delbtn" data-deldeck="${esc(d.id)}" aria-label="Delete ${esc(d.name)}">Delete</button></div>`).join(''):'<p class="hint">No decks yet. Tap New deck to start.</p>'}</div>
`;
  syncThemeUI(document.documentElement.dataset.theme||'night');
}
function renderAll(){
  const d=D();if(!d)return;
  if(db.tab==='create')renderCreate();
  else if(db.tab==='overview')renderOverview();
  else if(db.tab==='study')renderStudy();
  else renderQuiz();
  setBy();
}
function render(){
  const d=D();
  $('#deckbar').hidden=!d;
  $('#tabs').hidden=!d;
  $('#view-home').hidden=!!d;
  if(d)$('#dname').textContent=d.name;
  ['create','overview','study','quiz'].forEach(t=>{$('#view-'+t).hidden=!d||db.tab!==t});
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===db.tab)));
  if(!d){renderHome();return}
  renderAll();
  syncSpk();
}

/* ---------- events (delegated) ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest&&t.closest('#flip')){if(!ignoreClick)flipCard(1);return}
  const b=t.closest('button,[data-open]');if(!b)return;
  const ds=b.dataset;
  if(ds.open!==undefined){openDeck(ds.open);return}
  if(ds.deldeck!==undefined){deleteDeck(ds.deldeck);return}
  if(ds.rename!==undefined){
    const rd=db.decks.find(x=>x.id===ds.rename);if(!rd)return;
    const nv=prompt('New name for this deck',rd.name);
    if(nv&&nv.trim()){rd.name=nv.trim().slice(0,60);save()}
    render();return;
  }
  if(ds.tab!==undefined){db.tab=ds.tab;study=quiz=null;speechStop();{const tp={overview:'ov',study:'cards',quiz:'quiz'}[ds.tab];if(tp)untry(db.active,tp)}if(ds.tab==='overview')ovSpeakPending=true;render();window.scrollTo(0,0);return}
  if(ds.opt!==undefined){answer(+ds.opt);return}
  if(ds.d!==undefined){const d=D();d.difficulty=ds.d;study=quiz=null;save();renderAll();return}
  if(ds.themePick!==undefined){setTheme(ds.themePick);return}
  if(ds.rm!==undefined){const d=D();d.sources.splice(+ds.rm,1);save();renderAll();return}
  switch(b.id){
    case 'backHome':goHome();break;
    case 'newdeck':newDeck();break;
    case 'deldeck':deleteDeck(db.active);break;
    case 'addPaste':{
      const v=$('#paste').value.trim();if(!v)break;
      const d=D();
      d.sources.push({name:`Pasted text (${v.split(/\s+/).length} words)`,kind:'text',text:cleanText(v)});
      $('#paste').value='';lastMsg='';study=quiz=null;save();
      if(!factsOf(d).facts.length)lastMsg='No facts found in this text.';
      renderAll();break;
    }
    case 'sprev':move(-1);break;
    case 'snext':move(1);break;
    case 'again':grade(false);break;
    case 'got':grade(true);break;
    case 'restart':study.pos=0;study.flipped=false;study.angle=0;study.marks={};study.speak=true;renderStudy();break;
    case 'qnext':if(quiz){quiz.i++;quiz.picked=null;quiz.speak=true;renderQuiz()}break;
    case 'retake':quiz=null;renderQuiz();break;
    case 'spkMute':setMute(!spk.muted);break;
    case 'apiUpdate':apiUI={editing:true,msg:'',pick:''};renderHome();break;
    case 'apiCancel':apiUI={editing:false,msg:'',pick:''};renderHome();break;
    case 'apiSave':saveKey();break;
    case 'shuffle':{const d=D();if(d)reshuffle(d,db.tab==='study'?'cards':'quiz');break}
    case 'apiPickOpenai':apiUI.pick='openai';apiUI.msg='';updateDetect(typedKey());break;
    case 'apiPickDeepseek':apiUI.pick='deepseek';apiUI.msg='';updateDetect(typedKey());break;
  }
});
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{
  const z=e.target.closest&&e.target.closest('#drop');if(z){e.preventDefault();z.classList.add('over')}
}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#drop');if(z)z.classList.remove('over')});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('#drop');
  if(z){e.preventDefault();z.classList.remove('over');addFiles([...(e.dataTransfer?.files||[])])}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'){addFiles([...t.files]);t.value='';return}
  if(t.id==='count'){const d=D();d.countIdx=+t.value;study=quiz=null;save();renderAll();return}
  if(t.id==='owords'){const d=D();d.wordIdx=+t.value;save();renderAll();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='apiIn'){apiUI.pick='';updateDetect(e.target.value.trim());return}
  if(e.target.dataset&&e.target.dataset.c!==undefined){saveCustom();return}
  if(e.target.id==='owords'){
    const d=D(),idx=+e.target.value;
    setRangeFill(e.target);d.wordIdx=idx;
    $('#wordOut').textContent=wordText(idx,d);
    return;
  }
  if(e.target.id==='count'){
    setRangeFill(e.target);
    const d=D();
    const idx=+e.target.value;
    $('#countOut').textContent=countText(idx,d);
    d.countIdx=idx;
  }
});
document.addEventListener('submit',e=>{e.preventDefault()});

/* ---------- themes ---------- */
const THEMES=['night','forest','plum','custom'];
const THEME_KEY='cramdeck.theme', CUSTOM_KEY='cramdeck.custom';
const THEME_VARS=['--navy','--navy2','--yellow','--orange','--black','--white','--ph'];
const DEFAULT_CUSTOM={bg:'#1B1B1B',panel:'#2E2E2E',text:'#DCE1EE',accent:'#E0A463'};
function getCustom(){
  try{return {...DEFAULT_CUSTOM,...JSON.parse(localStorage.getItem(CUSTOM_KEY)||'{}')}}catch(e){return {...DEFAULT_CUSTOM}}
}
function setTheme(name){
  if(!THEMES.includes(name))name='night';
  const root=document.documentElement;
  THEME_VARS.forEach(v=>root.style.removeProperty(v));
  root.setAttribute('data-theme',name);
  if(name==='custom'){
    const c=getCustom();
    root.style.setProperty('--navy',c.bg);
    root.style.setProperty('--navy2',c.panel);
    root.style.setProperty('--yellow',c.text);
    root.style.setProperty('--orange',c.accent);
    root.style.setProperty('--black','#000000');
    root.style.setProperty('--white','#DCE1EE');
    root.style.setProperty('--ph',c.text);
  }
  try{localStorage.setItem(THEME_KEY,name)}catch(e){}
  syncThemeUI(name);
}
function syncThemeUI(name){
  document.querySelectorAll('[data-theme-pick]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.themePick===name)));
  const box=$('#custom');
  if(box){
    box.hidden=name!=='custom';
    const c=getCustom();
    box.querySelectorAll('[data-c]').forEach(i=>{i.value=c[i.dataset.c]});
  }
}
function saveCustom(){
  const c={};
  document.querySelectorAll('[data-c]').forEach(i=>{c[i.dataset.c]=i.value});
  try{localStorage.setItem(CUSTOM_KEY,JSON.stringify(c))}catch(e){}
  setTheme('custom');
}

/* ---------- start ---------- */
let savedTheme='night';
try{savedTheme=localStorage.getItem(THEME_KEY)||'night'}catch(e){}
setTheme(savedTheme);
load();
try{history.replaceState(null,'')}catch(e){}
/* System back button: from a deck it returns to the deck list; on the deck list it leaves the app. */
window.addEventListener('popstate',()=>{if(db.active!==null)showHome()});
render();
})();
