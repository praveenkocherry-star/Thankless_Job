    const blob=new Blob([ftyp,moov,mh,...this.parts],{type:'video/mp4'});this.parts=[];return blob}}

/* ============================================================
   Fast video maker: frames are drawn as fast as the phone can, sent to the hardware H.264 encoder,
   the sound is mixed separately, and both go into an MP4 file. A 10 minute video takes minutes, not 10 minutes.
   Returns null when the phone has no suitable encoder (the real-time recorder is used then).
   ============================================================ */
const yieldTick=()=>new Promise(r=>{const ch=new MessageChannel();ch.port1.onmessage=()=>{ch.port1.close();r()};ch.port2.postMessage(0)});
function avcCodecFor(W,H){const mb=Math.ceil(W/16)*Math.ceil(H/16);return mb<=3600?'avc1.64001f':mb<=8192?'avc1.640028':mb<=22080?'avc1.640032':'avc1.640033'}
async function fastEncoderConfig(W,H,fps,bitrate){if(!(window.VideoEncoder&&window.VideoFrame&&window.AudioContext))return null;
  const codec=avcCodecFor(W,H);
  for(const hw of ['prefer-hardware','no-preference']){const cfg={codec,width:W,height:H,bitrate,framerate:fps,hardwareAcceleration:hw,avc:{format:'avc'},latencyMode:'quality',bitrateMode:'variable'};

    ${t.kind==='image'&&!['quote_card'].includes(t.tpl)?`<div class="btnrow"><button class="pbtn" data-tplphoto="g">${I('gallery')} Add a photo</button><button class="pbtn" data-tplphoto="l">${I('lib')} Photo from the library</button></div><p class="note" id="tplphn">${''}</p>`:''}
    <span class="lbl">Style</span><div class="chips" role="group" aria-label="Style">${[['','Original'],...TPL_STYLES].map(([k,n])=>`<button class="chip ${k===''?'on':''}" data-tplstyle="${k}">${n}</button>`).join('')}</div>
    ${t.layouts?`<span class="lbl">Layout</span><div class="chips" role="group" aria-label="Layout">${[...Array(t.layouts)].map((_,i)=>`<button class="chip ${i===0?'on':''}" data-tpllay="${i}">Layout ${i+1}</button>`).join('')}</div>`:''}
    ${t.kind==='image'?`<span class="lbl">Size</span><div class="chips" role="group" aria-label="Size">${TPL_SIZES.map(([k,n])=>`<button class="chip ${k===''?'on':''}" data-tplsize="${k}">${n}</button>`).join('')}</div>`:''}
    <div class="btnrow"><button class="pbtn" data-act="tplback">${I('back')} Back</button><button class="pbtn prime" data-act="tpluse">${I('check')} Use it</button></div>`);
  tplPreview()}
let tplTimer=0;
function tplPreview(){clearTimeout(tplTimer);tplTimer=setTimeout(async()=>{const t=TPLS.cur;const cv=$('#tplcv');if(!t||!cv)return;
    try{const r=tplPlan(t);if(r.tool==='make_image'){const a=r.args,w=360,h=Math.round(w*a.height/a.width);const out=await renderImagePlan({...a,width:w,height:h},TPLS.c);if(!cv.isConnected)return;cv.width=out.cv.width;cv.height=out.cv.height;cv.getContext('2d').drawImage(out.cv,0,0);cv.style.aspectRatio=cv.width+'/'+cv.height}
      else if(cv.isConnected){const g=cv.getContext('2d');cv.width=360;cv.height=200;g.fillStyle='#222';g.fillRect(0,0,360,200);g.fillStyle='#fff';g.font='16px sans-serif';g.textAlign='center';g.fillText('Video: '+((r.args.scenes||[]).length)+' scenes',180,104)}}catch(e){}},300)}
function tplApply(){const t=TPLS.cur;if(!t)return;const r=tplPlan(t);const a={...r.args};delete a.keep_previous;delete a.summary;closeLayer();
  if(r.tool==='make_image'){Ed.change(p=>{for(const k of Object.keys(p))delete p[k];Object.assign(p,a);p.effects=p.effects||[];p.adjust=p.adjust||{};const fm=TPLS.fmt||t.format;if(fm&&PRINT_SIZES[fm])p.format=fm;Ed.sel=-1},true);Ed.tool='canvas';document.querySelectorAll('[data-edtool]').forEach(x=>{const on=x.dataset.edtool==='canvas';x.classList.toggle('on',on);x.setAttribute('aria-pressed',on)});Ed.panel();toast('Template applied. Tap the text to change it, or use the tools below.')}
  else if(r.tool==='make_video'){VidEd.change(p=>{p.width=a.width;p.height=a.height;p.scenes=a.scenes||[];if(a.audio)p.audio={...(p.audio||{}),...a.audio};delete p.format;VidEd.thumbs.clear()});VidEd.si=0;VidEd.refresh();toast('Template applied. Tap a scene to change it.')}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-tplcat],[data-tplpick],[data-tplstyle],[data-tpllay],[data-tplsize],[data-tplphoto],[data-act=tplopen],[data-act=tplback],[data-act=tpluse]');if(!b)return;e.stopPropagation();const d=b.dataset;
  if(d.act==='tplopen'){tplGallery(d.kind||'image',d.kind==='video'?VidEd.c:Ed.c);return}
  if(d.tplcat){TPLS.cat=d.tplcat;tplGallery(TPLS.kind,TPLS.c);return}
  if(d.tplpick){const t=TPL.find(x=>x.id===d.tplpick);if(t)tplForm(t);return}
  if(d.act==='tplback'){tplGallery(TPLS.kind,TPLS.c);return}
  if(d.act==='tpluse'){tplApply();return}
  const grp=(attr)=>document.querySelectorAll('['+attr+']').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});
  if('tplstyle' in d){TPLS.pal=d.tplstyle;grp('data-tplstyle');tplPreview();return}
  if('tpllay' in d){TPLS.layout=+d.tpllay;grp('data-tpllay');tplPreview();return}
  if('tplsize' in d){TPLS.fmt=d.tplsize;grp('data-tplsize');tplPreview();return}
  if(d.tplphoto==='g'){const fs=await pickFiles('image/*',false);if(!fs.length)return;const r=await addUploads(TPLS.c,fs,{quiet:true,keepSel:true});if(r[0]){TPLS.photos=[{type:'upload',media_id:r[0].id}];const n=$('#tplphn');if(n)n.textContent='Photo added: '+(r[0].name||'photo');tplPreview()}return}
  if(d.tplphoto==='l'){LibPick.open({kinds:['image'],title:'Choose a photo',onPick:({asset_id})=>{TPLS.photos=[{type:'asset',asset_id}];tplForm2Refresh()}});return}},true);
function tplForm2Refresh(){const t=TPLS.cur;if(!t)return;const keep={...TPLS.vals},pal=TPLS.pal,lay=TPLS.layout,fmt=TPLS.fmt,ph=TPLS.photos;tplForm(t);TPLS.vals=keep;TPLS.pal=pal;TPLS.layout=lay;TPLS.fmt=fmt;TPLS.photos=ph;
  document.querySelectorAll('[data-tplf]').forEach(i=>{i.value=keep[i.dataset.tplf]||''});const n=$('#tplphn');if(n)n.textContent='Photo added from the library';
  document.querySelectorAll('[data-tplstyle]').forEach(x=>x.classList.toggle('on',x.dataset.tplstyle===pal));document.querySelectorAll('[data-tpllay]').forEach(x=>x.classList.toggle('on',+x.dataset.tpllay===lay));document.querySelectorAll('[data-tplsize]').forEach(x=>x.classList.toggle('on',x.dataset.tplsize===fmt));tplPreview()}
document.addEventListener('input',e=>{const i=e.target.closest&&e.target.closest('[data-tplf]');if(!i)return;TPLS.vals[i.dataset.tplf]=i.value;tplPreview()});


</script>
