<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0C0E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Spoken PixelCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* ---------- Colour design: "Midnight Iris". Fixed scheme; only light and dark change. ---------- */
:root,[data-mode="dark"]{
  --bg:#0A0A0C;--bg2:#0F0F13;--surface:#15151A;--surface2:#1C1C23;--surface3:#24242D;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--line3:rgba(255,255,255,.22);
  --text:#F4F4F6;--muted:#A0A0AC;--faint:#6C6C78;
  --accent:#7B83F7;--accent2:#A88EFA;--glow:rgba(123,131,247,.38);
  --sel:#6E76F2;--onsel:#FFFFFF;
  --danger:#FF6B6B;--ok:#4ADE80;--warn:#F5B84A;
  --scrim:rgba(5,5,8,.62);--glass:rgba(21,21,26,.72);
  --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --shadow-s:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-mode="light"]{
  --bg:#F3F3F6;--bg2:#FAFAFC;--surface:#FFFFFF;--surface2:#F1F1F5;--surface3:#E7E7EE;
  --line:rgba(16,16,24,.07);--line2:rgba(16,16,24,.13);--line3:rgba(16,16,24,.22);
  --text:#121216;--muted:#62626E;--faint:#9A9AA6;
  --accent:#565EE6;--accent2:#7D5CF0;--glow:rgba(86,94,230,.28);
  --sel:#D8DAFF;--onsel:#0B0B12;
  --danger:#D93D3D;--ok:#1E9E57;--warn:#B7791F;
  --scrim:rgba(240,240,246,.6);--glass:rgba(255,255,255,.78);
  --shadow:0 18px 40px rgba(20,20,40,.14),0 2px 6px rgba(20,20,40,.08);
  --shadow-s:0 6px 18px rgba(20,20,40,.1);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s ease,color .35s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
::selection{background:var(--glow)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;position:relative}

/* ---------- header ---------- */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px}
.brandwrap{display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line2)}
.name{font-size:1.38rem;font-weight:500;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.name .cal{font-family:"Great Vibes",cursive;font-weight:400;font-size:2.05rem;line-height:.6;margin-right:1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px}
.name .gap{display:inline-block;width:.32em}
.tagline{font-size:.74rem;color:var(--muted);letter-spacing:.06em;padding-left:36px}
.hbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s ease,background .2s,border-color .2s,box-shadow .2s}
.ibtn:hover{border-color:var(--line3)}
.ibtn:active{transform:scale(.94);background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.ibtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.mode svg{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.mode .sun{position:absolute;opacity:0;transform:rotate(-90deg) scale(.6)}
[data-mode="light"] .mode .sun{opacity:1;transform:none}
[data-mode="light"] .mode .moon{opacity:0;transform:rotate(90deg) scale(.6)}
.mode{position:relative}
.rule{flex:none;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 12%,var(--line2) 88%,transparent);margin:0 0 2px}

/* ---------- views ---------- */
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px));animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vtitle{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.vtitle h1{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.88rem;margin:0}

/* ---------- home grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
@media (max-width:379px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{display:flex;flex-direction:column;gap:7px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.tile:hover{border-color:var(--line3)}
.tile:active{transform:scale(.965);box-shadow:0 0 0 4px var(--glow)}
.tile .art{position:absolute;inset:0}
.tile.empty{background:linear-gradient(160deg,var(--surface),var(--surface2))}
.tile.empty::after{content:"";position:absolute;inset:26%;border-radius:12px;border:1.5px dashed var(--line2)}
.badge{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border:1px solid var(--line2)}
.badge svg.i{width:14px;height:14px}
.cap{display:flex;align-items:flex-start;gap:0}
.cap .t{flex:1;font-size:.72rem;font-weight:500;line-height:1.3;text-align:center;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-top:3px}
.cap .t .rs{color:var(--accent);font-weight:600;white-space:nowrap}
.mini{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.mini svg.i{width:14px;height:14px}
.cap .mini{color:var(--faint)}
.mini:active{background:var(--sel);color:var(--onsel)}
.emptyhome{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;color:var(--muted)}

/* floating new button */
.fab{position:fixed;right:max(20px,calc(50% - 620px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 30px var(--glow),0 0 0 1px rgba(255,255,255,.18) inset;z-index:20;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.fab svg.i{width:28px;height:28px;stroke-width:2}
.fab:active{transform:scale(.92)}

/* ---------- voice pill: four dots while listening, mic when stopped ---------- */
.vpill{display:flex;align-items:center;justify-content:center;gap:7px;height:52px;min-width:96px;padding:0 22px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow-s);color:var(--text);transition:transform .18s,box-shadow .25s}
.vpill:active{transform:scale(.95)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;animation:wave 1.25s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}.dot:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{opacity:.25;transform:translateY(0) scale(.85)}35%{opacity:1;transform:translateY(-5px) scale(1.12);box-shadow:0 0 12px var(--glow)}}
.vpill.listen{box-shadow:var(--shadow-s),0 0 0 4px var(--glow)}
.vpill .mic svg.i{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.8}}

/* ---------- container view ---------- */
.cview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;animation:fade .32s ease}
.ctop{flex:none;display:flex;align-items:center;gap:8px}
.cname{flex:1;display:flex;align-items:center;gap:4px;justify-content:center}
.cname .t{font-weight:600;font-size:1rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{flex:none;display:flex;justify-content:center;gap:12px}
.tbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s,background .2s,box-shadow .25s,border-color .2s}
.tbtn:active,.tbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.tbtn:active{transform:scale(.94)}
.tbtn.glow{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 9px var(--glow);border-color:var(--accent)}}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:6px;margin:-6px;transition:flex-basis .35s ease}
.cview.chatopen .preview{min-height:110px}
.preview{position:relative;flex:1 1 auto;min-height:180px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);display:grid;place-items:center}
.preview .art,.preview img,.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.preview .art{object-fit:cover}
.pempty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;color:var(--muted);max-width:300px}
.pempty .big{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--accent)}
.pempty .big svg.i{width:30px;height:30px}
.pempty p{margin:0;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-size:.8rem;font-weight:500;color:var(--text);transition:background .2s,color .2s}
.chip:active,.chip.on{background:var(--sel);color:var(--onsel);border-color:transparent}
.dl{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line3);color:var(--text);box-shadow:var(--shadow-s);transition:transform .15s,background .2s}
.dl:active{transform:scale(.93);background:var(--sel);color:var(--onsel)}
.kind{position:absolute;left:14px;top:14px;height:28px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.04em;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2)}
.kind svg.i{width:14px;height:14px}
/* progress ring */
.prog{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line2)}
.ring .fgc{stroke:url(#rg);transition:stroke-dashoffset .25s linear}
.ring .spin{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1.1s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* versions strip */
.strip{flex:none;display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ver{position:relative;flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);transition:transform .15s,box-shadow .2s}
.ver .art{position:absolute;inset:0}
.ver.cur{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--glow)}
.ver:active{transform:scale(.94)}
.vx{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.vx svg.i{width:10px;height:10px;stroke-width:2.4}
.vslot{flex:none;display:flex;justify-content:center;padding-top:2px}
/* chat panel */
.chat{flex:0 0 50%;min-height:0;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;margin:0 -18px calc(-14px - env(safe-area-inset-bottom,0px));padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 40px rgba(0,0,0,.25);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line3);margin:0 auto 8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .who{font-size:.68rem;font-weight:600;letter-spacing:.05em;color:var(--muted);padding:0 6px}
.msg .b{padding:10px 14px;border-radius:18px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.app .b{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.compose{flex:none;display:flex;align-items:flex-end;gap:8px;padding-top:6px}
.compose textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:12px 16px;border-radius:23px;border:1px solid var(--line2);background:var(--surface);outline:none;font-size:.95rem;line-height:1.4;transition:border-color .2s,box-shadow .2s}
.compose textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none;transition:transform .15s}
.send:active{transform:scale(.92)}
.cview.kb .stage{flex:0 0 6.6rem;overflow:auto}
.cview.kb .vslot{display:none}
.cview.kb .preview{min-height:6.2rem}
.cview.kb .chat{flex:1 1 auto}
@media (min-width:900px){
  .cview.chatopen{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:20px}
  .cview.chatopen .ctop,.cview.chatopen .tools{grid-column:1}
  .cview.chatopen .stage{grid-column:1;grid-row:3}
  .cview.chatopen .vslot{grid-column:1;grid-row:4}
  .cview.chatopen .chat{grid-column:2;grid-row:1/5;margin:0;border-radius:24px;border-bottom:1px solid var(--line2);padding-bottom:12px}
  .cview.kb .stage{flex:1 1 auto}
}

/* ---------- menu & lists ---------- */
.list{display:flex;flex-direction:column;gap:10px;max-width:640px}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);text-align:left;width:100%;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.row:active{background:var(--sel);color:var(--onsel);transform:scale(.99);box-shadow:0 0 0 4px var(--glow)}
.row:active .rsub{color:inherit;opacity:.8}
.row .ric{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent);flex:none}
.row:active .ric{background:transparent;color:inherit}
.row .rtx{flex:1;display:flex;flex-direction:column}
.row .rt{font-weight:600;font-size:.98rem}
.row .rsub{font-size:.8rem;color:var(--muted)}
.chev{color:var(--faint)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--surface3);position:relative;transition:background .25s;flex:none;border:1px solid var(--line2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.card h2{margin:0;font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--text);transition:background .2s,color .2s,transform .15s,box-shadow .2s;text-align:center}
.pbtn:active,.pbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.pbtn:active{transform:scale(.98)}
.pbtn.prime{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.field{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.key{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.key .kn{flex:1;font-weight:600;font-size:.95rem}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface3)}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stat.ok{color:var(--ok)}.stat.bad{color:var(--danger)}.stat.chk{color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.seg button{min-height:48px;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--onsel);box-shadow:0 0 0 3px var(--glow)}
.bk{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.bk .bt{flex:1;display:flex;flex-direction:column}
.bk .bt b{font-weight:600;font-size:.92rem}
.bk .bt span{font-size:.78rem;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);margin:0;line-height:1.5}
.folder{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem}
.folder svg.i{color:var(--accent)}
/* about accordion */
.acc{display:flex;flex-direction:column;gap:10px;max-width:720px}
.sec{border-radius:18px;background:var(--surface);border:1px solid var(--line2);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.sec.open{border-color:var(--line3);box-shadow:var(--shadow-s)}

/* ---------- sheets, dialogs, toast ---------- */

/* start overlay */
.start{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);cursor:pointer;animation:fadein .4s ease}

.setup{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:20px;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadein .35s ease}

    get started(){return !!w},kill(){if(w){w.terminate();w=null}}};return rpc}

const ABOUT_FACTS=`Spoken PixelCraft is a voice-first app for creating and editing images, videos and logos for businesses and personal use. Containers hold each project; the plus icon or voice creates one; tiles sort by last edit; pencil renames, bin deletes. Deleted containers can be brought back by voice until the next day's first use. Home screen: Exit icon at the top left (the app can only be exited with this icon; it closes at once, and an unfinished creation is offered again next time). Every other screen has a Back icon at the top left. Inside a container: gallery icon (photos and videos), files icon (documents such as PDF, Word or text price lists, menus, scripts, and music), YouTube link icon (for understanding only, cannot be downloaded), the Recorded Requirement icon at the top right (tap once to open, tap again to close; play aloud inside), the messages icon below (tap to open the typing box, tap again to close), large preview with share and download icons, strip of saved versions and uploads. Before a new version replaces the current one, the app asks whether to keep the previous. Downloads: PNG, JPEG, WebP, GIF for images; MP4, WebM, MP3, GIF for videos; SVG for logos. Help icon at the top, between the light and dark switch and the Menu icon; the same icon closes Help. Menu: API keys (Google keys from Google AI Studio; optional Mistral keys from console.mistral.ai, free plan, API keys, create key; each key is tested as soon as it is added and a failure is reported at once so the user can delete it; several keys work together and share the work), Voice (replies use the phone's own default text-to-speech voice, changed in the phone's settings; speaking speed; voice-over voice samples; status check), Library (free images, video clips and music downloaded on Wi-Fi), Backup (one file per backup, named with date and time, saved once a day automatically into a folder the user picks, such as Google Drive; Back up now; the 7 newest are kept, each marked Automatic or Manual, with its own restore and delete icons; restoring adds containers marked Restored and then deletes that backup file; Restore picks a backup file from anywhere; turning backup off keeps the files), About. The preview has an Add to library icon (app_action add_to_library) that stores the current version under My creations; the Library page has sections Images, Video clips, Music and My creations, each item can be viewed or played, shared, downloaded or deleted. The editors pick backgrounds, pictures, scenes and music from the library. Help (top bar): how to use every icon, swipes, and a guided tour. Manual mode (Menu, Switch to manual mode, with a warning): AI, voice and typed commands stop; containers show New image, Edit image, New video, Edit video, Logo and Audio icons for full manual editing; Menu, Switch to AI mode brings voice back. Light and dark switch top right. Replies are spoken with the phone's own voice so they start instantly. Voice-overs inside videos use a natural voice engine with many voices: ${Object.values(VO_VOICES).map(v=>v.label).join(', ')}; or the user records their own voice. Listening: one steady microphone without beeps; with a key, Google's AI hears and understands each request in one step; without a key, an offline English speech model on the phone. If speech keeps stopping and starting, the app offers patient listening: it listens quietly until the user says go ahead or taps the dots. Say back to normal to leave it. During a generation, a ring shows the percentage and what is happening; the work continues while the user moves around the app, and voice keeps working; ask how far along it is at any time. Music: built-in styles (${Object.keys(MUSIC).join(', ')}), free library music, or the user's own audio file. YouTube audio and copyrighted film songs cannot be used. Logos are sharp vectors (PNG, JPEG, SVG); blurry logos can be redrawn. Camera recording with teleprompter. Silence ladder: after 2 minutes of silence the app asks if the user is there, then after 1 minute, 30 seconds, and closes listening after 15 more seconds. Everything stays on the device and in the backup folder. Backups hold the containers, not the keys.`;

function systemPrompt(){return `You are Spoken PixelCraft, a warm, expert creative partner inside a voice-first image, video and logo app. Users may be seniors, partially blind, or new to editing. Talk in plain words, like a friendly professional. Speed matters: keep every reply short.

Every turn:
1. Call respond exactly once. For a voice message, put the user's exact words in heard. Put your spoken reply in say: one to three short sentences, plain text, no lists or symbols. Call any other tools in the same turn.
2. If a voice message stops in the middle of a sentence, set complete false, leave say empty and call nothing else; the app waits for the rest. If the audio is only noise, other people, or the app's own voice (compare with app_last_said in the state), set understood false and leave say empty.

Gathering the requirement (most important):
3. Ask only what you cannot sensibly decide yourself, usually one or two short questions at a time: for example the person's or business name, the exact text, prices or phone numbers, and the platform if it is not clear. Never invent names, prices, phone numbers, dates or addresses. Decide everything else yourself with good taste: length, music, colours, fonts, effects, transitions.
4. Platforms and shapes: Instagram post (4:5) or square, Reel, Story or WhatsApp Status (tall 9:16), Facebook post, YouTube video (16:9), YouTube Short, YouTube thumbnail, Google Ads (square, landscape, portrait, rectangle, leaderboard, skyscraper), listing photos for OLX, Quikr or eBay, or print. Use the matching format name.
5. When it is clear, read back a short summary of the whole plan, including what you chose, and ask whether to go ahead. If a previous version exists, ask in the same question whether to keep it. Then understand the user's answer by its meaning, never by keywords: any agreement such as yes, okay, go ahead, sounds good, do it, perfect, make it, means go ahead. Agreement with a change, such as "yes but softer music", means apply the change and go ahead. A no or a new idea means adjust and summarise again. If unclear, ask briefly.
6. If the user seems unsure, offer: "I can make three versions in different styles for you to compare. Would you like that?" If they agree, create three versions (keep_previous true for each), then ask which to keep, which to delete, or which to refine.
7. Whenever requirement details are given or changed, also call update_requirement with the complete third-person summary, losing no detail.

Creating and editing:
8. Prefer use_template for greeting cards, festival wishes, sale posters, invitations, quote and menu cards, thumbnails, announcements, photo cards, slideshows, greeting, promo and quote videos, logos and the business templates; use make_image or make_video for custom work.
9. To change an existing video (add a voice-over, add or replace music, add the user's recorded voice, sound effects, text or captions), always call edit_video. Never rebuild an unrelated new video for an edit. For pictures, use make_image with base type version.
10. Voice-overs: ask whether the user wants to record their own voice (voice_record) or a generated voice, and which voice: ${Object.entries(VO_VOICES).map(([k,v])=>k+' ('+v.label+')').join(', ')}. Spoken voices cannot sing. For a birthday song, use music style happy_birthday (the traditional tune, free to use), optionally with a spoken greeting, or let the user sing with voice_record.
11. Music: built-in styles ${Object.keys(MUSIC).join(', ')}; or search_music for free library music by mood; or the user's own audio file. YouTube audio and copyrighted songs cannot be fetched; say so kindly and offer these options.
12. Browsers need a tap to open the file picker, download, or choose a backup folder. Call highlight or prepare_download and tell the user to tap the glowing icon.
13. Confirm before deleting anything. Never invent file ids; use the ids in the state.
14. Navigation: open or create containers by name with container_action. To create something in another container, first call container_action open (or create), then the creation tool, in the same turn. go_back and go_home with app_action. To save the current item to the library, app_action add_to_library. To back up now, app_action back_up_now.
15. The app cannot be closed by voice. If the user asks to exit or close the app, say: "To exit, please press the Exit icon at the top left of the home screen." and call app_action go_home.
16. While a generation runs, the state shows its percent and stage: answer how far along it is, cancel if asked; new creation requests are queued automatically.
17. Patient listening: if patient_offer_pending is true and the user agrees, or the user asks you to listen quietly or wait until they finish, call listening_mode patient. If they say back to normal, call listening_mode normal.
18. Logos: use_template template logo (sharp vector, PNG, JPEG and SVG). Ask for the business name and, if not given, offer a style (emblem, monogram, wordmark, badge, horizontal) and an icon (one of: ${Object.keys(LOGO_ICONS).join(', ')}). Use ai_image only for a painted, picture-style logo when asked.
19. When the app reports a blurry or small upload, tell the user and offer redraw_logo; ask whether to keep both versions to compare, or only the redrawn one.
20. Documents (price lists, menus, brochures, scripts) appear in the state with their text; use look_at_media to read a PDF. Use exact prices and details.

/* a voice message goes to Google once: it is heard, understood and answered in the same request */
async function voiceTurn(it){if(Brain.busy){Brain.pending.push(['__voice',it]);return}Brain.busy=true;setPill('think');showCaption('Got it…',true);
  const ctl={cancelled:false,answered:false};instantCommand(it,ctl);
  const ack=setTimeout(()=>{if(Brain.busy&&!ctl.cancelled&&!Voice.speaking&&it.ms>=1000&&!Conn.fails)Voice.say('Got it.')},1100);
  try{let last=null;
    for(let a=0;a<=sleepRetry.length;a++){if(ctl.cancelled){last=null;break}try{await aiTurn({audio:it.audio,ms:it.ms,ctl},'voice');Conn.ok();last=null;break}
      catch(e){if(e.name==='AbortError'||ctl.cancelled){last=null;break}last=e;const c=Conn.cause_(e);if(c==='quota'||c==='key'||c==='offline'||c==='app'||a===sleepRetry.length)break;await sleep(sleepRetry[a])}}
    if(last){const tell=Conn.fail(last)||it.ms>=1500;
      /* the offline model can still write it down; the built-in understanding or Mistral then takes over */
      let t='';if(Listen.modelLoaded){try{t=await STW.call('asr',{audio:it.audio.slice()})}catch(er){}}
      Brain.busy=false;clearTimeout(ack);showCaption('');
      if(t&&!isEcho(t)&&!unclearSpeech(t,it.ms)){showCaption(t);await handleTextOffline(t,last,tell);return}
      if(tell&&it.ms>=1000)reply(Conn.words(Conn.cause),'voice')}}
  finally{clearTimeout(ack);if(Brain.busy){Brain.busy=false;setPill();nextPending()}}}
async function handleTextOffline(t,err,tell){if(M.usable()&&navigator.onLine!==false){Brain.busy=true;try{await mistralTurn(t,'voice');return}catch(e){}finally{Brain.busy=false;setPill()}}

const FOLLOW=new Set(['look_at_media','look_at_link','search_images','search_music','search_videos','transcribe','interrupted_job']);

    parts.push({text:'[voice message]'},{inline_data:{mime_type:'audio/wav',data:await b64(wav16(input.audio))}});userTurn=pushUser(hist,parts);input.held=held}
  else userTurn=pushUser(hist,[{text:(channel==='chat'&&!input.text.startsWith('[app]')?'[typed] ':'')+input.text}]);

  for(let step=0;step<6;step++){const contents=trimHist(hist,useModel==='lite'?10:20);const last=contents[contents.length-1];

    const calls=content.parts.filter(p=>p.functionCall);const resp=calls.find(p=>p.functionCall.name==='respond');const ra=resp?resp.functionCall.args||{}:{};const others=calls.filter(p=>p!==resp);

      /* the audio is replaced by its words in the saved history, so later requests stay small */
      const ix=userTurn.parts.findIndex(p=>p.inline_data);if(ix>=0)userTurn.parts.splice(ix-1,2,{text:heardText?`[voice] ${heardText}`:'[voice] (unclear)'});
      const drop=()=>{const k=hist.indexOf(userTurn);if(k>=0){if(userTurn.parts.some(p=>p.functionResponse))userTurn.parts=userTurn.parts.filter(p=>p.functionResponse);else hist.splice(k,1)}};

        if(nav.chat&&c){c.chat.push({me:true,t:heardText,ts:Date.now(),v:1});renderChatOnly()}}}

    if(!calls.length)break;const res=[];let need=false;

    if(others.some(p=>!['update_requirement','app_action','highlight','container_action','listening_mode'].includes(p.functionCall.name)))useModel='text';
    const nc=nav.v==='container'?byId(nav.id):null;if(nc!==c){const nh=historyFor(nc);sealHist(nh);hist.push({role:'user',parts:res});nh.push(...trimHist(hist.slice(-6),6));hist=nh;c=nc;if(!need)break;continue}

async function mistralTurn(text,channel){const c=nav.v==='container'?byId(nav.id):null;const hist=historyFor(c);
  const msgs=[{role:'system',content:systemPrompt().replace(/Every turn:[\s\S]*?Gathering the requirement/,'Reply in plain spoken English, one to three short sentences.\n\nGathering the requirement')}];
  for(const h of hist.slice(-12)){if(!h.parts)continue;if(h.role==='user'){const t=h.parts.filter(p=>p.text).map(p=>p.text).join(' ');if(t)msgs.push({role:'user',content:t})}else{const t=lastSaid([h]);if(t)msgs.push({role:'assistant',content:t})}}

function localRecordFollowup(c,id,secs,played){if(!played){reply('Your recording is saved. You can download it, or ask me to add music, text or a look to it.','voice');return}

/* ---------- instant app commands: a short command is written down on the phone (offline model) while Google is asked;

const INSTANT=/^(go (back|home)|back|home|open (the )?(menu|help|library|backup|keys|api keys|voice|about|messages|requirement)|close (the )?(menu|help|messages|requirement)|show (the )?(menu|help|library|requirement|messages)|(dark|light) (mode|theme)|switch to (dark|light)( mode)?|stop|stop talking|be quiet|quiet|silence|stop listening|cancel( it| that| the generation)?|next|repeat|stop (the )?tour|show me around|start (the )?tour|(open|go to) (the )?(container )?[\w ]{1,30}|undo|bring it back|read (the )?requirement|what can you do|help)$/;
function instantCommand(it,ctl){const lg=r=>{if(window.__spcLog)window.__spcLog.push(['instant?',r])};if(!Listen.modelLoaded||it.ms>4000||Patient.on||Hold.text)return lg('skip');
  STW.call('asr',{audio:it.audio.slice()}).then(t=>{if(ctl.answered||ctl.cancelled)return lg('late');t=String(t||'').trim();if(!t||isEcho(t)||unclearSpeech(t,it.ms))return lg('unclear '+t);

    const r=localUnderstand(t,'voice');if(r===false)return lg('local false');ctl.cancelled=true;if(window.__spcLog)window.__spcLog.push(['instant',t,Date.now()]);showCaption(t);if(r)reply(r,'voice')}).catch(()=>{})}

      <label class="tbtn" id="galBtn" title="Photos and videos from your gallery" aria-label="Add photos and videos from your gallery" tabindex="0" role="button">${I('gallery')}<input type="file" id="galIn" accept="image/*,video/*" multiple hidden></label>
      <label class="tbtn" id="fileBtn" title="Documents and music" aria-label="Add documents or music" tabindex="0" role="button">${I('files')}<input type="file" id="fileIn" accept=".pdf,.doc,.docx,.txt,.csv,.md,.rtf,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,audio/*" multiple hidden></label>
      <button class="tbtn" data-act="yt" title="Add YouTube link" aria-label="Add YouTube link">${I('link')}</button></div>
    ${S.manual?manualToolsHTML(c):''}
    <div class="stage"><div class="preview" id="preview">${await previewInner(c)}</div><div id="stripbox">${stripHTML(c)}</div></div>
    ${chatOpen?chatHTML(c):''}</section>`;
  if(nav.v!=='container'||nav.id!==c.id)return;const pv=$('#preview');pv.classList.toggle('isvideo',!!pv.querySelector('video'));
  for(const id of ['#galIn','#fileIn']){$(id).onchange=e=>{const fs=[...e.target.files];e.target.value='';uploadFiles(c,fs)}}fillStripThumbs(c);const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
async function renderPreviewOnly(){if(nav.v!=='container')return;const c=byId(nav.id);const pv=$('#preview');if(!c||!pv)return;pv.innerHTML=await previewInner(c);pv.classList.toggle('isvideo',!!pv.querySelector('video'))}
async function renderAfterChange(c){if(nav.v==='container'&&nav.id===c.id){await renderPreviewOnly();const sb=$('#stripbox');if(sb){sb.innerHTML=stripHTML(c);fillStripThumbs(c)}const mt=$('.mtools');if(mt&&S.manual)mt.outerHTML=manualToolsHTML(c)}else if(nav.v==='home')renderHome()}
function chatHTML(c){const ms=c.chat.length?c.chat:[{me:false,t:'Type a request or a command, or paste a video or image script here. I will read it and reply.'}];
  return `<div class="chat" role="region" aria-label="Messages"><div class="grab"></div><div class="msgs" id="msgs" aria-live="polite">${ms.map(m=>`<div class="msg ${m.me?'me':'app'}"><span class="who">${m.me?'You':'Spoken PixelCraft'}</span><div class="b">${esc(m.t)}</div></div>`).join('')}</div>
    <div class="compose"><textarea id="ta" rows="1" placeholder="Type or paste here" aria-label="Message"></textarea><button class="send" data-act="send" aria-label="Send">${I('send')}</button></div></div>`}
function toggleChat(open){if(nav.v!=='container')return;const c=byId(nav.id),cv=$('#cview');nav.chat=open;history.replaceState(nav,'');if(!c||!cv)return render();
  document.body.classList.toggle('chatopen',open);cv.classList.toggle('chatopen',open);const btn=cv.querySelector('.msgbtn');if(btn){btn.classList.toggle('on',open);btn.setAttribute('aria-pressed',open);btn.setAttribute('aria-label',open?'Close messages':'Type a message')}
  const ex=cv.querySelector('.chat');if(open&&ex&&ex.classList.contains('closing')){ex.classList.remove('closing')}else if(open&&!ex){cv.insertAdjacentHTML('beforeend',chatHTML(c));const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight;if(matchMedia('(min-width:900px)').matches)setTimeout(()=>{const ta=$('#ta');if(ta)ta.focus()},80)}
  else if(!open&&ex){ex.classList.add('closing');cv.classList.remove('kb');document.body.classList.remove('kb');setTimeout(()=>{if(!nav.chat)ex.remove()},1150)}}
function renderChatOnly(){if(nav.v!=='container'||!nav.chat)return;const c=byId(nav.id),m=$('#msgs');if(!m||!c)return;m.innerHTML=c.chat.map(x=>`<div class="msg ${x.me?'me':'app'}"><span class="who">${x.me?'You':'Spoken PixelCraft'}</span><div class="b">${esc(x.t)}</div></div>`).join('');m.scrollTop=m.scrollHeight}

const keyRow=(k,i,kind)=>`<li class="key"><span class="kn">${kind==='m'?'Mistral':'Key'} ${i+1}</span><span class="stat ${k.st==='active'?'ok':k.st==='inactive'||k.st==='blocked'?'bad':'chk'}">${k.st==='active'?'Active':k.st==='inactive'?'Inactive':k.st==='blocked'?'Not usable here':k.st==='unknown'?'Not checked':'Checking'}</span><button class="mini big" data-kcopy="${kind}${i}" aria-label="Copy ${kind==='m'?'Mistral key':'key'} ${i+1}">${I('copy')}</button><button class="mini big del" data-kdel="${kind}${i}" aria-label="Delete ${kind==='m'?'Mistral key':'key'} ${i+1}">${I('trash')}</button></li>`;
function renderKeys(){const mk=S.mkeys||[];
  main.innerHTML=`<section class="view">${vtitle('API keys')}<div class="list">
    <div class="card"><h2>Google keys</h2><p class="note">A free Google key lets Spoken PixelCraft hear and understand you in one quick step. Create keys in several Google projects and save them all: they work side by side, share big jobs, and take over when one runs out of its free limit.</p>
      <div class="btnrow"><button class="pbtn" data-act="createkey">${I('ext')} Create free key</button><button class="pbtn prime" data-act="pastekey">${I('key')} Paste key</button></div>
      ${S.keys.length?`<ul class="keys">${S.keys.map((k,i)=>keyRow(k,i,'g')).join('')}</ul>`:'<p class="note">No Google keys saved yet.</p>'}</div>
    <div class="card"><h2>Mistral keys (optional)</h2><p class="note">Mistral's free keys can take background work, such as reading long documents, and step in when the Google keys are busy. Paste a key from console.mistral.ai, under API keys.</p>
      <div class="btnrow"><button class="pbtn" data-act="createmkey">${I('ext')} Get a Mistral key</button><button class="pbtn prime" data-act="pastemkey">${I('key')} Paste Mistral key</button></div>
      ${mk.length?`<ul class="keys">${mk.map((k,i)=>keyRow(k,i,'m')).join('')}</ul>${M.blocked?'<p class="note warnline">Mistral does not allow direct use from a web app on this device, so your Google keys handle everything.</p>':''}`:'<p class="note">No Mistral keys saved.</p>'}</div></div></section>`}
function renderVoice(){const vs=Voice.voices(),cur=pickDeviceVoice();
  main.innerHTML=`<section class="view">${vtitle('Voice')}<div class="list"><div class="card"><h2>Speaking</h2>
    <p class="note">Replies are spoken with your phone's own default voice, so they start at once. To change it, change the text-to-speech voice in your phone's settings.</p>
    <p class="note vstat"><b>Status:</b> <span id="vstatus">${voiceStatusText()}</span></p><div class="sbtns"><button class="sbtn prime" data-act="voicetest">${I('speaker')} Test voice</button></div>
    <span class="lbl">Speed</span><div class="seg seg3" role="group" aria-label="Speaking speed">${[['0.9','Calm'],['1','Normal'],['1.15','Quick']].map(([r,l])=>`<button data-rate="${r}" aria-pressed="${String(num(S.rate,1))===r}">${l}</button>`).join('')}</div></div>
    <div class="card"><h2>Voice-over voices</h2><p class="note">Natural voices for the voice-overs inside your videos. ${VOE.ready?'Ready on this device.':VOE.loading?'Downloading now, about 90 MB.':'They download once on Wi-Fi, about 90 MB, or the first time you ask for a voice-over.'}</p>
      <div class="vlist">${Object.entries(VO_VOICES).map(([k,v])=>`<button class="chip" data-vo="${k}" aria-label="Hear ${esc(v.label)}">${I('speaker')} ${esc(v.label)}</button>`).join('')}</div>
      ${!VOE.ready&&!VOE.loading?`<button class="pbtn" data-act="voeload">${I('down')} Download voice-over voices</button>`:''}</div>
    <div class="card"><h2>Status check</h2><ul class="diag">${[['mic','Microphone',Diag.mic||{st:'warn',msg:'Not started yet'}],
      ['ears','Understanding speech',Listen.engine==='ai'?{st:(Diag.ai&&Diag.ai.st==='fail'&&Date.now()-Diag.ai.t<600000)?'fail':'ok',msg:(Diag.ai&&Diag.ai.st==='fail'&&Date.now()-Diag.ai.t<600000)?Diag.ai.msg:'Google AI with your key, one quick step'}:Listen.engine==='local'?{st:'ok',msg:'Offline speech model on this phone'}:Listen.engine==='browser'?{st:'warn',msg:'Browser recognition'}:{st:'warn',msg:'Speech model loading'}],
      ['backupear','Offline speech model',Listen.modelLoaded?{st:'ok',msg:'Ready as a backup'}:{st:'warn',msg:'Downloads quietly in the background'}],
      ['speak','Speaking',('speechSynthesis' in window)?{st:Voice.state==='ok'?'ok':Voice.state==='blocked'?'warn':'fail',msg:Voice.state==='ok'?'Your phone\'s default voice':voiceStatusText()}:{st:'fail',msg:'This browser cannot speak'}],
      ['keys','Google AI keys',G.active().length?{st:'ok',msg:G.active().length+' working'}:{st:'warn',msg:'None saved'}]].map(([k,t,d])=>`<li class="${d.st}"><span class="dot2"></span><b>${t}</b><span>${esc(d.msg)}</span></li>`).join('')}</ul></div>
    <div class="card"><h2>Listening</h2><p class="note">One steady microphone, without beeps. ${Listen.engine==='ai'?'With your key, Google\'s AI hears and understands each request in one quick step.':'Without a key, the offline English speech model on this phone writes down what you say.'} If your speech keeps stopping and starting, I offer to listen quietly until you say go ahead.</p></div></div></section>`}
async function renderBackup(){const b=Backup;let list=[];try{list=await b.list()}catch(e){}if(nav.v!=='backup')return;
  const on=!!b.mode,folder=b.mode==='folder';
  main.innerHTML=`<section class="view">${vtitle('Backup')}<div class="list">
    <div class="card bkcard">${on?`<h2>Backup location</h2>
      ${folder?`<button class="locbtn" data-act="bkloc" aria-label="Backup location, ${esc(b.folder)}. Opens the folder">${I('folder')}<span>${esc(b.folder)}</span>${I('chev')}</button>`:`<div class="locbtn static">${I('folder')}<span>Inside this browser</span></div>`}
      <p class="note">Backed up automatically once a day, as one file named with the date and time. The 7 newest backups are kept.${folder?'':' This browser cannot save to a folder, so backups stay inside the browser. Use the download icon to keep a copy elsewhere.'}</p>
      ${b.needPerm?`<button class="sbtn prime" data-act="allowbk">${I('shield')} Allow</button>`:''}
      <div class="sbtns"><button class="sbtn prime" data-act="bknow">${I('backup')} Back up now</button>${folder?`<button class="sbtn" data-act="setbk">${I('folder')} Change folder</button>`:''}<button class="sbtn warn" data-act="offbk">${I('x')} Turn off</button></div>`
      :`<h2>Backup</h2><p class="note">Choose a folder once, on this phone or in Google Drive. A backup file is then saved there automatically every day.</p><div class="sbtns"><button class="sbtn prime" data-act="setbk">${I('folder')} Set up backup</button></div>`}</div>
    ${on?`<div class="card"><h2>Backups</h2>${list.length?`<ul class="bklist">${list.map(e=>`<li class="bk"><span class="bt"><b>${fmtDate(e.t)}, ${fmtTime(e.t)}</b><span class="bkk ${e.kind}">${e.kind==='auto'?'Automatic':'Manual'}</span></span>${folder?'':`<button class="mini" data-bksave="${esc(e.name)}" aria-label="Save a copy of the backup of ${fmtDate(e.t)} ${fmtTime(e.t)}">${I('down')}</button>`}<button class="mini rest" data-bkrest="${esc(e.name)}" aria-label="Restore the backup of ${fmtDate(e.t)} ${fmtTime(e.t)}">${I('restore')}</button><button class="mini del" data-bkdel="${esc(e.name)}" aria-label="Delete the backup of ${fmtDate(e.t)} ${fmtTime(e.t)}">${I('trash')}</button></li>`).join('')}</ul>`:'<p class="note">No backups yet. The first one is made automatically today, or tap Back up now.</p>'}</div>`:''}
    <div class="card"><h2>Restore</h2><p class="note">Bring back containers from any backup file, wherever it is kept. They are added to Home marked Restored; nothing on Home is replaced.</p><div class="sbtns"><button class="sbtn" data-act="bkpick">${I('restore')} Restore</button></div></div></div></section>`}
const ABOUT=[
 ['spark','What Spoken PixelCraft is','<p>A voice-first studio for creating and editing images and videos. You speak in plain words. The app asks questions until it understands exactly what you want, explains the choices, and then creates it with its own built-in tools.</p>'],
 ['book','Getting started','<ul><li>Tap anywhere when the app opens. Voice turns on and stays on.</li><li>Add a free Google key in Menu, API keys.</li><li>Tap the plus button, or say <q>create a new container</q>.</li><li>Inside the container, tell the app what you want. It asks only what it needs, reads back a short summary, and asks whether to go ahead. Answer in your own words, such as <q>yes</q> or <q>go ahead, but softer music</q>.</li></ul>'],
 ['key','Free API keys (Google and Mistral)','<p>In Menu, API keys, tap Create free key, then Open Google AI Studio. Sign in, tap Create API key and copy it. On a phone, press Back until you return to the app; on a computer, close that window. Then tap Paste key. Create keys in several Google projects and save them all: they share the work, so the app answers faster, and when one key reaches its free limit the others take over. Tap the copy icon to see a key again, and the bin to remove it.</p><p><b>Mistral keys (optional).</b> In Menu, API keys, tap Get a Mistral key. Sign in at console.mistral.ai, choose the free plan, open API keys, tap Create new key and copy it. Come back and tap Paste Mistral key. The key is tested at once: if it works, it shares background work, such as reading long documents, and steps in when the Google keys are busy; if the test fails, you are told why and can delete it.</p>'],
 ['voice','Talking to the app','<ul><li><q>Make a sunset poster for my tea shop with the name in big letters.</q></li><li><q>Make a Reel from these three clips with calm music.</q></li><li><q>Make the sky darker.</q> <q>Cut the first five seconds.</q></li><li><q>Go back to version two.</q> <q>Download it as PNG and JPEG.</q></li><li><q>Switch to dark mode.</q> <q>Open the menu.</q></li></ul><p>Replies are spoken with your phone\'s own voice, so they start at once. The dots flash when you finish speaking, and the words I heard appear above them. If your speech keeps stopping and starting, I offer to listen quietly until you say <q>go ahead</q>; say <q>back to normal</q> to leave that. You can interrupt a longer reply by speaking. Android shows a notification while the microphone is on; you can silence it in Chrome\'s notification settings. Tap the dots to stop listening, and the microphone to start again.</p>'],
 ['layers','Containers and versions','<p>Each project lives in its own container. The newest edited container is shown first. Before a new version replaces the current one, the app asks whether to keep the previous one. Kept versions and your uploads appear as small blocks below the preview; tap one to see it, or its cross to delete it.</p>'],
 ['file','Recorded requirement and messages','<p>The document icon at the top right of a container opens the Recorded User Requirement: a clear summary of everything you asked for, with a speaker icon to hear it. Tap the same icon again to close it. The messages icon at the bottom opens a box where you can type commands or paste a script; tap it again to close.</p>'],
 ['down','Downloading','<p>Choose a file name and one or more formats: PNG, JPEG, WebP or GIF for images; MP4, WebM, MP3 or GIF for videos. Files are saved to your device\'s Downloads folder. The folder button opens a file picker there, where your browser allows it.</p>'],
 ['backup','Backup and restore','<p>Choose a folder once, on the phone or in Google Drive. Nothing is saved at that moment. After that, one backup file named with the date and time is saved there automatically once a day, and Back up now saves one whenever you like. The 7 newest backups are kept, each marked Automatic or Manual.</p><p>The folder name is a button that opens the phone file picker in that folder. Each backup in the list has its own restore icon and a red delete icon. Restoring adds the containers to Home marked Restored, never replacing anything, and then deletes that backup file. Restore, at the bottom, opens a backup file from any place. Turning backup off stops new backups and keeps the files.</p>'],
 ['trash','Deleted containers','<p>A deleted container disappears at once, but you can say <q>undo</q> or <q>bring it back</q> until the first use of the next day, when it is removed for good. Backups taken earlier still hold a copy.</p>'],
 ['down','First-run setup','<p>On the very first run, the app downloads its one essential component: the offline English speech recognition model, about 65 MB. Tap Download when ready, preferably on Wi-Fi. While it downloads you can explore the Menu and add API keys. Replies use the phone\'s own voice, so nothing else is needed to talk. Other components, such as the voice-over voices, fonts, encoders, background removal and the starter library, download quietly in the background on Wi-Fi, pausing while you use the app.</p>'],
 ['spark','Ready-made designs','<p>Say, for example, <q>make a birthday card for Ravi</q>, <q>make a Diwali greeting video</q>, <q>make a sale poster for 50 percent off</q>, <q>make a quote card</q> or <q>make a slideshow of my photos</q>. Ready-made designs include greeting cards for any occasion, sale posters, invitations, quote cards, menu cards, YouTube thumbnails, announcements, photo cards, slideshows, greeting videos, promo reels and quote videos. They work even without an API key.</p>'],
 ['shield','Without a key or internet','<p>Without a key, the app still answers questions about itself, follows commands like dark mode, open the menu or show version two, makes simple edits like <q>make it brighter</q>, <q>add confetti</q> or <q>make it black and white</q>, and creates ready-made designs. Listening and speaking work offline after the first setup. A key adds Google\'s AI to understand any request and polish the result.</p>'],
 ['video','Camera recording','<p>Say, for example, <q>record me with the front camera while version two plays, and put me in the bottom right corner</q>. The app counts down, shows your script as a teleprompter if you give one, and records. Say <q>stop recording</q> or tap the stop button. While recording, everything else you say is recorded, not treated as a command. On some phones the browser cannot listen and record at the same moment; then simply tap stop.</p>'],
 ['clock','During a generation','<p>A ring shows the percentage, with a short line saying what is happening, such as <q>Adding music</q> or <q>Generating video</q>. Videos are created in real time, so a one-minute video takes about a minute. You can move around the app meanwhile: a small ring follows you, and tapping it brings you back. Voice keeps working, so you can ask <q>how far along is it?</q>, create another container, or say <q>cancel</q>. Keep the app on screen; locking the phone may pause the work.</p>'],
 ['link','YouTube links','<p>Links are used for understanding only. The app can watch a video and create something in a similar style, but YouTube videos cannot be downloaded or reused as footage. Use clips you own, uploaded from your device.</p>'],
 ['lib','Library, music and daily cleanup','<p>With your permission, a starter library of free images, video clips and music (about 500 MB) downloads in the background, on Wi-Fi only. It keeps growing as your requests fetch more, with no fixed limit. Only public-domain and free-to-use media is fetched. Built-in music comes in many styles, including soft, piano, lo-fi, devotional, Indian classical, kids, epic, jazz, wedding and the Happy Birthday tune. You can also use your own audio file. YouTube audio and copyrighted film songs cannot be used. Once a day, on first use, the app quietly clears deleted containers and leftovers.</p>'],
 ['screen','Phone and desktop','<p>The same app works on phones, tablets and computers. Larger screens show more containers, a bigger preview, and the messages panel at the side.</p>'],
 ['voice','Voice-overs','<p>Videos can carry a voice-over in many voices: female, male, British, storyteller, jovial, announcer, little girl, little boy, clown, robot, giant, old man, chipmunk, or a chorus. Or record your own voice: the app shows your script, records, and cleans up the sound. Spoken voices cannot sing; for a birthday, use the Happy Birthday tune, or sing it yourself.</p>'],
 ['sliders','Manual mode','<p>In Menu, choose Switch to manual mode. After a warning, all AI assistance, voice and typed commands stop, and each container shows editing icons: New image, Edit image, New video, Edit video, Logo and Audio.</p><ul><li><b>Image editor:</b> size for any platform, colour, gradient or photo backgrounds, crop, rotate and mirror, brightness, contrast, colour and more, ready-made looks, effects, text in many fonts and styles, shapes, stickers, pictures on top, particles, frames, background removal, and layers. Drag things with a finger to move them.</li><li><b>Video editor:</b> a timeline of scenes from clips, photos and colour cards; trim, split, reorder, copy and delete; speed, speed ramps and reverse; motion; transitions; looks; animated text; stickers; picture in picture; particles; and a quick preview.</li><li><b>Logo maker:</b> name, tagline, five styles, twenty icons, colours, background and font; saved as PNG and SVG.</li><li><b>Audio editor:</b> built-in or library music, voice-overs in many voices, your own voice, sound effects, volume, fades and start times; or trim, cut out and split sound files.</li></ul><p>Every save becomes a new version, and you can keep the one you started from. Choose Switch to AI mode in the Menu to bring voice and AI back.</p>'],
 ['exit','Back and Exit','<p>Every screen has a Back icon at the top left. On the home screen, the Exit icon in that spot closes the app at once. If something is being created, it pauses, and I offer to continue it next time. You can also say <q>go back</q>, <q>go home</q>, or <q>open the Birthday container</q>.</p>'],
 ['shield','Privacy','<p>Your work stays in this browser and in your chosen backup folder. Requests are sent to Google, or Mistral, only with your own keys. Backups hold your containers, not your keys.</p>']];
let openSec=0;
function renderAbout(){main.innerHTML=`<section class="view">${vtitle('About')}<div class="acc">${ABOUT.map((s,i)=>`<div class="sec ${i===openSec?'open':''}"><button class="sech" data-sec="${i}" aria-expanded="${i===openSec}"><span class="ric">${I(s[0])}</span><span class="tx">${s[1]}</span>${I('chev','chev')}</button><div class="secb"><div><div class="in">${s[2]}</div></div></div></div>`).join('')}</div></section>`}
function onKeysChanged(){if(nav.v==='keys')renderKeys();else if(nav.v==='home'&&!liveCS().length)renderHome()}
let vsT=0;function onVoiceStatus(){if(nav.v==='voice'&&Date.now()-vsT>600){vsT=Date.now();renderVoice()}}

/* ---------- sheets and dialogs ---------- */
const layer=$('#layer');
function closeLayer(){if(layer.innerHTML){layer.innerHTML='';if(reqSpeaking){Voice.stop();reqSpeaking=false}}}
function sheet(title,body,left=''){layer.innerHTML=`<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="shead">${left||'<span style="width:42px"></span>'}<h3>${esc(title)}</h3><button class="ibtn" data-act="close" aria-label="Close">${I('x')}</button></div>${body}</div></div>`;const f=layer.querySelector('input:not([type=file]),textarea');if(f)setTimeout(()=>f.focus(),60)}
function ask(title,text,okLabel,danger,cb){sheet(title,`<p class="note center">${esc(text)}</p><div class="btnrow"><button class="pbtn" data-act="close">Cancel</button><button class="pbtn prime ${danger?'danger':''}" id="okb">${esc(okLabel)}</button></div>`);$('#okb').onclick=()=>{closeLayer();cb()}}
function nameDialog(title,val,cb){sheet(title,`<input class="field" id="nm" value="${esc(val)}" maxlength="80" aria-label="Name"><button class="pbtn prime" id="okb">Save</button>`);const nm=$('#nm');nm.select();const done=()=>{const v=nm.value.trim();if(!v)return nm.focus();closeLayer();cb(v)};$('#okb').onclick=done;nm.onkeydown=e=>{if(e.key==='Enter')done()}}
let reqSpeaking=false;const reqOpen=()=>!!$('#reqpanel');
function reqSections(c){const s=(c.req||[]).length?c.req:[{heading:'Requirement so far',text:'Nothing recorded yet. Tell the app what you would like to create.'}];return [...s,{heading:'Status',text:c.reqStatus||'Not generated.'}]}
function reqInner(c){return reqSections(c).map(x=>`<div class="g"><h4>${esc(x.heading)}</h4><p>${esc(x.text)}</p></div>`).join('')}
function reqPanelHTML(c){return `<div class="reqpanel" id="reqpanel" role="region" aria-label="Recorded user requirement"><div class="rqhead"><h3>Recorded requirement</h3><button class="ibtn" id="reqspk" data-act="reqspeak" aria-label="Play aloud" aria-pressed="false" title="Play aloud">${I('speaker')}</button></div><div class="req" id="reqbox">${reqInner(c)}</div></div>`}

function glow(ctrl){const sel={upload:'#galBtn',gallery:'#galBtn',files:'#fileBtn',link:'[data-act=yt]',download:'#dlgo, [data-act=download]',share:'[data-act=share]',backup:'[data-act=setbk]',messages:'.msgbtn',requirement:'[data-act=req]',new:'.fab',install:'[data-act=install]',exit:'[data-act=exit]',help:'#helpBtn'}[ctrl]||'#galBtn';

/* ---------- uploads, versions, deletion ---------- */
async function uploadFiles(c,files){if(!files.length)return;let n=0;const blurry=[];
  for(const f of files){const k=(f.type||'').split('/')[0];const isDoc=!['image','video','audio'].includes(k);
    if(isDoc&&!/pdf|word|officedocument|text|rtf|csv|markdown/.test(f.type||'')&&!/\.(pdf|docx?|txt|csv|md|rtf)$/i.test(f.name)){toast(f.name+' is not a supported file.');continue}
    const meta=isDoc?{}:await probe(f);const type=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':/\.docx$/i.test(f.name)?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'text/plain');
    const id=await addMedia(c.id,f,{name:f.name});const item={id,type,name:f.name,size:f.size,w:meta.w,h:meta.h,duration:meta.duration};
    if(isDoc){item.text=await docText(f,f.name)||'';if(!item.text&&/doc$/i.test(f.name))item.note='Old Word format; save as DOCX or PDF for best results'}
    if(k==='image'){const q=await sharpness(f);if(q){item.quality=q;if(q.blurry)blurry.push(item)}}
    c.media.push(item);c.sel={t:'m',id};n++;if(!c.thumb&&(k==='image'||k==='video'))c.thumb=await makeThumb(f);if(!c.kind&&(k==='image'||k==='video'))c.kind=k}
  if(!n)return;await saveC(c);renderAfterChange(c);toast(n>1?`${n} files added.`:'Added.');
  if(blurry.length){const b=blurry[0];const note=`[app] The user uploaded ${b.name} (media_id ${b.id}); it looks blurry or small (${b.quality.w} by ${b.quality.h} pixels). Tell the user and offer to redraw it sharply as a vector, asking whether to keep both versions to compare or only the redrawn one.`;
    handleText(note,'voice',{fallback:()=>reply(Local.ask('This picture looks a little blurry or small. If it is a logo, I can try to redraw it sharply. Would you like that?',
      ()=>Local.ask('Shall I keep both versions so you can compare, or only the redrawn one? Say both, or only the new one.',()=>{redrawThen(c,b.id,false);return 'Redrawing it now. You will have both to compare.'},()=>{redrawThen(c,b.id,true);return 'Redrawing it now. I will remove the blurry one afterwards.'},
        s=>/\bboth\b/.test(s)?(redrawThen(c,b.id,false),'Redrawing it now. You will have both to compare.'):/only|new one|redrawn/.test(s)?(redrawThen(c,b.id,true),'Redrawing it now. I will remove the blurry one afterwards.'):undefined),
      ()=>'Okay, I will use it as it is.'),'voice')});return}
  const docs=files.filter(f=>!/^(image|video|audio)\//.test(f.type||''));
  if(Session.active&&!S.voiceOff&&!Brain.busy&&!Rec.active)Voice.say(docs.length?'I have your document. What would you like me to make with it?':n>1?`I have your ${n} files. What would you like to do with them?`:'Got it. What would you like to do with it?')}
async function redrawThen(c,id,removeOld){const before=c.versions.length;genTool('redraw_logo',c,{media_id:id,keep_previous:true,summary:'Redrawn logo'});if(!removeOld)return;await sleep(300);while(Gen.running||Gen.queue.length)await sleep(500);if(c.versions.length>before)deleteUpload(c,id)}
async function deleteVersion(c,i){const v=c.versions[i];if(!v)return;c.versions.splice(i,1);await delMedia(v.id);if(v.svg)await delMedia(v.svg);if(c.sel&&c.sel.id===v.id)c.sel=null;await refreshThumb(c);await saveC(c);renderAfterChange(c)}
async function deleteUpload(c,id){const i=c.media.findIndex(m=>m.id===id);if(i<0)return;c.media.splice(i,1);await delMedia(id);if(c.sel&&c.sel.id===id)c.sel=null;await refreshThumb(c);await saveC(c);renderAfterChange(c)}
async function refreshThumb(c){const it=await currentItem(c);if(!it){c.thumb=null;c.kind=null;return}if(it.kind==='audio')return;const m=await DB.get('media',it.sel.id);if(m){c.thumb=await makeThumb(m.blob);c.kind=it.kind}}
async function softDelete(c){c.deleted=Date.now();await saveC(c,false);if(nav.v==='container'&&nav.id===c.id)goHome();else render();toast('Deleted. Say "undo" or "bring it back" until tomorrow.')}
function setVoiceOff(off){S.voiceOff=off;saveS();if(off){Voice.stop();Session.stop()}else if(started&&(Listen.ready()||Listen.engine==='browser'))Session.start();render()}

async function shareCurrent(){const c=byId(nav.id);const it=await currentItem(c);if(!it||it.kind==='doc')return toast('Nothing to share yet.');const m=await DB.get('media',it.sel.id);if(!m)return;
  const ext=(m.type.split('/')[1]||'bin').split(';')[0].replace('jpeg','jpg').replace('svg+xml','svg');const file=new File([m.blob],(c.name.replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')||'Spoken_PixelCraft')+'.'+ext,{type:m.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:c.name});return}catch(e){if(e.name==='AbortError')return}}
  toast('Sharing files is not supported in this browser. Use Download instead.')}
function micStatusLine(){if(Listen.on&&Listen.lastLvl)return 'I am listening.';if(Listen.err==='denied')return 'The microphone is blocked. Please allow the microphone for this app, then tap the microphone again.';if(Listen.err==='nomic')return 'I could not open the microphone. Please check that the microphone is allowed for this app and not in use by a call, then tap the microphone again.';

/* ---------- download ---------- */
async function downloadDialog(c,pre,fname){const it=await currentItem(c);if(!it)return toast('Nothing to download yet.');
  if(it.kind==='doc')return toast('Documents are used for reading only.');
  const fm=it.kind==='video'?['MP4','WebM','MP3','GIF']:it.kind==='audio'?['MP3','Original']:(it.meta.svg?['PNG','JPEG','SVG','WebP']:['PNG','JPEG','WebP','GIF']);
  const want=(pre&&pre.length?pre:[fm[0]]).filter(f=>fm.includes(f));if(!want.length)want.push(fm[0]);
  const base=String(fname||c.name).replace(/\.[a-z0-9]{2,4}$/i,'').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,80)||'Spoken_PixelCraft';
  sheet('Download',`<span class="lbl">File name</span><input class="field" id="fname" value="${esc(base)}" aria-label="File name">
    <span class="lbl">Format</span><div class="fmts" role="group" aria-label="Formats">${fm.map(f=>`<button class="chip ${want.includes(f)?'on':''}" data-fmt="${f}" aria-pressed="${want.includes(f)}">${f}</button>`).join('')}</div>
    <p class="note">Choose one or more formats. Files are saved to your device's default Downloads folder.</p><p class="note" id="dlmsg" aria-live="polite"></p>
    <div class="btnrow"><button class="pbtn" data-act="openfolder">${I('folder')} Open folder</button><button class="pbtn prime" id="dlgo" data-act="dodl">${I('down')} Download</button></div>`);
  if(pre&&pre.length)glow('download')}
async function doDownload(){const c=byId(nav.id);const it=await currentItem(c);if(!it)return;const name=($('#fname').value.trim()||'Spoken_PixelCraft').replace(/[\\/:*?"<>|]+/g,'');const fmts=[...layer.querySelectorAll('.chip.on')].map(x=>x.dataset.fmt);
  const msg=t=>{const m=$('#dlmsg');if(m)m.textContent=t};const btn=$('#dlgo');btn.disabled=true;const m=await DB.get('media',it.sel.id);const blob=m.blob;let ok=0;
  const ext={PNG:['image/png','png'],JPEG:['image/jpeg','jpg'],WebP:['image/webp','webp']};
  for(const f of fmts){try{msg('Preparing '+f+'…');
      if(ext[f]){const out=blob.type===ext[f][0]?blob:await convertImage(blob,ext[f][0]);saveFile(out,name+'.'+ext[f][1])}
      else if(f==='SVG'){const sv=it.meta.svg&&await DB.get('media',it.meta.svg);if(!sv){msg('SVG is not available for this picture.');continue}saveFile(sv.blob,name+'.svg')}
      else if(f==='GIF')saveFile(await gifFrom(blob,p=>msg('Preparing GIF… '+Math.round(p)+'%')),name+'.gif');
      else if(f==='MP3'){const r=await mp3From(blob);saveFile(r.blob,name+'.'+r.ext);if(r.ext!=='mp3')msg('MP3 was not available, so a WAV sound file was saved.')}
      else if(f==='Original')saveFile(blob,name+'.'+((blob.type.split('/')[1]||'bin').split(';')[0]));
      else{const want=f==='MP4'?'video/mp4':'video/webm';
        if(blob.type.startsWith(want))saveFile(blob,name+'.'+f.toLowerCase());
        else if(it.sel.t==='v'&&it.meta.tool==='make_video'&&pickMime(f.toLowerCase()).startsWith(want)){const r=await renderVideoPlan(it.meta.plan,c,{mime:f.toLowerCase(),onProgress:p=>msg('Preparing '+f+'… '+Math.round(p)+'%')});saveFile(r.blob,name+'.'+f.toLowerCase())}
        else{msg(f+' is not available for this video in this browser.');continue}}
      ok++;await sleep(500)}catch(e){msg('Could not prepare '+f+'. '+e.message)}}
  btn.disabled=false;if(ok){msg('Saved to your Downloads folder.');if(!S.voiceOff)Voice.say(ok>1?'Downloaded in '+ok+' formats.':'Downloaded.')}}

  if(d.kdel!==undefined){const m=d.kdel[0]==='m',i=+d.kdel.slice(1);ask('Delete '+(m?'Mistral key ':'Key ')+(i+1)+'?','This key will be removed from this device.','Delete',true,()=>{(m?S.mkeys:S.keys).splice(i,1);saveS();renderKeys()});return}
  if(d.bkrest){const nm=d.bkrest,p=Backup.parse(nm);ask('Restore this backup?','The containers from '+(p?fmtDate(p.t)+', '+fmtTime(p.t):'this backup')+' are added to Home marked Restored. Nothing on Home is replaced. The backup file is then deleted.','Restore',false,async()=>{toast('Restoring…');try{const r=await Backup.restore(nm);bkDone(r)}catch(er){toast('The backup could not be restored.')}renderBackup()});return}
  if(d.bkdel){const nm=d.bkdel,p=Backup.parse(nm);ask('Delete this backup?','The backup file of '+(p?fmtDate(p.t)+', '+fmtTime(p.t):'this time')+' is deleted from the backup location.','Delete',true,async()=>{const ok=await Backup.remove(nm);toast(ok?'Backup deleted.':'The backup file could not be deleted.');renderBackup()});return}

    case 'createmkey':window.open('https://console.mistral.ai/api-keys','_blank');break;case 'pastemkey':openPasteKey('m');break;

const Rec={active:false,opening:false,stream:null,rec:null,chunks:[],c:null,a:null,bgStart:0,t0:0,timer:null,raf:0,el:null,playInfo:null,
  async open(c,a){if(this.active||this.opening)return;this.opening=true;this.c=c;this.a=a||{};this.playInfo=null;Voice.stop();
    const el=document.createElement('div');el.className='recl';el.setAttribute('role','dialog');el.setAttribute('aria-label','Camera recording');
    const audio=!!this.a.audio_only;el.classList.toggle('audioonly',audio);
    el.innerHTML=`${audio?`<div class="recaudio" aria-hidden="true"><div class="micorb">${I('mic')}</div><p>Recording your voice</p></div>`:`<video class="recbg" id="recbg" playsinline></video><video class="recpv ${this.a.play?'pip':'full'} ${this.a.camera==='back'?'':'mirror'}" id="recpv" muted playsinline autoplay></video>`}
      ${this.a.script?`<div class="prompter" aria-hidden="true"><div class="ptext" id="ptext">${esc(this.a.script)}</div></div>`:''}
      <div class="rectop"><span class="recdot"></span><span id="rect">Getting ready</span></div><div class="countdown" id="rcd" aria-live="assertive"></div>
      <div class="recbar"><button class="ibtn" data-act="reccancel" aria-label="Cancel recording">${I('x')}</button><button class="recstop" data-act="recstop" aria-label="Stop recording"><span></span></button><span style="width:42px"></span></div>`;

const Tour={active:false,i:0,steps:[],
  build(){const home=[['[data-act=exit]','Exit','This is the Exit icon. It closes the app at once.'],['#helpBtn','Help','This opens Help, where every icon is explained. Tap it again to close Help.'],['#modeBtn','Light and dark','This switches between light and dark.'],['#menuBtn','Menu','This opens the Menu: API keys, voice, library, backup, help and about.'],['.fab','New container','This plus icon creates a new container for each project.'],['.grid .cell .tile','Container','Tap a container to open it.'],['.grid .cell .mini.edit','Rename','The pencil renames a container.'],['.grid .cell .mini.del','Delete','The bin deletes a container. You can bring it back until tomorrow.'],['#vpill','Voice','These dots show I am listening. Tap them to stop, and tap the microphone to start again.']];
    const cont=[['.ctop [data-act=back]','Back','This takes you back to the home screen.'],['.cname','Name','Here are the container name, the pencil to rename, and the bin to delete.'],['.reqbtn','Recorded requirement','This opens the summary of everything you asked for. Tap again to close it.'],['#galBtn','Gallery','This adds photos and videos from your phone.'],['#fileBtn','Files','This adds documents, such as price lists or scripts, and music files.'],['[data-act=yt]','YouTube link','This adds a YouTube link for me to watch and understand.'],['#preview','Preview','Your creation appears here, with share and download icons.'],['.msgbtn','Messages','This opens a box to type or paste. Tap again to close it.'],['#vpill','Voice','Tap the dots to stop listening.']];
    return (nav.v==='container'?cont:home).filter(([sel])=>document.querySelector(sel))},
  start(){if(nav.v!=='container'&&nav.v!=='home')goHome();setTimeout(()=>{this.steps=this.build();if(!this.steps.length)return;this.active=true;this.i=0;LS.set('spc.toured',1);document.body.classList.add('touring');this.show()},nav.v==='home'?0:1300)},
  show(){$$('.tourglow').forEach(e=>e.classList.remove('tourglow'));const [sel,title,text]=this.steps[this.i];const el=document.querySelector(sel);if(el){el.classList.add('tourglow');el.scrollIntoView&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}
    let card=$('#tourcard');if(!card){card=document.createElement('div');card.id='tourcard';card.className='tourcard2';card.setAttribute('role','dialog');card.setAttribute('aria-live','polite');document.body.appendChild(card)}
    const r=el?el.getBoundingClientRect():{top:0};card.classList.toggle('top',r.top>innerHeight*.55);
    card.innerHTML=`<span class="tstep">${this.i+1} of ${this.steps.length}</span><b>${esc(title)}</b><p>${esc(text)}</p><div class="tbtns"><button class="ibtn" data-act="tourstop" aria-label="Stop the tour">${I('x')}</button><button class="ibtn" data-act="tourprev" aria-label="Previous" ${this.i?'':'disabled'}>${I('back')}</button><button class="ibtn prime" data-act="tournext" aria-label="${this.i+1<this.steps.length?'Next':'Finish'}">${I(this.i+1<this.steps.length?'chev':'check')}</button></div>`;
    Voice.stop();Voice.say(text+(this.i===0?' Say next, repeat, or stop tour.':''),{force:true})},
  next(){if(this.i+1>=this.steps.length)return this.stop(true);this.i++;this.show()},
  prev(){if(this.i>0){this.i--;this.show()}},
  stop(done){this.active=false;$$('.tourglow').forEach(e=>e.classList.remove('tourglow'));const c=$('#tourcard');if(c){c.classList.add('out');setTimeout(()=>c.remove(),900)}document.body.classList.remove('touring');Voice.stop();
    if(done)Voice.say(nav.v==='home'?'That is the tour. Open a container and say show me around to see the icons inside.':'That is the tour. Tell me what you would like to create.',{force:true})},
  cmd(t){const s=norm(t);if(/\b(stop|end|close|finish|exit)( the)? tour\b|^stop$/.test(s))return this.stop(false);if(/\b(repeat|again|say that again|pardon)\b/.test(s))return this.show();if(/\b(back|previous|go back)\b/.test(s))return this.prev();if(/\b(next|continue|go on|okay|ok|yes|carry on)\b/.test(s))return this.next();Voice.say('Say next, repeat, or stop tour.',{force:true})}};
function offerTour(){if(LS.get('spc.toured')||Tour.active||S.manual)return;LS.set('spc.toured',1);const q='Would you like a short guided tour of the icons? Say yes, or tap the tour icon in Help any time.';
  if(G.active().length&&navigator.onLine!==false){Voice.say(q);addHistNote('[app] The app offered the user a guided tour of the icons. If they agree, call app_action start_tour.')}
  else reply(Local.ask(q,()=>{Tour.start();return null},()=>'Okay.'),'voice')}
