<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A0C">
<title>Spoken PixelCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* ---------- Colour design: "Midnight Iris". Fixed scheme; only light and dark change. ---------- */
:root,[data-mode="dark"]{
  --bg:#0A0A0C;--bg2:#0F0F13;--surface:#15151A;--surface2:#1C1C23;--surface3:#24242D;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--line3:rgba(255,255,255,.22);
  --text:#F4F4F6;--muted:#A0A0AC;--faint:#6C6C78;
  --accent:#7B83F7;--accent2:#A88EFA;--glow:rgba(123,131,247,.38);
  --sel:#6E76F2;--onsel:#FFFFFF;
  --danger:#FF6B6B;--ok:#4ADE80;--warn:#F5B84A;
  --scrim:rgba(5,5,8,.62);--glass:rgba(21,21,26,.72);
  --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --shadow-s:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-mode="light"]{
  --bg:#F3F3F6;--bg2:#FAFAFC;--surface:#FFFFFF;--surface2:#F1F1F5;--surface3:#E7E7EE;
  --line:rgba(16,16,24,.07);--line2:rgba(16,16,24,.13);--line3:rgba(16,16,24,.22);
  --text:#121216;--muted:#62626E;--faint:#9A9AA6;
  --accent:#565EE6;--accent2:#7D5CF0;--glow:rgba(86,94,230,.28);
  --sel:#D8DAFF;--onsel:#0B0B12;
  --danger:#D93D3D;--ok:#1E9E57;--warn:#B7791F;
  --scrim:rgba(240,240,246,.6);--glass:rgba(255,255,255,.78);
  --shadow:0 18px 40px rgba(20,20,40,.14),0 2px 6px rgba(20,20,40,.08);
  --shadow-s:0 6px 18px rgba(20,20,40,.1);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s ease,color .35s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
::selection{background:var(--glow)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;position:relative}

/* ---------- header ---------- */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px}
.brandwrap{display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line2)}
.name{font-size:1.38rem;font-weight:500;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.name .cal{font-family:"Great Vibes",cursive;font-weight:400;font-size:2.05rem;line-height:.6;margin-right:1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px}
.name .gap{display:inline-block;width:.32em}
.tagline{font-size:.74rem;color:var(--muted);letter-spacing:.06em;padding-left:36px}
.hbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s ease,background .2s,border-color .2s,box-shadow .2s}
.ibtn:hover{border-color:var(--line3)}
.ibtn:active{transform:scale(.94);background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.ibtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.mode svg{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.mode .sun{position:absolute;opacity:0;transform:rotate(-90deg) scale(.6)}
[data-mode="light"] .mode .sun{opacity:1;transform:none}
[data-mode="light"] .mode .moon{opacity:0;transform:rotate(90deg) scale(.6)}
.mode{position:relative}
.rule{flex:none;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 12%,var(--line2) 88%,transparent);margin:0 0 2px}

/* ---------- views ---------- */
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px));animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vtitle{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.vtitle h1{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.88rem;margin:0}

/* ---------- home grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
@media (max-width:379px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{display:flex;flex-direction:column;gap:7px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.tile:hover{border-color:var(--line3)}
.tile:active{transform:scale(.965);box-shadow:0 0 0 4px var(--glow)}
.tile .art{position:absolute;inset:0}
.tile.empty{background:linear-gradient(160deg,var(--surface),var(--surface2))}
.tile.empty::after{content:"";position:absolute;inset:26%;border-radius:12px;border:1.5px dashed var(--line2)}
.badge{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border:1px solid var(--line2)}
.badge svg.i{width:14px;height:14px}
.cap{display:flex;align-items:flex-start;gap:0}
.cap .t{flex:1;font-size:.72rem;font-weight:500;line-height:1.3;text-align:center;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-top:3px}
.cap .t .rs{color:var(--accent);font-weight:600;white-space:nowrap}
.mini{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.mini svg.i{width:14px;height:14px}
.cap .mini{color:var(--faint)}
.mini:active{background:var(--sel);color:var(--onsel)}
.emptyhome{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;color:var(--muted)}

/* floating new button */
.fab{position:fixed;right:max(20px,calc(50% - 620px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 30px var(--glow),0 0 0 1px rgba(255,255,255,.18) inset;z-index:20;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.fab svg.i{width:28px;height:28px;stroke-width:2}
.fab:active{transform:scale(.92)}

/* ---------- voice pill: four dots while listening, mic when stopped ---------- */
.vpill{display:flex;align-items:center;justify-content:center;gap:7px;height:52px;min-width:96px;padding:0 22px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow-s);color:var(--text);transition:transform .18s,box-shadow .25s}
.vpill:active{transform:scale(.95)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;animation:wave 1.25s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}.dot:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{opacity:.25;transform:translateY(0) scale(.85)}35%{opacity:1;transform:translateY(-5px) scale(1.12);box-shadow:0 0 12px var(--glow)}}
.vpill.listen{box-shadow:var(--shadow-s),0 0 0 4px var(--glow)}
.vpill .mic svg.i{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.8}}

/* ---------- container view ---------- */
.cview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;animation:fade .32s ease}
.ctop{flex:none;display:flex;align-items:center;gap:8px}
.cname{flex:1;display:flex;align-items:center;gap:4px;justify-content:center}
.cname .t{font-weight:600;font-size:1rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{flex:none;display:flex;justify-content:center;gap:12px}
.tbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s,background .2s,box-shadow .25s,border-color .2s}
.tbtn:active,.tbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.tbtn:active{transform:scale(.94)}
.tbtn.glow{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 9px var(--glow);border-color:var(--accent)}}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:6px;margin:-6px;transition:flex-basis .35s ease}
.cview.chatopen .preview{min-height:110px}
.preview{position:relative;flex:1 1 auto;min-height:180px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);display:grid;place-items:center}
.preview .art,.preview img,.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.preview .art{object-fit:cover}
.pempty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;color:var(--muted);max-width:300px}
.pempty .big{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--accent)}
.pempty .big svg.i{width:30px;height:30px}
.pempty p{margin:0;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-size:.8rem;font-weight:500;color:var(--text);transition:background .2s,color .2s}
.chip:active,.chip.on{background:var(--sel);color:var(--onsel);border-color:transparent}
.dl{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line3);color:var(--text);box-shadow:var(--shadow-s);transition:transform .15s,background .2s}
.dl:active{transform:scale(.93);background:var(--sel);color:var(--onsel)}
.kind{position:absolute;left:14px;top:14px;height:28px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.04em;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2)}
.kind svg.i{width:14px;height:14px}
/* progress ring */
.prog{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line2)}
.ring .fgc{stroke:url(#rg);transition:stroke-dashoffset .25s linear}
.ring .spin{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1.1s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* versions strip */
.strip{flex:none;display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ver{position:relative;flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);transition:transform .15s,box-shadow .2s}
.ver .art{position:absolute;inset:0}
.ver.cur{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--glow)}
.ver:active{transform:scale(.94)}
.vx{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.vx svg.i{width:10px;height:10px;stroke-width:2.4}
.vslot{flex:none;display:flex;justify-content:center;padding-top:2px}
/* chat panel */
.chat{flex:0 0 50%;min-height:0;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;margin:0 -18px calc(-14px - env(safe-area-inset-bottom,0px));padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 40px rgba(0,0,0,.25);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line3);margin:0 auto 8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .who{font-size:.68rem;font-weight:600;letter-spacing:.05em;color:var(--muted);padding:0 6px}
.msg .b{padding:10px 14px;border-radius:18px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.app .b{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.compose{flex:none;display:flex;align-items:flex-end;gap:8px;padding-top:6px}
.compose textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:12px 16px;border-radius:23px;border:1px solid var(--line2);background:var(--surface);outline:none;font-size:.95rem;line-height:1.4;transition:border-color .2s,box-shadow .2s}
.compose textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none;transition:transform .15s}
.send:active{transform:scale(.92)}
.cview.kb .stage{flex:0 0 6.6rem;overflow:auto}
.cview.kb .vslot{display:none}
.cview.kb .preview{min-height:6.2rem}
.cview.kb .chat{flex:1 1 auto}
@media (min-width:900px){
  .cview.chatopen{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:20px}
  .cview.chatopen .ctop,.cview.chatopen .tools{grid-column:1}
  .cview.chatopen .stage{grid-column:1;grid-row:3}
  .cview.chatopen .vslot{grid-column:1;grid-row:4}
  .cview.chatopen .chat{grid-column:2;grid-row:1/5;margin:0;border-radius:24px;border-bottom:1px solid var(--line2);padding-bottom:12px}
  .cview.kb .stage{flex:1 1 auto}
}

/* ---------- menu & lists ---------- */
.list{display:flex;flex-direction:column;gap:10px;max-width:640px}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);text-align:left;width:100%;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.row:active{background:var(--sel);color:var(--onsel);transform:scale(.99);box-shadow:0 0 0 4px var(--glow)}
.row:active .rsub{color:inherit;opacity:.8}
.row .ric{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent);flex:none}
.row:active .ric{background:transparent;color:inherit}
.row .rtx{flex:1;display:flex;flex-direction:column}
.row .rt{font-weight:600;font-size:.98rem}
.row .rsub{font-size:.8rem;color:var(--muted)}
.chev{color:var(--faint)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--surface3);position:relative;transition:background .25s;flex:none;border:1px solid var(--line2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.card h2{margin:0;font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--text);transition:background .2s,color .2s,transform .15s,box-shadow .2s;text-align:center}
.pbtn:active,.pbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.pbtn:active{transform:scale(.98)}
.pbtn.prime{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.field{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.key{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.key .kn{flex:1;font-weight:600;font-size:.95rem}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface3)}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stat.ok{color:var(--ok)}.stat.bad{color:var(--danger)}.stat.chk{color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.seg button{min-height:48px;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--onsel);box-shadow:0 0 0 3px var(--glow)}
.bk{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.bk .bt{flex:1;display:flex;flex-direction:column}
.bk .bt b{font-weight:600;font-size:.92rem}
.bk .bt span{font-size:.78rem;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);margin:0;line-height:1.5}
.folder{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem}
.folder svg.i{color:var(--accent)}
/* about accordion */
.acc{display:flex;flex-direction:column;gap:10px;max-width:720px}
.sec{border-radius:18px;background:var(--surface);border:1px solid var(--line2);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.sec.open{border-color:var(--line3);box-shadow:var(--shadow-s)}
.sech{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;text-align:left;font-weight:600;font-size:.96rem}
.sech .ric{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--surface2);color:var(--accent)}
.sech .ric svg.i{width:18px;height:18px}
.sech .tx{flex:1}
.sech .chev{transition:transform .3s}
.sec.open .sech .chev{transform:rotate(90deg);color:var(--accent)}
.secb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.sec.open .secb{grid-template-rows:1fr}
.secb>div{overflow:hidden}
.secb .in{padding:0 18px 16px 62px;color:var(--muted);font-size:.9rem;line-height:1.6}
.secb .in p{margin:0 0 8px}
.secb .in ul{margin:0;padding-left:18px}
.secb .in li{margin:4px 0}
.secb .in q{color:var(--text);font-style:italic}

/* ---------- sheets, dialogs, toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@media (min-width:700px){.sheet{border-radius:28px;padding-bottom:22px}}
.shead{display:flex;align-items:center;gap:10px}
.shead h3{flex:1;margin:0;font-size:1.08rem;font-weight:600;text-align:center}
.lbl{font-size:.74rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.fmts{display:flex;flex-wrap:wrap;gap:8px}
.fmts .chip{height:42px;padding:0 18px;font-size:.88rem}
.req{display:flex;flex-direction:column;gap:12px}
.req .g{padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line2)}
.req .g h4{margin:0 0 8px;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.req .g p{margin:0 0 6px;font-size:.92rem;line-height:1.55;color:var(--text)}
.req .g .st{display:inline-flex;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,460px);padding:12px 18px;border-radius:16px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line2);box-shadow:var(--shadow);font-size:.88rem;font-weight:500;text-align:center;animation:toast .3s cubic-bezier(.2,.8,.2,1)}
@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* start overlay */
.start{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);cursor:pointer;animation:fadein .4s ease}
.start .box{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
.start .orb{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--glass);border:1px solid var(--line2);box-shadow:0 0 0 10px var(--glow),var(--shadow)}
.start h2{margin:0;font-size:1.2rem;font-weight:600}
.start p{margin:0;color:var(--muted);font-size:.9rem}
/* ---------- full app additions ---------- */
.vpill{position:relative}
.vdock{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.vdock>*{pointer-events:auto}
.vdock.float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:19;max-width:min(70vw,520px)}
.livecap{margin:0;min-height:1.1em;max-width:100%;font-size:.78rem;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;pointer-events:none}
.vpill.float{position:static;transform:none}
.vpill.think .dot{animation:think 1.4s ease-in-out infinite}
.vpill.think .dot:nth-child(2){animation-delay:.2s}.vpill.think .dot:nth-child(3){animation-delay:.4s}.vpill.think .dot:nth-child(4){animation-delay:.6s}
@keyframes think{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.9;transform:scale(1)}}
.vpill.speak .dot{background:var(--accent2);animation-duration:.75s}
.vpill.listen{box-shadow:var(--shadow-s),0 0 0 4px var(--glow)}
.vpill.off{min-width:64px;padding:0 18px}
.preview .pm{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.preview audio{width:min(320px,80vw)}
.ver .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ver.aud{display:grid;place-items:center;background:var(--surface2)}
.vsel{position:absolute;inset:0;z-index:1}
.vb{position:absolute;left:3px;bottom:3px;z-index:2;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}
.vb svg.i{width:11px;height:11px;stroke-width:2.2}
.vx{z-index:2}
.qn{position:absolute;bottom:18%;left:0;right:0;text-align:center;font-size:.8rem;color:var(--muted);margin:0}
.prog{flex-direction:column}
.pbtn.danger{background:var(--danger);color:#fff;border-color:transparent}
.pbtn:disabled{opacity:.5}
.note.center{text-align:center;font-size:.95rem}
.mini.big{width:42px;height:42px;border-radius:12px}
.mini.big svg.i{width:18px;height:18px}
#keybox:not([hidden]){display:flex;flex-direction:column;gap:10px}
.emptyhome .big{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line2);color:var(--accent)}
.emptyhome .big svg.i{width:32px;height:32px}
.emptyhome h2{margin:6px 0 0;font-size:1.15rem;color:var(--text)}
.emptyhome p{margin:0;max-width:300px}
.tile img.art{width:100%;height:100%;object-fit:cover}
label.pbtn{cursor:pointer}
.glow{animation:pulse 1.2s ease-in-out 3!important}
.preview.isvideo .dl{bottom:64px}
@media (max-width:899px){.cview.chatopen .vpill{height:38px;min-width:76px;padding:0 16px}.cview.chatopen .livecap{display:none}.cview.chatopen .dot{width:7px;height:7px}}
@media (min-width:900px){.cview.kb .vslot{display:flex}}
</style>
</head>

<script type="module">
'use strict';
/* ============================================================
   Spoken PixelCraft — core: utilities, storage, settings, Gemini
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=(v,d=0)=>(v!==null&&v!==''&&Number.isFinite(+v))?+v:d;
const mkErr=(m,status)=>{const e=new Error(m);e.status=status;return e};
const todayStr=()=>new Date().toDateString();
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const fmtTime=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const once=(el,ev,ms=15000)=>new Promise((res,rej)=>{let t;const f=e=>{clearTimeout(t);el.removeEventListener(ev,f);res(e)};el.addEventListener(ev,f);if(ms)t=setTimeout(()=>{el.removeEventListener(ev,f);res(null)},ms)});
const canvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
const b64ToBlob=(d,type)=>{const bin=atob(d);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
const toBlob=(cv,type='image/png',q=.92)=>new Promise(r=>cv.toBlob(b=>r(b),type,q));
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const plainSize=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

/* ---------- IndexedDB ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('spoken-pixelcraft',1);
    r.onupgradeneeded=()=>{const d=r.result;for(const s of['containers','media','assets','backups'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{let out;const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(s,k){return k==null?Promise.resolve(undefined):this.tx(s,'readonly',o=>o.get(k))},
  put(s,v,k){return this.tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k))},
  del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))},
  all(s){return this.tx(s,'readonly',o=>o.getAll())}
};

/* ---------- settings (browser storage) ---------- */
const SKEY='spc.settings';
const S=Object.assign({mode:'dark',voice:'female',voiceOff:false,keys:[],lang:'en-IN'},(()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}})());
function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
const LS={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- containers in memory ---------- */
let CS=[];
const dirty=new Set();
const byId=id=>CS.find(c=>c.id===id);
const liveCS=()=>CS.filter(c=>!c.deleted).sort((a,b)=>b.updated-a.updated);
function newContainer(name){return {id:'c'+uid(),name,created:Date.now(),updated:Date.now(),deleted:0,restored:false,originId:null,lang:null,thumb:null,kind:null,versions:[],media:[],links:[],chat:[],ai:[],req:[],reqStatus:'Not generated.',sel:null}}
async function saveC(c,changed=true){if(changed){c.updated=Date.now();dirty.add(c.id)}const copy={...c};delete copy._tmp;await DB.put('containers',copy)}

/* ---------- media blobs ---------- */
const urlCache=new Map();
async function mediaURL(id){if(urlCache.has(id))return urlCache.get(id);const m=await DB.get('media',id);if(!m)return null;const u=URL.createObjectURL(m.blob);urlCache.set(id,u);return u}
async function addMedia(cid,blob,meta={}){const id='m'+uid();await DB.put('media',{id,cid,blob,type:blob.type||meta.type||'',size:blob.size,created:Date.now(),...meta});return id}

/* ---------- Google Gemini: several keys, round robin, fallback on failure ---------- */
const G={base:'https://generativelanguage.googleapis.com/',rr:0,models:null,listed:false,cool:{},files:new Map(),
  active(){return S.keys.filter(k=>k.st!=='inactive')},
  pick(skip){const now=Date.now();const ks=this.active().filter(k=>!skip.has(k.key)&&!((this.cool[k.key]||0)>now));if(!ks.length)return null;return ks[(this.rr++)%ks.length]},
  async ensureModels(key){if(this.models)return;const ver=n=>{const m=/gemini-(\d+(?:\.\d+)?)/.exec(n);return m?parseFloat(m[1]):0};
    try{const r=await fetch(this.base+'v1beta/models?pageSize=300',{headers:{'x-goog-api-key':key}});const j=await r.json();
      const names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
      const text=names.filter(n=>/^gemini-\d+(\.\d+)?-flash$/.test(n)).sort((a,b)=>ver(b)-ver(a));
      const lite=names.filter(n=>/^gemini-\d+(\.\d+)?-flash-lite$/.test(n)).sort((a,b)=>ver(b)-ver(a));
      const img=names.filter(n=>/^gemini-[\d.]+-flash-image(-preview)?$/.test(n)).sort((a,b)=>ver(b)-ver(a));
      this.models={text:text[0]||lite[0]||'gemini-2.5-flash',image:img[0]||'gemini-2.5-flash-image'}}
    catch(e){this.models={text:'gemini-2.5-flash',image:'gemini-2.5-flash-image'}}},
  /* body may be an object, or a function (key) => body, so media can be uploaded to whichever key runs the request */
  async gen(kind,body,opt={}){const tried=new Set();let last=null;
    for(let n=0;n<12;n++){const k=opt.key||this.pick(tried);if(!k)break;
      try{await this.ensureModels(k.key);const b=typeof body==='function'?await body(k):body;
        const r=await fetch(this.base+'v1beta/models/'+(opt.model||this.models[kind])+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k.key},body:JSON.stringify(b),signal:opt.signal});
        if(r.ok){const json=await r.json();if(k.st!=='active'){k.st='active';saveS()}return {json,key:k}}
        let msg='';try{msg=((await r.json()).error||{}).message||''}catch(e){}
        last=mkErr(msg||('HTTP '+r.status),r.status);
        if(r.status===429)this.cool[k.key]=Date.now()+60000;
        else if(r.status===403||(r.status===400&&/api key/i.test(msg))){k.st='inactive';saveS()}
        else if(r.status===404&&!this.listed){this.listed=true;this.models=null;n--;continue}
        else if(r.status===400)throw last;
      }catch(e){if(e.name==='AbortError'||e.status===400)throw e;last=last||e}
      if(opt.key)break;tried.add(k.key)}
    if(!last)throw mkErr('No working API key. Add a free Google key in Menu, API keys.','nokey');
    if(last.status===429)last.quota=true;throw last},
  text(json){return ((json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim()},
  mime(t){t=String(t||'').split(';')[0];if(t==='audio/webm')return 'video/webm';if(t==='audio/mp4'||t==='audio/x-m4a')return 'audio/mp4';return t||'application/octet-stream'},
  /* a part for one media item: inline for small images and audio, otherwise uploaded to the key (cached per key) */
  async part(blob,key,name,cacheId){const mime=this.mime(blob.type);
    if(blob.size<7*1048576&&(mime.startsWith('image/')||mime.startsWith('audio/')))return {inline_data:{mime_type:mime,data:await b64(blob)}};
    const ck=key.key+'|'+(cacheId||name);if(this.files.has(ck))return {file_data:{mime_type:mime,file_uri:this.files.get(ck)}};
    const s=await fetch(this.base+'upload/v1beta/files',{method:'POST',headers:{'x-goog-api-key':key.key,'Content-Type':'application/json','X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(blob.size),'X-Goog-Upload-Header-Content-Type':mime},body:JSON.stringify({file:{display_name:String(name||'media').slice(0,90)}})});
    if(!s.ok)throw mkErr('Upload failed ('+s.status+')',s.status);const url=s.headers.get('x-goog-upload-url');if(!url)throw mkErr('Upload failed');
    const u=await fetch(url,{method:'POST',headers:{'X-Goog-Upload-Offset':'0','X-Goog-Upload-Command':'upload, finalize'},body:blob});if(!u.ok)throw mkErr('Upload failed ('+u.status+')',u.status);

    for(let i=0;f.state==='PROCESSING'&&i<300;i++){await sleep(2000);const g=await fetch(this.base+'v1beta/'+f.name,{headers:{'x-goog-api-key':key.key}});if(!g.ok)break;f=await g.json()}
    if(!f.uri||f.state==='FAILED')throw mkErr('The file could not be processed');
    this.files.set(ck,f.uri);return {file_data:{mime_type:mime,file_uri:f.uri}}}
};

/* ---------- asset library: open web images saved for reuse, 500 MB limit, least used removed first ---------- */
const Lib={LIMIT:500*1048576,
  async get(id){const a=await DB.get('assets',id);if(a){a.lastUsed=Date.now();a.uses=(a.uses||0)+1;DB.put('assets',a).catch(()=>{})}return a},
  async put(a){a.lastUsed=Date.now();a.size=a.blob.size;await DB.put('assets',a);this.prune().catch(()=>{})},
  async prune(){const all=await DB.all('assets');let tot=all.reduce((s,a)=>s+(a.size||0),0);if(tot<=this.LIMIT)return;
    all.sort((a,b)=>(a.lastUsed||0)-(b.lastUsed||0));for(const a of all){if(tot<=this.LIMIT)break;await DB.del('assets',a.id);tot-=a.size||0}},
  async total(){const all=await DB.all('assets');return {count:all.length,size:all.reduce((s,a)=>s+(a.size||0),0)}},
  async searchImages(q,n=6){q=String(q||'').trim();if(!q)return [];const lq=q.toLowerCase();
    const all=await DB.all('assets');const out=all.filter(a=>a.kind==='image'&&(a.query||'').toLowerCase()===lq).slice(0,n);
    if(out.length>=Math.min(n,3))return out.map(this.info);
    try{const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit='+(n+4)+'&gsrsearch='+encodeURIComponent('filetype:bitmap '+q)+'&prop=imageinfo&iiprop=url|size|mime|extmetadata&iiurlwidth=1600';
      const j=await (await fetch(u)).json();const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>(a.index||0)-(b.index||0));
      for(const p of pages){if(out.length>=n)break;const ii=(p.imageinfo||[])[0];if(!ii||!/jpe?g|png|webp/i.test(ii.mime||''))continue;const id='wm'+p.pageid;if(out.some(o=>o.id===id))continue;
        try{const blob=await (await fetch(ii.thumburl||ii.url)).blob();const md=ii.extmetadata||{};const strip=s=>String(s||'').replace(/<[^>]+>/g,'').trim();
          const a={id,kind:'image',source:'Wikimedia Commons',query:q,title:strip(p.title).replace(/^File:/,'').replace(/\.\w+$/,''),licence:strip(md.LicenseShortName&&md.LicenseShortName.value),author:strip(md.Artist&&md.Artist.value).slice(0,80),blob,w:ii.thumbwidth||ii.width,h:ii.thumbheight||ii.height};
          await this.put(a);out.push(a)}catch(e){}}}catch(e){}
    if(out.length<2){try{const j=await (await fetch('https://api.openverse.org/v1/images/?page_size='+n+'&q='+encodeURIComponent(q))).json();
      for(const r of (j.results||[])){if(out.length>=n)break;const id='ov'+r.id;try{const blob=await (await fetch(r.thumbnail||('https://api.openverse.org/v1/images/'+r.id+'/thumb/'))).blob();if(!blob.type.startsWith('image/'))continue;
        const a={id,kind:'image',source:'Openverse',query:q,title:r.title||q,licence:(r.license||'').toUpperCase()+' '+(r.license_version||''),author:r.creator||'',blob,w:r.width,h:r.height};await this.put(a);out.push(a)}catch(e){}}}catch(e){}}
    return out.map(this.info)},
  info(a){return {asset_id:a.id,title:a.title,licence:a.licence,author:a.author,source:a.source}}
};

const musicCache=new Map();
async function musicBuffer(style,secs){style=MUSIC[style]?style:'calm';secs=Math.ceil(clamp(secs,3,900));const key=style+':'+secs;if(musicCache.has(key))return musicCache.get(key);
  const P=MUSIC[style],sr=44100,ctx=new OfflineAudioContext(2,Math.ceil((secs+1.5)*sr),sr);const mtof=n=>440*Math.pow(2,(n-69)/12);
  const master=ctx.createGain();master.gain.value=.55;const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);

  const tone=(type,f,t,d,v,a=.02,r=.3,cut=0)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;let node=o;if(cut){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);node=fl}node.connect(g);g.connect(master);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.setValueAtTime(v,Math.max(t+a,t+d-r));g.gain.linearRampToValueAtTime(0,t+d);o.start(t);o.stop(t+d+.05)};
  const noise=(t,d,v,hp)=>{const b=ctx.createBuffer(1,Math.ceil(sr*d),sr),ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1;const s=ctx.createBufferSource();s.buffer=b;const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ctx.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t)};
  const kick=(t,v=.9)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(42,t+.18);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4)};

  while(t<secs){const ch=P.prog[i%P.prog.length];
    ch.forEach(n=>tone(P.pad,mtof(n),t,bar+.1,.05,.6,.6,P.pad==='sawtooth'?900:0));

    P.arp.forEach((ix,k)=>{if(ix<0)return;const st=t+k*bar/P.arp.length;tone(P.pluck,mtof(ch[ix%ch.length]+12*(ix>=ch.length?1:0)+12),st,bar/P.arp.length*1.6,P.pluck==='square'?.035:.07,.005,bar/P.arp.length,P.pluck==='square'?2400:0)});
    if(P.drums)for(let b=0;b<4;b++){const bt=t+b*beat;
      if(P.drums==='boom'){if(b===0)kick(bt,1)}
      else{if(b===0||b===2||(P.drums==='pop'&&b===3))kick(bt,P.drums==='soft'?.55:.85);noise(bt+beat/2,.05,P.drums==='soft'?.05:.09,7000);if((b===1||b===3)&&P.drums!=='soft')noise(bt,.18,P.drums==='clap'?.35:.22,1500)}}
    t+=bar;i++}

  const buf=await ctx.startRendering();musicCache.set(key,buf);return buf}

const FONTS={sans:'Inter',modern:'Poppins',bold:'Montserrat',serif:'Playfair Display',display:'Bebas Neue',fun:'Lobster',script:'Great Vibes',hand:'Pacifico',condensed:'Oswald',malayalam:'Noto Sans Malayalam',hindi:'Noto Sans Devanagari',tamil:'Noto Sans Tamil'};

  l.href='https://fonts.googleapis.com/css2?'+[...new Set(Object.values(FONTS))].filter(f=>f!=='Inter'&&f!=='Great Vibes').map(f=>'family='+f.replace(/ /g,'+')+(ONE_WEIGHT.has(f)?'':':wght@400;700')).join('&')+'&display=swap';

function curVersionIndex(c){if(!c||!c.versions.length)return -1;const i=c.sel&&c.sel.t==='v'?c.versions.findIndex(v=>v.id===c.sel.id):-1;return i<0?c.versions.length-1:i}

async function resolveSource(src,c){src=src||{type:'color',color:'#101014'};const t=src.type||'color';
  if(t==='color')return {fill:(x,W,H)=>{x.fillStyle=src.color||'#101014';x.fillRect(0,0,W,H)}};
  if(t==='gradient')return {fill:(x,W,H)=>{const cs=(src.colors&&src.colors.length?src.colors:['#2A2E6E','#FF8A7A']);const a=(num(src.angle,180)-90)*Math.PI/180,r=Math.hypot(W,H)/2,cx=W/2,cy=H/2;
    const g=src.radial?x.createRadialGradient(cx,cy,0,cx,cy,r):x.createLinearGradient(cx-Math.cos(a)*r,cy-Math.sin(a)*r,cx+Math.cos(a)*r,cy+Math.sin(a)*r);cs.forEach((col,i)=>g.addColorStop(cs.length>1?i/(cs.length-1):0,col));x.fillStyle=g;x.fillRect(0,0,W,H)}};
  let blob=null,credit=null;
  if(t==='upload'||t==='version'){const id=t==='version'?versionId(c,src.version):src.media_id;const m=await DB.get('media',id);if(!m)throw mkErr('That '+(t==='version'?'version':'file')+' was not found.');blob=m.blob}
  else if(t==='asset'){const a=await Lib.get(src.asset_id);if(!a)throw mkErr('That library image was not found.');blob=a.blob;credit=a}
  else if(t==='web'){const r=await Lib.searchImages(src.query,3);if(!r.length)throw mkErr('No free image was found online for "'+src.query+'".');const a=await Lib.get(r[clamp(num(src.pick,1),1,r.length)-1].asset_id);blob=a.blob;credit=a}

function filterStr(a){if(!a)return 'none';const f=[],p=k=>num(a[k],0);
  if(p('brightness'))f.push(`brightness(${Math.max(0,1+p('brightness')/100)})`);if(p('contrast'))f.push(`contrast(${Math.max(0,1+p('contrast')/100)})`);
  if(p('saturation'))f.push(`saturate(${Math.max(0,1+p('saturation')/100)})`);if(p('hue'))f.push(`hue-rotate(${p('hue')}deg)`);
  if(p('blur'))f.push(`blur(${clamp(p('blur'),0,40)}px)`);if(p('grayscale'))f.push(`grayscale(${clamp(p('grayscale'),0,100)/100})`);if(p('sepia'))f.push(`sepia(${clamp(p('sepia'),0,100)/100})`);

function postFX(x,a,W,H){if(!a)return;const w=num(a.warmth,0);if(w){x.save();x.globalCompositeOperation='soft-light';x.fillStyle=w>0?`rgba(255,140,40,${clamp(w,0,100)/160})`:`rgba(40,120,255,${clamp(-w,0,100)/160})`;x.fillRect(0,0,W,H);x.restore()}

function drawImg(x,res,X,Y,W,H,fit='cover',crop=null,zoom=1,px=0,py=0){

/* ---------- speaking: natural voice engine downloaded in the background, device voice as fallback ---------- */

  const want=S.voice==='male'?male:female;const exact=pool.find(v=>String(v.lang).toLowerCase()===String(lang).toLowerCase()&&want.test(v.name));
  return exact||pool.find(v=>want.test(v.name)&&/natural|neural|google|online/i.test(v.name))||pool.find(v=>want.test(v.name))||pool.find(v=>String(v.lang).toLowerCase()===String(lang).toLowerCase())||pool[0]||null}

  status(){return this.kok?'natural':this.loading?'downloading':'device'},
  preload(){if(this.loading)return this.loading;this.loading=(async()=>{try{const m=await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm');
      this.kok=await m.KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX',{dtype:'q8',device:'wasm'});LS.set('spc.voiceReady',1)}catch(e){this.kok=null;this.failed=true}
    finally{if(typeof onVoiceStatus==='function')onVoiceStatus()}})();return this.loading},
  clean(t){return String(t||'').replace(/\[(.*?)\]\((.*?)\)/g,'$1').replace(/[*_#`>~|]/g,'').replace(/\s+/g,' ').trim()},
  say(text,opt={}){if(S.voiceOff)return Promise.resolve();text=this.clean(text);if(!text)return Promise.resolve();this.queue.push({text,lang:opt.lang||curLang()});

    this.done=(async()=>{while(this.queue.length&&g===this.gen){const it=this.queue.shift();await this.one(it,g)}if(g===this.gen){this.speaking=false;BargeIn.disarm();setPill();if(Session.active)Ear.resume()}})();return this.done},

  async one({text,lang},g){const parts=(text.match(/[^.!?।]+[.!?।]*\s*/g)||[text]).map(s=>s.trim()).filter(Boolean);
    if(this.kok&&/^en/i.test(lang)&&this.slow<2){try{let next=this.synth(parts[0]);for(let i=0;i<parts.length;i++){const t0=performance.now();const a=await next;if(g!==this.gen)return;if(i===0&&performance.now()-t0>4500)this.slow++;if(i+1<parts.length)next=this.synth(parts[i+1]);await this.play(a,g);if(g!==this.gen)return}return}catch(e){this.slow++}}

/* ---------- session: continuous conversation with the silence ladder (2 min, 1 min, 30 s, 15 s) ---------- */
const Session={active:false,last:Date.now(),stage:0,timer:null,isDenied:false,
  start(){if(S.voiceOff)return;this.active=true;this.isDenied=false;this.touch();Ear.start();wakeOn();clearInterval(this.timer);this.timer=setInterval(()=>this.tick(),1000);setPill()},

  touch(){this.last=Date.now();this.stage=0},
  denied(){this.isDenied=true;this.stop();toast('Microphone access was blocked. Allow the microphone for this site, then tap the microphone.')},
  tick(){if(!this.active)return;if(Gen.running||Brain.busy){this.last=Date.now();this.stage=0;return}if(Voice.speaking)return;
    const idle=(Date.now()-this.last)/1000,marks=[120,180,210,225];if(idle<marks[this.stage])return;

    else{this.stage=0;const t=this.last;Voice.say('It seems you are not available, hence closing now. Tap the microphone when you want to talk again.').then(()=>{if(this.last===t)this.stop()})}}

const ABOUT_FACTS=`Spoken PixelCraft is a voice-first app for creating and editing images and videos. Containers hold each project; the plus button or voice creates one; tiles sort by last edit; pencil renames, bin deletes. Deleted containers can be brought back by voice until the next day's first use. Inside a container: upload button (photos, videos, audio), YouTube link button (for understanding only, cannot be downloaded), Recorded User Requirement button (summary with play aloud), messages button (typed chat), large preview, download button on the preview, strip of saved versions and uploads below the preview. Before a new version replaces the current one, the app asks whether to keep the previous. Downloads: PNG, JPEG, WebP, GIF for images; MP4, WebM, MP3, GIF for videos; saved to the Downloads folder; the folder button opens a file picker. Menu: API keys (create a free Google key in Google AI Studio, save several keys from different projects; they work together and share the work), Voice (female or male), Disable voice mode (typing only), Backup (choose a folder once; a folder named Spoken_PixelCraft_backup is created; a backup is saved when leaving a container after changes; restore adds containers marked Restored, restoring again replaces them), About. Light and dark switch top right. Voice: always listening while the app is open; the user can interrupt; after 2 minutes of silence the app asks if the user is there, then after 1 minute, then 30 seconds, then closes after 15 more seconds; tap the microphone to start again. During a generation, keep the app on screen; questions and cancel work; new requests are queued. Daily cleanup runs silently on the first use of each day. The asset library keeps fetched images up to 500 MB. Everything stays in this browser and the backup folder; backups include the keys.`;
function brainState(){const c=nav.v==='container'?byId(nav.id):null;const st={screen:nav.v,containers:liveCS().slice(0,40).map(x=>({name:(x.restored?'(Restored) ':'')+x.name,versions:x.versions.length,uploads:x.media.length})),recently_deleted:CS.filter(x=>x.deleted).map(x=>x.name),keys_saved:G.active().length,language:curLang(),voice_mode:S.voiceOff?'off (typing only)':'on',generation:Gen.running?{container:(byId(Gen.running.cid)||{}).name,summary:Gen.running.summary,percent:Gen.running.p,queued:Gen.queue.length}:null,interrupted_last_time:LS.get('spc.pending')};
  if(c)st.open_container={name:c.name,uploads:c.media.map(m=>({media_id:m.id,type:m.type,name:m.name,width:m.w,height:m.h,seconds:m.duration?Math.round(m.duration):undefined,description:m.desc?m.desc.slice(0,600):undefined})),youtube_links:c.links,
    versions:c.versions.map((v,i)=>({version:i+1,kind:v.kind,summary:v.summary,width:v.w,height:v.h,seconds:v.duration?Math.round(v.duration):undefined,kept:!!v.kept})),showing:c.sel?(c.sel.t==='v'?'version '+(c.versions.findIndex(v=>v.id===c.sel.id)+1):'upload '+c.sel.id):null,requirement:c.req,status:c.reqStatus};
  return st}
function systemPrompt(){return `You are Spoken PixelCraft, a warm, expert creative partner inside a voice-first image and video app. Users may be seniors, partially blind, or new to editing. You talk with them in plain words, like a friendly professional.

How to talk:
1. Keep each reply short: one to three spoken sentences. Plain text only, no lists, no symbols, no markdown.
2. Ask one clear question at a time until the request is completely clear. Ask about format and size (portrait 9:16 for Reels and stories, landscape 16:9 for YouTube, square 1:1 for posts), mood, colours, text and its language, music, length. Briefly explain the advantage or trade-off of each choice when it helps.
3. When everything is clear, describe in one or two sentences exactly what you will create and ask: "Shall I create it? Say generate now." Only call make_image, make_video or ai_image after the user agrees, or says generate now.
4. If a previous version exists, before generating ask whether to keep the previous version or replace it, and pass keep_previous.
5. Reply in the user's language. If the user speaks another language, call set_language with its code.
6. Whenever the user gives or changes requirement details, also call update_requirement with the complete, third-person summary of everything recorded so far, without losing a single point.
7. Prefer the built-in tools. Use web images, the AI image model, or looking at media only when needed. Use look_at_media before editing an uploaded video or photo whose content you do not know yet.
8. Browsers need a tap to open the file picker, download, or choose a backup folder. When the user asks for these, call highlight or prepare_download and tell them to tap the glowing button.
9. Confirm before deleting anything. Never invent file ids; use the ids in the state below.
10. If there is no open container and the user wants to create something, first call container_action create with a short fitting name.
11. While a generation runs, answer questions, cancel if asked, and new generation requests are queued automatically.
12. Messages that start with [typed] came from the messages panel.
13. Do not ask about details the user already gave. Keep a calm, confident, encouraging tone.

What the app can do with its built-in tools: images with gradients, colours, uploaded photos, web images, crop, rotate, flip, brightness, contrast, saturation, warmth, hue, blur, black and white, sepia, vignette, text with word art (shadow, outline, glow, neon, gradient, 3d, banner) in fonts (sans, modern, bold, serif, display, fun, script, hand, condensed; Malayalam, Hindi and Tamil text supported), shapes (rectangle, circle, star, heart, badge, ribbon, arrow, line), emoji stickers, picture layers. Videos from clips, photos and colours: trim, cut, join, speed, slideshows with motion, fade, slide and zoom transitions, colour effects, animated text and stickers, original sound, uploaded audio, or built-in music (${Object.keys(MUSIC).join(', ')}). Export images as PNG, JPEG, WebP, GIF; videos as MP4 or WebM where the browser supports it, MP3 for sound only, GIF for short clips.

About the app (answer questions from this): ${ABOUT_FACTS}

Today is ${new Date().toDateString()}. Current app state (JSON): ${JSON.stringify(brainState())}`}

/* ---------- generation manager: one job at a time, the rest wait in a queue ---------- */
const Gen={running:null,queue:[],
  submit(job){job.done=new Promise(r=>job._resolve=r);if(this.running){this.queue.push(job);renderPreviewOnly();return {status:'queued',position:this.queue.length,note:'A generation is already running. Tell the user it is queued.'}}this.start(job);return {status:'started',note:'Running in the background. The app announces when it is ready.'}},
  async start(job){this.running=job;job.p=0;job.ctrl=new AbortController();LS.set('spc.pending',{cid:job.cid,name:(byId(job.cid)||{}).name,summary:job.summary,t:Date.now(),tool:job.tool,args:job.args});wakeOn();renderPreviewOnly();
    let result={status:'failed'};
    try{const out=await job.exec(job.ctrl.signal,p=>{job.p=Math.round(p);updateRing()});const c=byId(job.cid);if(!c)throw mkErr('The container was deleted.');await addVersion(c,job,out);result={status:'done',version:c.versions.length};
      if(!job.quiet)announce(c,`Your ${out.kind==='video'?'video':'image'} is ready${nav.id===c.id?'':' in '+c.name}. Would you like any changes, or shall I prepare the download?`)}
    catch(e){if(e.status==='cancel'||(job.ctrl.signal.aborted)){result={status:'cancelled'};announce(byId(job.cid),'The generation was cancelled.')}else{result={status:'failed',error:e.message};if(!job.quiet)announce(byId(job.cid),'Sorry, that could not be created. '+e.message)}}
    finally{LS.del('spc.pending');this.running=null;Session.touch();renderPreviewOnly();job._resolve(result);const c=byId(job.cid);if(c&&dirty.has(c.id)&&!(nav.v==='container'&&nav.id===c.id))Backup.leave(c);const n=this.queue.shift();if(n)this.start(n);else wakeOffIfIdle()}},
  cancel(){this.queue.forEach(j=>j._resolve({status:'cancelled'}));this.queue=[];if(this.running)this.running.ctrl.abort()}
};
function announce(c,text){if(!S.voiceOff)Voice.say(text);if(c&&(S.voiceOff||(nav.v==='container'&&nav.id===c.id&&nav.chat))){c.chat.push({me:false,t:text,ts:Date.now()});saveC(c,false);renderChatOnly()}else if(S.voiceOff)toast(text)}
async function addVersion(c,job,out){const id=await addMedia(c.id,out.blob,{name:job.summary,w:out.w,h:out.h,duration:out.duration});
  const prevIdx=curVersionIndex(c);if(!job.args.keep_previous&&prevIdx>=0){const p=c.versions[prevIdx];if(p&&!p.kept){c.versions.splice(prevIdx,1);delMedia(p.id)}else if(p)p.kept=true}else if(prevIdx>=0)c.versions[prevIdx].kept=true;
  c.versions.push({id,kind:out.kind,mime:out.blob.type,created:Date.now(),summary:job.summary,tool:job.tool,plan:job.args,w:out.w,h:out.h,duration:out.duration});c.sel={t:'v',id};c.kind=out.kind;
  c.thumb=await makeThumb(out.blob)||c.thumb;c.reqStatus=`Generated version ${c.versions.length}: ${job.summary}. Ready to download or edit further.`;await saveC(c);renderAfterChange(c)}
const execFor={
  make_image:(c,a)=>async(sig,prog)=>{prog(15);const {cv}=await renderImagePlan(a,c);prog(80);const blob=await toBlob(cv,'image/png');prog(100);return {blob,kind:'image',w:cv.width,h:cv.height}},
  ai_image:(c,a)=>async(sig,prog)=>{let t=0;const iv=setInterval(()=>prog(Math.min(92,t+=3)),600);try{let input=null;if(a.edit_current){const id=c.sel&&c.sel.t==='m'?c.sel.id:versionId(c);const m=id&&await DB.get('media',id);if(m&&m.type.startsWith('image/'))input=m.blob}
      const blob=await aiImageBlob(a.prompt,a.aspect_ratio,input,sig);const b=await createImageBitmap(blob);return {blob,kind:'image',w:b.width,h:b.height}}finally{clearInterval(iv)}},
  make_video:(c,a)=>async(sig,prog)=>{const r=await renderVideoPlan(a,c,{signal:sig,onProgress:prog,mime:a._mime});return {...r,kind:'video'}}
};
function genTool(name,c,a){if(!c)return {error:'No container is open. Create or open one first.'};const job={cid:c.id,tool:name,args:a,summary:String(a.summary||(name==='make_video'?'Video':'Image')).slice(0,140),exec:execFor[name](c,a)};const r=Gen.submit(job);
  if(name==='ai_image'&&r.status==='started')return job.done.then(x=>x.status==='done'?{status:'done',version:x.version}:{status:x.status,error:x.error,note:'If the AI image model is not available, build the image with make_image instead.'});return r}

/* ---------- tools ---------- */
async function lookAtMedia(c,ids,question){const keys=G.active();if(!keys.length)return {error:'No API key'};
  const q=question||'Describe this in detail for a video and image editor: what is shown, people, objects, text on screen, colours, light, mood, and for video the scenes with start and end seconds and what is heard.';
  const items=await Promise.all((ids||[]).map(async(id,i)=>{const m=await DB.get('media',id);const meta=(c&&(c.media.find(x=>x.id===id)||c.versions.find(x=>x.id===id)))||{};if(!m)return {media_id:id,error:'not found'};
    try{const dur=num(meta.duration,0);
      if(m.type.startsWith('video/')&&dur>600&&keys.length>1){const n=keys.length,w=dur/n;const parts=await Promise.all(keys.map(async(k,j)=>{const s=Math.floor(j*w),e=Math.ceil((j+1)*w);
          const {json}=await G.gen('text',async kk=>({contents:[{parts:[{text:q+` Only describe from second ${s} to ${e}.`},{...(await G.part(m.blob,kk,meta.name,id)),video_metadata:{start_offset:s+'s',end_offset:e+'s'}}]}]}),{key:k}).catch(()=>G.gen('text',async kk=>({contents:[{parts:[{text:q+` Only describe from second ${s} to ${e}.`},{...(await G.part(m.blob,kk,meta.name,id)),video_metadata:{start_offset:s+'s',end_offset:e+'s'}}]}]})));
          return `From ${s} to ${e} seconds: `+G.text(json)}));meta.desc=parts.join('\n');}
      else{const {json}=await G.gen('text',async k=>({contents:[{parts:[{text:q},await G.part(m.blob,k,meta.name,id)]}],generationConfig:{temperature:.2}}),i<keys.length?{key:keys[i%keys.length]}:{}).catch(()=>G.gen('text',async k=>({contents:[{parts:[{text:q},await G.part(m.blob,k,meta.name,id)]}]})));meta.desc=G.text(json)}
      return {media_id:id,description:meta.desc.slice(0,6000)}}catch(e){return {media_id:id,error:e.message}}}));
  if(c)saveC(c,false);return {results:items}}
async function runTool(name,a){const c=nav.v==='container'?byId(nav.id):null;a=a||{};
  try{switch(name){
    case 'update_requirement':if(!c)return {error:'No container open'};c.req=(a.sections||[]).filter(s=>s&&s.heading).slice(0,20);if(a.status)c.reqStatus=a.status;await saveC(c);if(reqOpen())openRequirement(true);return {ok:true};
    case 'make_image':case 'make_video':case 'ai_image':return await genTool(name,c,a);
    case 'look_at_media':return await lookAtMedia(c,a.media_ids,a.question);
    case 'look_at_link':{const {json}=await G.gen('text',{contents:[{parts:[{text:a.question||'Describe this video in detail for an editor who wants to make something in a similar style: scenes, shots, pacing, colours, text, music and mood.'},{file_data:{file_uri:a.url}}]}]});return {description:G.text(json).slice(0,6000)}}
    case 'search_images':{const r=await Lib.searchImages(a.query,clamp(num(a.count,4),1,8));return r.length?{results:r}:{error:'Nothing found'}}
    case 'prepare_download':if(!c)return {error:'No container open'};{const it=await currentItem(c);if(!it)return {error:'Nothing to download yet'};downloadDialog(c,a.formats,a.filename);return {ok:true,note:'Dialog is open. Ask the user to tap Download.'}}
    case 'highlight':glow(a.control);return {ok:true};
    case 'app_action':return appAction(a.action);
    case 'container_action':return await containerAction(a);
    case 'set_language':setLanguage(a.code);return {ok:true,language:a.code};
    case 'interrupted_job':{const p=LS.get('spc.pending');if(!p)return {error:'Nothing was interrupted'};if(a.action==='drop'){LS.del('spc.pending');return {ok:true}}
      const pc=byId(p.cid);if(!pc)return {error:'That container no longer exists'};if(nav.id!==pc.id)go('container',{id:pc.id});LS.del('spc.pending');return genTool(p.tool,pc,p.args)}
  }return {error:'Unknown tool'}}catch(e){return {error:e.message}}}
function appAction(x){switch(x){
  case 'go_home':goHome();break;case 'open_menu':go('menu');break;case 'open_keys':go('keys');break;case 'open_voice':go('voice');break;case 'open_backup':go('backup');break;case 'open_about':go('about');break;case 'go_back':history.back();break;
  case 'dark_mode':setMode('dark');break;case 'light_mode':setMode('light');break;case 'voice_female':S.voice='female';saveS();break;case 'voice_male':S.voice='male';saveS();break;
  case 'stop_listening':setTimeout(()=>Session.stop(),1800);break;case 'disable_voice_mode':setTimeout(()=>setVoiceOff(true),1800);break;
  case 'cancel_generation':Gen.cancel();break;case 'open_messages':if(nav.v==='container'){nav.chat=true;history.replaceState(nav,'');render()}break;case 'close_messages':if(nav.v==='container'){nav.chat=false;history.replaceState(nav,'');render()}break;
  case 'open_requirement':if(nav.v==='container')openRequirement();break}return {ok:true}}
function findC(name,list){name=String(name||'').toLowerCase().replace(/^\(restored\)\s*/,'').trim();if(!name)return null;list=list||liveCS();
  return list.find(c=>c.name.toLowerCase()===name)||list.find(c=>c.name.toLowerCase().includes(name)||name.includes(c.name.toLowerCase()))||
    list.map(c=>({c,s:name.split(/\s+/).filter(w=>w.length>2&&c.name.toLowerCase().includes(w)).length})).filter(o=>o.s).sort((a,b)=>b.s-a.s).map(o=>o.c)[0]||null}
async function containerAction(a){const cur=nav.v==='container'?byId(nav.id):null;
  switch(a.action){
    case 'create':{const c=newContainer(String(a.name||('Container '+(liveCS().length+1))).slice(0,80));CS.push(c);await saveC(c);go('container',{id:c.id});return {ok:true,name:c.name}}
    case 'open':{const c=findC(a.name);if(!c)return {error:'No container matches that name'};go('container',{id:c.id});return {ok:true,name:c.name}}

    case 'delete_upload':{if(!cur)return {error:'No container'};await deleteUpload(cur,a.media_id);return {ok:true}}

function setLanguage(code,quiet){code=String(code||'').trim();if(!/^[a-z]{2,3}(-[A-Za-z]{2,4})?$/.test(code))return;if(code.length===2)code=code+'-IN';const c=nav.v==='container'?byId(nav.id):null;if(c){c.lang=code;saveC(c,false)}else{S.lang=code;saveS()}Ear.setLang(code)}

/* ---------- quick commands handled on the phone, with no AI tokens ---------- */
function localIntent(t){const s=t.toLowerCase().replace(/[.!?,]/g,'').trim();const c=nav.v==='container'?byId(nav.id):null;
  if(Gen.running&&/^(stop|cancel|stop it|cancel it|stop the generation|cancel the generation|stop generating)$/.test(s)){Gen.cancel();return 'Cancelling.'}
  if(Gen.running&&/(how long|how much (is )?(left|remaining)|progress|percent)/.test(s))return `It is ${Gen.running.p} percent done.`;
  if(/^(switch to |turn on |change to )?(the )?dark (mode|theme)( please)?$/.test(s)){setMode('dark');return 'Dark mode.'}
  if(/^(switch to |turn on |change to )?(the )?light (mode|theme)( please)?$/.test(s)){setMode('light');return 'Light mode.'}
  if(/^(open |show |go to )(the )?menu$/.test(s)){go('menu');return 'Menu.'}
  if(/^(go (back )?home|home|go to (the )?home( screen)?|home screen)$/.test(s)){goHome();return 'Home.'}
  if(/^go back$|^back$/.test(s)){history.back();return null}
  if(/^(open |show |go to )(the )?(api )?keys?( section)?$/.test(s)){go('keys');return 'API keys.'}
  if(/^(open |show |go to )(the )?backup( section)?$/.test(s)){go('backup');return 'Backup.'}
  if(/^(open |show |go to )(the )?about( section)?$/.test(s)){go('about');return 'About.'}
  if(/^(stop listening|go to sleep|close the app|close app|goodbye|bye)$/.test(s)){setTimeout(()=>Session.stop(),1500);return 'Okay. Tap the microphone when you need me.'}
  if(/^(undo|undo that|undo delete|bring it back)$/.test(s)){const del=CS.filter(x=>x.deleted).sort((a,b)=>b.deleted-a.deleted)[0];if(del){del.deleted=0;saveC(del,false);render();return `${del.name} is back.`}}
  if(c&&/^(open|show) (the )?(messages|chat)$/.test(s)){appAction('open_messages');return null}
  if(c&&/^(close|hide) (the )?(messages|chat)$/.test(s)){appAction('close_messages');return null}
  if(c&&/^(open|show|read) (the )?(recorded )?(user )?requirement$/.test(s)){openRequirement();return null}
  return false}

/* ---------- conversation loop with tool calls ---------- */
const Brain={busy:false,pending:[],homeAI:LS.get('spc.homeAI',[])||[]};
function historyFor(c){return c?(c.ai=c.ai||[]):Brain.homeAI}
function trimHist(h,max=26){if(h.length<=max)return h;let i=h.length-max;while(i<h.length&&!(h[i].role==='user'&&h[i].parts&&h[i].parts.some(p=>p.text)))i++;return h.slice(i)}
async function heard(text,conf,viaAI){if(!Session.active)return;Session.touch();interim('');
  if(!viaAI&&conf>0&&conf<.45&&G.active().length){Ear.low++;if(Ear.low>=2){Ear.low=0;Ear.pause();await Voice.say('Sorry, I did not catch that clearly. Please say it once more.');Ear.pause();setPill('listen');const r=await AIEar.once();Ear.resume();if(r&&r.text){if(r.language)setLanguage(r.language,true);return heard(r.text,1,true)}return}}else Ear.low=0;
  showCaption(text);await handleText(text,'voice')}
function interim(t){const el=$('#livecap');if(el&&t)el.textContent=t}
function showCaption(t){const el=$('#livecap');if(el)el.textContent=t}
async function handleText(text,channel){if(Brain.busy){Brain.pending.push([text,channel]);return}Brain.busy=true;setPill('think');
  try{const loc=/^en/i.test(curLang())?localIntent(text):false;
    if(loc!==false){if(loc)reply(loc,channel);return}
    if(!G.active().length){reply('Please add a free API key in the menu, under API keys, so I can understand and create for you. Quick commands like dark mode or open menu work without a key.',channel);return}
    await aiTurn(text,channel)}
  catch(e){reply(e.quota?'All your API keys have reached their free limit for now. Your conversation is saved in the requirement. Simple commands still work; please try again later or add another key.':'Sorry, something went wrong. '+(e.message||''),channel)}
  finally{Brain.busy=false;setPill();const n=Brain.pending.shift();if(n)handleText(n[0],n[1])}}
async function aiTurn(text,channel){let c=nav.v==='container'?byId(nav.id):null;let hist=historyFor(c);hist.push({role:'user',parts:[{text:(channel==='chat'?'[typed] ':'')+text}]});
  for(let step=0;step<7;step++){const body={systemInstruction:{parts:[{text:systemPrompt()}]},contents:trimHist(hist),tools:[{functionDeclarations:TOOLS}],generationConfig:{temperature:.6}};
    const {json}=await G.gen('text',body);const content=json.candidates&&json.candidates[0]&&json.candidates[0].content;if(!content||!content.parts)break;content.role='model';hist.push(content);
    const said=content.parts.filter(p=>p.text&&!p.thought).map(p=>p.text).join(' ').trim();if(said)reply(said,channel);
    const calls=content.parts.filter(p=>p.functionCall);if(!calls.length)break;const res=[];
    for(const p of calls){const r=await runTool(p.functionCall.name,p.functionCall.args);res.push({functionResponse:{name:p.functionCall.name,response:r&&typeof r==='object'?r:{result:r}}})}
    const nc=nav.v==='container'?byId(nav.id):null;if(nc!==c){const nh=historyFor(nc);nh.push(...hist.slice(-4));hist=nh;c=nc}
    hist.push({role:'user',parts:res})}
  if(c){c.ai=trimHist(hist,40);saveC(c,false)}else{Brain.homeAI=trimHist(hist,30);LS.set('spc.homeAI',Brain.homeAI)}}
function reply(text,channel){const c=nav.v==='container'?byId(nav.id):null;
  if(channel==='chat'&&c){c.chat.push({me:false,t:text,ts:Date.now()});saveC(c,false);renderChatOnly();if(!S.voiceOff)Voice.say(text)}
  else{if(!S.voiceOff)Voice.say(text);else if(c){c.chat.push({me:false,t:text,ts:Date.now()});saveC(c,false);renderChatOnly()}else toast(text);showCaption(text)}}

function renderChatOnly(){if(nav.v!=='container'||!nav.chat)return;const c=byId(nav.id),m=$('#msgs');if(!m||!c)return;m.innerHTML=c.chat.map(x=>`<div class="msg ${x.me?'me':'app'}"><span class="who">${x.me?'You':'Spoken PixelCraft'}</span><div class="b">${esc(x.t)}</div></div>`).join('');m.scrollTop=m.scrollHeight}

function renderKeys(){
  main.innerHTML=`<section class="view">${vtitle('API keys')}<div class="list">
    <div class="card"><p class="note">A free Google key lets Spoken PixelCraft understand you. Create keys in several Google projects and save them all: they work together, share the work, and take over when one runs out of its free limit.</p>

    <div class="card"><h2>Saved keys</h2>${S.keys.length?`<ul class="keys">${S.keys.map((k,i)=>`<li class="key"><span class="kn">Key ${i+1}</span><span class="stat ${k.st==='active'?'ok':k.st==='inactive'?'bad':'chk'}">${k.st==='active'?'Active':k.st==='inactive'?'Inactive':k.st==='unknown'?'Not checked':'Checking'}</span><button class="mini big" data-kcopy="${i}" aria-label="Copy key ${i+1}">${I('copy')}</button><button class="mini big" data-kdel="${i}" aria-label="Delete key ${i+1}">${I('trash')}</button></li>`).join('')}</ul>`:'<p class="note">No keys saved yet.</p>'}</div></div></section>${vdock(true)}`}
function renderVoice(){const st=Voice.status();
  main.innerHTML=`<section class="view">${vtitle('Voice')}<div class="list"><div class="card"><h2>Speaking voice</h2>
    <div class="seg" role="group" aria-label="Speaking voice"><button data-vc="female" aria-pressed="${S.voice==='female'}">Female</button><button data-vc="male" aria-pressed="${S.voice==='male'}">Male</button></div>
