<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0A0A0C">
<title>Spoken PixelCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* ---------- Colour design: "Midnight Iris". Fixed scheme; only light and dark change. ---------- */
:root,[data-mode="dark"]{
  --bg:#0A0A0C;--bg2:#0F0F13;--surface:#15151A;--surface2:#1C1C23;--surface3:#24242D;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--line3:rgba(255,255,255,.22);
  --text:#F4F4F6;--muted:#A0A0AC;--faint:#6C6C78;
  --accent:#7B83F7;--accent2:#A88EFA;--glow:rgba(123,131,247,.38);
  --sel:#6E76F2;--onsel:#FFFFFF;
  --danger:#FF6B6B;--ok:#4ADE80;--warn:#F5B84A;
  --scrim:rgba(5,5,8,.62);--glass:rgba(21,21,26,.72);
  --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --shadow-s:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-mode="light"]{
  --bg:#F3F3F6;--bg2:#FAFAFC;--surface:#FFFFFF;--surface2:#F1F1F5;--surface3:#E7E7EE;
  --line:rgba(16,16,24,.07);--line2:rgba(16,16,24,.13);--line3:rgba(16,16,24,.22);
  --text:#121216;--muted:#62626E;--faint:#9A9AA6;
  --accent:#565EE6;--accent2:#7D5CF0;--glow:rgba(86,94,230,.28);
  --sel:#D8DAFF;--onsel:#0B0B12;
  --danger:#D93D3D;--ok:#1E9E57;--warn:#B7791F;
  --scrim:rgba(240,240,246,.6);--glass:rgba(255,255,255,.78);
  --shadow:0 18px 40px rgba(20,20,40,.14),0 2px 6px rgba(20,20,40,.08);
  --shadow-s:0 6px 18px rgba(20,20,40,.1);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s ease,color .35s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
::selection{background:var(--glow)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;position:relative}

/* ---------- header ---------- */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px}
.brandwrap{display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line2)}
.name{font-size:1.38rem;font-weight:500;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.name .cal{font-family:"Great Vibes",cursive;font-weight:400;font-size:2.05rem;line-height:.6;margin-right:1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px}
.name .gap{display:inline-block;width:.32em}
.tagline{font-size:.74rem;color:var(--muted);letter-spacing:.06em;padding-left:36px}
.hbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s ease,background .2s,border-color .2s,box-shadow .2s}
.ibtn:hover{border-color:var(--line3)}
.ibtn:active{transform:scale(.94);background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.ibtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.mode svg{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.mode .sun{position:absolute;opacity:0;transform:rotate(-90deg) scale(.6)}
[data-mode="light"] .mode .sun{opacity:1;transform:none}
[data-mode="light"] .mode .moon{opacity:0;transform:rotate(90deg) scale(.6)}
.mode{position:relative}
.rule{flex:none;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 12%,var(--line2) 88%,transparent);margin:0 0 2px}

/* ---------- views ---------- */
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px));animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vtitle{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.vtitle h1{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.88rem;margin:0}

/* ---------- home grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
@media (max-width:379px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{display:flex;flex-direction:column;gap:7px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.tile:hover{border-color:var(--line3)}
.tile:active{transform:scale(.965);box-shadow:0 0 0 4px var(--glow)}
.tile .art{position:absolute;inset:0}
.tile.empty{background:linear-gradient(160deg,var(--surface),var(--surface2))}
.tile.empty::after{content:"";position:absolute;inset:26%;border-radius:12px;border:1.5px dashed var(--line2)}
.badge{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border:1px solid var(--line2)}
.badge svg.i{width:14px;height:14px}
.cap{display:flex;align-items:flex-start;gap:0}
.cap .t{flex:1;font-size:.72rem;font-weight:500;line-height:1.3;text-align:center;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-top:3px}
.cap .t .rs{color:var(--accent);font-weight:600;white-space:nowrap}
.mini{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.mini svg.i{width:14px;height:14px}
.cap .mini{color:var(--faint)}
.mini:active{background:var(--sel);color:var(--onsel)}
.emptyhome{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;color:var(--muted)}

/* floating new button */
.fab{position:fixed;right:max(20px,calc(50% - 620px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 30px var(--glow),0 0 0 1px rgba(255,255,255,.18) inset;z-index:20;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.fab svg.i{width:28px;height:28px;stroke-width:2}
.fab:active{transform:scale(.92)}

/* ---------- voice pill: four dots while listening, mic when stopped ---------- */
.vpill{display:flex;align-items:center;justify-content:center;gap:7px;height:52px;min-width:96px;padding:0 22px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow-s);color:var(--text);transition:transform .18s,box-shadow .25s}
.vpill:active{transform:scale(.95)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;animation:wave 1.25s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}.dot:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{opacity:.25;transform:translateY(0) scale(.85)}35%{opacity:1;transform:translateY(-5px) scale(1.12);box-shadow:0 0 12px var(--glow)}}
.vpill.listen{box-shadow:var(--shadow-s),0 0 0 4px var(--glow)}
.vpill .mic svg.i{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.8}}

/* ---------- container view ---------- */
.cview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;animation:fade .32s ease}
.ctop{flex:none;display:flex;align-items:center;gap:8px}
.cname{flex:1;display:flex;align-items:center;gap:4px;justify-content:center}
.cname .t{font-weight:600;font-size:1rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{flex:none;display:flex;justify-content:center;gap:12px}
.tbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s,background .2s,box-shadow .25s,border-color .2s}
.tbtn:active,.tbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.tbtn:active{transform:scale(.94)}
.tbtn.glow{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 9px var(--glow);border-color:var(--accent)}}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:6px;margin:-6px;transition:flex-basis .35s ease}
.cview.chatopen .preview{min-height:110px}
.preview{position:relative;flex:1 1 auto;min-height:180px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);display:grid;place-items:center}
.preview .art,.preview img,.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.preview .art{object-fit:cover}
.pempty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;color:var(--muted);max-width:300px}
.pempty .big{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--accent)}
.pempty .big svg.i{width:30px;height:30px}
.pempty p{margin:0;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-size:.8rem;font-weight:500;color:var(--text);transition:background .2s,color .2s}
.chip:active,.chip.on{background:var(--sel);color:var(--onsel);border-color:transparent}
.dl{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line3);color:var(--text);box-shadow:var(--shadow-s);transition:transform .15s,background .2s}
.dl:active{transform:scale(.93);background:var(--sel);color:var(--onsel)}
.kind{position:absolute;left:14px;top:14px;height:28px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.04em;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2)}
.kind svg.i{width:14px;height:14px}
/* progress ring */
.prog{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line2)}
.ring .fgc{stroke:url(#rg);transition:stroke-dashoffset .25s linear}
.ring .spin{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1.1s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* versions strip */
.strip{flex:none;display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ver{position:relative;flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);transition:transform .15s,box-shadow .2s}
.ver .art{position:absolute;inset:0}
.ver.cur{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--glow)}
.ver:active{transform:scale(.94)}
.vx{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.vx svg.i{width:10px;height:10px;stroke-width:2.4}
.vslot{flex:none;display:flex;justify-content:center;padding-top:2px}
/* chat panel */
.chat{flex:0 0 50%;min-height:0;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;margin:0 -18px calc(-14px - env(safe-area-inset-bottom,0px));padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 40px rgba(0,0,0,.25);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line3);margin:0 auto 8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .who{font-size:.68rem;font-weight:600;letter-spacing:.05em;color:var(--muted);padding:0 6px}
.msg .b{padding:10px 14px;border-radius:18px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.app .b{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.compose{flex:none;display:flex;align-items:flex-end;gap:8px;padding-top:6px}
.compose textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:12px 16px;border-radius:23px;border:1px solid var(--line2);background:var(--surface);outline:none;font-size:.95rem;line-height:1.4;transition:border-color .2s,box-shadow .2s}
.compose textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none;transition:transform .15s}
.send:active{transform:scale(.92)}
.cview.kb .stage{flex:0 0 6.6rem;overflow:auto}
.cview.kb .vslot{display:none}
.cview.kb .preview{min-height:6.2rem}
.cview.kb .chat{flex:1 1 auto}
@media (min-width:900px){
  .cview.chatopen{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:20px}
  .cview.chatopen .ctop,.cview.chatopen .tools{grid-column:1}
  .cview.chatopen .stage{grid-column:1;grid-row:3}
  .cview.chatopen .vslot{grid-column:1;grid-row:4}
  .cview.chatopen .chat{grid-column:2;grid-row:1/5;margin:0;border-radius:24px;border-bottom:1px solid var(--line2);padding-bottom:12px}
  .cview.kb .stage{flex:1 1 auto}
}

/* ---------- menu & lists ---------- */
.list{display:flex;flex-direction:column;gap:10px;max-width:640px}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);text-align:left;width:100%;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.row:active{background:var(--sel);color:var(--onsel);transform:scale(.99);box-shadow:0 0 0 4px var(--glow)}
.row:active .rsub{color:inherit;opacity:.8}
.row .ric{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent);flex:none}
.row:active .ric{background:transparent;color:inherit}
.row .rtx{flex:1;display:flex;flex-direction:column}
.row .rt{font-weight:600;font-size:.98rem}
.row .rsub{font-size:.8rem;color:var(--muted)}
.chev{color:var(--faint)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--surface3);position:relative;transition:background .25s;flex:none;border:1px solid var(--line2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.card h2{margin:0;font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--text);transition:background .2s,color .2s,transform .15s,box-shadow .2s;text-align:center}
.pbtn:active,.pbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.pbtn:active{transform:scale(.98)}
.pbtn.prime{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.field{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.key{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.key .kn{flex:1;font-weight:600;font-size:.95rem}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface3)}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stat.ok{color:var(--ok)}.stat.bad{color:var(--danger)}.stat.chk{color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.seg button{min-height:48px;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--onsel);box-shadow:0 0 0 3px var(--glow)}
.bk{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.bk .bt{flex:1;display:flex;flex-direction:column}
.bk .bt b{font-weight:600;font-size:.92rem}
.bk .bt span{font-size:.78rem;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);margin:0;line-height:1.5}
.folder{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem}
.folder svg.i{color:var(--accent)}
/* about accordion */
.acc{display:flex;flex-direction:column;gap:10px;max-width:720px}
.sec{border-radius:18px;background:var(--surface);border:1px solid var(--line2);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.sec.open{border-color:var(--line3);box-shadow:var(--shadow-s)}
.sech{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 16px;text-align:left;font-weight:600;font-size:.96rem}

/* ---------- sheets, dialogs, toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fadein .25s ease}

@media (min-width:700px){.sheet{border-radius:28px;padding-bottom:22px}}
.shead{display:flex;align-items:center;gap:10px}

.fmts .chip{height:42px;padding:0 18px;font-size:.88rem}
.req{display:flex;flex-direction:column;gap:12px}

@keyframes toast{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* start overlay */
.start{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);cursor:pointer;animation:fadein .4s ease}
.start .box{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
.start .orb{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--glass);border:1px solid var(--line2);box-shadow:0 0 0 10px var(--glow),var(--shadow)}
.start h2{margin:0;font-size:1.2rem;font-weight:600}
.start p{margin:0;color:var(--muted);font-size:.9rem}
/* ---------- full app additions ---------- */
.vpill{position:relative}
.vdock{display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.vdock>*{pointer-events:auto}
.vdock.float{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:19;max-width:min(70vw,520px)}
.livecap{margin:0;min-height:1.1em;max-width:100%;font-size:.78rem;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;pointer-events:none}
.vpill.float{position:static;transform:none}
.vpill.think .dot{animation:think 1.4s ease-in-out infinite}
.vpill.think .dot:nth-child(2){animation-delay:.2s}.vpill.think .dot:nth-child(3){animation-delay:.4s}.vpill.think .dot:nth-child(4){animation-delay:.6s}

.vpill.speak .dot{background:var(--accent2);animation-duration:.75s}

.vpill.off{min-width:64px;padding:0 18px}
.preview .pm{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.preview audio{width:min(320px,80vw)}
.ver .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ver.aud{display:grid;place-items:center;background:var(--surface2)}
.vsel{position:absolute;inset:0;z-index:1}
.vb{position:absolute;left:3px;bottom:3px;z-index:2;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}

.pbtn.danger{background:var(--danger);color:#fff;border-color:transparent}

.mini.big{width:42px;height:42px;border-radius:12px}
.mini.big svg.i{width:18px;height:18px}
#keybox:not([hidden]){display:flex;flex-direction:column;gap:10px}
.emptyhome .big{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line2);color:var(--accent)}
.emptyhome .big svg.i{width:32px;height:32px}

/* ================= v2: smoothness, colour, setup, recorder ================= */
html{touch-action:manipulation}

/* lighter rendering on phones: no live blur on small, frequently drawn elements */

/* one persistent voice dock for every screen */

.vpill.rec .dots{display:none}.vpill.rec .recsq{display:block;width:16px;height:16px;border-radius:4px;background:var(--danger)}

body[data-view="container"] .cview{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}

@media (max-width:899px){
  body.chatopen .vdock{bottom:calc((100dvh - 96px) * .5 + 6px)}

  body.chatopen .livecap{display:none}
  body.kb .vdock{opacity:0;pointer-events:none}
  .chat{flex:0 0 calc((100dvh - 96px) * .5)}
}

.vslot{display:none!important}

/* colour: restrained, but present on every screen */
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--line2) 10%,color-mix(in srgb,var(--accent) 70%,transparent) 42%,color-mix(in srgb,var(--accent2) 70%,transparent) 58%,var(--line2) 90%,transparent)}
.tbtn{color:var(--accent)}
.tbtn:active,.tbtn.on{color:var(--onsel)}
.ibtn#menuBtn{color:var(--accent)}
.ibtn.mode .moon{color:var(--accent2)}.ibtn.mode .sun{color:var(--warn)}
.vtitle h1{background:linear-gradient(90deg,var(--text),var(--text) 60%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.cap .mini svg.i,.cname .mini{color:var(--accent)}
.cap .mini:last-child svg.i,.cname .mini:last-of-type{color:var(--faint)}
.badge{color:#fff}.badge svg.i{color:var(--accent2)}
.kind svg.i{color:var(--accent)}
.card h2{color:var(--accent)}
.sech .ric,.row .ric{background:color-mix(in srgb,var(--accent) 14%,var(--surface2))}
.tile{box-shadow:var(--shadow-s),0 0 0 0 var(--glow)}
.tile.empty::after{border-color:color-mix(in srgb,var(--accent) 45%,var(--line2))}
.chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.stat.ok{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.note b,.folder b{color:var(--text)}
.ver.cur{box-shadow:0 0 0 2px var(--accent),0 0 14px var(--glow)}
.emptyhome .big{background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--accent)}
.pempty .big{background:color-mix(in srgb,var(--accent) 12%,var(--surface2))}
.qn{color:var(--accent)}

/* first-run setup card (white) and progress bar */
.setup{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:20px;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadein .35s ease}
.scard{width:100%;max-width:440px;background:#FFFFFF;color:#121216;border-radius:28px;padding:28px 24px 22px;box-shadow:0 30px 80px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px;text-align:center;animation:rise .45s cubic-bezier(.2,.8,.2,1)}
.scard h2{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.scard p{margin:0;font-size:.95rem;line-height:1.55;color:#3A3A44}
.scard .small{font-size:.82rem;color:#6A6A76}
.sbadge{width:60px;height:60px;margin:0 auto;border-radius:20px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#7B83F7,#A88EFA);box-shadow:0 10px 24px rgba(123,131,247,.45)}
.sbadge svg.i{width:28px;height:28px}
.sfacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sfacts div{border-radius:16px;background:#F3F3F8;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.sfacts b{font-size:1rem;color:#121216}.sfacts span{font-size:.75rem;color:#6A6A76}
.scard .pbtn.big{min-height:56px;font-size:1.02rem;border-radius:18px}
.scard .pbtn.prime{background:linear-gradient(135deg,#6E76F2,#9B7BF7);color:#fff}
.setupbar{flex:none;display:flex;align-items:center;gap:14px;margin:10px 18px 0;padding:12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.setupbar[hidden]{display:none!important}
.sbring{position:relative;width:52px;height:52px;flex:none}
.sring{width:52px;height:52px;transform:rotate(-90deg)}
.sring .bgc{stroke:var(--line2)}.sring .fgc{stroke:url(#rg);transition:stroke-dashoffset .4s ease}
.sbp{position:absolute;inset:0;display:grid;place-items:center;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.sbtx{flex:1;display:flex;flex-direction:column;gap:4px;font-size:.84rem}

.sbtx span{color:var(--muted);line-height:1.4}
.sbbtns{display:flex;gap:8px;margin-top:4px}
.sbbtns .chip{height:32px}
.setupbar #sbretry{display:none}

.setupbar[data-state="done"] .sbp::after{content:"✓";font-size:1.1rem;color:var(--ok)}

/* camera recorder */
.recl{position:fixed;inset:0;z-index:75;background:#000;display:block;animation:fadein .25s ease}
.recbg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.recpv{position:absolute;object-fit:cover;background:#111}

.ptext{color:#fff;font-size:1.45rem;line-height:1.5;font-weight:600;text-align:center;will-change:transform}
.rectop{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-weight:600;font-variant-numeric:tabular-nums}
.recdot{width:10px;height:10px;border-radius:50%;background:#FF4D4D;animation:think 1.2s ease-in-out infinite}
.countdown{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:7rem;font-weight:700;pointer-events:none;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.countdown.pulse{animation:cd .9s ease-out}
@keyframes cd{from{transform:scale(1.4);opacity:0}30%{opacity:1}to{transform:scale(.9);opacity:.2}}
.recbar{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;padding:0 28px}
.recbar .ibtn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)}
.recstop{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center;background:transparent}
.recstop span{width:30px;height:30px;border-radius:8px;background:#FF4D4D}
.recstop:active{transform:scale(.94)}
.noanim>*{animation:none!important}
/* v3 */
.tagline{padding-left:2px}
.brand{gap:0}
.vpill.loading .dot{background:var(--faint);animation:think 1.4s ease-in-out infinite}
.vpill.loading .dot:nth-child(2){animation-delay:.2s}.vpill.loading .dot:nth-child(3){animation-delay:.4s}.vpill.loading .dot:nth-child(4){animation-delay:.6s}
ol.steps{margin:0;padding:0 0 0 22px;display:flex;flex-direction:column;gap:10px;font-size:.95rem;line-height:1.45;color:var(--text)}

.sheet .pbtn.big{min-height:56px;font-size:1.02rem;border-radius:18px}
#pastemanual:not([hidden]){display:flex;flex-direction:column;gap:10px}
.prog{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;background:color-mix(in srgb,var(--bg) 72%,transparent)}
.ring .spin{will-change:transform}
.ibtn#menuBtn.on{color:var(--onsel)}
</style>

<script type="module">
'use strict';
/* ============================================================
   Spoken PixelCraft — core: utilities, storage, settings, Gemini
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=(v,d=0)=>(v!==null&&v!==''&&Number.isFinite(+v))?+v:d;
const mkErr=(m,status)=>{const e=new Error(m);e.status=status;return e};
const todayStr=()=>new Date().toDateString();

function workerRPC(fn){let w=null,seq=0;const cb=new Map();const ensure=()=>{if(w)return w;w=makeWorker(fn);
    w.onmessage=e=>{const m=e.data;if(m&&m.event){(rpc.onEvent||(()=>{}))(m);return}const c=cb.get(m.id);if(!c)return;cb.delete(m.id);m.error?c.rej(mkErr(m.error)):c.res(m.result)};
    w.onerror=e=>{for(const c of cb.values())c.rej(mkErr('Background worker failed'));cb.clear();w=null};return w};
  const rpc={call(type,payload={},transfer=[]){return new Promise((res,rej)=>{const id=++seq;cb.set(id,{res,rej});try{ensure().postMessage({id,type,...payload},transfer)}catch(e){cb.delete(id);rej(e)}})},
    get started(){return !!w},kill(){if(w){w.terminate();w=null}}};return rpc}

const ABOUT_FACTS=`Spoken PixelCraft is a voice-first app for creating and editing images and videos. Containers hold each project; the plus button or voice creates one; tiles sort by last edit; pencil renames, bin deletes. Deleted containers can be brought back by voice until the next day's first use. Inside a container: upload button (photos, videos, audio), YouTube link button (for understanding only, cannot be downloaded), Recorded User Requirement button (summary with play aloud), messages button (typed chat), large preview, download button on the preview, strip of saved versions and uploads below the preview. Before a new version replaces the current one, the app asks whether to keep the previous. Downloads: PNG, JPEG, WebP, GIF for images; MP4, WebM, MP3, GIF for videos; saved to the Downloads folder; the folder button opens a file picker. Menu: API keys (create a free Google key in Google AI Studio, save several keys from different projects; they work together and share the work), Voice (female or male), Disable voice mode (typing only), Backup (choose a folder once; a folder named Spoken_PixelCraft_backup is created; a backup is saved when leaving a container after changes; restore adds containers marked Restored, restoring again replaces them), About. Light and dark switch top right. To add a key: Menu, API keys, Create free key, follow the Google page, copy the key, press Back until you return, then tap Paste key. Ready-made designs: greeting cards for any occasion, sale posters, invitations, quote cards, menu cards, YouTube thumbnails, announcements, photo cards, slideshows, greeting videos, promo reels and quote videos. Listening and speaking are in English, on the device, without beeps. First run downloads the essential components once (about 160 MB: natural voice engine and offline English speech recognition); other components download quietly in the background. Camera recording: front or back camera, teleprompter script, recording while a video plays, say stop recording or tap stop. Voice: always listening while the app is open; the user can interrupt; after 2 minutes of silence the app asks if the user is there, then after 1 minute, then 30 seconds, then closes after 15 more seconds; tap the microphone to start again. During a generation, keep the app on screen; questions and cancel work; new requests are queued. Daily cleanup runs silently on the first use of each day. The asset library keeps fetched images up to 500 MB. Everything stays in this browser and the backup folder; backups include the keys.`;

      <div class="btnrow"><button class="pbtn" data-act="createkey">${I('ext')} Create free key</button><button class="pbtn prime" data-act="pastekey">${I('key')} Paste key</button></div></div>
    <div class="card"><h2>Saved keys</h2>${S.keys.length?`<ul class="keys">${S.keys.map((k,i)=>`<li class="key"><span class="kn">Key ${i+1}</span><span class="stat ${k.st==='active'?'ok':k.st==='inactive'?'bad':'chk'}">${k.st==='active'?'Active':k.st==='inactive'?'Inactive':k.st==='unknown'?'Not checked':'Checking'}</span><button class="mini big" data-kcopy="${i}" aria-label="Copy key ${i+1}">${I('copy')}</button><button class="mini big" data-kdel="${i}" aria-label="Delete key ${i+1}">${I('trash')}</button></li>`).join('')}</ul>`:'<p class="note">No keys saved yet.</p>'}</div></div></section>`}
function renderVoice(){const st=Voice.status(),pct=Math.round(Voice.progress*100);
  main.innerHTML=`<section class="view">${vtitle('Voice')}<div class="list"><div class="card"><h2>Speaking voice</h2>
    <div class="seg" role="group" aria-label="Speaking voice"><button data-vc="female" aria-pressed="${S.voice==='female'}">Female</button><button data-vc="male" aria-pressed="${S.voice==='male'}">Male</button></div>
    <p class="note" id="vstat">${st==='natural'?'The natural voice is ready on this device.':st==='downloading'?'The natural voice is being prepared.':'The natural voice could not load, so the device voice is used for now.'} </p></div>
    <div class="card"><h2>Listening</h2><p class="note">I listen in English with an offline speech model on this device, in one steady session without beeps. ${Listen.engine==='local'?'The speech model is ready.':Listen.engine==='ai'?'The offline speech model could not load, so your API key is used to understand speech.':Listen.engine==='browser'?'The browser\'s own recognition is used for now; it may beep on some phones.':'The speech model is being prepared.'} Unclear speech is checked with Google's AI when a key is saved.</p></div></div></section>`}
async function renderBackup(){const b=Backup;let list=[];try{list=await b.list()}catch(e){}if(nav.v!=='backup')return;
  const groups=[];for(const e of list){const g=groups.find(x=>Math.abs(x.t-e.t)<60000);if(g)g.names.push(e.name);else groups.push({t:e.t,names:[e.name]})}
  main.innerHTML=`<section class="view">${vtitle('Backup')}<div class="list">
    <div class="card">${b.mode?`<h2>Backup location</h2><div class="folder">${I('folder')}<span>${b.mode==='folder'?`<b>${esc(b.parent)}</b> / ${BK_FOLDER}`:'Stored inside this browser'}</span></div>
      <p class="note">A backup is saved silently whenever you leave a container after making changes.${b.mode==='device'?' This browser cannot write to a folder, so backups are kept inside the browser. Save a backup file now and then to keep a copy outside the browser.':''}</p>
      ${b.needPerm?`<button class="pbtn prime" data-act="allowbk">${I('shield')} Allow backups again</button>`:''}
      <div class="btnrow">${b.mode==='device'?`<button class="pbtn" data-act="expbk">${I('down')} Save backup file</button><label class="pbtn" tabindex="0" role="button">${I('upload')} Open backup file<input type="file" id="impbk" accept=".spcbackup" hidden></label>`:`<button class="pbtn" data-act="setbk">${I('folder')} Change location</button><button class="pbtn" data-act="offbk">${I('x')} Turn off</button>`}</div>`
      :`<p class="note">Choose a folder on this device once. Spoken PixelCraft creates a folder named ${BK_FOLDER} inside it, and keeps your work safe there automatically.</p><button class="pbtn prime" data-act="setbk">${I('folder')} Set up backup</button>`}</div>
    ${b.mode?`<div class="card"><h2>Backups</h2>${groups.length?groups.slice(0,60).map(g=>`<div class="bk"><span class="bt"><b>${fmtDate(g.t)}, ${fmtTime(g.t)}</b><span>${esc([...new Set(g.names)].join(', '))}</span></span><button class="mini big" data-rest="${g.t+59999}" aria-label="Restore to ${fmtDate(g.t)} ${fmtTime(g.t)}">${I('restore')}</button></div>`).join(''):'<p class="note">No backups yet.</p>'}</div>`:''}</div></section>`;
  const ib=$('#impbk');if(ib)ib.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{await Backup.importFile(f);toast('Backup file opened.');renderBackup()}catch(er){toast('That file could not be read.')}}}
const ABOUT=[
 ['spark','What Spoken PixelCraft is','<p>A voice-first studio for creating and editing images and videos. You speak in plain words. The app asks questions until it understands exactly what you want, explains the choices, and then creates it with its own built-in tools.</p>'],
 ['book','Getting started','<ul><li>Tap anywhere when the app opens. Voice turns on and stays on.</li><li>Add a free Google key in Menu, API keys.</li><li>Tap the plus button, or say <q>create a new container</q>.</li><li>Inside the container, tell the app what you want. When it is clear, say <q>generate now</q>.</li></ul>'],
 ['key','Free API keys','<p>In Menu, API keys, tap Create free key, then Open Google AI Studio. Sign in, tap Create API key and copy it. On a phone, press Back until you return to the app; on a computer, close that window. Then tap Paste key. Create keys in several Google projects and save them all: they share the work, so the app answers faster, and when one key reaches its free limit the others take over. Tap the copy icon to see a key again, and the bin to remove it.</p>'],
 ['voice','Talking to the app','<ul><li><q>Make a sunset poster for my tea shop with the name in big letters.</q></li><li><q>Make a Reel from these three clips with calm music.</q></li><li><q>Make the sky darker.</q> <q>Cut the first five seconds.</q></li><li><q>Go back to version two.</q> <q>Download it as PNG and JPEG.</q></li><li><q>Switch to dark mode.</q> <q>Open the menu.</q></li></ul><p>You can interrupt a longer reply by speaking. Listening is in English, on your device, with no beeps. Android shows a notification while the microphone is on; you can silence it in Chrome\'s notification settings. Tap the dots at the bottom to stop listening, and the microphone to start again.</p>'],
 ['layers','Containers and versions','<p>Each project lives in its own container. The newest edited container is shown first. Before a new version replaces the current one, the app asks whether to keep the previous one. Kept versions and your uploads appear as small blocks below the preview; tap one to see it, or its cross to delete it.</p>'],
 ['file','Recorded requirement and messages','<p>The document button shows the Recorded User Requirement: a clear summary of everything you asked for, with a speaker button to hear it read aloud. The messages button opens a panel where you can type commands or paste a script from another AI tool.</p>'],
 ['down','Downloading','<p>Choose a file name and one or more formats: PNG, JPEG, WebP or GIF for images; MP4, WebM, MP3 or GIF for videos. Files are saved to your device\'s Downloads folder. The folder button opens a file picker there, where your browser allows it.</p>'],
 ['backup','Backup and restore','<p>Choose a folder once. A folder named Spoken_PixelCraft_backup is created, and your work is backed up silently whenever you leave a container after changes. Restore adds the backed-up containers marked (Restored); restoring the same backup again replaces them. Phone browsers that cannot write to folders keep backups inside the browser; save a backup file from time to time.</p>'],
 ['trash','Deleted containers','<p>A deleted container disappears at once, but you can say <q>undo</q> or <q>bring it back</q> until the first use of the next day, when it is removed for good. Backups taken earlier still hold a copy.</p>'],
 ['down','First-run setup','<p>On the very first run, the app downloads its essential components once: the natural voice engine and the offline English speech recognition model, about 160 MB. Tap Download when ready, preferably on Wi-Fi. While it downloads you can explore the Menu and add API keys. Every later start says welcome at once, loads these components into memory in a few seconds, then tells you it is ready. Other components, such as fonts, encoders, background removal and a starter image library, download quietly in the background, pausing while you use the app.</p>'],
 ['spark','Ready-made designs','<p>Say, for example, <q>make a birthday card for Ravi</q>, <q>make a Diwali greeting video</q>, <q>make a sale poster for 50 percent off</q>, <q>make a quote card</q> or <q>make a slideshow of my photos</q>. Ready-made designs include greeting cards for any occasion, sale posters, invitations, quote cards, menu cards, YouTube thumbnails, announcements, photo cards, slideshows, greeting videos, promo reels and quote videos. They work even without an API key.</p>'],
 ['shield','Without a key or internet','<p>Without a key, the app still answers questions about itself, follows commands like dark mode, open the menu or show version two, makes simple edits like <q>make it brighter</q>, <q>add confetti</q> or <q>make it black and white</q>, and creates ready-made designs. Listening and speaking work offline after the first setup. A key adds Google\'s AI to understand any request and polish the result.</p>'],
 ['video','Camera recording','<p>Say, for example, <q>record me with the front camera while version two plays, and put me in the bottom right corner</q>. The app counts down, shows your script as a teleprompter if you give one, and records. Say <q>stop recording</q> or tap the stop button. While recording, everything else you say is recorded, not treated as a command. On some phones the browser cannot listen and record at the same moment; then simply tap stop.</p>'],
 ['clock','During a generation','<p>A ring shows the progress. Videos are created in real time, so a one-minute video takes about a minute. Keep the app on screen; locking the phone or switching apps may pause the work. You can ask questions or say <q>cancel</q>; new requests wait in a queue.</p>'],
 ['link','YouTube links','<p>Links are used for understanding only. The app can watch a video and create something in a similar style, but YouTube videos cannot be downloaded or reused as footage. Use clips you own, uploaded from your device.</p>'],
 ['lib','Library and daily cleanup','<p>Free images found online are saved in the app\'s library for reuse, up to 500 MB; the least used are removed first. Built-in music is created on the device and is free to use. Once a day, on first use, the app quietly clears deleted containers and leftovers.</p>'],
 ['screen','Phone and desktop','<p>The same app works on phones, tablets and computers. Larger screens show more containers, a bigger preview, and the messages panel at the side.</p>'],
 ['shield','Privacy','<p>Your work stays in this browser and in your chosen backup folder. Requests are sent to Google only with your own keys. Backups include your keys, so keep that folder private.</p>']];
let openSec=0;
function renderAbout(){main.innerHTML=`<section class="view">${vtitle('About')}<div class="acc">${ABOUT.map((s,i)=>`<div class="sec ${i===openSec?'open':''}"><button class="sech" data-sec="${i}" aria-expanded="${i===openSec}"><span class="ric">${I(s[0])}</span><span class="tx">${s[1]}</span>${I('chev','chev')}</button><div class="secb"><div><div class="in">${s[2]}</div></div></div></div>`).join('')}</div></section>`}
function onKeysChanged(){if(nav.v==='keys')renderKeys();else if(nav.v==='home'&&!liveCS().length)renderHome()}
let vsT=0;function onVoiceStatus(){if(nav.v==='voice'&&Date.now()-vsT>800){vsT=Date.now();renderVoice()}}

/* ---------- sheets and dialogs ---------- */
const layer=$('#layer');
function closeLayer(){if(layer.innerHTML){layer.innerHTML='';if(reqSpeaking){Voice.stop();reqSpeaking=false}}}
function sheet(title,body,left=''){layer.innerHTML=`<div class="scrim" data-scrim="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="shead">${left||'<span style="width:42px"></span>'}<h3>${esc(title)}</h3><button class="ibtn" data-act="close" aria-label="Close">${I('x')}</button></div>${body}</div></div>`;const f=layer.querySelector('input:not([type=file]),textarea');if(f)setTimeout(()=>f.focus(),60)}
function ask(title,text,okLabel,danger,cb){sheet(title,`<p class="note center">${esc(text)}</p><div class="btnrow"><button class="pbtn" data-act="close">Cancel</button><button class="pbtn prime ${danger?'danger':''}" id="okb">${esc(okLabel)}</button></div>`);$('#okb').onclick=()=>{closeLayer();cb()}}
function nameDialog(title,val,cb){sheet(title,`<input class="field" id="nm" value="${esc(val)}" maxlength="80" aria-label="Name"><button class="pbtn prime" id="okb">Save</button>`);const nm=$('#nm');nm.select();const done=()=>{const v=nm.value.trim();if(!v)return nm.focus();closeLayer();cb(v)};$('#okb').onclick=done;nm.onkeydown=e=>{if(e.key==='Enter')done()}}
let reqSpeaking=false;const reqOpen=()=>!!$('#reqbox');
function reqSections(c){const s=(c.req||[]).length?c.req:[{heading:'Requirement so far',text:'Nothing recorded yet. Tell the app what you would like to create.'}];return [...s,{heading:'Status',text:c.reqStatus||'Not generated.'}]}
function openRequirement(refresh){const c=byId(nav.id);if(!c)return;const g=reqSections(c);const body=`<div class="req" id="reqbox">${g.map(x=>`<div class="g"><h4>${esc(x.heading)}</h4><p>${esc(x.text)}</p></div>`).join('')}</div>`;
  if(refresh&&reqOpen()){$('#reqbox').outerHTML=body;return}
  sheet('Recorded user requirement',body,`<button class="ibtn" id="reqspk" aria-label="Play aloud" aria-pressed="false" title="Play aloud">${I('speaker')}</button>`);
  $('#reqspk').onclick=function(){if(reqSpeaking){Voice.stop();reqSpeaking=false;this.classList.remove('on');this.setAttribute('aria-pressed','false');return}
    reqSpeaking=true;this.classList.add('on');this.setAttribute('aria-pressed','true');const b=this,wasOff=S.voiceOff;S.voiceOff=false;
    Voice.say(reqSections(c).map(x=>x.heading+'. '+x.text).join(' ')).then(()=>{reqSpeaking=false;b.classList.remove('on');b.setAttribute('aria-pressed','false')});S.voiceOff=wasOff}}
function glow(ctrl){const sel={upload:'#upBtn',link:'[data-act=yt]',download:'#dlgo, .dl',backup:'[data-act=setbk]',messages:'[data-act=chat]',requirement:'[data-act=req]',new:'.fab'}[ctrl];
  if(ctrl==='backup'&&nav.v!=='backup')go('backup');if(ctrl==='new'&&nav.v!=='home')goHome();
  setTimeout(()=>{const el=document.querySelector(sel);if(el){el.classList.remove('glow');void el.offsetWidth;el.classList.add('glow');el.focus&&el.focus({preventScroll:true});setTimeout(()=>el.classList.remove('glow'),4200)}},350)}

/* ---------- uploads, versions, deletion ---------- */
async function uploadFiles(c,files){if(!files.length)return;let n=0;
  for(const f of files){const k=(f.type||'').split('/')[0];if(!['image','video','audio'].includes(k)){toast(f.name+' is not a photo, video or audio file.');continue}
    const meta=await probe(f);const id=await addMedia(c.id,f,{name:f.name});c.media.push({id,type:f.type,name:f.name,size:f.size,w:meta.w,h:meta.h,duration:meta.duration});c.sel={t:'m',id};n++;
    if(!c.thumb&&k!=='audio')c.thumb=await makeThumb(f);if(!c.kind)c.kind=k==='audio'?null:k}
  if(!n)return;await saveC(c);renderAfterChange(c);const msg=n>1?`${n} files added.`:'Added.';toast(msg+(n&&files.some(f=>f.size>500*1048576)?' Large files are edited directly from your device storage.':''));
  if(Session.active&&!S.voiceOff&&!Brain.busy&&!Rec.active)Voice.say(n>1?`I have your ${n} files. What would you like to do with them?`:'Got it. What would you like to do with it?')}
async function deleteVersion(c,i){const v=c.versions[i];if(!v)return;c.versions.splice(i,1);await delMedia(v.id);if(c.sel&&c.sel.id===v.id)c.sel=null;await refreshThumb(c);await saveC(c);renderAfterChange(c)}
async function deleteUpload(c,id){const i=c.media.findIndex(m=>m.id===id);if(i<0)return;c.media.splice(i,1);await delMedia(id);if(c.sel&&c.sel.id===id)c.sel=null;await refreshThumb(c);await saveC(c);renderAfterChange(c)}
async function refreshThumb(c){const it=await currentItem(c);if(!it){c.thumb=null;c.kind=null;return}if(it.kind==='audio')return;const m=await DB.get('media',it.sel.id);if(m){c.thumb=await makeThumb(m.blob);c.kind=it.kind}}
async function softDelete(c){c.deleted=Date.now();await saveC(c,false);if(nav.v==='container'&&nav.id===c.id)goHome();else render();toast('Deleted. Say "undo" or "bring it back" until tomorrow.')}
function setVoiceOff(off){S.voiceOff=off;saveS();if(off){Voice.stop();Session.stop()}else if(started&&(Listen.ready()||Listen.engine==='browser'))Session.start();render()}

/* ---------- download ---------- */
async function downloadDialog(c,pre,fname){const it=await currentItem(c);if(!it)return toast('Nothing to download yet.');
  const fm=it.kind==='video'?['MP4','WebM','MP3','GIF']:it.kind==='audio'?['MP3','Original']:['PNG','JPEG','WebP','GIF'];
  const want=(pre&&pre.length?pre:[fm[0]]).filter(f=>fm.includes(f));if(!want.length)want.push(fm[0]);
  const base=String(fname||c.name).replace(/\.[a-z0-9]{2,4}$/i,'').replace(/[\\/:*?"<>|]+/g,'').trim().slice(0,80)||'Spoken_PixelCraft';
  sheet('Download',`<span class="lbl">File name</span><input class="field" id="fname" value="${esc(base)}" aria-label="File name">
    <span class="lbl">Format</span><div class="fmts" role="group" aria-label="Formats">${fm.map(f=>`<button class="chip ${want.includes(f)?'on':''}" data-fmt="${f}" aria-pressed="${want.includes(f)}">${f}</button>`).join('')}</div>
    <p class="note">Choose one or more formats. Files are saved to your device's default Downloads folder.</p><p class="note" id="dlmsg" aria-live="polite"></p>
    <div class="btnrow"><button class="pbtn" data-act="openfolder">${I('folder')} Open folder</button><button class="pbtn prime" id="dlgo" data-act="dodl">${I('down')} Download</button></div>`);
  if(pre&&pre.length)glow('download')}
async function doDownload(){const c=byId(nav.id);const it=await currentItem(c);if(!it)return;const name=($('#fname').value.trim()||'Spoken_PixelCraft').replace(/[\\/:*?"<>|]+/g,'');const fmts=[...layer.querySelectorAll('.chip.on')].map(x=>x.dataset.fmt);
  const msg=t=>{const m=$('#dlmsg');if(m)m.textContent=t};const btn=$('#dlgo');btn.disabled=true;const m=await DB.get('media',it.sel.id);const blob=m.blob;let ok=0;
  const ext={PNG:['image/png','png'],JPEG:['image/jpeg','jpg'],WebP:['image/webp','webp']};
  for(const f of fmts){try{msg('Preparing '+f+'…');
      if(ext[f]){const out=blob.type===ext[f][0]?blob:await convertImage(blob,ext[f][0]);saveFile(out,name+'.'+ext[f][1])}
      else if(f==='GIF')saveFile(await gifFrom(blob,p=>msg('Preparing GIF… '+Math.round(p)+'%')),name+'.gif');
      else if(f==='MP3'){const r=await mp3From(blob);saveFile(r.blob,name+'.'+r.ext);if(r.ext!=='mp3')msg('MP3 was not available, so a WAV sound file was saved.')}
      else if(f==='Original')saveFile(blob,name+'.'+((blob.type.split('/')[1]||'bin').split(';')[0]));
      else{const want=f==='MP4'?'video/mp4':'video/webm';
        if(blob.type.startsWith(want))saveFile(blob,name+'.'+f.toLowerCase());
        else if(it.sel.t==='v'&&it.meta.tool==='make_video'&&pickMime(f.toLowerCase()).startsWith(want)){const r=await renderVideoPlan(it.meta.plan,c,{mime:f.toLowerCase(),onProgress:p=>msg('Preparing '+f+'… '+Math.round(p)+'%')});saveFile(r.blob,name+'.'+f.toLowerCase())}
        else{msg(f+' is not available for this video in this browser.');continue}}
      ok++;await sleep(500)}catch(e){msg('Could not prepare '+f+'. '+e.message)}}
  btn.disabled=false;if(ok){msg('Saved to your Downloads folder.');if(!S.voiceOff)Voice.say(ok>1?'Downloaded in '+ok+' formats.':'Downloaded.')}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-open],[data-scrim]');if(!t)return;
  if(t.dataset.scrim){if(e.target===t)closeLayer();return}
  const d=t.dataset,c=nav.v==='container'?byId(nav.id):null;
  if(d.open){go('container',{id:d.open});return}
  if(d.go){go(d.go);return}
  if(d.ren){const k=byId(d.ren);nameDialog('Rename container',k.name,async v=>{k.name=v;await saveC(k);render()});return}
  if(d.del){const k=byId(d.del);ask('Delete container?','"'+k.name+'" will be removed. You can say "undo" or "bring it back" until tomorrow.','Delete',true,()=>softDelete(k));return}
  if(d.pick&&c){const [tp,id]=d.pick.split(':');c.sel={t:tp,id};saveC(c,false);renderPreviewOnly();$$('.ver').forEach(v=>v.classList.toggle('cur',v.dataset.thumb===id));return}
  if(d.vdel&&c){const [tp,id]=d.vdel.split(':');const lbl=tp==='v'?'Version '+(c.versions.findIndex(v=>v.id===id)+1):'this upload';ask('Delete '+lbl+'?','It will be removed from this container.','Delete',true,()=>tp==='v'?deleteVersion(c,c.versions.findIndex(v=>v.id===id)):deleteUpload(c,id));return}
  if(d.fmt){const on=!t.classList.contains('on');if(!on&&layer.querySelectorAll('.chip.on').length===1)return;t.classList.toggle('on',on);t.setAttribute('aria-pressed',on);return}
  if(d.vc){S.voice=d.vc;saveS();render();Bg.add('phrases-'+S.voice,()=>Voice.precache(PHRASES));const wasOff=S.voiceOff;S.voiceOff=false;Voice.say(S.voice==='female'?'This is the female voice.':'This is the male voice.');S.voiceOff=wasOff;return}
  if(d.sec!==undefined){const i=+d.sec;openSec=openSec===i?-1:i;$$('.sec').forEach((s,j)=>{s.classList.toggle('open',j===openSec);s.querySelector('.sech').setAttribute('aria-expanded',j===openSec)});return}
  if(d.kcopy!==undefined){const k=S.keys[+d.kcopy];const done=()=>toast('Key '+(+d.kcopy+1)+' copied.');if(navigator.clipboard)navigator.clipboard.writeText(k.key).then(done,()=>toast('Could not copy.'));return}
  if(d.kdel!==undefined){const i=+d.kdel;ask('Delete Key '+(i+1)+'?','This key will be removed from this device.','Delete',true,()=>{S.keys.splice(i,1);saveS();renderKeys()});return}
  if(d.rest){ask('Restore this backup?','Its containers are added to Home marked (Restored). Containers restored earlier from the same backup are replaced.','Restore',false,async()=>{toast('Restoring…');try{const r=await Backup.restore(+d.rest);const m=r.replaced?'Restored. The earlier restored containers were replaced.':`Restored ${r.added} container${r.added===1?'':'s'}. They are marked Restored on Home.`;toast(m);if(!S.voiceOff)Voice.say(m)}catch(er){toast('The backup could not be restored.')}});return}
  switch(d.act){
    case 'back':history.back();break;
    case 'close':closeLayer();break;
    case 'new':nameDialog('New container','Container '+(liveCS().length+1),async v=>{const k=newContainer(v);CS.push(k);await saveC(k);go('container',{id:k.id})});break;
    case 'reccancel':Rec.cancel();break;case 'recstop':Rec.stop();break;
    case 'voice':if(S.voiceOff)break;if(Rec.active){Rec.stop();break}if(Session.active||Voice.speaking){Voice.stop();Session.stop()}else{Voice.unlock();if(!Listen.ready()&&Listen.engine!=='browser'){toast('Voice will start as soon as the essential components are ready.');Session.start();break}Session.start().then(()=>Voice.say('I am listening.'))}break;
    case 'voiceoff':setVoiceOff(!S.voiceOff);break;
    case 'yt':sheet('Add YouTube link',`<input class="field" id="yt" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=" aria-label="YouTube link"><p class="note">The app watches the video to understand it, so it can create something in a similar style. YouTube videos cannot be downloaded.</p><button class="pbtn prime" data-act="ytsave">${I('link')} Add link</button>`);break;
    case 'ytsave':{const v=$('#yt').value.trim();if(!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(v)){toast('Paste a full YouTube link.');break}closeLayer();if(c){c.links=[...new Set([...(c.links||[]),v])];saveC(c)}toast('Link added for the AI to watch.');if(!S.voiceOff&&Session.active)Voice.say('Link added. What would you like me to do with it?');break}
    case 'req':openRequirement();break;
    case 'chat':toggleChat(!nav.chat);break;
    case 'send':{const ta=$('#ta'),v=ta.value.trim();if(!v||!c)break;c.chat.push({me:true,t:v,ts:Date.now()});ta.value='';ta.style.height='';saveC(c);renderChatOnly();handleText(v,'chat');break}
    case 'download':if(c)downloadDialog(c);break;
    case 'dodl':doDownload();break;
    case 'openfolder':if(window.showOpenFilePicker)window.showOpenFilePicker({startIn:'downloads'}).catch(()=>{});else toast('Open the Downloads folder from your phone\'s Files app.');break;
    case 'createkey':openCreateKey();break;case 'goaistudio':goAIStudio();break;case 'pastekey':openPasteKey();break;case 'dopaste':doPasteKey();break;
    case 'savekey':saveKey($('#keyin')&&$('#keyin').value);break;
    case 'setbk':Backup.setup().then(()=>{toast('Backup is set up.');if(!S.voiceOff)Voice.say('Backup is set up. Your work will be kept safe automatically.');renderBackup()}).catch(er=>{if(er&&er.name!=='AbortError')toast('The folder could not be used. Please try another folder.')});break;
    case 'allowbk':Backup.allow().then(()=>renderBackup());break;
    case 'offbk':ask('Turn off backup?','New backups stop. Files already in the folder are kept.','Turn off',true,async()=>{Backup.mode=null;Backup.dir=null;await DB.del('kv','backup');renderBackup()});break;
    case 'expbk':Backup.exportFile().catch(()=>toast('The backup file could not be saved.'));break;
  }});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&e.target.id==='ta'){e.preventDefault();$('[data-act=send]').click()}if(e.key==='Enter'&&e.target.id==='keyin')$('[data-act=savekey]').click();if(e.key==='Enter'&&e.target.id==='yt')$('[data-act=ytsave]').click();if(e.key==='Escape')closeLayer();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('label[role=button]')){e.preventDefault();const i=e.target.querySelector('input');if(i)i.click()}});
document.addEventListener('focusin',e=>{if(e.target.id==='ta'){const v=$('#cview');if(v)v.classList.add('kb');document.body.classList.add('kb')}});
document.addEventListener('focusout',e=>{if(e.target.id==='ta')setTimeout(()=>{if(!document.activeElement||document.activeElement.id!=='ta'){const v=$('#cview');if(v)v.classList.remove('kb');document.body.classList.remove('kb')}},150)});
document.addEventListener('input',e=>{if(e.target.id==='ta'){e.target.style.height='auto';e.target.style.height=Math.min(140,e.target.scrollHeight)+'px'}});

/* ---------- camera recording with teleprompter ---------- */
const Rec={active:false,opening:false,stream:null,rec:null,chunks:[],c:null,a:null,bgStart:0,t0:0,timer:null,raf:0,el:null,playInfo:null,
  async open(c,a){if(this.active||this.opening)return;this.opening=true;this.c=c;this.a=a||{};this.playInfo=null;Voice.stop();
    const el=document.createElement('div');el.className='recl';el.setAttribute('role','dialog');el.setAttribute('aria-label','Camera recording');
    el.innerHTML=`<video class="recbg" id="recbg" playsinline></video><video class="recpv ${this.a.play?'pip':'full'} ${this.a.camera==='back'?'':'mirror'}" id="recpv" muted playsinline autoplay></video>
      ${this.a.script?`<div class="prompter" aria-hidden="true"><div class="ptext" id="ptext">${esc(this.a.script)}</div></div>`:''}
      <div class="rectop"><span class="recdot"></span><span id="rect">Getting ready</span></div><div class="countdown" id="rcd" aria-live="assertive"></div>
      <div class="recbar"><button class="ibtn" data-act="reccancel" aria-label="Cancel recording">${I('x')}</button><button class="recstop" data-act="recstop" aria-label="Stop recording"><span></span></button><span style="width:42px"></span></div>`;
    document.body.appendChild(el);this.el=el;
    try{this.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:this.a.camera==='back'?'environment':'user',width:{ideal:1280},height:{ideal:720}},audio:{echoCancellation:true,noiseSuppression:true}})}
    catch(e){this.close();this.opening=false;toast('The camera could not open. Allow camera and microphone access for this site.');reply('The camera could not open. Please allow camera and microphone access for this site.','voice');return}
    $('#recpv').srcObject=this.stream;const bg=$('#recbg');
    if(this.a.play){const p=this.a.play,id=p.type==='version'?versionId(c,p.version):p.media_id;const m=id&&await DB.get('media',id);
      if(m&&/^video\//.test(m.type)){bg.src=URL.createObjectURL(m.blob);await once(bg,'loadedmetadata',8000);this.bgStart=clamp(num(p.start,0),0,Math.max(0,(bg.duration||1)-.1));bg.currentTime=this.bgStart;
        this.playInfo=p.type==='version'?{version:p.version||c.versions.length,start:this.bgStart,id}:{media_id:id,start:this.bgStart,id}}else this.a.play=null}
    if(!this.a.play)bg.remove();
    this.opening=false;this.active=true;wakeOn();setPill();
    if(this.a.countdown!==false){const cd=$('#rcd');for(const n of[3,2,1]){if(!this.el)return;cd.textContent=n;cd.classList.remove('pulse');void cd.offsetWidth;cd.classList.add('pulse');await sleep(900)}if(cd)cd.textContent=''}
    if(!this.el)return;
    const mt=pickMime('mp4');this.chunks=[];this.rec=new MediaRecorder(this.stream,mt?{mimeType:mt}:{});this.rec.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};this.rec.start(1000);this.t0=Date.now();
    if(this.a.play){bg.muted=false;bg.play().catch(()=>{bg.muted=true;bg.play().catch(()=>{})})}
    const rect=$('#rect');this.timer=setInterval(()=>{const s=Math.floor((Date.now()-this.t0)/1000);if(rect)rect.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
    const pt=$('#ptext');if(pt){const words=this.a.script.split(/\s+/).length,dur=Math.max(6,words/2.3)*1000,st=performance.now(),h=pt.scrollHeight;const step=()=>{if(!this.active)return;const p=Math.min(1,(performance.now()-st)/dur);pt.style.transform=`translateY(${-p*Math.max(0,h-80)}px)`;if(p<1)this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)}},
  async stop(){if(!this.active||!this.rec)return this.close();this.active=false;clearInterval(this.timer);cancelAnimationFrame(this.raf);const secs=(Date.now()-this.t0)/1000;
    const stopped=once(this.rec,'stop',6000);try{this.rec.stop()}catch(e){}await stopped;const type=(this.rec.mimeType||'video/webm').split(';')[0];const blob=new Blob(this.chunks,{type});const c=this.c,played=this.playInfo;this.close();
    if(!blob.size){toast('Nothing was recorded.');return}
    const id=await addMedia(c.id,blob,{name:'Camera recording'});c.media.push({id,type,name:'Camera recording',size:blob.size,duration:Math.round(secs*10)/10,recorded_with:played?{media:played.id,start:played.start}:null});c.sel={t:'m',id};if(!c.thumb)c.thumb=await makeThumb(blob);if(!c.kind)c.kind='video';await saveC(c);renderAfterChange(c);
    handleText(`[app] The camera recording was saved as media_id ${id}, ${Math.round(secs)} seconds long${played?`, recorded while media ${played.id} played from second ${played.start}`:''}. Continue with what the user asked for, or ask what to do next.`,'voice',{fallback:()=>localRecordFollowup(c,id,secs,played)})},
  close(){this.active=false;clearInterval(this.timer);cancelAnimationFrame(this.raf);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}
    if(this.el){const bg=this.el.querySelector('#recbg');if(bg&&bg.src){bg.pause();URL.revokeObjectURL(bg.src)}this.el.remove();this.el=null}setPill();wakeOffIfIdle()},
  cancel(){if(this.rec&&this.rec.state!=='inactive'){this.rec.ondataavailable=null;try{this.rec.stop()}catch(e){}}this.close();toast('Recording cancelled.')}
};

/* ---------- API keys: create in a separate window or tab, then one-tap paste ---------- */
const AISTUDIO='https://aistudio.google.com/apikey';
function openCreateKey(){sheet('Create a free key',`<ol class="steps"><li>Sign in with your Google account.</li><li>Tap <b>Create API key</b>, and choose or create a project.</li><li>Copy the key.</li><li>${matchMedia('(min-width:900px) and (pointer:fine)').matches?'Close that window':'Press Back until you return here'}, then tap <b>Paste key</b>.</li></ol>
  <button class="pbtn prime big" data-act="goaistudio">${I('ext')} Open Google AI Studio</button>`);
  if(!S.voiceOff)Voice.say('After copying your key, press Back until you return here, then tap Paste key.')}
function goAIStudio(){closeLayer();LS.set('spc.keyflow',Date.now());Voice.stop();if(Session.active){Listen.stop();Session.paused=true}
  const desk=matchMedia('(min-width:900px) and (pointer:fine)').matches;let w=null;
  if(desk){const W=560,H=780,L=Math.max(0,(screen.availWidth-W)/2),T=Math.max(0,(screen.availHeight-H)/2);w=window.open(AISTUDIO,'aistudio',`popup=yes,width=${W},height=${H},left=${L},top=${T}`);
    if(w){const iv=setInterval(()=>{if(w.closed){clearInterval(iv);keyflowReturn()}},700)}}
  if(!w)w=window.open(AISTUDIO,'_blank');if(!w){location.href=AISTUDIO}}
function keyflowReturn(){if(!LS.get('spc.keyflow'))return;LS.del('spc.keyflow');if(Session.paused){Session.paused=false;if(Session.active)Listen.start().catch(()=>{})}if(nav.v!=='keys')go('keys');setTimeout(()=>{openPasteKey();if(!S.voiceOff)Voice.say('Welcome back. Tap Paste key to save the key you copied.')},250)}
function openPasteKey(){sheet('Paste your key',`<p class="note center">Tap Paste key to save the key you copied from Google AI Studio.</p><button class="pbtn prime big" id="pastego" data-act="dopaste">${I('key')} Paste key</button>
  <div id="pastemanual" hidden><input class="field" id="keyin" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Or paste it here yourself" aria-label="Paste your key"><button class="pbtn" data-act="savekey">Save</button></div><p class="note center" id="pastemsg" aria-live="polite"></p>`);
  setTimeout(()=>{const b=$('#pastego');if(b){b.focus();b.classList.add('glow')}},120)}
const looksLikeKey=v=>/^[A-Za-z0-9_\-.]{30,}$/.test(v);
async function doPasteKey(){const msg=t=>{const m=$('#pastemsg');if(m)m.textContent=t};let v='';
  try{v=(await navigator.clipboard.readText()||'').trim()}catch(e){}
  if(!looksLikeKey(v)){msg(v?'The copied text does not look like a key. Please copy the key again, or paste it in the box.':'The app could not read the copied key. Please paste it in the box below.');const mb=$('#pastemanual');if(mb){mb.hidden=false;$('#keyin').focus()}return}
  saveKey(v)}
function saveKey(v){v=String(v||'').trim();if(!v){toast('Paste the key first.');return}if(S.keys.some(k=>k.key===v)){closeLayer();toast('This key is already saved.');return}
  const k={key:v,st:'checking'};S.keys.push(k);saveS();G.models=null;closeLayer();if(nav.v==='keys')renderKeys();toast(`Key ${S.keys.length} saved. Checking it now.`);if(!S.voiceOff)Voice.say('Key saved.');testKey(k)}

/* ---------- first-run setup: only the essential components (voice and speech recognition) ---------- */
const SETUP_MB=160;
const setupDone=()=>!!LS.get('spc.setup');
let setupRunning=false;
function showSetupCard(){const el=document.createElement('div');el.className='setup';el.id='setupcard';
  el.innerHTML=`<div class="scard" role="dialog" aria-modal="true" aria-labelledby="sch"><div class="sbadge">${I('spark')}</div><h2 id="sch">Initial app setup</h2>
    <p>Some critical components need to be downloaded for the initial app setup: the natural voice engine and the offline speech recognition model.</p>
    <div class="sfacts"><div><b>About ${SETUP_MB} MB</b><span>Total download</span></div><div><b>One time only</b><span>Saved on this device</span></div></div>
    <p class="small">This is required only on the first run; the components are saved and will not be downloaded again. Other components download quietly in the background later. You may switch to Wi-Fi to save your mobile data.</p>
    <button class="pbtn prime big" id="setupgo">${I('down')} Download</button><p class="small">Please tap Download when ready.</p></div>`;
  document.body.appendChild(el);$('#setupgo').onclick=startSetup;setTimeout(()=>$('#setupgo').focus(),100)}
function setBar(pct,text,state){const bar=$('#setupbar');if(!bar)return;bar.hidden=false;bar.dataset.state=state||'run';const C=2*Math.PI*20,f=$('#sbr');if(f)f.style.strokeDashoffset=C*(1-pct/100);
  const p=$('#sbp');if(p)p.textContent=state==='done'?'':Math.round(pct)+'%';const t=$('#sbt');if(t&&text)t.textContent=text}
function hideBar(ms){setTimeout(()=>{const b=$('#setupbar');if(b&&b.dataset.state==='done')b.hidden=true},ms)}
/* loads (or downloads) the voice engine and the speech model in parallel */
async function loadEssentials(onTick){const iv=setInterval(()=>onTick&&onTick(Essentials.pct()*100),350);
  const v=Voice.load().catch(e=>{throw e}),s=Listen.loadModel().catch(e=>e);
  try{await v;const r=await s;if(r instanceof Error&&!G.active().length&&!SR)throw r}finally{clearInterval(iv)}}
async function startSetup(){if(setupRunning)return;setupRunning=true;Voice.unlock();started=true;const card=$('#setupcard');if(card)card.remove();
  setBar(0,'Importing critical components for initial app setup','run');$('#sbmore').hidden=false;render();
  try{await loadEssentials(p=>setBar(p,null,'run'));setBar(100,'Setup complete. Everything is ready.','done');LS.set('spc.setup',1);hideBar(2600);setupRunning=false;
    if(!S.voiceOff){await Session.start();Voice.say(readyMessage())}
    Voice.synthRaw(Voice.sentences(PHRASES[0])[0]).then(()=>Voice.synthRaw(Voice.sentences(PHRASES[0])[1])).catch(()=>{});queueBackground()}
  catch(e){setupRunning=false;setBar(Essentials.pct()*100,'The download paused. Check your connection, then tap Retry.','fail')}}
function readyMessage(){const p=LS.get('spc.pending'),pc=p&&byId(p.cid);if(p&&!pc)LS.del('spc.pending');
  if(pc)return `The program is now ready. Last time, the generation in ${pc.name} from ${fmtDate(p.t)} was interrupted: ${p.summary}. Would you like me to continue it, or drop it?`;
  if(!G.active().length)return 'The program is now ready and completely functional. How may I help you today? To start creating with me, please add a free API key in the menu, under API keys. You can ask me how.';
  return 'The program is now ready and completely functional. How may I help you today?'}
/* background work: low priority, pauses while the user interacts */
const STARTER=['sunset sky','beach','mountains','flowers','forest','city skyline night','coffee cup','birthday cake','balloons','gift box','diya lamp','christmas tree','fireworks','rangoli','kerala backwaters','paper texture','abstract background','bokeh lights','food platter','tea'];
function queueBackground(){Bg.add('fonts',()=>ensureFonts());Bg.add('encoders',()=>FX.call('warm'));Bg.add('phrases',()=>Voice.precache(PHRASES));
  Bg.add('help-voice',()=>Voice.precache(HELP.map(h=>h.a+(h.offer?' '+h.offer:''))));
  Bg.add('cutout',()=>Promise.race([SEG.call('warm'),sleep(900000)]));
  if(!LS.get('spc.starter'))Bg.add('starter',async()=>{for(const q of STARTER){while(!Bg.free())await sleep(1500);try{await Lib.searchImages(q,2)}catch(e){}}LS.set('spc.starter',1)})}

/* ---------- start ---------- */
let started=false,hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();if(Session.active&&!Rec.active){Listen.stop()}return}
  housekeeping();if(LS.get('spc.keyflow')){keyflowReturn();return}
  if(Session.active&&!Session.paused){wakeOn();if(Listen.ready()||Listen.engine==='browser')Listen.start().catch(()=>{});if(Date.now()-hiddenAt>8000&&!Gen.running&&!Rec.active)Voice.say('I am listening.')}else if(Gen.running||Rec.active)wakeOn()});
window.addEventListener('pageshow',e=>{if(e.persisted&&Session.active)Listen.start().catch(()=>{})});
window.addEventListener('pagehide',()=>{if(nav.v==='container'){const c=byId(nav.id);if(c&&dirty.has(c.id))Backup.leave(c)}});
async function begin(){if(started)return;started=true;const st=$('#start');if(st)st.remove();Voice.unlock();
  if(Backup.needPerm)Backup.allow();
  const welcome=PHRASES[0];if(!S.voiceOff)Voice.say(welcome);
  setBar(2,'Loading the essential components into memory','run');
  try{await loadEssentials(p=>setBar(Math.max(3,p),null,'run'));setBar(100,'Ready.','done');hideBar(1500)}catch(e){setBar(Essentials.pct()*100,'The components could not load. Check your connection, then tap Retry.','fail');}
  queueBackground();
  if(S.voiceOff)return;await Session.start();Voice.say(readyMessage())}
(async()=>{applyMode();try{await DB.open()}catch(e){toast('This browser blocked storage. Your work cannot be saved here.')}
  try{CS=(await DB.all('containers'))||[]}catch(e){CS=[]}await Backup.init();
  history.replaceState({v:'home',depth:0},'');nav={v:'home',depth:0};render();setPill();
  $('#sbmenu').onclick=()=>go('menu');$('#sbkeys').onclick=()=>go('keys');$('#sbretry').onclick=()=>{Voice.loading=null;Voice.failed=false;setupRunning=false;if(setupDone()){started=false;begin()}else startSetup()};
  if(!setupDone()){const st=$('#start');if(st)st.remove();showSetupCard()}
  else{const st=$('#start');st.addEventListener('click',begin);st.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')begin()});
    setTimeout(()=>{Voice.cached(Voice.sentences(PHRASES[0])[0]);Voice.cached(Voice.sentences(PHRASES[0])[1])},50)}
  try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
  Voice.listeners.add(onVoiceStatus);
  setTimeout(()=>housekeeping(),4000);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  if(location.hash==='#spc-test')window.__spc={DB,CS:()=>CS,runTool,Gen,go,Voice,Session,heard,handleText,Rec,Backup,Bg,FX,Listen,Local,localUnderstand,expandTemplate,genTool,STW,Essentials};})();
