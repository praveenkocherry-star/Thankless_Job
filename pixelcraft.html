const LIB_PLAN=(()=>{const img=['sunset sky','beach','mountains','flowers','forest','city skyline night','coffee cup','birthday cake','balloons','gift box','diya lamp','christmas tree','fireworks','rangoli','kerala backwaters','paper texture','abstract background','bokeh lights','food platter','tea','biryani','dosa','restaurant interior','grocery shop','clothing store','jewellery','smartphone','laptop','house exterior','apartment interior','living room','kitchen','salon','dentist clinic','classroom','books','tools workshop','car','bike','wedding','temple','church','mosque','market','vegetables','fruits','spices','bakery','ice cream','pizza','sale banner background','gold texture','marble texture','wood texture','water drops','rain','clouds','stars night sky','autumn leaves','snow'];
  const mus=['soft piano','calm acoustic','happy upbeat','cinematic','corporate','lo-fi','ambient','devotional','indian','folk','jazz','kids','wedding','romantic','epic','classical','guitar','celebration','relaxing','motivational','retro','electronic','orchestral','meditation','christmas'];
  const vid=['ocean waves','city traffic','fireworks','clouds timelapse','rain','forest','flowers','sunset','birds flying','waterfall','snow falling','candles','city night','beach','river','trees wind','market','cooking','road driving','sky'];
  const out=[];const n=Math.max(img.length,mus.length,vid.length);for(let i=0;i<n;i++){if(img[i])out.push(['image',img[i],3]);if(mus[i])out.push(['audio',mus[i],3]);if(vid[i])out.push(['video',vid[i],2])}return out})();
const Library={running:false,paused:false,state:'',TARGET:500*1048576,
  ok(){return LS.get('spc.libok')},
  maybeAsk(){if(this.ok()!==null||!started||Rec.active||Tour.active||S.manual)return;if(Gen.running||!Bg.free()||$('#layer').innerHTML){setTimeout(()=>this.maybeAsk(),20000);return}
    sheet('Build your free library?',`<p class="note center">May I download a starter library of free images, video clips and music, about 500 MB, in the background on Wi-Fi only? It makes your creations richer. It keeps growing later as your requests need more.</p><div class="btnrow"><button class="pbtn" data-act="libno">${I('x')} Not now</button><button class="pbtn prime" data-act="libyes">${I('down')} Download on Wi-Fi</button></div>`);
    Voice.say('May I download a starter library of free images, video clips and music, about 500 megabytes, in the background on Wi-Fi only? Tap Download, or Not now.',{force:true});if(!LS.get('spc.toured'))setTimeout(offerTour,60000)},
  consent(yes){LS.set('spc.libok',yes?1:0);closeLayer();Voice.stop();Voice.say(yes?'Thank you. I will build the library quietly on Wi-Fi while you work.':'Okay. I will fetch free media only when you ask for it.',{force:true});if(yes)this.resume();if(nav.v==='library')renderLibrary();if(!LS.get('spc.toured'))setTimeout(offerTour,4000)},
  toggle(){this.paused=!this.paused;if(!this.paused)this.resume();renderLibrary()},
  resume(){if(this.ok()!==1||this.running)return;this.run()},
  async run(){this.running=true;try{let i=LS.get('spc.libi',0)||0;
      while(i<LIB_PLAN.length){if(this.paused){this.state='Paused';await sleep(3000);continue}
        if(!onWifi()){this.state='Waiting for Wi-Fi';await sleep(60000);continue}
        if(!Bg.free()||document.hidden){this.state='Waiting until you are idle';await sleep(2500);continue}
        if((LS.get('spc.libbytes',0)||0)>=this.TARGET)break;
        const [k,q,n]=LIB_PLAN[i];this.state='Downloading '+(k==='audio'?'music':k==='video'?'video clips':'images')+': '+q;if(nav.v==='library')updateLibStatus();
        const before=(await Lib.stats()).bytes;try{if(k==='image')await Lib.searchImages(q,n);else if(k==='audio')await Lib.searchMusic(q,n);else await Lib.searchVideos(q,n)}catch(e){}
        const after=(await Lib.stats()).bytes;LS.set('spc.libbytes',(LS.get('spc.libbytes',0)||0)+Math.max(0,after-before));i++;LS.set('spc.libi',i);await sleep(1500)}
      this.state='Starter library complete';LS.set('spc.libdone',1)}finally{this.running=false;if(nav.v==='library')renderLibrary()}}};
async function renderLibrary(){return renderLibraryPage()}
function updateLibStatus(){const e=$('#libstat');if(e)e.textContent=(Library.state||'')+' · '+plainSize(LS.get('spc.libbytes',0)||0)+' of about 500 MB'}

    const r=await VOE.line('Hello! This is how I sound in your videos.',style);btn&&btn.classList.remove('busy');const ac=Listen.ac||new AudioContext();const b=ac.createBuffer(1,r.audio.length,r.sr);b.copyToChannel(r.audio,0);const s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start();voPlay=s;if(nav.v==='voice'&&$('[data-act=voeload]'))renderVoice()}

  async open(c,mode){const it=await currentItem(c);let plan;

      else plan={width:it.meta.w||1080,height:it.meta.h||1080,base:it.sel.t==='v'?{type:'version',version:c.versions.findIndex(x=>x.id===it.sel.id)+1}:{type:'upload',media_id:it.sel.id},fit:'cover',layers:[]};
      this.from=it.sel}

  async mix(total,only){const sr=44100,ctx=new OfflineAudioContext(2,Math.ceil(total*sr),sr);const list=only?[only]:this.tracks().filter(t=>t.source!=='original');

  async fileResult(){const b=this.buf,sr=b.sampleRate,a=Math.floor(this.sel[0]*b.length),z=Math.floor(this.sel[1]*b.length),n=Math.max(1,z-a),ctx=new OfflineAudioContext(b.numberOfChannels,n,sr);const part=ctx.createBuffer(b.numberOfChannels,n,sr);

document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.act==='editaudio'){const c=byId(nav.id);if(c)AudEd.open(c);return}

  switch(d.act){
    case 'aclose':if(AudEd.hist.length)ask('Close the audio editor?','Your changes are not saved.','Close',true,()=>AudEd.close());else AudEd.close();return;
    case 'aundo':return AudEd.undo();case 'aplay':return AudEd.toggle();case 'asave':return AudEd.save();
    case 'aaddmusic':return AudEd.pickSheet('music');case 'aaddsfx':return AudEd.pickSheet('sfx');case 'aaddfile':return AudEd.pickSheet('file');case 'aaddrec':return AudEd.pickSheet('rec');

    case 'amsearch':{const q=($('#amq')||{}).value||'';if(!q.trim())return;const box=$('#amres');box.innerHTML='<p class="note">Searching…</p>';Lib.searchMusic(q,5).then(r=>{box.innerHTML=r.length?r.map(x=>`<button class="chip" data-alib="${x.asset_id}">${I('music')} ${esc((x.title||'Music').slice(0,28))}</button>`).join(''):'<p class="note">Nothing found. Try other words, or use a built-in style.</p>'}).catch(()=>{box.innerHTML='<p class="note">The free music library could not be reached.</p>'});return}
    case 'acutmid':{const d0=AudEd.buf.duration;sheet('Cut out a middle part',`${slider('acuta','From second',0,Math.round(d0*10)/10,Math.round(d0*.4*10)/10,.1)}${slider('acutb','To second',0,Math.round(d0*10)/10,Math.round(d0*.6*10)/10,.1)}<button class="pbtn prime" data-act="acutgo">${I('scissors')} Cut it out</button>`);return}
    case 'acutgo':{const a=+$('[data-ed=acuta]').value,b2=+$('[data-ed=acutb]').value;closeLayer();if(!(b2>a))return toast('The end must be after the start.');const B=AudEd.buf,sr=B.sampleRate,ia=Math.floor(a*sr),ib=Math.floor(b2*sr),n=B.length-(ib-ia);const out=new AudioBuffer({length:n,numberOfChannels:B.numberOfChannels,sampleRate:sr});
      for(let c=0;c<B.numberOfChannels;c++){const s=B.getChannelData(c),o=out.getChannelData(c);o.set(s.subarray(0,ia),0);o.set(s.subarray(ib),ia)}AudEd.push();AudEd.buf=out;AudEd.sel=[0,1];AudEd.panel();toast('Cut out '+Math.round((b2-a)*10)/10+' seconds.');return}

  main.innerHTML=`<section class="view">${vtitle('Library')}<div class="list">
    <div class="seg seg4 libtabs" role="tablist" aria-label="Library sections" id="libtabs">${Object.entries(LIB_KINDS).map(([k,t])=>`<button role="tab" data-libtab="${k}" aria-selected="${k===libTab}" aria-pressed="${k===libTab}">${t} <small>${k==='mine'?all.filter(a=>a.mine).length:(st[k]||0)}</small></button>`).join('')}</div>
    <div class="card libbrowse" id="libbrowse">${items.length?`<div class="libgrid ${libTab==='audio'?'aud':''}">${items.slice(0,120).map(a=>`<div class="libitem ${a.kind}">${a.kind==='audio'?`<button class="lprow" data-libplay="${a.id}" aria-label="Play ${esc(a.title||'music')}">${I('play')}<span>${esc((a.title||'Music').slice(0,40))}</span></button>`:`<button class="lpcell" data-libview="${a.id}" aria-label="View ${esc(a.title||a.kind)}"><img data-lpth="${a.id}" alt="">${a.kind==='video'?`<span class="pk">${I('video')}</span>`:''}</button>`}
        <div class="libacts"><button class="mini" data-libshare="${a.id}" aria-label="Share ${esc(a.title||'')}">${I('share')}</button><button class="mini" data-libdl="${a.id}" aria-label="Download ${esc(a.title||'')}">${I('down')}</button><button class="mini del" data-libdel="${a.id}" aria-label="Delete ${esc(a.title||'')} from the library">${I('trash')}</button></div></div>`).join('')}</div>`
      :`<p class="note">${libTab==='mine'?'Nothing yet. Use the library icon on a preview to add your own images, videos and sounds here.':'Nothing here yet. Search in any editor, or download the starter library below.'}</p>`}</div>
    <div class="card"><h2>On this device</h2><p class="note">${plainSize(st.bytes||0)} in all. Only free, public-domain or openly licensed media is fetched, and the library keeps growing as your requests need more.</p></div>
    <div class="card"><h2>Starter library</h2>${ok===1?`<p class="note" id="libstat">${LS.get('spc.libdone')?'Complete.':esc(Library.state||'Starting soon')} · ${plainSize(got)} of about 500 MB</p><div class="bar"><span style="width:${Math.min(100,Math.round(got/Library.TARGET*100))}%"></span></div>${LS.get('spc.libdone')?'':`<button class="pbtn" data-act="libpause">${I(Library.paused?'down':'x')} ${Library.paused?'Resume':'Pause'}</button>`}`
      :`<p class="note">About 500 MB of free images, video clips and music, downloaded in the background on Wi-Fi only.</p><button class="pbtn prime" data-act="libyes">${I('down')} Download on Wi-Fi</button>`}</div></div></section>`;
  for(const im of main.querySelectorAll('[data-lpth]'))libThumb(im.dataset.lpth).then(u=>{if(u)im.src=u})}
let libAudio=null;
function libExt(a){return ((a.blob.type||'').split('/')[1]||'bin').split(';')[0].replace('jpeg','jpg').replace('mpeg','mp3')}
document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.lpk){LibPick.kind=d.lpk;LibPick.render();return}
  if(d.act==='lpsearch'){LibPick.search();return}
  if(d.lppick){LibPick.pick(d.lppick);return}
  if(d.libtab){libTab=d.libtab;renderLibraryPage();return}
  if(d.libplay){if(libAudio){libAudio.pause();URL.revokeObjectURL(libAudio.src);const same=libAudio.dataset.id===d.libplay;libAudio=null;if(same)return}const a=await Lib.get(d.libplay);if(!a)return;libAudio=new Audio(URL.createObjectURL(a.blob));libAudio.dataset.id=d.libplay;libAudio.play().catch(()=>toast('This sound could not be played.'));return}
  if(d.libview){const a=await Lib.get(d.libview);if(!a)return;const u=URL.createObjectURL(a.blob);sheet(a.title||'Library item',`<div class="libview">${a.kind==='video'?`<video src="${u}" controls playsinline autoplay></video>`:`<img src="${u}" alt="${esc(a.title||'')}">`}</div><p class="note">${esc([a.source,a.licence,a.author].filter(Boolean).join(' · '))}</p>`);return}
  if(d.libshare){const a=await Lib.get(d.libshare);if(!a)return;const f=new File([a.blob],(a.title||'Spoken_PixelCraft').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'_')+'.'+libExt(a),{type:a.blob.type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:a.title})}catch(er){}}else toast('Sharing files is not supported in this browser. Use Download instead.');return}
  if(d.libdl){const a=await Lib.get(d.libdl);if(a){saveFile(a.blob,(a.title||'Spoken_PixelCraft').replace(/[\\/:*?"<>|]+/g,'')+'.'+libExt(a));toast('Saved to your Downloads folder.')}return}
  if(d.libdel){const a=await DB.get('assets',d.libdel);ask('Delete from the library?','"'+((a&&a.title)||'This item')+'" will be removed from the library. Versions in your containers are not affected.','Delete',true,async()=>{await DB.del('assets',d.libdel);thumbCache.delete(d.libdel);renderLibraryPage();toast('Deleted from the library.')});return}
  if(d.act==='addlib'){const c=byId(nav.id);if(!c)return;const r=await addToLibrary(c);toast(r.error?r.error:r.already?'This is already in your library.':'Added to your library, under My creations.');return}
  /* the editors pick from the library */
  if(d.act==='edlib'&&Ed.on){LibPick.open({kinds:['image'],title:'Background from the library',onPick:x=>Ed.change(p=>{p.base={type:'asset',asset_id:x.asset_id};p.fit=p.fit||'cover'},true)});return}
  if(d.act==='edliblayer'&&Ed.on){LibPick.open({kinds:['image'],title:'Picture from the library',onPick:x=>Ed.addLayer({kind:'image',source:{type:'asset',asset_id:x.asset_id},w:40,x:50,y:50,radius:4})});return}
  if(d.act==='vlib'&&VidEd.on){LibPick.open({kinds:['video','image'],title:'Clips and photos from the library',onPick:x=>VidEd.addScene({type:'asset',asset_id:x.asset_id})});return}
  if(d.act==='alib'&&AudEd.on){LibPick.open({kinds:['audio'],title:'Music from the library',onPick:x=>AudEd.add({source:'library',asset_id:x.asset_id,volume:55})});return}
});

/* ============================================================
   Swipes, as extras to the icons and voice:
   1. preview: left or right for the next or previous version or upload
   2. down on a pop-up, the requirement panel or the messages panel: close it
   3. video editor scene preview: left or right for the next or previous scene
   4. Library page: left or right between the sections
   ============================================================ */
function stepPreview(dir){const c=byId(nav.id);if(!c)return false;const items=[...c.versions.map((v,i)=>({t:'v',id:v.id,label:'Version '+(i+1)})),...c.media.map((m,i)=>({t:'m',id:m.id,label:'Upload '+(i+1)}))];
  if(items.length<2)return false;let i=items.findIndex(x=>c.sel&&x.id===c.sel.id);if(i<0)i=items.length-1;const j=i+dir;const pv=$('#preview');
  if(j<0||j>=items.length){if(pv){pv.classList.remove('swipenudge-l','swipenudge-r');void pv.offsetWidth;pv.classList.add(dir>0?'swipenudge-l':'swipenudge-r')}toast(dir>0?'This is the last one.':'This is the first one.');return true}
  const it=items[j];c.sel={t:it.t,id:it.id};saveC(c,false);renderPreviewOnly().then(()=>{const p2=$('#preview');if(p2){p2.classList.remove('swipenudge-l','swipenudge-r');void p2.offsetWidth;p2.classList.add(dir>0?'swipenudge-l':'swipenudge-r')}});
  $$('.ver').forEach(v=>v.classList.toggle('cur',v.dataset.thumb===it.id));toast(it.label);return true}
function stepScene(dir){if(!VidEd.on||!VidEd.plan)return false;const n=VidEd.plan.scenes.length;if(n<2)return false;const j=VidEd.si+dir;
  if(j<0||j>=n){toast(dir>0?'This is the last scene.':'This is the first scene.');return true}VidEd.si=j;VidEd.sel=-1;VidEd.refresh();toast('Scene '+(j+1));return true}
function stepLibrary(dir){const ks=Object.keys(LIB_KINDS);const j=ks.indexOf(libTab)+dir;if(j<0||j>=ks.length)return false;libTab=ks[j];renderLibraryPage().then(()=>{const m=$('#libbrowse');if(m){m.classList.add(dir>0?'swipenudge-l':'swipenudge-r')}});toast(LIB_KINDS[libTab]);return true}
let swp=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1){swp=null;return}const p=e.touches[0],tg=e.target;
  swp={x:p.clientX,y:p.clientY,t:Date.now(),tg,vsel:VidEd.on?VidEd.sel:-1,
    /* a touch that starts on a slider, text box, or a video's own controls is never a swipe */
    skip:!!tg.closest('input,textarea,select,.edpanel,.timeline,.strip,.edtabs')||(tg.tagName==='VIDEO'&&p.clientY>tg.getBoundingClientRect().bottom-56)}},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{if(swp&&e.touches.length!==1)swp=null},{passive:true,capture:true});
document.addEventListener('touchend',e=>{const s=swp;swp=null;if(!s||s.skip)return;const p=e.changedTouches[0];const dx=p.clientX-s.x,dy=p.clientY-s.y,dt=Date.now()-s.t,ax=Math.abs(dx),ay=Math.abs(dy);if(dt>900)return;
  const tg=s.tg;
  /* swipe down closes */
  if(dy>70&&ay>ax*1.4){
    const sh=tg.closest('.sheet');
    if(sh&&sh.scrollTop<=2){closeLayer();return}
    const rp=tg.closest('.reqpanel');if(rp&&rp.scrollTop<=2){toggleReq(false);return}
    const ch=tg.closest('.chat');if(ch){const ms=$('#msgs');if(tg.closest('.grab')||!ms||ms.scrollTop<=2||!tg.closest('.msgs')){toggleChat(false);return}}
    return}
  if(ax>60&&ax>ay*1.5){const dir=dx<0?1:-1;
    if(VidEd.on&&tg.closest('#vstage')&&s.vsel<0&&VidEd.sel<0&&!VidEd.previewing){stepScene(dir);return}
    if(!VidEd.on&&!Ed.on&&nav.v==='container'&&tg.closest('#preview')){stepPreview(dir);return}
    if(nav.v==='library'&&tg.closest('#main')&&!tg.closest('#layer')){stepLibrary(dir);return}}
},{passive:true,capture:true});


</script>
