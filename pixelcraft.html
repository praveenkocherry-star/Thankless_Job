<!doctype html>
<html lang="en" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0B0C0E">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Special PixelCraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Great+Vibes&display=swap">
<style>
/* ---------- Colour design: "Midnight Iris". Fixed scheme; only light and dark change. ---------- */
:root,[data-mode="dark"]{
  --bg:#0A0A0C;--bg2:#0F0F13;--surface:#15151A;--surface2:#1C1C23;--surface3:#24242D;
  --line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.14);--line3:rgba(255,255,255,.22);
  --text:#F4F4F6;--muted:#A0A0AC;--faint:#6C6C78;
  --accent:#7B83F7;--accent2:#A88EFA;--glow:rgba(123,131,247,.38);
  --sel:#6E76F2;--onsel:#FFFFFF;
  --danger:#FF6B6B;--ok:#4ADE80;--warn:#F5B84A;
  --scrim:rgba(5,5,8,.62);--glass:rgba(21,21,26,.72);
  --shadow:0 18px 40px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  --shadow-s:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
[data-mode="light"]{
  --bg:#F3F3F6;--bg2:#FAFAFC;--surface:#FFFFFF;--surface2:#F1F1F5;--surface3:#E7E7EE;
  --line:rgba(16,16,24,.07);--line2:rgba(16,16,24,.13);--line3:rgba(16,16,24,.22);
  --text:#121216;--muted:#62626E;--faint:#9A9AA6;
  --accent:#565EE6;--accent2:#7D5CF0;--glow:rgba(86,94,230,.28);
  --sel:#D8DAFF;--onsel:#0B0B12;
  --danger:#D93D3D;--ok:#1E9E57;--warn:#B7791F;
  --scrim:rgba(240,240,246,.6);--glass:rgba(255,255,255,.78);
  --shadow:0 18px 40px rgba(20,20,40,.14),0 2px 6px rgba(20,20,40,.08);
  --shadow-s:0 6px 18px rgba(20,20,40,.1);
  color-scheme:light;
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .35s ease,color .35s ease}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}
::selection{background:var(--glow)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:1280px;margin:0 auto;position:relative}

/* ---------- header ---------- */
.hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px}
.brandwrap{display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:26px;height:26px;border-radius:7px;object-fit:cover;flex:none;box-shadow:0 0 0 1px var(--line2)}
.name{font-size:1.38rem;font-weight:500;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.name .cal{font-family:"Great Vibes",cursive;font-weight:400;font-size:2.05rem;line-height:.6;margin-right:1px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 2px}
.name .gap{display:inline-block;width:.32em}
.tagline{font-size:.74rem;color:var(--muted);letter-spacing:.06em;padding-left:36px}
.hbtns{display:flex;gap:8px;align-items:center}
.ibtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s ease,background .2s,border-color .2s,box-shadow .2s}
.ibtn:hover{border-color:var(--line3)}
.ibtn:active{transform:scale(.94);background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.ibtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.mode svg{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .3s}
.mode .sun{position:absolute;opacity:0;transform:rotate(-90deg) scale(.6)}
[data-mode="light"] .mode .sun{opacity:1;transform:none}
[data-mode="light"] .mode .moon{opacity:0;transform:rotate(90deg) scale(.6)}
.mode{position:relative}
.rule{flex:none;height:1px;background:linear-gradient(90deg,transparent,var(--line2) 12%,var(--line2) 88%,transparent);margin:0 0 2px}

/* ---------- views ---------- */
.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:18px 18px calc(110px + env(safe-area-inset-bottom,0px));animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vtitle{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.vtitle h1{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.88rem;margin:0}

/* ---------- home grid ---------- */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 12px}
@media (max-width:379px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px}}
@media (min-width:960px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (min-width:1180px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.cell{display:flex;flex-direction:column;gap:7px}
.tile{position:relative;aspect-ratio:1;border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s,border-color .2s}
.tile:hover{border-color:var(--line3)}
.tile:active{transform:scale(.965);box-shadow:0 0 0 4px var(--glow)}
.tile .art{position:absolute;inset:0}
.tile.empty{background:linear-gradient(160deg,var(--surface),var(--surface2))}
.tile.empty::after{content:"";position:absolute;inset:26%;border-radius:12px;border:1.5px dashed var(--line2)}
.badge{position:absolute;right:8px;bottom:8px;width:24px;height:24px;border-radius:8px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--text);border:1px solid var(--line2)}
.badge svg.i{width:14px;height:14px}
.cap{display:flex;align-items:flex-start;gap:0}
.cap .t{flex:1;font-size:.72rem;font-weight:500;line-height:1.3;text-align:center;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;padding-top:3px}
.cap .t .rs{color:var(--accent);font-weight:600;white-space:nowrap}
.mini{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .15s,color .15s}
.mini svg.i{width:14px;height:14px}
.cap .mini{color:var(--faint)}
.mini:active{background:var(--sel);color:var(--onsel)}
.emptyhome{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:60px 20px;color:var(--muted)}

/* floating new button */
.fab{position:fixed;right:max(20px,calc(50% - 620px));bottom:calc(24px + env(safe-area-inset-bottom,0px));width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 30px var(--glow),0 0 0 1px rgba(255,255,255,.18) inset;z-index:20;transition:transform .18s cubic-bezier(.2,.8,.2,1)}
.fab svg.i{width:28px;height:28px;stroke-width:2}
.fab:active{transform:scale(.92)}

/* ---------- voice pill: four dots while listening, mic when stopped ---------- */
.vpill{display:flex;align-items:center;justify-content:center;gap:7px;height:52px;min-width:96px;padding:0 22px;border-radius:999px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line2);box-shadow:var(--shadow-s);color:var(--text);transition:transform .18s,box-shadow .25s}
.vpill:active{transform:scale(.95)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);opacity:.3;animation:wave 1.25s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.15s}.dot:nth-child(3){animation-delay:.3s}.dot:nth-child(4){animation-delay:.45s}
@keyframes wave{0%,100%{opacity:.25;transform:translateY(0) scale(.85)}35%{opacity:1;transform:translateY(-5px) scale(1.12);box-shadow:0 0 12px var(--glow)}}
.vpill.listen{box-shadow:var(--shadow-s),0 0 0 4px var(--glow)}
.vpill .mic svg.i{width:24px;height:24px}
@media (prefers-reduced-motion:reduce){.dot{animation:none;opacity:.8}}

/* ---------- container view ---------- */
.cview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));gap:12px;animation:fade .32s ease}
.ctop{flex:none;display:flex;align-items:center;gap:8px}
.cname{flex:1;display:flex;align-items:center;gap:4px;justify-content:center}
.cname .t{font-weight:600;font-size:1rem;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{flex:none;display:flex;justify-content:center;gap:12px}
.tbtn{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);color:var(--text);transition:transform .15s,background .2s,box-shadow .25s,border-color .2s}
.tbtn:active,.tbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.tbtn:active{transform:scale(.94)}
.tbtn.glow{animation:pulse 1.2s ease-in-out 3}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 0 9px var(--glow);border-color:var(--accent)}}
.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden;padding:6px;margin:-6px;transition:flex-basis .35s ease}
.cview.chatopen .preview{min-height:110px}
.preview{position:relative;flex:1 1 auto;min-height:180px;border-radius:24px;overflow:hidden;background:var(--surface);border:1px solid var(--line2);box-shadow:var(--shadow-s);display:grid;place-items:center}
.preview .art,.preview img,.preview video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.preview .art{object-fit:cover}
.pempty{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;color:var(--muted);max-width:300px}
.pempty .big{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line2);color:var(--accent)}
.pempty .big svg.i{width:30px;height:30px}
.pempty p{margin:0;font-size:.92rem}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--surface2);font-size:.8rem;font-weight:500;color:var(--text);transition:background .2s,color .2s}
.chip:active,.chip.on{background:var(--sel);color:var(--onsel);border-color:transparent}
.dl{position:absolute;right:14px;bottom:14px;width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line3);color:var(--text);box-shadow:var(--shadow-s);transition:transform .15s,background .2s}
.dl:active{transform:scale(.93);background:var(--sel);color:var(--onsel)}
.kind{position:absolute;left:14px;top:14px;height:28px;padding:0 10px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;letter-spacing:.04em;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line2)}
.kind svg.i{width:14px;height:14px}
/* progress ring */
.prog{position:absolute;inset:0;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:3}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line2)}
.ring .fgc{stroke:url(#rg);transition:stroke-dashoffset .25s linear}
.ring .spin{position:absolute;inset:-8px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);animation:spin 1.1s linear infinite;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:1.7rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
/* versions strip */
.strip{flex:none;display:flex;gap:10px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.ver{position:relative;flex:none;width:52px;height:52px;border-radius:14px;overflow:hidden;border:1px solid var(--line2);transition:transform .15s,box-shadow .2s}
.ver .art{position:absolute;inset:0}
.ver.cur{box-shadow:0 0 0 2px var(--accent),0 0 12px var(--glow)}
.ver:active{transform:scale(.94)}
.vx{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(6px)}
.vx svg.i{width:10px;height:10px;stroke-width:2.4}
.vslot{flex:none;display:flex;justify-content:center;padding-top:2px}
/* chat panel */
.chat{flex:0 0 50%;min-height:0;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:var(--bg2);border:1px solid var(--line2);border-bottom:0;margin:0 -18px calc(-14px - env(safe-area-inset-bottom,0px));padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -18px 40px rgba(0,0,0,.25);animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line3);margin:0 auto 8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 10px}
.msg{max-width:84%;display:flex;flex-direction:column;gap:3px}
.msg .who{font-size:.68rem;font-weight:600;letter-spacing:.05em;color:var(--muted);padding:0 6px}
.msg .b{padding:10px 14px;border-radius:18px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .b{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:6px}
.msg.app .b{background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:6px}
.compose{flex:none;display:flex;align-items:flex-end;gap:8px;padding-top:6px}
.compose textarea{flex:1;resize:none;min-height:46px;max-height:140px;padding:12px 16px;border-radius:23px;border:1px solid var(--line2);background:var(--surface);outline:none;font-size:.95rem;line-height:1.4;transition:border-color .2s,box-shadow .2s}
.compose textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;flex:none;transition:transform .15s}
.send:active{transform:scale(.92)}
.cview.kb .stage{flex:0 0 6.6rem;overflow:auto}
.cview.kb .vslot{display:none}
.cview.kb .preview{min-height:6.2rem}
.cview.kb .chat{flex:1 1 auto}
@media (min-width:900px){
  .cview.chatopen{display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto auto minmax(0,1fr) auto;column-gap:20px}
  .cview.chatopen .ctop,.cview.chatopen .tools{grid-column:1}
  .cview.chatopen .stage{grid-column:1;grid-row:3}
  .cview.chatopen .vslot{grid-column:1;grid-row:4}
  .cview.chatopen .chat{grid-column:2;grid-row:1/5;margin:0;border-radius:24px;border-bottom:1px solid var(--line2);padding-bottom:12px}
  .cview.kb .stage{flex:1 1 auto}
}

/* ---------- menu & lists ---------- */
.list{display:flex;flex-direction:column;gap:10px;max-width:640px}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:10px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line2);text-align:left;width:100%;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.row:active{background:var(--sel);color:var(--onsel);transform:scale(.99);box-shadow:0 0 0 4px var(--glow)}
.row:active .rsub{color:inherit;opacity:.8}
.row .ric{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent);flex:none}
.row:active .ric{background:transparent;color:inherit}
.row .rtx{flex:1;display:flex;flex-direction:column}
.row .rt{font-weight:600;font-size:.98rem}
.row .rsub{font-size:.8rem;color:var(--muted)}
.chev{color:var(--faint)}
.switch{width:52px;height:32px;border-radius:999px;background:var(--surface3);position:relative;transition:background .25s;flex:none;border:1px solid var(--line2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(20px)}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.card h2{margin:0;font-size:.82rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface2);font-weight:600;font-size:.92rem;text-decoration:none;color:var(--text);transition:background .2s,color .2s,transform .15s,box-shadow .2s;text-align:center}
.pbtn:active,.pbtn.on{background:var(--sel);color:var(--onsel);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.pbtn:active{transform:scale(.98)}
.pbtn.prime{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.field{width:100%;min-height:50px;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--bg2);outline:none;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--glow)}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.key{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 8px 6px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.key .kn{flex:1;font-weight:600;font-size:.95rem}
.stat{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface3)}
.stat::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.stat.ok{color:var(--ok)}.stat.bad{color:var(--danger)}.stat.chk{color:var(--warn)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border-radius:18px;background:var(--surface2);border:1px solid var(--line)}
.seg button{min-height:48px;border-radius:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .25s,color .25s,box-shadow .25s}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--onsel);box-shadow:0 0 0 3px var(--glow)}
.bk{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 8px 8px 14px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.bk .bt{flex:1;display:flex;flex-direction:column}
.bk .bt b{font-weight:600;font-size:.92rem}
.bk .bt span{font-size:.78rem;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);margin:0;line-height:1.5}
.folder{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem}
.folder svg.i{color:var(--accent)}
/* about accordion */
.acc{display:flex;flex-direction:column;gap:10px;max-width:720px}
.sec{border-radius:18px;background:var(--surface);border:1px solid var(--line2);overflow:hidden;transition:border-color .25s,box-shadow .25s}
.sec.open{border-color:var(--line3);box-shadow:var(--shadow-s)}

/* ---------- sheets, dialogs, toast ---------- */

/* start overlay */
.start{position:fixed;inset:0;z-index:80;display:grid;place-items:center;background:var(--scrim);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);cursor:pointer;animation:fadein .4s ease}

.setup{position:fixed;inset:0;z-index:85;display:grid;place-items:center;padding:20px;background:var(--scrim);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);animation:fadein .35s ease}

/* ================= v6: wider palette, thicker accents, strong selected state, 4 per row, library and backup ================= */

#helpBtn{--selc:var(--c-amber)}#menuBtn{--selc:var(--c-cyan)}.reqbtn{--selc:var(--c-cyan)}.msgbtn{--selc:var(--sky)}

.edtab.on{background:var(--c-cyan);color:#06121A;box-shadow:0 0 0 3px color-mix(in srgb,var(--c-cyan) 35%,transparent),0 0 16px color-mix(in srgb,var(--c-cyan) 50%,transparent)}
.edtab:nth-child(3n+2) svg.i{color:var(--c-amber)}.edtab:nth-child(3n) svg.i{color:var(--sky)}.edtab.on svg.i{color:#06121A!important}
/* the plus icon sits higher: about a fifth of the screen above the bottom */
.fab{bottom:calc(20vh + env(safe-area-inset-bottom,0px))!important;border:3px solid var(--stripe)!important}
/* four containers per row on phones */

}

.tring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#E7EAEE}

.tring .bgc{stroke:color-mix(in srgb,var(--c-amber) 30%,#fff 40%)}.tring .fgc{stroke:var(--c-amber);transition:stroke-dashoffset .4s ease}
.tring .tp{position:relative;z-index:1;font-size:.68rem;font-weight:800;color:#16181C;font-variant-numeric:tabular-nums}

/* choosing where the content to edit comes from */

.pickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.key{flex-wrap:wrap}.kwhy{flex:1 0 100%;font-size:.74rem;color:var(--danger,#E11D48);padding:2px 4px 0}

.hdr .brandwrap{overflow:hidden}

.tourcard2{z-index:200!important}

.edtop h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

<noscript><p style="padding:20px">Special PixelCraft needs JavaScript.</p></noscript>
<script type="module">
'use strict';
/* ============================================================
   Special PixelCraft — core: utilities, storage, settings, Google AI
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const num=(v,d=0)=>(v!==null&&v!==''&&Number.isFinite(+v))?+v:d;
const mkErr=(m,status)=>{const e=new Error(m);e.status=status;return e};
const todayStr=()=>new Date().toDateString();
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
const fmtTime=t=>new Date(t).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const once=(el,ev,ms=15000)=>new Promise((res,rej)=>{let t;const f=e=>{clearTimeout(t);el.removeEventListener(ev,f);res(e)};el.addEventListener(ev,f);if(ms)t=setTimeout(()=>{el.removeEventListener(ev,f);res(null)},ms)});
const canvas=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const b64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)});
const b64ToBlob=(d,type)=>{const bin=atob(d);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})};
const toBlob=(cv,type='image/png',q=.92)=>new Promise(r=>cv.toBlob(b=>r(b),type,q));
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const plainSize=b=>b>=1073741824?(b/1073741824).toFixed(1)+' GB':b>=1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB';

/* ---------- IndexedDB ---------- */
const DB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('special-pixelcraft',1);
    r.onupgradeneeded=()=>{const d=r.result;for(const s of['containers','media','assets','backups'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv')};
    r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(store,mode,fn){return new Promise((res,rej)=>{let out;const t=this.db.transaction(store,mode);const q=fn(t.objectStore(store));if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  get(s,k){return k==null?Promise.resolve(undefined):this.tx(s,'readonly',o=>o.get(k))},
  put(s,v,k){return this.tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k))},
  del(s,k){return this.tx(s,'readwrite',o=>o.delete(k))},
  all(s){return this.tx(s,'readonly',o=>o.getAll())}
};

/* ---------- settings (browser storage) ---------- */
const SKEY='spc.settings';
const S=Object.assign({mode:'dark',keys:[]},(()=>{try{return JSON.parse(localStorage.getItem(SKEY)||'{}')}catch(e){return{}}})());
function saveS(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
const LS={get(k,d=null){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- containers in memory ---------- */
let CS=[];
const dirty=new Set();
const byId=id=>CS.find(c=>c.id===id);
const liveCS=()=>CS.filter(c=>!c.deleted).sort((a,b)=>b.updated-a.updated);
function newContainer(name){return {id:'c'+uid(),name,created:Date.now(),updated:Date.now(),deleted:0,restored:false,originId:null,thumb:null,kind:null,versions:[],media:[],chat:[],ai:[],sel:null}}
async function saveC(c,changed=true){if(changed){c.updated=Date.now();dirty.add(c.id)}const copy={...c};delete copy._tmp;await DB.put('containers',copy)}

/* ---------- media blobs ---------- */
const urlCache=new Map();
async function mediaURL(id){if(urlCache.has(id))return urlCache.get(id);const m=await DB.get('media',id);if(!m)return null;const u=URL.createObjectURL(m.blob);urlCache.set(id,u);return u}
async function addMedia(cid,blob,meta={}){const id='m'+uid();await DB.put('media',{id,cid,blob,type:blob.type||meta.type||'',size:blob.size,created:Date.now(),...meta});return id}
async function delMedia(id){const u=urlCache.get(id);if(u){URL.revokeObjectURL(u);urlCache.delete(id)}try{await DB.del('media',id)}catch(e){}}
function probe(blob){return new Promise(res=>{const t=blob.type||'';const u=URL.createObjectURL(blob);const done=v=>{URL.revokeObjectURL(u);res(v)};
  if(t.startsWith('image/')){const i=new Image();i.onload=()=>done({w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>done({});i.src=u;return}
  const v=document.createElement(t.startsWith('audio/')?'audio':'video');v.preload='metadata';v.muted=true;
  v.onloadedmetadata=()=>{const first=isFinite(v.duration)?v.duration:0;const fin=()=>done({w:v.videoWidth||0,h:v.videoHeight||0,duration:Math.max(first,isFinite(v.duration)?v.duration:0)});
    /* always seek to the end once: browser recordings can report a wrong length until then */
    let ok=false;v.ontimeupdate=v.onseeked=()=>{if(ok)return;ok=true;fin()};v.currentTime=1e7;setTimeout(()=>{if(!ok){ok=true;fin()}},4000)};
  v.onerror=()=>done({});v.src=u;setTimeout(()=>done({}),12000)})}
function videoFrame(blob,t=.5){return new Promise((res,rej)=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';const u=URL.createObjectURL(blob);let done=false;
  const fin=ok=>{if(done)return;done=true;if(!ok){URL.revokeObjectURL(u);return rej(mkErr('Could not read the video'))}const c=canvas(v.videoWidth||16,v.videoHeight||16);c.getContext('2d').drawImage(v,0,0);URL.revokeObjectURL(u);res(c)};
  v.onloadeddata=()=>{const d=isFinite(v.duration)?v.duration:t*2;v.currentTime=Math.min(t,Math.max(0,d*.5))};
  v.onseeked=()=>fin(true);v.onerror=()=>fin(false);setTimeout(()=>fin(v.readyState>=2),12000);v.src=u})}
async function makeThumb(blob){try{const T=240,cv=canvas(T,T),x=cv.getContext('2d');let src;const t=blob.type||'';
  if(t.startsWith('image/'))src=await createImageBitmap(blob);else if(t.startsWith('video/'))src=await videoFrame(blob,.8);else return null;
  const sw=src.width,sh=src.height,s=Math.max(T/sw,T/sh);x.fillStyle='#F4F5F7';x.fillRect(0,0,T,T);x.drawImage(src,(T-sw*s)/2,(T-sh*s)/2,sw*s,sh*s);return cv.toDataURL('image/jpeg',.8)}catch(e){return null}}


/* ---------- Google AI: several keys, all working at once; the tested Gemini 2.5 models first ---------- */
const G={base:'https://generativelanguage.googleapis.com/',rr:0,cands:null,models:null,cool:{},files:new Map(),noThink:{},last:null,
  /* the well-tested 2.5 models come first; newer ones are only a fallback when Google no longer offers these */
  PREF:{text:['gemini-2.5-flash'],lite:['gemini-2.5-flash-lite','gemini-2.5-flash'],image:['gemini-2.5-flash-image','gemini-2.5-flash-image-preview'],tts:['gemini-2.5-flash-preview-tts','gemini-2.5-pro-preview-tts']},
  active(){return S.keys.filter(k=>k.st!=='inactive')},
  pick(skip){const now=Date.now();const ks=this.active().filter(k=>!skip.has(k.key)&&!((this.cool[k.key]||0)>now));if(!ks.length)return null;return ks[(this.rr++)%ks.length]},
  async ensureModels(key){if(this.cands)return;let names=null;
    try{const r=await fetch(this.base+'v1beta/models?pageSize=300',{headers:{'x-goog-api-key':key}});if(r.ok){const j=await r.json();names=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''))}}catch(e){}
    const ver=n=>{const m=/gemini-(\d+(?:\.\d+)?)/.exec(n);return m?parseFloat(m[1]):0};const stable=n=>!/preview|exp/.test(n);
    const newer=re=>(names||[]).filter(n=>re.test(n)&&ver(n)>2.5).sort((a,b)=>(stable(b)-stable(a))||(ver(b)-ver(a)));
    const has=n=>!names||names.includes(n);const uniq=a=>[...new Set(a)];
    this.cands={text:uniq([...this.PREF.text.filter(has),...newer(/^gemini-[\d.]+-flash(-preview[\w-]*)?$/),'gemini-flash-latest','gemini-2.5-flash']),
      lite:uniq([...this.PREF.lite.filter(has),...newer(/^gemini-[\d.]+-flash-lite(-preview[\w-]*)?$/),'gemini-flash-lite-latest','gemini-2.5-flash']),
      image:uniq([...this.PREF.image.filter(has),...newer(/^gemini-[\d.]+-flash-image(-preview[\w-]*)?$/),'gemini-2.5-flash-image']),
      tts:uniq([...this.PREF.tts.filter(has),...newer(/^gemini-[\d.]+-flash(-preview)?-tts$/),'gemini-2.5-flash-preview-tts'])};
    this.models={text:this.cands.text[0],lite:this.cands.lite[0],image:this.cands.image[0],tts:this.cands.tts[0]}},
  dropModel(kind){const c=this.cands&&this.cands[kind];if(!c||c.length<2)return false;c.shift();this.models[kind]=c[0];return true},
  note(ok,msg,model,status){this.last={ok,msg:String(msg||'').slice(0,400),model,status,t:Date.now()};if(typeof onAIStatus==='function')onAIStatus()},
  /* body may be an object, or a function (key) => body, so media can be uploaded to whichever key runs the request */
  async gen(kind,body,opt={}){const tried=new Set();let last=null;
    for(let n=0;n<12;n++){const k=opt.key||this.pick(tried);if(!k)break;let model='';
      try{await this.ensureModels(k.key);let b=typeof body==='function'?await body(k):body;model=opt.model||this.models[kind];
        /* quick answers: long thinking switched off where the model allows it */
        if(opt.fast&&!this.noThink[model]){const tc=/gemini-2\.5/.test(model)?{thinkingBudget:0}:/gemini-3/.test(model)?{thinkingLevel:'low'}:null;if(tc)b={...b,generationConfig:{...(b.generationConfig||{}),thinkingConfig:tc}}}
        const r=await fetch(this.base+'v1beta/models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k.key},body:JSON.stringify(b),signal:opt.signal});
        if(r.ok){const json=await r.json();if(k.st!=='active'){k.st='active';k.why='';saveS()}if(!opt.quiet)this.note(true,'',model,200);return {json,key:k,model}}
        let msg='';try{msg=((await r.json()).error||{}).message||''}catch(e){}
        last=mkErr(msg||('HTTP '+r.status),r.status);last.model=model;if(!opt.quiet)this.note(false,msg||('HTTP '+r.status),model,r.status);
        if(r.status===429){this.cool[k.key]=Date.now()+60000;last.quota=true}
        else if(r.status===403||(r.status===400&&/api key/i.test(msg))){k.st='inactive';k.why=msg||'Google did not accept this key';saveS()}
        else if(r.status===400&&/thinking/i.test(msg)&&opt.fast&&!this.noThink[model]){this.noThink[model]=1;n--;continue}
        else if((r.status===404||(r.status===400&&/not found|not supported|unsupported model|is not available/i.test(msg)))&&!opt.model&&this.dropModel(kind)){n--;continue}
        else if(r.status===400)throw last;
      }catch(e){if(e.name==='AbortError'||e.status===400)throw e;if(!e.status&&!opt.quiet)this.note(false,navigator.onLine===false?'No internet connection':'Could not reach Google: '+(e.message||'network error'),model,0);last=last&&last.status?last:e}
      if(opt.key)break;tried.add(k.key)}
    if(!last)throw mkErr('No working API key. Add a free Google key in Menu, API keys.','nokey');
    if(last.status===429)last.quota=true;throw last},
  /* a backup request: if the first key has not answered within the given time, the same request also goes to a second key; the first answer wins */
  genHedged(kind,body,opt={}){const wait=opt.hedge||2500;if(this.active().length<2)return this.gen(kind,body,opt);
    return new Promise((res,rej)=>{let done=false,running=0,timer=null;const ctls=[];
      const fin=(ok,v)=>{if(done)return;done=true;clearTimeout(timer);ctls.forEach(c=>c.abort());ok?res(v):rej(v)};
      const launch=()=>{const c=new AbortController();ctls.push(c);running++;
        this.gen(kind,body,{...opt,signal:c.signal}).then(v=>fin(true,v),e=>{running--;if(done)return;if(e.status===400||running===0)fin(false,e)})};
      if(opt.signal)opt.signal.addEventListener('abort',()=>fin(false,Object.assign(new Error('aborted'),{name:'AbortError'})));
      launch();timer=setTimeout(()=>{timer=null;if(!done)launch()},wait)})},
  text(json){return ((json.candidates&&json.candidates[0]&&json.candidates[0].content&&json.candidates[0].content.parts)||[]).filter(p=>p.text&&!p.thought).map(p=>p.text).join('').trim()},
  mime(t){t=String(t||'').split(';')[0];if(t==='audio/webm')return 'video/webm';if(t==='audio/mp4'||t==='audio/x-m4a')return 'audio/mp4';return t||'application/octet-stream'},
  /* a part for one media item: inline for small images and audio, otherwise uploaded to the key (cached per key) */
  async part(blob,key,name,cacheId){const mime=this.mime(blob.type);
    if(blob.size<7*1048576&&(mime.startsWith('image/')||mime.startsWith('audio/')))return {inline_data:{mime_type:mime,data:await b64(blob)}};
    const ck=key.key+'|'+(cacheId||name);if(this.files.has(ck))return {file_data:{mime_type:mime,file_uri:this.files.get(ck)}};
    const s=await fetch(this.base+'upload/v1beta/files',{method:'POST',headers:{'x-goog-api-key':key.key,'Content-Type':'application/json','X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(blob.size),'X-Goog-Upload-Header-Content-Type':mime},body:JSON.stringify({file:{display_name:String(name||'media').slice(0,90)}})});
    if(!s.ok)throw mkErr('Upload failed ('+s.status+')',s.status);const url=s.headers.get('x-goog-upload-url');if(!url)throw mkErr('Upload failed');

const ABOUT_FACTS=`Special PixelCraft is an app for creating and editing images and videos for businesses and personal use. Home shows Containers; each container is a project and always shows four buttons: New image, New video, Edit image and Edit video. Edit asks where the content comes from: this container, the library, or the phone's gallery. A plus icon makes a new container; tiles sort by last edit; the pencil renames and the bin deletes (deleted containers can be brought back until the next day). Pictures, video clips, audio and scripts are added inside the editors, and everything added is shared between the container's images and videos and the library. Image sizes: tall, wide, square, 4:5 and a custom size, plus print sizes (A4 flyer, business card, poster). Image downloads are chosen each time as PNG or JPG, and print sizes can also be PDF. Videos have a custom length box in minutes and seconds, may run 10 to 20 minutes, are always saved as MP4 in 720p or 1080p, and come in tall (Reels and Shorts), wide (YouTube), square, 4:5 (Instagram and Facebook feed) or a custom size. Captions, music and floating text are never added unless the user asks, by hand or through this command window. The video editor can import a script (lines starting with Scene, Visual, Voice-over or On-screen text become scenes, voice-over lines and text). Voice-overs are available in English, Hindi, Malayalam and Marathi; the voice engine and each language download only the first time they are used, after a size notice. Templates (editable, recolourable, several styles each): Indian festivals, birthday, anniversary, wedding, sale or offer, new arrival, shop opening, real estate, restaurant menu, business card, social posts, YouTube thumbnail, invitations, Instagram and Facebook reels, business logo, sales and marketing flyers. The Library has a starter set of images, clips, music, icons and cards, grows on demand and has no size limit. Backup: one file per backup, saved automatically once a day or with Back up now, the 7 newest kept, restore adds containers marked Restored. Menu: API keys (free Google keys from Google AI Studio; all saved keys work at the same time, and big jobs are split between them), Library, Backup, Help, About. Swipe left or right to move between pictures and versions. The command window (the glowing icon at the top left, shown only when a Google key is saved) lets the user type a request instead of tapping; on Home, a creative request makes a new container unless an existing container is named. A ring shows the percentage while something is being created. Everything stays on the device and in the backup folder. Backups hold the containers, not the keys.`;

function systemPrompt(){return `You are the helper inside Special PixelCraft, an app for creating and editing images and videos for businesses and personal use. The user types requests in a small command window. Talk in plain words, like a friendly professional, and keep every reply short.

Every turn:
1. Call respond exactly once, with a short plain-text reply in say: one to three short sentences, no lists or symbols. Call any other tools in the same turn.
2. Ask only what you cannot sensibly decide yourself, usually one or two short questions at a time: for example the person's or business name, the exact text, prices or phone numbers. Never invent names, prices, phone numbers, dates or addresses. Decide everything else with good taste: colours, fonts, effects, transitions. Do not add captions, music or floating text to a video unless the user asks.
3. When the request is clear, just do it. If something similar already exists in the container, ask in the same message whether to keep it (keep_previous). If the user seems unsure, offer three versions in different styles to compare.
4. Shapes: tall 9:16 (Reels, Shorts, Stories, WhatsApp Status), wide 16:9 (YouTube), square, 4:5 (Instagram and Facebook feed), a custom size, or print sizes for images (A4 flyer, business card, poster). Videos are in minutes and seconds; keep to the length the user asks for.
5. Prefer use_template for greeting cards, festival wishes, sale posters, invitations, quote and menu cards, thumbnails, flyers, business cards, announcements, photo cards, slideshows, reels, greeting and promo videos and logos; use make_image or make_video for custom work.
6. To change an existing video (add a voice-over, add or replace music, add the user's recorded voice, sound effects, text or captions), always call edit_video. Never rebuild an unrelated new video for an edit. For pictures, use make_image with base type version.
7. Voice-overs: ask which voice, from: ${Object.entries(VO_VOICES).map(([k,v])=>k+' ('+v.label+')').join(', ')}. Voices cannot sing. For a birthday song use music style happy_birthday (the traditional tune, free to use).
8. Music: built-in styles ${Object.keys(MUSIC).join(', ')}; or search_music for free library music by mood; or the user's own audio file. YouTube audio and copyrighted songs cannot be fetched; say so kindly and offer these options.
9. Browsers need a tap to open the file picker, download, or choose a backup folder. Call highlight or prepare_download and tell the user to tap the glowing icon.
10. Confirm before deleting anything. Never invent file ids; use the ids in the state.
11. Navigation: open or create containers by name with container_action. To create something in another container, first call container_action open (or create), then the creation tool, in the same turn. go_back and go_home with app_action. To save the current item to the library, app_action add_to_library. To back up now, app_action back_up_now.
12. While a creation runs, the state shows its percent and stage: answer how far along it is, cancel if asked; new requests are queued automatically.
13. Logos: use_template template logo (sharp vector). Ask for the business name; offer a style (emblem, monogram, wordmark, badge, horizontal) and an icon (one of: ${Object.keys(LOGO_ICONS).join(', ')}). Use ai_image only for a painted, picture-style logo when asked.
14. When the app reports a blurry or small upload, tell the user and offer redraw_logo.
15. Documents (price lists, menus, scripts) appear in the state with their text; use look_at_media to read a PDF. Use exact prices and details.
16. Business focus: shop offers, new arrivals and festival sales; restaurant menus and dish reels; real estate listings; services such as salons, clinics, tutors and repairs; personal sellers' listing photos. Prefer the matching template.
17. Messages starting with [app] are notes from the app itself. Always reply in English; text inside designs may be in English, Hindi, Malayalam or Marathi when asked. Do not ask about details already given.

What the built-in tools can do: images from gradients, colours, uploaded photos, free web images and collages; background removal; crop, rotate, flip; colour looks (${Object.keys(PRESETS).join(', ')}); effects (cartoon, sketch, posterize, duotone, pixel art, glitch, grain, sharpen, emboss, halftone, oil paint); word art in many fonts, including Malayalam and Hindi; shapes, emoji stickers, particles, light leaks, frames, picture layers. Videos from clips, photos, web images and colours: trim, cut, join, speed and ramps, reverse, freeze frames, motion, many transitions, looks, animated text and karaoke captions, picture-in-picture, camera recording, original sound, uploaded audio, music that lowers under speech, voice-overs, sound effects (${SFX.join(', ')}).

About the app (answer questions from this): ${ABOUT_FACTS}

The current app state is given as JSON in the latest message, after [state].`}

const Gen={running:null,queue:[],
  submit(job){job.done=new Promise(r=>job._resolve=r);if(this.running){this.queue.push(job);renderPreviewOnly();return {status:'queued',position:this.queue.length,note:'A generation is already running. Tell the user it is queued.'}}this.start(job);return {status:'started',note:'Running in the background. The app announces when it is ready.'}},
  async start(job){this.running=job;job.p=0;job.ctrl=new AbortController();LS.set('spc.pending',{cid:job.cid,name:(byId(job.cid)||{}).name,summary:job.summary,t:Date.now(),tool:job.tool,args:job.args});wakeOn();renderPreviewOnly();
    let result={status:'failed'};
    job.stage=job.tool==='make_video'||job.tool==='edit_video'?'Preparing scenes':'Generating preview';updateRing(true);
    try{const out=await job.exec(job.ctrl.signal,(p,stage)=>{if(p!=null)job.p=Math.round(p);if(stage&&stage!==job.stage){job.stage=stage;updateRing(true)}else updateRing()});job.stage='Saving';job.p=100;updateRing(true);const c=byId(job.cid);if(!c)throw mkErr('The container was deleted.');await addVersion(c,job,out);result={status:'done',version:c.versions.length};
      if(!job.quiet)announce(c,`Your ${job.tool==='make_logo'||job.tool==='redraw_logo'?'logo':out.kind==='video'?'video':out.kind==='audio'?'recording':'image'} is ready${nav.id===c.id?'':' in '+c.name}.`)}
    catch(e){if(e.status==='cancel'||(job.ctrl.signal.aborted)){result={status:'cancelled'};announce(byId(job.cid),'The generation was cancelled.')}else{result={status:'failed',error:e.message};if(!job.quiet)announce(byId(job.cid),'Sorry, that could not be created. '+e.message)}}
    finally{LS.del('spc.pending');this.running=null;renderPreviewOnly();job._resolve(result);const c=byId(job.cid);if(c&&dirty.has(c.id)&&!(nav.v==='container'&&nav.id===c.id))Backup.leave(c);const n=this.queue.shift();if(n)this.start(n);else wakeOffIfIdle()}},
  cancel(){this.queue.forEach(j=>j._resolve({status:'cancelled'}));this.queue=[];if(this.running)this.running.ctrl.abort()}
};

async function addVersion(c,job,out){const id=await addMedia(c.id,out.blob,{name:job.summary,w:out.w,h:out.h,duration:out.duration});

/* builds the new plan for an edit from the saved plan of the version, so nothing is lost and quality is kept */
function editPlan(c,a){const vi=a.version?clamp(Math.round(a.version),1,c.versions.length)-1:curVersionIndex(c);const v=c.versions[vi];if(!v)return {error:'There is no video to change yet.'};
  if(v.kind!=='video')return {error:'The version showing is a picture. Use make_image to change pictures.'};
  let plan=v.plan&&v.plan.scenes&&v.tool==='make_video'?JSON.parse(JSON.stringify(v.plan)):null;
  if(!plan||!plan.scenes)plan={width:v.w||1080,height:v.h||1920,scenes:[{source:{type:'version',version:vi+1},fit:'cover',duration:v.duration||undefined}],audio:{tracks:[{source:'original'}]}};
  plan.audio=plan.audio||{};plan.audio.tracks=(plan.audio.tracks||[]).filter(t=>!(a.remove_tracks||[]).includes(t.source));
  for(const t of a.add_tracks||[])plan.audio.tracks.push({...t});if(a.mute_original!=null)plan.audio.mute_original=!!a.mute_original;

  delete plan.keep_previous;plan.summary=a.summary;return {plan,from:vi}}

async function fillStripThumbs(c){for(const el of $$('[data-thumb]')){const id=el.dataset.thumb;const m=await DB.get('media',id);if(!m)continue;const k=(m.type||'').split('/')[0];

const ABOUT=[
 ['spark','What Special PixelCraft is','<p>A studio for creating and editing images and videos for your business, festivals, family and social media. Work lives in containers. Each container has four buttons: New image, New video, Edit image and Edit video. Everything is built in, so it works without AI. Free Google keys add an AI command window on top.</p>'],
 ['book','Getting started','<ul><li>Tap the plus button to make a container.</li><li>Open it and tap New image or New video. Pick a size, a template or a blank page, and make it yours.</li><li>Tap Edit image or Edit video to change something you already have: from this container, from the library, or from your phone gallery.</li><li>Tap the tick to save. Every save becomes a new version, and you choose whether to keep the earlier one.</li></ul>'],
 ['cmd','The AI command window','<p>When at least one Google key is saved, a glowing command icon appears at the top left of every screen. Tap it to open a small window where you type, or paste a script, and the app does the work: <q>Make a Diwali offer poster for my sweet shop</q>, <q>Make a 30 second Reel from these clips</q>, <q>Make the sky darker</q>. On Home, a request makes a new container for you unless you name an existing one. The trash icon in the window clears the conversation. With no key, the window stays hidden and you edit everything by hand.</p>'],
 ['key','Free Google keys','<p>In Menu, API keys, tap Create free key, then Open Google AI Studio. Sign in, tap Create API key and copy it. Press Back until you return to the app, then tap Paste key. The key is tested at once. Save several keys from different Google projects: they all work together, so the app answers faster, big jobs are shared between them, and when one reaches its free limit the others carry on. Tap Test Google AI to see exactly what Google answers.</p>'],
 ['layers','Containers and versions','<p>The most recently edited container comes first. The pencil renames and the bin deletes; a deleted container can be brought back until the first use of the next day. Pictures, clips, audio and scripts you add inside the editors are shared between the container and the Library. Kept versions and uploads appear as small blocks under the preview: tap one to see it, swipe the preview left or right to move through them, and tap its cross to delete it.</p>'],
 ['image','Images and sizes','<p>Sizes: tall (Reels, Shorts, Stories), wide (YouTube), square, 4:5 (Instagram and Facebook feed), a custom size, and print sizes: A4 flyer, business card and poster. Edit with backgrounds, crop, rotate, colours, looks, effects, text and word art in many fonts, shapes, stickers, pictures, frames and background removal. The Templates tool, first in the row, opens the template gallery. A logo is just another image: pick the logo template.</p>'],
 ['video','Videos','<p>Set the length in minutes and seconds; videos of 10 to 20 minutes are possible. Choose tall, wide, square, 4:5 or a custom shape. Build scenes from clips, photos and colour cards, with trimming, speed, motion, transitions, looks and text. Finished videos are always MP4, in 720p or 1080p. Nothing is added automatically: captions, music and floating text are your choice, added by hand or by asking the AI. Under the plus: From my gallery, Video templates, and Import a script, which turns lines that start with Scene, Visual, Voice-over or On-screen text into scenes, voice-over lines, captions and library clips. The Sound tool holds music, voice-overs, your own voice and sound effects.</p>'],
 ['voice','Voice-overs and languages','<p>Voice-overs are available in English, Hindi, Malayalam and Marathi, with fonts and templates for each. The voice engine (about 100 MB) and each language download only the first time you use them, after a notice about the size. Other languages can be downloaded when you need them. The app itself is always in English.</p>'],
 ['spark','Templates','<p>Editable, recolourable templates with several styles each: Indian festivals (Diwali, Onam, Vishu, Christmas, Eid, Pongal, New Year), birthday, anniversary, wedding, sale and offer, new arrival, shop opening, real estate, restaurant menu, business card, social posts, YouTube thumbnail, invitations, Instagram and Facebook Reels, business logo, and sales and marketing flyers.</p>'],
 ['down','Saving and sharing','<p>For images you choose PNG or JPG each time; print sizes can also be saved as PDF. Videos are MP4 in 720p or 1080p. Files go to your Downloads folder. The share icon hands the file to WhatsApp, Instagram, Facebook and other apps.</p>'],
 ['lib','Library','<p>A starter library of images, video clips, music, icons, festival cards and flyers downloads in the background after you agree (about 300 MB; Wi-Fi is suggested, any connection works). More is fetched when you ask and added to the library, with no limit. Save your own creations to it with the library icon under the preview.</p>'],
 ['backup','Backup and restore','<p>Choose a folder once, on the phone or in Google Drive. One backup file named with the date and time is then saved there automatically once a day, and Back up now saves one whenever you like. The 7 newest are kept. Restoring adds containers to Home marked Restored and never replaces anything.</p>'],
 ['clock','While something is created','<p>A ring shows the percentage and what is happening, on the container tile on Home and inside the container. You can move around the app meanwhile; a small ring follows you. Keep the app on screen, because locking the phone may pause the work.</p>'],
 ['exit','Leaving the app','<p>On Home, the phone Back button leaves the app. On every other screen, Back goes one screen back. An unfinished creation is offered again next time.</p>'],
 ['shield','Privacy','<p>Your work stays in this browser and in your chosen backup folder. Requests go to Google only with your own keys, and only when you use AI. Backups hold your containers, not your keys.</p>']];

function glow(ctrl){const sel={download:'#dlgo, [data-act=download]',share:'[data-act=share]',backup:'[data-act=setbk]',new:'.fab',help:'#helpBtn',command:'#cmdBtn',newimage:'[data-act=newimage]',newvideo:'[data-act=newvideo]',editimage:'[data-act=editimage]',editvideo:'[data-act=editvideo]'}[ctrl]||'.fab';

/* ---------- adding files to a container (always from inside an editor or a picker) ---------- */
const SCRIPT_RE=/\.(pdf|docx?|txt|csv|md|rtf)$/i;
async function addUploads(c,files,o={}){const added=[];
  for(const f of files){const k=(f.type||'').split('/')[0];const isDoc=!['image','video','audio'].includes(k);
    if(isDoc&&!/pdf|word|officedocument|text|rtf|csv|markdown/.test(f.type||'')&&!SCRIPT_RE.test(f.name)){toast(f.name+' is not a supported file.');continue}
    const meta=isDoc?{}:await probe(f);const type=f.type||(/\.pdf$/i.test(f.name)?'application/pdf':/\.docx$/i.test(f.name)?'application/vnd.openxmlformats-officedocument.wordprocessingml.document':'text/plain');
    const id=await addMedia(c.id,f,{name:f.name});const item={id,type,name:f.name,size:f.size,w:meta.w,h:meta.h,duration:meta.duration};
    if(isDoc){item.text=await docText(f,f.name)||''}
    if(k==='image'){const q=await sharpness(f);if(q)item.quality=q}
    c.media.push(item);added.push(item);if(!o.keepSel)c.sel={t:'m',id};if(!c.thumb&&(k==='image'||k==='video'))c.thumb=await makeThumb(f);if(!c.kind&&(k==='image'||k==='video'))c.kind=k}
  if(!added.length)return added;await saveC(c);renderAfterChange(c);if(!o.quiet)toast(added.length>1?`${added.length} files added.`:'Added.');return added}
/* pick files from the phone: a hidden picker opened from a button tap */
function pickFiles(accept,multiple){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=accept;i.multiple=!!multiple;i.style.display='none';document.body.appendChild(i);let done=false;
    i.onchange=()=>{done=true;const fs=[...i.files];i.remove();res(fs)};i.addEventListener('cancel',()=>{if(!done){i.remove();res([])}});i.click()})}
async function deleteVersion(c,i){const v=c.versions[i];if(!v)return;c.versions.splice(i,1);await delMedia(v.id);if(v.svg)await delMedia(v.svg);if(c.sel&&c.sel.id===v.id)c.sel=null;await refreshThumb(c);await saveC(c);renderAfterChange(c)}
async function deleteUpload(c,id){const i=c.media.findIndex(m=>m.id===id);if(i<0)return;c.media.splice(i,1);await delMedia(id);if(c.sel&&c.sel.id===id)c.sel=null;await refreshThumb(c);await saveC(c);renderAfterChange(c)}
async function refreshThumb(c){const it=await currentItem(c);if(!it){c.thumb=null;c.kind=null;return}if(it.kind==='audio'||it.kind==='doc')return;const m=await DB.get('media',it.sel.id);if(m){c.thumb=await makeThumb(m.blob);c.kind=it.kind}}
async function softDelete(c){c.deleted=Date.now();await saveC(c,false);if(nav.v==='container'&&nav.id===c.id)goHome();else render();toast('Deleted. You can bring it back until tomorrow.')}

function editItems(c,kind){const out=[];c.versions.forEach((v,i)=>{if(v.kind===kind)out.push({t:'v',id:v.id,label:'Version '+(i+1)})});c.media.forEach(m=>{if((m.type||'').startsWith(kind+'/'))out.push({t:'m',id:m.id,label:m.name||'Upload'})});return out}

async function doDownload(){const c=byId(nav.id);const it=await currentItem(c);if(!it)return;const name=($('#fname').value.trim()||'Special_PixelCraft').replace(/[\\/:*?"<>|]+/g,'');const fmts=[...layer.querySelectorAll('[data-fmt].on')].map(x=>x.dataset.fmt);

  const msg=t=>{const m=$('#dlmsg');if(m)m.textContent=t};const btn=$('#dlgo');btn.disabled=true;const m=await DB.get('media',it.sel.id);const blob=m.blob;let ok=0;
  for(const f of fmts){try{msg('Preparing '+f+'…');
      if(f==='PNG'||f==='JPG'){const mt=f==='PNG'?'image/png':'image/jpeg';const out=blob.type===mt?blob:await convertImage(blob,mt);saveFile(out,name+'.'+(f==='PNG'?'png':'jpg'))}
      else if(f==='PDF'){const pr=printInfo(it.meta);const jp=blob.type==='image/jpeg'?blob:await convertImage(blob,'image/jpeg');saveFile(await pdfFromJpeg(jp,pr),name+'.pdf')}
      else if(f==='SVG'){const sv=it.meta.svg&&await DB.get('media',it.meta.svg);if(!sv){msg('SVG is not available for this picture.');continue}saveFile(sv.blob,name+'.svg')}
      else if(f==='MP3'){const r=await mp3From(blob);saveFile(r.blob,name+'.'+r.ext);if(r.ext!=='mp3')msg('MP3 was not available, so a WAV sound file was saved.')}
      else if(f==='Original')saveFile(blob,name+'.'+((blob.type.split('/')[1]||'bin').split(';')[0]));
      else if(f==='MP4'){S.vq=q;saveS();const out=await exportVideo(c,it,blob,q,p=>msg('Preparing MP4… '+Math.round(p)+'%'));const isMp4=/mp4/i.test(out.type||'');saveFile(out,name+(isMp4?'.mp4':'.webm'));if(!isMp4)msg('This browser cannot make MP4 files, so a WebM video was saved instead. Chrome on Android makes MP4.')}
      ok++;await sleep(500)}catch(e){msg('Could not prepare '+f+'. '+e.message)}}
  btn.disabled=false;if(ok){msg('Saved to your Downloads folder.');toast(ok>1?'Downloaded in '+ok+' formats.':'Downloaded.')}}

/* ---------- camera and voice recording with a script to read ---------- */
const Rec={active:false,opening:false,stream:null,rec:null,chunks:[],c:null,a:null,bgStart:0,t0:0,timer:null,raf:0,el:null,playInfo:null,
  async open(c,a){if(this.active||this.opening)return;this.opening=true;this.c=c;this.a=a||{};this.playInfo=null;
    const el=document.createElement('div');el.className='recl';el.setAttribute('role','dialog');el.setAttribute('aria-label','Camera recording');
    const audio=!!this.a.audio_only;el.classList.toggle('audioonly',audio);
    el.innerHTML=`${audio?`<div class="recaudio" aria-hidden="true"><div class="micorb">${I('mic')}</div><p>Recording your voice</p></div>`:`<video class="recbg" id="recbg" playsinline></video><video class="recpv ${this.a.play?'pip':'full'} ${this.a.camera==='back'?'':'mirror'}" id="recpv" muted playsinline autoplay></video>`}
      ${this.a.script?`<div class="prompter" aria-hidden="true"><div class="ptext" id="ptext">${esc(this.a.script)}</div></div>`:''}
      <div class="rectop"><span class="recdot"></span><span id="rect">Getting ready</span></div><div class="countdown" id="rcd" aria-live="assertive"></div>
      <div class="recbar"><button class="ibtn" data-act="reccancel" aria-label="Cancel recording">${I('x')}</button><button class="recstop" data-act="recstop" aria-label="Stop recording"><span></span></button><span style="width:42px"></span></div>`;
    document.body.appendChild(el);this.el=el;

    catch(e){this.close();this.opening=false;const m=audio?'The microphone could not open for recording. Please allow microphone access for this app.':'The camera could not open. Please allow camera and microphone access for this site.';toast(m);return}
    const bg=$('#recbg');if(!audio)$('#recpv').srcObject=this.stream;else this.a.play=null;
    if(this.a.play){const p=this.a.play,id=p.type==='version'?versionId(c,p.version):p.media_id;const m=id&&await DB.get('media',id);
      if(m&&/^video\//.test(m.type)){bg.src=URL.createObjectURL(m.blob);await once(bg,'loadedmetadata',8000);this.bgStart=clamp(num(p.start,0),0,Math.max(0,(bg.duration||1)-.1));bg.currentTime=this.bgStart;
        this.playInfo=p.type==='version'?{version:p.version||c.versions.length,start:this.bgStart,id}:{media_id:id,start:this.bgStart,id}}else this.a.play=null}
    if(!this.a.play&&bg)bg.remove();
    this.opening=false;this.active=true;wakeOn();
    if(this.a.countdown!==false){const cd=$('#rcd');for(const n of[3,2,1]){if(!this.el)return;cd.textContent=n;cd.classList.remove('pulse');void cd.offsetWidth;cd.classList.add('pulse');await sleep(900)}if(cd)cd.textContent=''}
    if(!this.el)return;
    const mt=audio?['audio/webm;codecs=opus','audio/mp4','audio/webm'].find(t=>MediaRecorder.isTypeSupported(t)):pickMime('mp4');this.chunks=[];this.rec=new MediaRecorder(this.stream,mt?{mimeType:mt}:{});this.rec.ondataavailable=e=>{if(e.data&&e.data.size)this.chunks.push(e.data)};this.rec.start(1000);this.t0=Date.now();

    const rect=$('#rect');this.timer=setInterval(()=>{const s=Math.floor((Date.now()-this.t0)/1000);if(rect)rect.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},500);
    const pt=$('#ptext');if(pt){const words=this.a.script.split(/\s+/).length,dur=Math.max(6,words/2.3)*1000,st=performance.now(),h=pt.scrollHeight;const step=()=>{if(!this.active)return;const p=Math.min(1,(performance.now()-st)/dur);pt.style.transform=`translateY(${-p*Math.max(0,h-80)}px)`;if(p<1)this.raf=requestAnimationFrame(step)};this.raf=requestAnimationFrame(step)}},
  async stop(){if(!this.active||!this.rec)return this.close();this.active=false;clearInterval(this.timer);cancelAnimationFrame(this.raf);const secs=(Date.now()-this.t0)/1000;

      toast('Your voice recording is saved in your uploads.');return}
    const id=await addMedia(c.id,blob,{name:'Camera recording'});c.media.push({id,type,name:'Camera recording',size:blob.size,duration:Math.round(secs*10)/10,recorded_with:played?{media:played.id,start:played.start}:null});c.sel={t:'m',id};if(!c.thumb)c.thumb=await makeThumb(blob);if(!c.kind)c.kind='video';await saveC(c);renderAfterChange(c);

  close(){this.active=false;clearInterval(this.timer);cancelAnimationFrame(this.raf);if(this.stream){this.stream.getTracks().forEach(t=>t.stop());this.stream=null}
    if(this.el){const bg=this.el.querySelector('#recbg');if(bg&&bg.src){bg.pause();URL.revokeObjectURL(bg.src)}this.el.remove();this.el=null}wakeOffIfIdle()},
  cancel(){if(this.rec&&this.rec.state!=='inactive'){this.rec.ondataavailable=null;try{this.rec.stop()}catch(e){}}this.close();toast('Recording cancelled.')}

async function sceneFrame(c,sc,W,H,lt){const ac=new AudioContext();const av={ac,dest:ac.createMediaStreamDestination(),cleanup:[],W,H};

    if(s.video){s.video.muted=true;s.video.currentTime=Math.min(s.end-.05,s.start+t*s.speed);await once(s.video,'seeked',4000)}
    const cv=canvas(W,H);drawScene(cv.getContext('2d'),s,t,W,H);return {cv,dur:s.dur}}
  finally{av.cleanup.forEach(f=>{try{f()}catch(e){}});ac.close().catch(()=>{})}}

  if(src.type==='asset')return {kind:/^lv/.test(src.asset_id)?'video':'image',dur:0,label:'Library'};return {kind:'color',dur:0,label:'Colour'}}

const VED_TOOLS=[['trim','Trim','scissors'],['speed','Speed','speed'],['motion','Motion','motion'],['trans','Transition','trans'],['look','Look','palette'],['text','Text','type'],['stickers','Stickers','smile'],['pip','Picture in picture','pip'],['fx','Particles','confetti'],['sound','Sound','speaker'],['video','Video','film']];

      const W=this.plan.width,H=this.plan.height,k=Math.min(1,720/Math.max(W,H));const b=$('#vbusy');const t=setTimeout(()=>{if(b)b.hidden=false},250);

  showSel(){const s=$('#vsel'),L=this.layer(),cv=$('#vcv');if(!s||!cv)return;if(!L||L.kind==='particles'||L.kind==='frame'){s.hidden=true;return}const r=cv.getBoundingClientRect(),st=$('#vstage').getBoundingClientRect();const ar=this.plan.height/this.plan.width;
    const w=L.kind==='text'?Math.min(96,String(L.text||'').length*num(L.size,7)*.55*ar):L.kind==='sticker'?num(L.size,12)*ar:num(L.w,34),h=L.kind==='text'?num(L.size,7)*1.3:L.kind==='sticker'?num(L.size,12):num(L.h,num(L.w,34)/ar*(L.shape==='circle'?1:.5625));

/* ============================================================
   Swipes, as extras to the icons and voice:
   1. preview: left or right for the next or previous version or upload

function stepPreview(dir){const c=byId(nav.id);if(!c)return false;const items=[...c.versions.map((v,i)=>({t:'v',id:v.id,label:'Version '+(i+1)})),...c.media.map((m,i)=>({t:'m',id:m.id,label:'Upload '+(i+1)}))];
  if(items.length<2)return false;let i=items.findIndex(x=>c.sel&&x.id===c.sel.id);if(i<0)i=items.length-1;const j=i+dir;const pv=$('#preview');
  if(j<0||j>=items.length){if(pv){pv.classList.remove('swipenudge-l','swipenudge-r');void pv.offsetWidth;pv.classList.add(dir>0?'swipenudge-l':'swipenudge-r')}toast(dir>0?'This is the last one.':'This is the first one.');return true}
  const it=items[j];c.sel={t:it.t,id:it.id};saveC(c,false);renderPreviewOnly().then(()=>{const p2=$('#preview');if(p2){p2.classList.remove('swipenudge-l','swipenudge-r');void p2.offsetWidth;p2.classList.add(dir>0?'swipenudge-l':'swipenudge-r')}});
  $$('.ver').forEach(v=>v.classList.toggle('cur',v.dataset.thumb===it.id));toast(it.label);return true}
function stepScene(dir){if(!VidEd.on||!VidEd.plan)return false;const n=VidEd.plan.scenes.length;if(n<2)return false;const j=VidEd.si+dir;
  if(j<0||j>=n){toast(dir>0?'This is the last scene.':'This is the first scene.');return true}VidEd.si=j;VidEd.sel=-1;VidEd.refresh();toast('Scene '+(j+1));return true}
function stepLibrary(dir){const ks=Object.keys(LIB_KINDS);const j=ks.indexOf(libTab)+dir;if(j<0||j>=ks.length)return false;libTab=ks[j];renderLibraryPage().then(()=>{const m=$('#libbrowse');if(m){m.classList.add(dir>0?'swipenudge-l':'swipenudge-r')}});toast(LIB_KINDS[libTab]);return true}
let swp=null;
document.addEventListener('touchstart',e=>{if(e.touches.length!==1){swp=null;return}const p=e.touches[0],tg=e.target;
  swp={x:p.clientX,y:p.clientY,t:Date.now(),tg,vsel:VidEd.on?VidEd.sel:-1,
    /* a touch that starts on a slider, text box, or a video's own controls is never a swipe */
    skip:!!tg.closest('input,textarea,select,.edpanel,.timeline,.strip,.edtabs,.compose')||(tg.tagName==='VIDEO'&&p.clientY>tg.getBoundingClientRect().bottom-56)}},{passive:true,capture:true});
document.addEventListener('touchmove',e=>{if(swp&&e.touches.length!==1)swp=null},{passive:true,capture:true});
document.addEventListener('touchend',e=>{const s=swp;swp=null;if(!s||s.skip)return;const p=e.changedTouches[0];const dx=p.clientX-s.x,dy=p.clientY-s.y,dt=Date.now()-s.t,ax=Math.abs(dx),ay=Math.abs(dy);if(dt>900)return;
  const tg=s.tg;
  /* swipe down closes */
  if(dy>70&&ay>ax*1.4){
    const sh=tg.closest('.sheet');
    if(sh&&sh.scrollTop<=2){closeLayer();return}
    const ch=tg.closest('.cmdpanel');if(ch){const ms=$('#msgs');if(tg.closest('.grab')||tg.closest('.cmdhead')||!ms||ms.scrollTop<=2||!tg.closest('.msgs')){closeCmd();return}}
    return}
  if(ax>60&&ax>ay*1.5){const dir=dx<0?1:-1;
    if(VidEd.on&&tg.closest('#vstage')&&s.vsel<0&&VidEd.sel<0&&!VidEd.previewing){stepScene(dir);return}
    if(!VidEd.on&&!Ed.on&&nav.v==='container'&&tg.closest('#preview')){stepPreview(dir);return}
    if(nav.v==='library'&&tg.closest('#main')&&!tg.closest('#layer')){stepLibrary(dir);return}}
},{passive:true,capture:true});

/* a small PDF writer: one page, the picture filling it */
async function pdfFromJpeg(jpg,pr){const bmp=await createImageBitmap(jpg);const W=bmp.width,H=bmp.height;if(bmp.close)bmp.close();
  const wpt=pr&&pr.pt?pr.pt[0]:Math.round(W*72/150),hpt=pr&&pr.pt?pr.pt[1]:Math.round(H*72/150);
  const data=new Uint8Array(await jpg.arrayBuffer());const enc=new TextEncoder();const parts=[];let pos=0;const offs=[];
  const push=u=>{parts.push(u);pos+=u.length};const str=s=>push(enc.encode(s));
  push(new Uint8Array([37,80,68,70,45,49,46,52,10,37,226,227,207,211,10]));
  const obj=(n,body)=>{offs[n]=pos;str(n+' 0 obj\n'+body+'\nendobj\n')};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${wpt} ${hpt}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=pos;str(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${W} /Height ${H} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${data.length} >>\nstream\n`);push(data);str('\nendstream\nendobj\n');
  const cs=`q ${wpt} 0 0 ${hpt} 0 0 cm /Im0 Do Q`;obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xr=pos;str('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)str(String(offs[i]).padStart(10,'0')+' 00000 n \n');
  str(`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF`);return new Blob(parts,{type:'application/pdf'})}

/* MP4 export: the stored video is returned as is when it already matches; otherwise it is drawn again from its plan */
async function exportVideo(c,it,blob,q,onP){const h=q==='1080p'?1080:720;const mp4=/mp4/.test(blob.type);const short=Math.min(it.meta.w||0,it.meta.h||0);
  if(mp4&&short===h)return blob;
  if(it.sel.t==='v'&&it.meta.plan&&it.meta.tool==='make_video'){const p=JSON.parse(JSON.stringify(it.meta.plan));const W=p.width||1080,H=p.height||1920,k=h/Math.min(W,H);p.width=Math.round(W*k/2)*2;p.height=Math.round(H*k/2)*2;
    const r=await renderVideo(p,c,{mime:"mp4",onProgress:onP});return r.blob}
  if(mp4)return blob;throw mkErr('This video cannot be saved as MP4 here.')}

/* ---------- Import a script: no AI needed; the patterns are read by rule ---------- */
const SCRIPT_KEYS=[['visual',/^(visuals?|video|shots?|footage|b-?roll|scene\s*description|image|camera|clip)$/i],['voice',/^(voice[\s-]*over|voiceover|vo|v\.o\.|narrat(?:or|ion)|speaker|audio|dialogue|script)$/i],['text',/^(on[\s-]*screen[\s-]*text|onscreen\s*text|text|caption|captions|title|super|lower[\s-]*third|heading|headline|overlay)$/i],['dur',/^(duration|length|time|timing)$/i]];
function parseScript(raw){const clean=l=>l.replace(/^\s*(?:[-*•▪●>]+|\d+[.)])\s+/,'').replace(/[*_`#]+/g,'').replace(/\s+$/,'').trim();
  const lines=String(raw||'').replace(/\r/g,'').split('\n');const scenes=[];let cur=null,last=null;
  const secs=s=>{let m=/(\d+)\s*(?:-|–|to)\s*(\d+)\s*s/i.exec(s);if(m)return Math.max(1,+m[2]-+m[1]);m=/(\d+):(\d{2})\s*(?:-|–|to)\s*(\d+):(\d{2})/.exec(s);if(m)return Math.max(1,(+m[3]*60+ +m[4])-(+m[1]*60+ +m[2]));m=/(\d+(?:\.\d+)?)\s*(?:s|sec|secs|seconds)\b/i.exec(s);return m?Math.max(1,+m[1]):0};
  const start=(t)=>{cur={title:t||'',visual:'',voice:'',text:'',dur:0,other:''};scenes.push(cur);last=null};
  for(const rl of lines){const l=clean(rl);if(!l){continue}
    const sm=/^(?:scene|shot|slide|part|segment)\s*#?\s*(?:(\d+)\b\s*[:.\-–—)]?|[:\-–—])\s*(.*)$/i.exec(l);
    if(sm){start('');const rest=sm[2]||'';cur.dur=secs(rest)||0;cur.title=rest.replace(/[\(\[][^\)\]]*[\)\]]/g,'').replace(/^[:\-–—\s]+/,'').trim();last=null;continue}
    const km=/^([A-Za-z][A-Za-z \-\.]{0,24}?)\s*[:：]\s*(.*)$/.exec(l);
    if(km){const key=km[1].trim();const f=SCRIPT_KEYS.find(([n,re])=>re.test(key));
      if(f){if(!cur||(f[0]==='visual'&&cur.visual))start('');const v=km[2].replace(/^["“”']|["“”']$/g,'').trim();if(f[0]==='dur')cur.dur=secs(v)||cur.dur;else{cur[f[0]]=(cur[f[0]]?cur[f[0]]+' ':'')+v;last=f[0]}continue}}
    if(!cur)start('');
    /* a line with no label continues the previous labelled part, or becomes on-screen text */
    const v=l.replace(/^["“”']|["“”']$/g,'');const d=secs(l);if(d&&l.length<24&&!cur.dur){cur.dur=d;continue}
    if(last&&cur[last])cur[last]+=' '+v;else{cur.text=(cur.text?cur.text+' ':'')+v;last='text'}}
  /* no scene markers at all: every paragraph is a scene */
  if(scenes.length===1&&!/^\s*(scene|shot|slide)/im.test(raw)){const paras=String(raw).replace(/\r/g,'').split(/\n\s*\n/).map(p=>clean(p.replace(/\n/g,' '))).filter(Boolean);if(paras.length>1)return paras.map(p=>({title:'',visual:'',voice:'',text:p,dur:0}))}
  return scenes.filter(s=>s.visual||s.voice||s.text||s.title).map(s=>{if(!s.text&&!s.visual&&!s.voice&&s.title)s.text=s.title;return s})}
async function importScriptInto(text){const sc=parseScript(text);if(!sc.length)return toast('I could not find any scenes in that text.');
  const c=VidEd.c;const pal=['#14213D','#3A0CA3','#0B6E4F','#7A1F3D','#1F4068','#4A2C2A'];
  if(/[ഀ-ൿ]/.test(text))VidEd.plan.lang='ml';else if(/[ऀ-ॿ]/.test(text)&&!VidEd.plan.lang)VidEd.plan.lang='hi';
  toast('Reading your script, '+sc.length+' scene'+(sc.length>1?'s':'')+'…');
  const scenes=[],tracks=[];let cum=0,i=0;
  for(const s of sc){const words=(s.voice||'').split(/\s+/).filter(Boolean).length;const dur=Math.max(2,Math.round((s.dur||(words?words/2.5+.8:4))*10)/10);let src=null;
    if(s.visual){try{const v=await Lib.searchVideos(s.visual,1);if(v&&v[0])src={type:'asset',asset_id:v[0].asset_id}}catch(e){}
      if(!src){try{const im=await Lib.searchImages(s.visual,1);if(im&&im[0])src={type:'asset',asset_id:im[0].asset_id}}catch(e){}}}
    const isVid=src&&/^lv/.test(src.asset_id||'');
    const scene={source:src||{type:'color',color:pal[i%pal.length]},fit:'cover',...(isVid?{}:{duration:dur,...(src?{motion:'ken_burns'}:{})}),...(scenes.length?{transition:'fade'}:{}),layers:[]};
    if(isVid){scene.duration=dur}
    const t=s.text||(src?'':s.title);if(t)scene.layers.push({kind:'text',text:t,font:'bold',style:'shadow',size:7,x:50,y:src?80:50,color:'#FFFFFF',appear:'fade',start:0});
    if(s.voice)tracks.push({source:'voiceover',text:s.voice,voice:S.voice==='male'?'male':'female',start:Math.round(cum*10)/10,...(VidEd.plan.lang&&VidEd.plan.lang!=='en'?{lang:VidEd.plan.lang}:{})});
    scenes.push(scene);cum+=dur;i++}
  VidEd.change(p=>{const base=p.scenes.length;p.scenes.push(...scenes);const shift=VidEd.total()-scenes.reduce((a,s)=>a+num(s.duration,3),0);p.audio=p.audio||{tracks:[]};p.audio.tracks=p.audio.tracks||[];tracks.forEach(t=>{t.start=Math.round((t.start+Math.max(0,shift))*10)/10;p.audio.tracks.push(t)})});
  VidEd.si=0;VidEd.refresh();toast('Script imported: '+scenes.length+' scene'+(scenes.length>1?'s':'')+(tracks.length?' and '+tracks.length+' voice-over line'+(tracks.length>1?'s':''):'')+'.')}

/* ============================================================
   MP4 file writer (H.264 video + AAC or Opus audio), written by hand.
   Samples are stored as Blob pieces as they arrive, so long videos do not fill the phone's memory.
   The file has its index (moov) at the front, so it starts playing and uploads quickly.
   ============================================================ */
const Mp4={
  u8(...a){return Uint8Array.from(a)},
  cat(list){let n=0;for(const x of list)n+=x.length;const o=new Uint8Array(n);let p=0;for(const x of list){o.set(x,p);p+=x.length}return o},
  be(n,bytes){const o=new Uint8Array(bytes);for(let i=bytes-1;i>=0;i--){o[i]=n%256;n=Math.floor(n/256)}return o},
  str(s){return Uint8Array.from([...s].map(c=>c.charCodeAt(0)))},
  box(type,...payload){const body=Mp4.cat(payload.flat());return Mp4.cat([Mp4.be(body.length+8,4),Mp4.str(type),body])},
  full(type,ver,flags,...payload){return Mp4.box(type,Mp4.u8(ver,(flags>>16)&255,(flags>>8)&255,flags&255),...payload)},
  zeros(n){return new Uint8Array(n)},
  matrix(){return Mp4.cat([Mp4.be(0x00010000,4),Mp4.zeros(8),Mp4.zeros(4),Mp4.be(0x00010000,4),Mp4.zeros(4),Mp4.zeros(8),Mp4.be(0x40000000,4)])},
  rle(list){const out=[];for(const v of list){const l=out[out.length-1];if(l&&l[1]===v)l[0]++;else out.push([1,v])}return out},
  desc(tag,body){return Mp4.cat([Mp4.u8(tag,body.length),body])}};

class Mp4Mux{

  constructor(o){this.o=o;this.fps=Math.max(1,Math.round(o.fps||30));
    this.tr={v:this.track(this.fps*1000,this.fps),a:o.audio?this.track(o.audio.sr,o.audio.sr):null};
    this.parts=[];this.pos=0;this.vCount=0}
  track(ts,perChunk){return {ts,sizes:[],durs:[],keys:[],chunks:[],cur:[],curBytes:0,curN:0,curDur:0,perChunk,total:0,samples:0}}
  /* one encoded video frame (H.264, length-prefixed) */
  addVideo(data,key){const t=this.tr.v;t.sizes.push(data.length);t.durs.push(1000);if(key)t.keys.push(t.samples+1);t.samples++;t.total+=1000;t.cur.push(data);t.curBytes+=data.length;t.curN++;
    if(t.curN>=this.fps)this.flush(t)}
  /* one encoded audio frame; dur is in the audio timescale */
  addAudio(data,dur){const t=this.tr.a;if(!t)return;t.sizes.push(data.length);t.durs.push(dur);t.samples++;t.total+=dur;t.cur.push(data);t.curBytes+=data.length;t.curN++;t.curDur+=dur;
    if(t.curDur>=t.ts)this.flush(t)}
  flush(t){if(!t.curN)return;t.chunks.push({off:this.pos,n:t.curN});const b=new Blob(t.cur);this.parts.push(b);this.pos+=t.curBytes;t.cur=[];t.curBytes=0;t.curN=0;t.curDur=0}

  stbl(t,entry,base,big){const stts=Mp4.rle(t.durs);
    const parts=[Mp4.full('stsd',0,0,Mp4.be(1,4),entry),
      Mp4.full('stts',0,0,Mp4.be(stts.length,4),...stts.map(r=>[Mp4.be(r[0],4),Mp4.be(r[1],4)]))];

    parts.push(Mp4.full('stsz',0,0,Mp4.be(0,4),Mp4.be(t.sizes.length,4),...t.sizes.map(s=>Mp4.be(s,4))));

  audioEntry(){const a=this.o.audio;const head=[Mp4.zeros(6),Mp4.be(1,2),Mp4.zeros(8),Mp4.be(a.ch,2),Mp4.be(16,2),Mp4.zeros(4),Mp4.be(a.sr*65536,4)];

    return Mp4.box('mp4a',...head,Mp4.full('esds',0,0,Mp4.desc(3,Mp4.cat([Mp4.be(1,2),Mp4.u8(0),dcd,Mp4.desc(6,Mp4.u8(2))]))))}
  trak(id,t,kind,entry,base,big,movDur){const video=kind==='vide';const dur=Math.round(t.total/t.ts*1000);

      Mp4.full('tkhd',0,3,Mp4.be(0,4),Mp4.be(0,4),Mp4.be(id,4),Mp4.zeros(4),Mp4.be(dur,4),Mp4.zeros(8),Mp4.be(0,2),Mp4.be(0,2),Mp4.be(video?0:0x0100,2),Mp4.zeros(2),Mp4.matrix(),Mp4.be(video?this.o.w*65536:0,4),Mp4.be(video?this.o.h*65536:0,4)),
      Mp4.box('mdia',Mp4.full('mdhd',0,0,Mp4.be(0,4),Mp4.be(0,4),Mp4.be(t.ts,4),Mp4.be(t.total,4),Mp4.be(0x55c4,2),Mp4.be(0,2)),
        Mp4.full('hdlr',0,0,Mp4.zeros(4),Mp4.str(kind),Mp4.zeros(12),Mp4.str(video?'VideoHandler':'SoundHandler'),Mp4.u8(0)),
        Mp4.box('minf',video?Mp4.full('vmhd',0,1,Mp4.zeros(8)):Mp4.full('smhd',0,0,Mp4.zeros(4)),
          Mp4.box('dinf',Mp4.full('dref',0,0,Mp4.be(1,4),Mp4.full('url ',0,1))),this.stbl(t,entry,base,big))))}
  moov(base,big){const v=this.tr.v,a=this.tr.a;const dur=Math.max(Math.round(v.total/v.ts*1000),a?Math.round(a.total/a.ts*1000):0);
    return Mp4.box('moov',Mp4.full('mvhd',0,0,Mp4.be(0,4),Mp4.be(0,4),Mp4.be(1000,4),Mp4.be(dur,4),Mp4.be(0x00010000,4),Mp4.be(0x0100,2),Mp4.zeros(10),Mp4.matrix(),Mp4.zeros(24),Mp4.be(a?3:2,4)),

    const ftyp=Mp4.box('ftyp',Mp4.str('isom'),Mp4.be(512,4),Mp4.str('isom'),Mp4.str('iso2'),Mp4.str('avc1'),Mp4.str('mp41'));
