<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>replyO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700;800&display=swap">
<style>
/* Themes: each sets the same colour tokens. The page is always pitch black; panels take the faded colour. */
:root{--navy:#000;--navy2:#2a3140;--yellow:#e3e9f2;--orange:#9aa9bf;--black:#000;--white:#cdd6e3;--ph:#bcc7d6}
[data-theme="bw"]{--navy:#000;--navy2:#2a2a2a;--yellow:#ffffff;--orange:#f2f2f2;--black:#000;--white:#ffffff;--ph:#cfcfcf}
[data-theme="espresso"]{--navy:#000;--navy2:#3a2a21;--yellow:#f4e4d0;--orange:#c58a5a;--black:#000;--white:#e9d6bf;--ph:#d9c3a8}
[data-theme="sunset"]{--navy:#000;--navy2:#4a2b1f;--yellow:#ffe3c9;--orange:#ff8c42;--black:#000;--white:#ffd0a6;--ph:#ffc9a0}
[data-theme="forest"]{--navy:#000;--navy2:#1f3b2c;--yellow:#d8f3dc;--orange:#6cc48a;--black:#000;--white:#b7e4c7;--ph:#a9d8b8}
[data-theme="royal"]{--navy:#000;--navy2:#33204d;--yellow:#eadcf7;--orange:#b07ce8;--black:#000;--white:#d7bdf2;--ph:#cdb4ea}
[data-theme="ocean"]{--navy:#000;--navy2:#163f44;--yellow:#d2f5f2;--orange:#4fd1c5;--black:#000;--white:#a8ece6;--ph:#9fdcd6}
[data-theme="crimson"]{--navy:#000;--navy2:#4a1820;--yellow:#ffd9de;--orange:#e5484d;--black:#000;--white:#ffb3bb;--ph:#f2a6b0}
[data-theme="golden"]{--navy:#000;--navy2:#4a3d15;--yellow:#fff4c2;--orange:#f5c518;--black:#000;--white:#ffe98a;--ph:#f5e39a}
[data-theme="rose"]{--navy:#000;--navy2:#4d2a3a;--yellow:#ffdeea;--orange:#f08fb8;--black:#000;--white:#ffc2da;--ph:#f5b6cf}
[data-theme="slate"]{--navy:#000;--navy2:#2a3140;--yellow:#e3e9f2;--orange:#9aa9bf;--black:#000;--white:#cdd6e3;--ph:#bcc7d6}
[data-theme="ice"]{--navy:#000;--navy2:#1d3a52;--yellow:#e3f4ff;--orange:#8fd8ff;--black:#000;--white:#bfe8ff;--ph:#a9dcf7}
[data-theme="olive"]{--navy:#000;--navy2:#3b3e1d;--yellow:#f0efd0;--orange:#bfc25a;--black:#000;--white:#dfe39a;--ph:#d0d48a}
[data-theme="burgundy"]{--navy:#000;--navy2:#3f1520;--yellow:#f3d3dc;--orange:#a8334f;--black:#000;--white:#e0a3b4;--ph:#d99aaf}
[data-theme="indigo"]{--navy:#000;--navy2:#232b5e;--yellow:#dfe4ff;--orange:#8190ff;--black:#000;--white:#c3cbff;--ph:#b4bef5}
[data-theme="sand"]{--navy:#000;--navy2:#4a4131;--yellow:#f8f0de;--orange:#dcc597;--black:#000;--white:#efe2c6;--ph:#e6d7b8}

*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
html{font-size:clamp(16px,4vw,26px);-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--navy)}
html,body{margin:0;max-width:100%}
body{overflow:hidden;height:100vh;height:100svh;background:var(--navy);color:var(--yellow);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.5;padding:0 1rem;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--white);outline-offset:3px}
::placeholder{color:var(--ph);opacity:1}
.app{display:flex;flex-direction:column;height:100vh;height:100svh;max-width:46rem;width:100%;margin:0 auto;overflow:hidden}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 0 1rem}
.wrap{width:100%;display:flex;flex-direction:column;gap:.45rem}

/* header: spaced name, credit box, thin line across the screen */
.top{display:flex;flex-direction:column;gap:.35rem;padding-top:.4rem}
.brand{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:1.89rem;font-weight:900;white-space:nowrap;color:var(--yellow);line-height:1.05}
.credit-row{display:flex;justify-content:flex-end}
.credit{flex:none;border:1px solid var(--white);border-radius:0;padding:.03rem .12rem;font-weight:800;line-height:1.15;text-align:center;background:var(--navy);color:var(--yellow);outline:1px solid var(--black);outline-offset:1px;box-shadow:0 0 0 2px var(--white)}
.credit .cr1{display:block;font-size:.285rem}
.credit .cr2{display:block;font-size:.21875rem;text-transform:uppercase}
.credit hr{border:0;height:1px;margin:.08rem 0;background:var(--white)}
.letterhead{height:0;border-top:1px solid var(--white);margin:.5rem calc(50% - 50vw) .3rem}
.homesep{height:0;border-top:1px solid var(--white);margin:.3rem calc(50% - 50vw) .3rem}

/* panels: thin double frame (white, black, white) */
.panel{background:var(--navy2);border:1px solid var(--white);border-radius:18px;padding:.5rem .6rem;gap:.35rem;display:flex;flex-direction:column;position:relative;overflow:hidden;outline:1px solid var(--black);outline-offset:1px;box-shadow:0 0 0 2px var(--white)}
.label{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow)}
.hint{margin:0;text-align:center;color:var(--white);font-weight:700;font-size:.85rem}
.msg{margin:0;min-height:1.2em;color:var(--white);font-weight:800;font-size:.85rem;overflow-wrap:anywhere}
.text{width:100%;background:var(--navy);color:var(--yellow);border:1px solid var(--white);border-radius:12px;padding:.35rem .5rem;font-size:.85rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.6rem;padding:.4rem .8rem;border:1px solid var(--white);border-radius:14px;background:var(--orange);color:var(--black);font-weight:800;font-size:.9rem;text-align:center;line-height:1.1;outline:1px solid var(--black);outline-offset:1px;box-shadow:0 0 0 2px var(--white)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{min-height:1.5rem;padding:.1rem .5rem;font-size:.66rem;border-radius:9px}

/* ask button and slider: two equal boxes side by side */
.twin{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;align-items:stretch}
.twin .ask{min-height:4.4rem;font-size:.95rem;border-radius:18px}
.twin .panel{justify-content:center;gap:.2rem}
.slhead{display:flex;justify-content:space-between;align-items:center;gap:.4rem}
.slhead .label{font-size:.58rem;letter-spacing:.05em;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:.3rem;margin:.35rem 0 .1rem;border-radius:999px;border:1px solid var(--white);background:linear-gradient(var(--yellow),var(--yellow)) 0 / var(--p,50%) 100% no-repeat,var(--navy)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:1.1rem;height:1.1rem;border-radius:50%;background:var(--orange);border:2px solid var(--white)}
input[type=range]::-moz-range-thumb{width:1rem;height:1rem;border-radius:50%;background:var(--orange);border:2px solid var(--white)}
input[type=range]::-moz-range-track{background:transparent}
.notches{display:flex;justify-content:space-between;font-size:.6rem;font-weight:800;color:var(--white)}

/* output choice: three radio buttons */
.radios{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem}
.rad{position:relative;display:block}
.rad input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.rad span{display:flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.1rem;border:1px solid var(--white);border-radius:12px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:.8rem;padding:.1rem .3rem}
.rad span::before{content:"";width:.7rem;height:.7rem;border-radius:50%;border:2px solid var(--white);flex:none}
.rad input:checked+span{background:var(--orange);color:var(--black)}
.rad input:checked+span::before{background:var(--black);border-color:var(--black);box-shadow:inset 0 0 0 2px var(--orange)}
.rad input:focus-visible+span{outline:3px solid var(--white);outline-offset:2px}
.rad input:disabled+span{opacity:.5}

/* theme drop-down */
.theme-panel{overflow:visible}
.tdd{position:relative;z-index:40}
.tddbtn{width:100%;min-height:2.1rem;display:flex;align-items:center;gap:.5rem;padding:.2rem .6rem;border:1px solid var(--white);border-radius:12px;background:var(--navy);color:var(--yellow);font-weight:800;font-size:.8rem}
.tddlist{position:absolute;z-index:40;left:0;right:0;top:calc(100% + .3rem);list-style:none;margin:0;padding:.3rem;max-height:60vh;overflow-y:auto;border:1px solid var(--white);border-radius:12px;background:var(--navy2)}
.tddlist li+li{margin-top:.25rem}
.tddlist button{width:100%;display:flex;align-items:center;gap:.5rem;min-height:2rem;padding:.2rem .5rem;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--yellow);font-weight:800;font-size:.8rem;text-align:left}
.tddlist button[aria-selected="true"],.tddlist button:focus-visible{border-color:var(--white);background:var(--navy)}
.sw{display:inline-block;width:.9rem;height:.9rem;border:1px solid var(--white);border-radius:3px;flex:none}

/* twinkling stars on the panels of the starry themes */
html[data-stars] .panel::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,var(--yellow) 0 1.1px,transparent 1.8px),radial-gradient(circle,var(--yellow) 0 .9px,transparent 1.6px),radial-gradient(circle,var(--yellow) 0 .8px,transparent 1.5px);
  background-size:190px 170px,260px 230px,330px 290px;background-position:24px 30px,120px 110px,250px 60px;
  opacity:.6;animation:twinkle 5s ease-in-out infinite}
html[data-stars] .panel>*:not(.tdd){position:relative;z-index:1}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.85}}
@media (prefers-reduced-motion:reduce){html[data-stars] .panel::before{animation:none;opacity:.5}}

/* key panel: compact, small text, thin lines */
.apipanel{padding:.5rem .6rem;gap:.4rem}
.kbtns{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
.kbtn,.kbtns .btn.sm{display:inline-flex;align-items:center;justify-content:center;min-height:1.5rem;padding:.1rem .45rem;border:1px solid var(--white);border-radius:9px;background:var(--orange);color:#000;font-weight:900;font-size:.6rem;text-decoration:none;line-height:1;box-shadow:none;outline:0}
.ksteps{margin:0;padding-left:1.1rem;font-size:.68rem;font-weight:700;color:var(--yellow);display:flex;flex-direction:column;gap:.15rem}
.knote{margin:0;font-size:.64rem;font-weight:700;color:var(--white)}
.apipanel .hint{font-size:.62rem;text-align:left}
.apipanel .klist .hint{text-align:left}
.klist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.3rem}
.krow{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border:1px solid var(--white);border-radius:10px;padding:.25rem .5rem}
.kname{font-weight:800;font-size:.72rem;color:var(--yellow)}
.kadd{padding:.4rem .5rem;gap:.35rem}
.kwhat{display:flex;flex-direction:column;gap:.25rem}
.apirow{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.keyline{border-top:1px solid var(--white);padding-top:.4rem;justify-content:space-between}
.apititle{flex:1;min-width:0;font-size:.72rem;font-weight:800;color:var(--yellow)}
.kcount{display:block;font-size:.62rem;font-weight:700;color:var(--white)}
.apipanel .keyline .btn.sm,.apipanel .krow .btn.sm{min-height:.95rem;height:.95rem;padding:0 .4rem;font-size:.6rem;line-height:1;border-radius:8px;box-shadow:none;outline:0}
.delkey{background:#b00020!important;color:#fff!important;border-color:#fff!important}

/* questions and responses */
.qrhead{margin:0;font-size:.75rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:var(--yellow)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.35rem}
.item{display:flex;align-items:center;gap:.5rem;border:1px solid var(--white);border-radius:10px;padding:.35rem .5rem;flex-wrap:wrap;background:var(--navy)}
.item .txt{flex:1 1 8rem;min-width:0}
.item .q{font-weight:700;font-size:.8rem;overflow-wrap:anywhere;color:var(--yellow)}
.item .when{font-size:.62rem;font-weight:700;color:var(--white)}
.acts{display:flex;align-items:center;gap:.35rem}
.pdfbtn{flex:none;width:1.9rem;height:1.9rem;border:1px solid var(--white);border-radius:8px;background:var(--navy2);color:var(--yellow);display:grid;place-items:center;padding:0}
.pdfbtn svg{width:1.3rem;height:1.3rem}
.item .btn.sm{box-shadow:none;outline:0}
.item .btn.sm.del{background:#b00020;color:#fff}

/* listening screen */
#overlay{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center}
#overlay .big{font-size:1.5rem;font-weight:800;margin:0;color:var(--yellow)}
#overlay .box{max-width:40rem;min-height:4rem;font-size:1rem;font-weight:700;border:1px solid var(--white);border-radius:14px;padding:.7rem;width:100%;text-align:left;overflow-wrap:anywhere;background:var(--navy2);color:var(--yellow)}
#overlay .btn{width:100%;max-width:40rem;min-height:2.8rem;font-size:1rem}
</style>
</head>
<body>
<div class="app">
<div class="scroll" id="scroll">
  <header class="top">
    <span class="brand" aria-label="replyO"><span aria-hidden="true">r</span><span aria-hidden="true">e</span><span aria-hidden="true">p</span><span aria-hidden="true">l</span><span aria-hidden="true">y</span><span aria-hidden="true">O</span></span>
    <div class="credit-row">
      <div class="credit" aria-label="Developed by PK. Accessibility first."><span class="cr1">Developed by PK</span><hr><span class="cr2">Accessibility first</span></div>
    </div>
    <div class="letterhead" aria-hidden="true"></div>
  </header>

  <section class="wrap">
    <div class="twin">
      <button class="btn ask" id="askBtn">Ask a question</button>
      <div class="panel">
        <div class="slhead"><span class="label" id="lenLbl">Response length</span><span class="label" id="lenVal">STD</span></div>
        <input type="range" id="len" min="0" max="2" step="1" value="1" aria-labelledby="lenLbl" aria-valuetext="STD">
        <div class="notches" aria-hidden="true"><span>MIN</span><span>STD</span><span>MAX</span></div>
      </div>
    </div>
    <div class="panel" role="radiogroup" aria-labelledby="outLbl">
      <span class="label" id="outLbl">Output</span>
      <div class="radios">
        <label class="rad"><input type="radio" name="out" value="pdf"><span>PDF</span></label>
        <label class="rad"><input type="radio" name="out" value="picture"><span>Picture</span></label>
        <label class="rad"><input type="radio" name="out" value="voice"><span>Voice</span></label>
      </div>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <div class="panel theme-panel" id="themeHost"></div>
    <div class="panel apipanel" id="keyHost"></div>

    <div class="homesep" aria-hidden="true"></div>

    <div class="panel">
      <h2 class="qrhead" id="qrH">Questions &amp; Responses</h2>
      <p class="hint" id="empty">No questions yet. Tap Ask a question.</p>
      <ul class="list" id="list"></ul>
    </div>
  </section>
</div>
</div>

<div id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="ovTitle">
  <p class="big" id="ovTitle">Listening</p>
  <div class="box" id="ovText" aria-live="polite">Speak your question.</div>
  <button class="btn" id="stopBtn">Stop and send</button>
  <button class="btn" id="cancelBtn" style="background:var(--navy2);color:var(--yellow)">Cancel</button>
</div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEYS_STORE='ask4pdf.keys', ITEMS_STORE='ask4pdf.items', LEN_STORE='ask4pdf.len';
const OUT_KEY='ask4pdf.out';
const IMG_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="10" r="1.8" fill="currentColor"/><path d="M4 18l5-5 4 4 3-3 4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const SPK_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8c1.5 1.2 1.5 6.8 0 8M18.5 5.5c3 2.8 3 10.2 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const FILE_SVG='<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 2h8l6 6v14H6z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M14 2v6h6" fill="none" stroke="currentColor" stroke-width="2"/><text x="12" y="19" font-size="5" text-anchor="middle" fill="currentColor" font-weight="bold">PDF</text></svg>';
const PROV={
  google:{name:'Google',re:/^(AIza|AQ\.)/,page:'https://aistudio.google.com/apikey'},
  openai:{name:'OpenAI',re:/^sk-/,page:'https://platform.openai.com/api-keys'}
};
const MODEL={google:'gemini-3.1-flash-lite',openai:'gpt-4.1-mini'};
const LIB={
  jspdf:'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  table:'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
};
/* Response length: MIN (to the point), STD (descriptive), MAX (exhaustive). It applies to PDF, Picture and Voice. */
const LEN=[
  {name:'MIN',sections:'3 or 4',count:[3,4],
   words:'Write 2 or 3 short paragraphs of 40 to 60 words each. Be direct and to the point.',links:false,
   pic:'Use 2 sections and about 90 words in total. Be straight to the point.',
   speech:'Write about 80 words. Be straight to the point: the direct answer and nothing else.'},
  {name:'STD',sections:'5 to 7',count:[5,7],
   words:'Write 4 paragraphs of 70 to 100 words each. Be descriptive: explain the background and the reasoning, and give examples.',links:false,
   pic:'Use 3 or 4 sections and about 220 words in total. Be descriptive: explain the key background and reasoning.',
   speech:'Write about 250 words. Be descriptive: give the answer, then the background, reasoning and a useful example.'},
  {name:'MAX',sections:'8 or 9',count:[8,9],
   words:'Write 5 or 6 paragraphs of 90 to 130 words each. Be exhaustive: cover nuance, examples, comparisons, exceptions and implications.',links:true,
   pic:'Use 5 sections and about 400 words in total, so it fits one page. The last section is titled "Explore further" and has 4 to 6 bullets naming reputable organisations, books or websites to look up. Do not write web addresses.',
   speech:'Write between 900 and 1200 words. Be as exhaustive as you can: the direct answer, background, detailed explanation, examples, nuances, exceptions and implications. End with avenues for further exploration: the names of reputable organisations, books, courses or websites the listener can look up. Do not read out web addresses.'}
];

/* ---------- storage ---------- */
function readJSON(k,fb){try{const v=JSON.parse(localStorage.getItem(k));return v==null?fb:v}catch(e){return fb}}
let keys=readJSON(KEYS_STORE,[]).filter(x=>x&&PROV[x.p]&&x.k);
let items=readJSON(ITEMS_STORE,[]);
let lenIdx=Math.max(0,Math.min(2,+readJSON(LEN_STORE,1)||0));
let outMode=(()=>{try{const v=localStorage.getItem(OUT_KEY);return v==='picture'||v==='voice'?v:'pdf'}catch(e){return 'pdf'}})();
let playingId=null, speakGen=0;
let busy=false, rec=null, cancelled=false, keyUI={open:false,adding:null,msg:''};
const saveKeys=()=>localStorage.setItem(KEYS_STORE,JSON.stringify(keys));
const saveItems=()=>localStorage.setItem(ITEMS_STORE,JSON.stringify(items));

let dbp=null;
function idb(){return dbp||(dbp=new Promise((ok,no)=>{
  const r=indexedDB.open('ask4pdf',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('pdfs');
  r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);
}))}
async function idbPut(id,blob){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('pdfs','readwrite');t.objectStore('pdfs').put(blob,id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function idbGet(id){const d=await idb();return new Promise((ok,no)=>{const q=d.transaction('pdfs').objectStore('pdfs').get(id);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}
async function idbDel(id){const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('pdfs','readwrite');t.objectStore('pdfs').delete(id);t.oncomplete=ok;t.onerror=()=>no(t.error)})}

function msg(t){$('#msg').textContent=t||''}

/* ---------- themes (same fifteen as Kramdex): page always pitch black, panels take the faded colour ---------- */
const THEME_LIST=[
  ['bw','Black and White','#f2f2f2',false],
  ['espresso','Espresso Brown','#7b4a2d',false],
  ['sunset','Sunset Orange','#ff7a2f',false],
  ['forest','Forest Green','#2f8f4e',true],
  ['royal','Royal Purple','#7b2fbf',true],
  ['ocean','Ocean Teal','#1aa3a3',true],
  ['crimson','Crimson Red','#d62839',false],
  ['golden','Golden Yellow','#f5c518',true],
  ['rose','Rose Pink','#e86fa0',false],
  ['slate','Slate Grey','#6b7a90',true],
  ['ice','Ice Blue','#7fd4ff',true],
  ['olive','Olive','#7d8229',false],
  ['burgundy','Burgundy','#7a1b31',false],
  ['indigo','Indigo','#3f51b5',true],

/* ---------- AI calls: keys are tried in the order saved ---------- */
function parseJSON(t){
  t=t.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');
  const a=t.indexOf('{'),b=t.lastIndexOf('}');
  return JSON.parse(a>=0&&b>a?t.slice(a,b+1):t);
}
const verNum=n=>{const m=String(n).match(/(\d+(?:\.\d+)?)/);return m?parseFloat(m[1]):0};
/* If the stored model name is refused (404), look up a current one on the account and use it. */
async function findModel(p,k){
  if(p==='google'){
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':k}});
    if(!r.ok)throw new Error(String(r.status));
    const j=await r.json();
    const c=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')&&/^models\/gemini-[\d.]+-flash(-lite)?$/.test(m.name))
      .map(m=>m.name.replace('models/',''))
      .sort((a,b)=>verNum(b)-verNum(a)||(/lite/.test(b)?1:0)-(/lite/.test(a)?1:0));
    if(!c.length)throw new Error('404');
    return c[0];
  }
  const r=await fetch('https://api.openai.com/v1/models',{headers:{Authorization:'Bearer '+k}});
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();
  const c=(j.data||[]).map(m=>m.id).filter(id=>/^gpt-[\d.]+-mini$/.test(id)).sort((a,b)=>verNum(b)-verNum(a));
  if(!c.length)throw new Error('404');
  return c[0];
}
async function requestOnce(p,k,prompt,json){
  if(p==='google'){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL.google}:generateContent`,{
      method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':k},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.4,...(json?{responseMimeType:'application/json'}:{})}})
    });
    if(!r.ok)throw new Error(String(r.status));
    const j=await r.json();
    return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(x=>x.text||'').join('');
  }
  const r=await fetch('https://api.openai.com/v1/chat/completions',{
    method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+k},
    body:JSON.stringify({model:MODEL.openai,messages:[{role:'user',content:prompt}],...(json?{response_format:{type:'json_object'}}:{})})
  });
  if(!r.ok)throw new Error(String(r.status));
  const j=await r.json();
  return (j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
}
async function callOne(p,k,prompt,json){
  let text;
  try{text=await requestOnce(p,k,prompt,json)}
  catch(e){
    if(e.message!=='404')throw e;
    MODEL[p]=await findModel(p,k);
    text=await requestOnce(p,k,prompt,json);
  }
  text=String(text).trim();
  if(!text)throw new Error('empty reply');
  return json?parseJSON(text):text;
}
async function ai(prompt,json){
  if(!keys.length)throw new Error('Save an API key first, then ask again.');
  let last='';
  for(const k of keys){
    try{return await callOne(k.p,k.k,prompt,json)}catch(e){last=e.message||'error'}
  }
  throw new Error(`The AI could not answer (${last}). Check the key and its free quota.`);
}

/* ---------- Picture: one A4 page (1240 x 1754), always fitted so it never runs past the page ---------- */
function makePicture(doc){
  return new Promise((resolve,reject)=>{
    const W=1240,H=1754,M=90,FF='Arial, Helvetica, sans-serif';
    const c=document.createElement('canvas');c.width=W;c.height=H;
    const ctx=c.getContext('2d');
    if(!ctx)return reject(new Error('This browser cannot make pictures.'));
    const LIMIT=H-M-30,START=150,TW=W-2*M;
    const fnt=(sz,wt,it)=>`${it?'italic ':''}${wt} ${Math.round(sz)}px ${FF}`;
    const date=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
    const wcache=new Map();
    const wid=t=>{const key=ctx.font+'|'+t;let v=wcache.get(key);if(v===undefined){v=ctx.measureText(t).width;wcache.set(key,v)}return v};
    function wrap(text,w){
      const words=String(text).split(/\s+/).filter(Boolean),lines=[];
      const sp=wid(' ');let cur=[],cw=0;
      for(const wd of words){
        const ww=wid(wd);
        if(!cur.length){cur=[wd];cw=ww}
        else if(cw+sp+ww<=w){cur.push(wd);cw+=sp+ww}
        else{lines.push(cur.join(' '));cur=[wd];cw=ww}
      }
      if(cur.length)lines.push(cur.join(' '));
      return lines;
    }
    function layout(fs,secs){
      const cmds=[];let y=START;
      const para=(text,sz,wt,it,o={})=>{
        ctx.font=fnt(sz,wt,it);
        const ind=o.indent||0,w=TW-ind,lh=sz*1.42;
        const lines=wrap(o.bullet?'•  '+text:text,w);
        lines.forEach((ln,k)=>{cmds.push({k:'t',s:ln,x:M+ind,y:y+sz,font:ctx.font,j:o.justify!==false&&k<lines.length-1,w});y+=lh});
        y+=o.gap===undefined?sz*0.5:o.gap;
      };
      const rule=gap=>{cmds.push({k:'l',y:y,x1:M,x2:W-M,lw:1.5});y+=gap};
      para(doc.title,fs*1.7,'bold',false,{justify:false,gap:fs*0.25});
      para('Date: '+date,fs*0.7,'normal',false,{justify:false,gap:fs*0.9});
      para('Question',fs*1.1,'bold',false,{justify:false,gap:fs*0.1});
      rule(fs*0.5);
      para(doc.question,fs*1.05,'normal',false,{justify:false,gap:fs*0.2});
      para('Original spoken question: '+doc.original,fs*0.75,'normal',true,{justify:false,gap:fs*1});
      para('Response',fs*1.1,'bold',false,{justify:false,gap:fs*0.1});
      rule(fs*0.6);
      secs.forEach((x,i)=>{
        para(`${i+1}.  ${x.heading}`,fs*1.05,'bold',false,{justify:false,gap:fs*0.2});
        if(x.text)para(x.text,fs,'normal',false,{gap:fs*0.3});
        x.bullets.forEach(b=>para(b,fs,'normal',false,{bullet:true,indent:22,justify:false,gap:fs*0.2}));
        y+=fs*0.5;
      });
      return {cmds,y};
    }
    /* find the largest font size (14 to 26) at which everything fits; if none does, drop the last section and try again */
    let secs=doc.sections.slice(),fs=14,res=null;
    for(;;){
      let lo=14,hi=26,best=null,bestFs=14;
      while(lo<=hi){
        const mid=(lo+hi)>>1,r=layout(mid,secs);
        if(r.y<=LIMIT){best=r;bestFs=mid;lo=mid+1}else hi=mid-1;
      }
      if(best){res=best;fs=bestFs;break}
      if(secs.length<=1){res=layout(14,secs);fs=14;break}
      secs=secs.slice(0,-1);
    }
    ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.strokeRect(30,30,W-60,H-60);
    ctx.fillStyle='#000';ctx.textBaseline='alphabetic';
    ctx.font=fnt(28,'bold');ctx.fillText('Created by replyO',M,82);
    ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(M,102);ctx.lineTo(W-M,102);ctx.stroke();
    for(const m of res.cmds){
      if(m.k==='l'){ctx.lineWidth=m.lw;ctx.beginPath();ctx.moveTo(m.x1,m.y);ctx.lineTo(m.x2,m.y);ctx.stroke();continue}
      ctx.font=m.font;
      if(m.j){
        const ws=m.s.split(' ');
        if(ws.length>1){
          const tot=ws.reduce((a,x)=>a+wid(x),0);
          const gap=(m.w-tot)/(ws.length-1),sp=wid(' ');
          if(gap<=sp*3){let x=m.x;for(const wd of ws){ctx.fillText(wd,x,m.y);x+=wid(wd)+gap}continue}
        }
      }
      ctx.fillText(m.s,m.x,m.y);
    }
    c.toBlob(b=>b?resolve(b):reject(new Error('The picture could not be made.')),'image/png');
  });
}

/* ---------- Voice playback: short pieces one after another; a piece that stalls is skipped ---------- */
function chunkText(t){
  const sents=(String(t).replace(/\s+/g,' ').match(/[^.!?]+[.!?]+["')\]]*\s*|[^.!?]+$/g)||[String(t)]).map(x=>x.trim()).filter(Boolean);
  const out=[];let cur='';
  const push=x=>{if(x)out.push(x)};
  for(let s of sents){
    while(s.length>240){
      let cut=s.lastIndexOf(',',220);if(cut<80)cut=s.lastIndexOf(' ',220);if(cut<80)cut=220;
      if(cur){push(cur);cur=''}
      push(s.slice(0,cut+1).trim());s=s.slice(cut+1).trim();
    }
    if((cur+' '+s).trim().length>220){push(cur);cur=s}else cur=(cur+' '+s).trim();
  }
  push(cur);
  return out;
}
function pickVoice(){
  const v=(window.speechSynthesis&&speechSynthesis.getVoices&&speechSynthesis.getVoices())||[];
  return v.find(x=>/^en[-_]IN/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null;
}
function stopSpeech(){
  speakGen++;playingId=null;
  try{if(window.speechSynthesis)speechSynthesis.cancel()}catch(e){}
  renderList();
}
function speakText(text,id){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined')return msg('Voice playback is not available in this browser.');
  try{speechSynthesis.cancel()}catch(e){}
  const gen=++speakGen;playingId=id;renderList();
  const parts=chunkText(text);let idx=0,anyStarted=false;
  msg('Speaking. Tap Stop to stop.');
  const finish=()=>{if(gen!==speakGen)return;playingId=null;renderList();msg('')};
  const next=()=>{
    if(gen!==speakGen)return;
    if(idx>=parts.length)return finish();
    const part=parts[idx],u=new SpeechSynthesisUtterance(part);
    const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}else u.lang='en-IN';
    u.rate=1;
    let done=false,wd=null;
    const advance=()=>{if(done||gen!==speakGen)return;done=true;clearTimeout(wd);idx++;next()};
    u.onstart=()=>{anyStarted=true};
    u.onend=advance;
    u.onerror=()=>{if(gen!==speakGen)return;advance()};
    wd=setTimeout(()=>{
      if(done||gen!==speakGen)return;
      if(idx===0&&!anyStarted){speakGen++;try{speechSynthesis.cancel()}catch(e){}playingId=null;renderList();msg('The phone did not start the voice. Tap Play on the answer in the list.');return}
      try{speechSynthesis.cancel()}catch(e){}
      advance();
    },Math.max(8000,part.length*150));
    try{speechSynthesis.speak(u)}catch(e){advance()}
  };
  next();
}

/* ---------- PDF: white paper, black text, Created by replyO top-left on every page, paragraphs not split across pages where avoidable ---------- */
const loaded={};
function loadScript(src){
  return loaded[src]||(loaded[src]=new Promise((ok,no)=>{
    const s=document.createElement('script');s.src=src;s.onload=ok;
    s.onerror=()=>{delete loaded[src];no(new Error('The PDF tools could not load. Check the internet connection.'))};
    document.head.appendChild(s);
  }));
}
async function makePDF(doc){
  await loadScript(LIB.jspdf);await loadScript(LIB.table);
  const pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const W=210,M=20,TW=W-2*M,TOP=28,BOT=280,LH=k=>k*0.53;
  let y=TOP;
  const hdrDone=new Set();
  const header=()=>{
    const pn=pdf.getNumberOfPages();
    if(hdrDone.has(pn))return;
    hdrDone.add(pn);
    pdf.setTextColor(0);pdf.setFont('helvetica','bold');pdf.setFontSize(10);
    pdf.text('Created by replyO',M,12);
    pdf.setDrawColor(0);pdf.setLineWidth(0.3);pdf.line(M,15,W-M,15);
  };
  const newPage=()=>{pdf.addPage();y=TOP;header()};
  const need=h=>{if(y+h>BOT)newPage()};
  const justified=(t,x,yy,w,last)=>{
    const ws=t.split(' ');
    if(last||ws.length<2){pdf.text(t,x,yy);return}
    const tot=ws.reduce((a,s)=>a+pdf.getTextWidth(s),0);
    const g=(w-tot)/(ws.length-1);let cx=x;
    for(const s of ws){pdf.text(s,cx,yy);cx+=pdf.getTextWidth(s)+g}
  };
  const para=(text,o={})=>{
    const size=o.size||11,indent=o.indent||0,gap=o.gap===undefined?3.5:o.gap;
    pdf.setFont('helvetica',o.style||'normal');pdf.setFontSize(size);pdf.setTextColor(0);
    const w=TW-indent,lh=LH(size);
    const lines=pdf.splitTextToSize(text,w);
    const h=lines.length*lh;
    if(y+h>BOT&&h<=BOT-TOP)newPage();
    lines.forEach((ln,k)=>{
      if(y+lh>BOT)newPage();
      justified(ln,M+indent,y,w,k===lines.length-1||o.left);
      y+=lh;
    });
    y+=gap;
  };
  const linkLine=(url)=>{
    need(LH(10)+3);
    pdf.setFont('helvetica','normal');pdf.setFontSize(10);pdf.setTextColor(0);
    pdf.textWithLink(url,M,y,{url});
    y+=LH(10)+3;
  };
  const heading=(t,size=14)=>{
    need(LH(size)+14);
    y+=2;
    pdf.setFont('helvetica','bold');pdf.setFontSize(size);pdf.setTextColor(0);
    pdf.text(t,M,y);
    y+=2;pdf.setLineWidth(0.2);pdf.line(M,y,W-M,y);y+=4;
  };
  const flow=steps=>{
    const bw=TW*0.7,bx=M+(TW-bw)/2,cx=W/2;
    steps.forEach((s,i)=>{
      pdf.setFont('helvetica','normal');pdf.setFontSize(10.5);
      const lines=pdf.splitTextToSize(s,bw-8);
      const bh=Math.max(12,lines.length*4.6+6);
      need(bh+10);
      pdf.setDrawColor(0);pdf.setLineWidth(0.4);pdf.roundedRect(bx,y,bw,bh,2,2);
      const top=y+(bh-lines.length*4.6)/2+3.4;
      lines.forEach((ln,k)=>pdf.text(ln,cx,top+k*4.6,{align:'center'}));
      y+=bh;
      if(i<steps.length-1){
        pdf.setLineWidth(0.4);pdf.line(cx,y,cx,y+5);
        pdf.setFillColor(0);pdf.triangle(cx-1.6,y+4.6,cx+1.6,y+4.6,cx,y+7.2,'F');
        y+=8;
      }else y+=4;
    });
  };
  const table=t=>{
    pdf.autoTable({
      head:[t.headers],body:t.rows,startY:y,
      margin:{left:M,right:M,top:TOP,bottom:20},
      theme:'grid',
      styles:{font:'helvetica',fontSize:10,textColor:0,lineColor:0,lineWidth:0.2,cellPadding:2.4,halign:'left',valign:'top'},
      headStyles:{fillColor:0,textColor:255,fontStyle:'bold'},
      didDrawPage:header
    });
    y=pdf.lastAutoTable.finalY+6;
  };

  header();
  para(doc.title,{size:20,style:'bold',gap:4});
  para('Date: '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}),{size:10,gap:6});
  heading('Question');
  para(doc.question,{size:12});
  para('Original spoken question: '+doc.original,{size:10,style:'italic',gap:6});
  heading('Contents');
  doc.sections.forEach((s,i)=>para(`${i+1}.  ${s.heading}`,{size:11,gap:1.5}));
  y+=4;
  heading('Response',16);
  doc.sections.forEach((s,i)=>{
    heading(`${i+1}.  ${s.heading}`,13);
    s.paragraphs.forEach(p=>para(p));
    s.bullets.forEach(b=>para('•  '+b,{indent:4,gap:2}));
    if(s.bullets.length)y+=1.5;
    if(s.table)table(s.table);
    if(s.flow.length)flow(s.flow);
    (s.links||[]).forEach(l=>{
      para(l.title,{style:'bold',gap:0.5});
      if(l.why)para(l.why,{size:10,gap:0.5});
      linkLine(l.url);
    });
  });

  const n=pdf.getNumberOfPages();
  for(let i=1;i<=n;i++){
    pdf.setPage(i);pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(0);
    pdf.text(`Page ${i} of ${n}`,W/2,291,{align:'center'});
  }
  return pdf.output('blob');
}

/* ---------- saving, opening, downloading (location chosen by the user), deleting ---------- */
const typeOf=it=>it.type==='picture'||it.type==='voice'?it.type:'pdf';
const KIND={pdf:{mime:'application/pdf',ext:'.pdf',desc:'PDF document',noun:'PDF'},picture:{mime:'image/png',ext:'.png',desc:'PNG picture',noun:'picture'}};
function fileName(t){return (t||'replyO').replace(/[^\w\- ]+/g,'').trim().slice(0,60)||'replyO'}
async function openFile(i){
  const it=items[i];if(!it)return;
  const k=typeOf(it);
  if(k==='voice')return playItem(i);
  const b=await idbGet(it.id);
  if(!b)return msg(`That ${KIND[k].noun} is no longer saved on this phone.`);
  const u=URL.createObjectURL(b);
  window.open(u,'_blank');
  setTimeout(()=>URL.revokeObjectURL(u),60000);
}
async function downloadFile(i){
  const it=items[i];if(!it)return;
  const k=typeOf(it);if(k==='voice')return;
  const K=KIND[k];
  const b=await idbGet(it.id);
  if(!b)return msg(`That ${K.noun} is no longer saved on this phone.`);
  const name=fileName(it.title)+K.ext;
  if(window.showSaveFilePicker){
    try{
      const h=await window.showSaveFilePicker({suggestedName:name,types:[{description:K.desc,accept:{[K.mime]:[K.ext]}}]});
      const w=await h.createWritable();await w.write(b);await w.close();
      return msg('Saved to the location you chose.');
    }catch(e){if(e&&e.name==='AbortError')return msg('Download cancelled.')}
  }
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),60000);
  msg('Download started. Your phone will choose where it goes.');
}
function playItem(i){
  const it=items[i];if(!it||typeOf(it)!=='voice')return;
  if(playingId===it.id){stopSpeech();msg('');return}
  speakText(it.text||'',it.id);
}
async function deleteItem(i){
  const it=items[i];if(!it)return;
  if(!confirm(`Delete "${it.title}"? The question and its ${typeOf(it)==='voice'?'answer':typeOf(it)} will be removed from this phone. This cannot be undone.`))return;
  if(playingId===it.id)stopSpeech();
  if(typeOf(it)!=='voice'){try{await idbDel(it.id)}catch(e){}}
  items.splice(i,1);saveItems();renderList();msg('Deleted.');
}
function renderList(){
  $('#empty').hidden=items.length>0;
  $('#list').innerHTML=items.map((it,i)=>{
    const k=typeOf(it),t=esc(it.title||'');
    const tag=k==='voice'?'Voice':k==='picture'?'Picture':'PDF';
    let acts;
    if(k==='voice'){
      const on=playingId===it.id;
      acts=`<button class="pdfbtn" data-act="play" data-i="${i}" aria-label="${on?'Stop':'Play'} voice answer: ${t}" title="${on?'Stop':'Play'}">${SPK_SVG}</button>
        <button class="btn sm" data-act="play" data-i="${i}" aria-label="${on?'Stop':'Play'} voice answer: ${t}">${on?'Stop':'Play'}</button>`;
    }else{
      acts=`<button class="pdfbtn" data-act="open" data-i="${i}" aria-label="Open ${k==='picture'?'picture':'PDF'}: ${t}" title="Open">${k==='picture'?IMG_SVG:FILE_SVG}</button>
        <button class="btn sm" data-act="dl" data-i="${i}" aria-label="Download ${k==='picture'?'picture':'PDF'}: ${t}">Download</button>`;
    }
    return `<li class="item">
      <div class="txt"><div class="q">${esc(it.q)}</div><div class="when">${tag} · ${esc(new Date(it.date).toLocaleString('en-IN'))}</div></div>
      <div class="acts">${acts}
        <button class="btn sm del" data-act="del" data-i="${i}" aria-label="Delete: ${t}">Delete</button>
      </div>
    </li>`;
  }).join('');
}

/* ---------- voice input ---------- */
function showOverlay(on){$('#overlay').hidden=!on}
/* Plain reasons for voice errors. "not-allowed" means the browser blocked the microphone for this page. */
function voiceReason(code){
  if(code==='not-allowed'||code==='service-not-allowed')return 'The microphone is blocked for this page. Open replyO online (the https web address), not from a downloaded file, then tap Allow when the phone asks for the microphone. You can also turn it on in the browser settings for this site.';
  if(code==='network')return 'Voice needs an internet connection. Check the connection and try again.';
  if(code==='audio-capture')return 'No microphone was found on this device.';
  return 'Voice stopped ('+code+'). Please try again.';
}
/* Asks the browser for the microphone first, so the permission prompt appears before listening starts. */
async function ensureMic(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return;
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});s.getTracks().forEach(t=>t.stop())}
  catch(e){throw new Error(voiceReason('not-allowed'))}
}
function listen(){
  return new Promise((resolve,reject)=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR)return reject(new Error('Voice input is not available in this browser. Please open replyO in Chrome.'));
    const r=new SR();rec=r;
    r.lang='en-IN';r.interimResults=true;r.continuous=true;
    let fin='',mid='';
    r.onresult=e=>{
      mid='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const t=e.results[i][0].transcript;
        if(e.results[i].isFinal)fin+=t+' ';else mid+=t;
      }
      $('#ovText').textContent=(fin+mid).trim()||'Speak your question.';
    };
    r.onerror=e=>{if(e.error==='no-speech'||e.error==='aborted')return;reject(new Error(voiceReason(e.error)))};
    r.onend=()=>resolve((fin+mid).trim());
    try{r.start()}catch(e){reject(e)}
  });
}
async function askByVoice(){
  if(busy)return;
  if(!keys.length)return msg('Save an API key first, then ask.');
  if(location.protocol==='file:')return msg('Voice input does not work when the app is opened from a file. Open replyO online (the https web address).');
  cancelled=false;
  $('#ovTitle').textContent='Listening';
  $('#ovText').textContent='Speak your question. Tap Stop when you finish.';
  showOverlay(true);
  let text='';
  try{await ensureMic();text=await listen()}catch(e){showOverlay(false);return msg(e.message)}
  showOverlay(false);
  if(cancelled){cancelled=false;return msg('Cancelled.')}
  if(!text)return msg('Nothing was heard. Please tap Ask a question and try again.');
  await process(text);
}
async function process(raw){
  busy=true;$('#askBtn').disabled=true;
  document.querySelectorAll('input[name="out"]').forEach(r=>r.disabled=true);
  const mode=outMode,level=lenIdx;
  try{
    const id='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
    let item;
    if(mode==='pdf'){
      const doc=await buildDoc(raw,level,msg);
      msg('Making the PDF…');
      await idbPut(id,await makePDF(doc));
      item={id,type:'pdf',q:doc.question,original:doc.original,title:doc.title};
    }else if(mode==='picture'){
      const doc=await buildPicture(raw,level,msg);
      msg('Making the picture…');
      await idbPut(id,await makePicture(doc));
      item={id,type:'picture',q:doc.question,original:doc.original,title:doc.title};
    }else{
      const doc=await buildSpeech(raw,level,msg);
      item={id,type:'voice',q:doc.question,original:doc.original,title:doc.title,text:doc.speech};
    }
    item.date=new Date().toISOString();item.level=LEN[level].name;
    items.unshift(item);saveItems();renderList();
    if(mode==='voice')speakText(item.text,item.id);
    else msg(`Done. Your ${mode==='pdf'?'PDF':'picture'} is in the list below.`);
  }catch(e){
    msg(e.message||'Something went wrong. Please try again.');
  }finally{
    busy=false;$('#askBtn').disabled=false;
    document.querySelectorAll('input[name="out"]').forEach(r=>r.disabled=false);
  }
}

/* ---------- events ---------- */
$('#askBtn').addEventListener('click',askByVoice);
document.querySelectorAll('input[name="out"]').forEach(r=>r.addEventListener('change',()=>{if(r.checked){outMode=r.value;try{localStorage.setItem(OUT_KEY,outMode)}catch(e){}}}));
$('#len').addEventListener('input',e=>{lenIdx=+e.target.value;localStorage.setItem(LEN_STORE,String(lenIdx));renderLen()});
$('#stopBtn').addEventListener('click',()=>{if(rec)try{rec.stop()}catch(e){}});
$('#cancelBtn').addEventListener('click',()=>{cancelled=true;if(rec)try{rec.abort()}catch(e){}showOverlay(false)});
document.addEventListener('click',e=>{
  const t=e.target;
  const closest=s=>t.closest&&t.closest(s);
  /* theme drop-down */
  const tb=closest('#tddBtn');
  if(tb){const l=$('#tddList');l.hidden=!l.hidden;tb.setAttribute('aria-expanded',String(!l.hidden));return}
  const tp=closest('[data-theme-pick]');
  if(tp){setTheme(tp.dataset.themePick);renderTheme();return}
  if(!closest('.tdd')){const l=$('#tddList');if(l&&!l.hidden){l.hidden=true;$('#tddBtn').setAttribute('aria-expanded','false')}}
  /* key panel */
  if(closest('#apiUpdate')){keyUI.open=!keyUI.open;if(!keyUI.open)keyUI.adding=null;keyUI.msg='';return renderKeys()}
  const kd=closest('[data-kdel]');if(kd)return deleteKey(+kd.dataset.kdel);
  const ka=closest('[data-kadd]');if(ka){keyUI.adding=ka.dataset.kadd;keyUI.msg='';renderKeys();const n=$('#newKey');if(n)n.focus();return}
  if(closest('[data-ksave]'))return saveNewKey();
  if(closest('[data-kclose]')){keyUI.adding=null;keyUI.msg='';return renderKeys()}
  /* questions and responses */
  const b=closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act,i=+b.dataset.i;
  if(act==='open')openFile(i);
  else if(act==='dl')downloadFile(i);
  else if(act==='play')playItem(i);
  else if(act==='del')deleteItem(i);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const l=$('#tddList');if(l&&!l.hidden){l.hidden=true;$('#tddBtn').setAttribute('aria-expanded','false');$('#tddBtn').focus()}}
});

let savedTheme='slate';
try{savedTheme=localStorage.getItem(THEME_KEY)||'slate'}catch(e){}
setTheme(savedTheme);
renderTheme();
renderLen();
renderOut();
renderKeys();
renderList();
})();
</script>
